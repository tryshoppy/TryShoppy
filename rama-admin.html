<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRY SHOPPY — RAMA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb; --bg:#f4f7fe; --white:#fff; --text:#1e293b; --border:#cbd5e1;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --gray:#64748b;
}
*{box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);margin:0;padding:20px;color:var(--text);}
.container{max-width:900px;margin:auto;}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:16px;}
h2{margin:0 0 18px;text-align:center;color:var(--primary);font-weight:900;}
.input-group{margin-bottom:14px;}
.input-group label{display:block;margin-bottom:6px;font-weight:700;color:#475569;font-size:13.5px;}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font-family:'Cairo';box-sizing:border-box;font-size:14px;min-height:44px;}
button{padding:12px 18px;border:none;border-radius:11px;background:var(--primary);color:#fff;font-family:'Cairo';font-size:13.5px;font-weight:800;cursor:pointer;min-height:44px;transition:opacity .15s,transform .1s;}
button:hover{opacity:.9;}
button:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-ghost{background:#f1f5f9;color:var(--text);}
.btn-success{background:var(--success);}
.btn-danger{background:var(--danger);}
.hidden{display:none !important;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;min-width:120px;}

/* حلقة تركيز واضحة لأي عنصر تفاعلي — مهم لاستخدام لوحة المفاتيح */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2.5px solid var(--primary);outline-offset:2px;
}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:22px;padding:32px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.notif-badge{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;padding:6px 14px;border-radius:20px;font-weight:800;font-size:13px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
.stat-box{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.stat-box .num{font-size:1.3rem;font-weight:900;color:var(--primary);}
.stat-box .lbl{font-size:11.5px;color:var(--gray);font-weight:700;margin-top:3px;}

.product-card{border:1.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;gap:14px;transition:box-shadow .15s,border-color .15s;}
@media(hover:hover){.product-card:hover{border-color:#93c5fd;box-shadow:0 4px 16px rgba(37,99,235,.08);}}
.product-img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#f1f5f9;flex-shrink:0;}
.product-body{flex:1;min-width:0;}
.product-name{font-weight:800;font-size:14.5px;margin-bottom:4px;}
.product-link{font-size:11.5px;color:var(--gray);text-decoration:none;display:block;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.product-link-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--primary);text-decoration:none;background:#eef2ff;border:1px solid #c7d2fe;padding:7px 14px;border-radius:9px;margin-bottom:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s,transform .1s;}
.product-link-btn:hover{background:#e0e7ff;}
.product-link-btn:active{transform:scale(.97);}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:8px;}
.b-gray{background:#f1f5f9;color:#475569;} .b-blue{background:#eff6ff;color:#2563eb;}
.b-orange{background:#fff7ed;color:#c2410c;} .b-green{background:#f0fdf4;color:#16a34a;} .b-red{background:#fef2f2;color:#dc2626;}
.meta-line{font-size:12.5px;color:var(--gray);margin-top:4px;}
.empty-hint{text-align:center;color:#94a3b8;font-weight:700;padding:24px 0;}
/* تجميع أدوات التسعير/الحالة في مربّع مميز عن باقي بيانات المنتج —
   بيسهّل تمييز "بيانات المنتج" عن "الإجراء المطلوب مني دلوقتي" بصريًا */
.action-box{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px;border:1px solid #f1f5f9;}
.spinner{display:inline-block;width:14px;height:14px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
#refreshBtn.spinning{animation:spin .8s linear infinite;}
.notif-badge:not(.hidden){animation:pulseBadge 2s ease-in-out infinite;}
@keyframes pulseBadge{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35);} 50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}

/* موبايل: مساحات أضيق ومريحة أكتر بدل ما تتزنق */
@media(max-width:480px){
  body{padding:12px;}
  .card{padding:16px;border-radius:16px;}
  .login-box{padding:24px;}
  .product-card{padding:12px;gap:10px;}
  .product-img{width:52px;height:52px;}
  .stats-grid{gap:8px;}
  .stat-box{padding:10px;}
  .stat-box .num{font-size:1.05rem;}
  h2{font-size:1.15rem;}
}

/* احترام تفضيل تقليل الحركة — بيوقف الحركات الزخرفية بس، مش
   السبينر (بيفضل يلف عشان لسه بيدل على إن حاجة شغالة) */
@media(prefers-reduced-motion:reduce){
  button,.product-link-btn,.product-card{transition:none;}
  .notif-badge:not(.hidden){animation:none;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:1.6rem;font-weight:900;color:var(--primary);margin-bottom:6px;">TRY SHOPPY</div>
    <div style="font-size:13px;color:#94a3b8;font-weight:700;margin-bottom:24px;">👨‍💼 RAMA Vitamins — لوحة الموظف</div>
    <input id="loginUser" type="text" placeholder="👤 اسم المستخدم" style="margin-bottom:12px;" autocomplete="username">
    <input id="loginPass" type="password" placeholder="🔒 كلمة المرور" style="margin-bottom:14px;" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginError" class="hidden" style="color:var(--danger);font-size:13px;font-weight:700;margin-bottom:12px;"></div>
    <button class="btn-block" id="loginBtn" onclick="doLogin()">🔐 دخول ←</button>
  </div>
</div>

<div id="mainContent" class="hidden">
<div class="container">

  <div class="topbar">
    <h2 style="margin:0;">📇 RAMA — إدارة الفيتامينات</h2>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="lastRefreshLbl" style="font-size:11px;color:var(--gray);"></span>
      <button id="refreshBtn" class="btn-ghost" onclick="manualRefresh(this)" title="تحديث القائمة" style="padding:8px 12px;">🔄</button>
      <button class="btn-ghost" onclick="showActivityLog()" title="سجل نشاطي" style="padding:8px 12px;">📜</button>
      <button id="exportCsvBtn" class="btn-ghost" onclick="exportCSV()" title="تصدير المنتجات الظاهرة كـ CSV" style="padding:8px 12px;">📊</button>
      <span id="notifBadge" class="notif-badge hidden" style="cursor:pointer;" onclick="jumpToNeedsReview()" title="اضغط للانتقال للمنتجات المحتاجة مراجعة"></span>
      <button class="btn-ghost" onclick="doLogout()" style="padding:8px 16px;">🚪 خروج</button>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="card">
    <div class="row">
      <input id="searchInput" placeholder="🔍 دوّر باسم المنتج أو اللينك أو موعد الوصول..." oninput="debouncedRenderList()">
    </div>
    <div class="row" style="margin-top:10px;">
      <select id="filterStatus" onchange="renderList()">
        <option value="">📋 كل الحالات</option>
        <option value="NeedsAction">🔔 يحتاج إجراء مني</option>
        <option value="PendingPrice">⏳ بانتظار السعر</option>
        <option value="PendingApproval">👤 بانتظار العميل</option>
        <option value="PendingReview">🔔 يحتاج مراجعتك</option>
        <option value="Confirmed">✅ Confirmed</option>
        <option value="Placed">📦 Placed</option>
        <option value="Delayed">⏱️ Delayed</option>
        <option value="Delivered">🎉 Delivered</option>
      </select>
      <input type="date" id="filterArrival" onchange="renderList()">
      <button class="btn-ghost" onclick="document.getElementById('searchInput').value='';document.getElementById('filterStatus').value='';document.getElementById('filterArrival').value='';renderList();">🧹 مسح الفلاتر</button>
    </div>
    <div class="row" style="margin-top:10px;align-items:center;">
      <label style="display:flex;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;font-size:13px;font-weight:800;color:var(--primary);">
        <input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll(this.checked)" style="width:18px;height:18px;cursor:pointer;">
        ☑️ تحديد الكل (المفلتر)
      </label>
    </div>
  </div>

  <div id="bulkBar" class="card hidden" style="position:sticky;top:8px;z-index:5;background:#eff6ff;border:1.5px solid #93c5fd;padding:12px 16px;">
    <div class="row" style="align-items:center;">
      <div style="font-weight:800;color:var(--primary);flex:0 0 auto;"><span id="bulkCount">0</span> منتج محدد</div>
      <select id="bulkStatus">
        <option value="Confirmed">✅ Confirmed</option>
        <option value="Placed">📦 Placed</option>
        <option value="Delayed">⏱️ Delayed</option>
        <option value="Delivered">🎉 Delivered</option>
      </select>
      <button class="btn-success" style="flex:0 0 auto;" onclick="applyBulkStatus()">✅ تطبيق على المحدد</button>
      <button class="btn-ghost" style="flex:0 0 auto;" onclick="clearSelection()">✖️ إلغاء التحديد</button>
    </div>
  </div>

  <div id="productsList"></div>

</div>
</div>

<script src="assets/function_calc.js"></script>
<script src="staff-auth.js"></script>
<script src="assets/config.js"></script>
<script>
const RMA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyz2XgdEyZb3HkZGFk9wN9fKoMD9I2Nin-YXwl1Dy3rtd5u3qPRokcpa0T9UKJyDdf6jg/exec"; // ⚠️ نفس رابط RMA_Vitamins_Code.gs من صفحة العميل

// ⚠️ رقم واتساب العميل بصيغة دولية من غير + أو صفر في الأول
// (زي 201234567890) — يُستخدم بس لفتح رابط wa.me جاهز برسالة،
// مفيش أي بيانات بترسل لأي سيرفر
const CLIENT_WHATSAPP = "201000449470";
const SESSION_TIME = 8 * 60 * 60 * 1000;
let allProducts = [];
let lastRenderedItems = []; // آخر مجموعة اتعرضت فعليًا (بعد البحث/الفلترة) — يستخدمها تصدير CSV
let selectedIds = new Set(); // ✅ تحديد متعدد لتغيير الحالة دفعة واحدة
let pricedThisSessionCount = 0; // لعداد "خلصت تسعير X منتج" وقت ما طابور التسعير يفضى

/* اسم/صورة المنتج ممكن يكونوا جايين من موقع خارجي (جلب تلقائي
   بـ og:title/JSON-LD..) مش تحت سيطرتنا، فلازم ننضفهم قبل ما
   نحطهم في innerHTML أو في href/src عشان نمنع XSS */
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// بيرجع اللينك بس لو بروتوكول http/https عادي، وإلا يرجع فاضي
function safeUrl(u){
  const s = String(u || "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}

function getStaffToken(){ return localStorage.getItem("rmaStaffToken") || ""; }

function setBtnLoading(btn, text){
  if(!btn || btn.dataset.loading==='1') return;
  btn.dataset.loading='1'; btn.dataset.orig=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> '+text;
}
function clearBtnLoading(btn){
  if(!btn || btn.dataset.loading!=='1') return;
  btn.disabled=false; btn.innerHTML=btn.dataset.orig;
  delete btn.dataset.loading; delete btn.dataset.orig;
}

function checkSession(){
  const t = localStorage.getItem("rmaLoginTime");
  // ⚠️ لازم rmaStaffUser يكون موجود كمان — أي جلسة قديمة اتسجلت
  // قبل ما نضيف تمييز المستخدم (isHaitham) مش هيبقى فيها اسم
  // مستخدم محفوظ، وده كان بيخلي isHaitham() يرجع false حتى لهيثم
  // نفسه لحد ما يعمل logout/login يدوي. دلوقتي جلسة من غير اسم
  // مستخدم بتتعتبر منتهية تلقائي وبترجعه لشاشة الدخول عشان تتسجل
  // صح من الأول
  return !!(t && (Date.now()-t < SESSION_TIME) && getStaffToken() && localStorage.getItem("rmaStaffUser"));
}
function showLogin(){ document.getElementById("loginScreen").classList.remove("hidden"); document.getElementById("mainContent").classList.add("hidden"); }
function showMain(){ document.getElementById("loginScreen").classList.add("hidden"); document.getElementById("mainContent").classList.remove("hidden"); applyRoleVisibility(); loadProducts(); }

// 👤 هيثم بس هو اللي شايف كل حاجة (الهيدر بالأرقام/الحسابات،
// تصدير CSV، والطلبات اللي خلصت إجراءها). أي حد تاني بيشوف بس
// الطلبات المحتاجة تدخل فعلي منه، وبتختفي أول ما تتأكد
function isHaitham(){
  return (localStorage.getItem("rmaStaffUser") || "").toLowerCase() === "haitham";
}
function applyRoleVisibility(){
  const allowed = isHaitham();
  const stats = document.getElementById("statsGrid");
  if(stats) stats.style.display = allowed ? "" : "none";
  const exportBtn = document.getElementById("exportCsvBtn");
  if(exportBtn) exportBtn.style.display = allowed ? "" : "none";
}

async function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if(!u||!p) return;
  const btn = document.getElementById("loginBtn");
  setBtnLoading(btn, "جاري التحقق...");
  let res;
  try{ res = await tsStaffLogin(u,p); }catch(e){ res={success:false,message:"تعذر الاتصال"}; }
  clearBtnLoading(btn);
  if(res && res.success){
    localStorage.setItem("rmaLoginTime", Date.now());
    localStorage.setItem("rmaStaffToken", res.token || "");
    localStorage.setItem("rmaStaffUser", u.toLowerCase());
    showMain();
  } else {
    document.getElementById("loginError").textContent = (res&&res.code==='locked') ? res.message : "❌ اسم المستخدم أو كلمة المرور غلط";
    document.getElementById("loginError").classList.remove("hidden");
  }
}
function doLogout(){
  localStorage.removeItem("rmaLoginTime"); localStorage.removeItem("rmaStaffToken"); localStorage.removeItem("rmaStaffUser");
  showLogin();
}

// ⚠️ لازم يتعرّف قبل أي حاجة ممكن تنده على loadProducts() —
// أول مرة اتحطت بعد checkSession() بالغلط وده كسر التحميل كله
// (TDZ error لأنها متعرّفة بـlet مش hoisted زي الدوال)
let loadingInProgress = null;

if(checkSession()) showMain(); else showLogin();

// منع طلبين متزامنين (مثلاً لو دوس تحديث وهو لسه بيحمّل من نفسه)
// — بيرجّع نفس الـpromise الشغالة بدل ما يبدأ طلب جديد فوقه
async function loadProducts(){
  if(loadingInProgress) return loadingInProgress;
  loadingInProgress = loadProductsInner();
  const result = await loadingInProgress;
  loadingInProgress = null;
  return result;
}

async function loadProductsInner(retrying){
  let res, data;
  try{
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 15000); // سقف 15 ثانية بدل ما يفضل معلّق للأبد
    res = await fetch(RMA_SCRIPT_URL + "?scope=staff&staffToken=" + encodeURIComponent(getStaffToken()), { signal: ctrl.signal });
    clearTimeout(timeout);
    data = await res.json(); // لو السيرفر رجع HTML/نص مش JSON (مشكلة نشر مثلًا)، هيقع هنا
  }catch(e){
    console.error("loadProducts failed:", e);
    // 🔁 أول فشل شبكة، بنجرب تاني تلقائي بصمت مرة واحدة قبل ما
    // نزعجك برسالة — كتير من الحالات بتكون تهنيجة شبكة لحظية
    // بتتصلح لوحدها من غير أي إجراء منك
    if(!retrying) return loadProductsInner(true);
    showToast("⚠️ تعذر الاتصال بالسيرفر — تأكد من الإنترنت", "error");
    return;
  }
  if(!Array.isArray(data)){ alert("⚠️ الجلسة انتهت — سجّل دخول تاني"); doLogout(); return; }
  allProducts = data;
  renderNotifBadge(); // ⚠️ التنبيه دايمًا بيعكس *كل* البيانات، بغض النظر عن الفلتر الحالي — عشان محدش ينسى منتج محتاج مراجعة لمجرد إنه فلتر على حاجة تانية
  renderList();
  updateLastRefreshLabel();
}

// 🔄 تحديث يدوي — من غير ما يأثر على شكل الصفحة، بس أيقونة الزرار
// بتلف وهي بتحمّل عشان تحس إنها فعلاً بتحصل
function updateLastRefreshLabel(){
  const lbl = document.getElementById("lastRefreshLbl");
  if(!lbl) return;
  const now = new Date();
  lbl.textContent = "آخر تحديث: " + now.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
}

async function manualRefresh(btn){
  btn.classList.add("spinning");
  btn.disabled = true;
  await loadProducts();
  btn.classList.remove("spinning");
  btn.disabled = false;
}

function renderNotifBadge(){
  const needsAction = allProducts.filter(p => p.status==="PendingPrice" || p.status==="PendingReview").length;
  const badge = document.getElementById("notifBadge");
  if(needsAction>0){ badge.textContent = "🔔 " + needsAction + " يحتاج مراجعة"; badge.classList.remove("hidden"); }
  else badge.classList.add("hidden");
}

// ✅ الكروت دلوقتي بتاخد "items" (المجموعة بعد الفلترة/البحث) بدل
// allProducts كله — يعني لو فلترت بحالة معيّنة أو بحثت عن حاجة،
// الأرقام فوق بتتغيّر تتبع بالظبط اللي شايفه في القائمة تحتها
function renderStats(items){
  const totalFinal = items.reduce((s,p)=> s + (parseFloat(p.finalEgp)||0), 0);
  const totalRemaining = items.reduce((s,p)=> s + (parseFloat(p.remaining)||0), 0);
  const totalPaid = items.reduce((s,p)=> s + (parseFloat(p.deposit)||0), 0);
  const totalQty = items.reduce((s,p)=> s + (parseInt(p.quantity)||1), 0);
  // إجمالي الدولار: سعر الدولار للقطعة × الكمية (لو الكمية لسه ماتحددتش
  // لأن العميل لسه ماأكدش، بنفترض قطعة واحدة كحد أدنى بدل ما نصفّرها)
  const totalUsd = items.reduce((s,p)=> s + ((parseFloat(p.staffUsd)||0) * (parseInt(p.quantity)||1)), 0);
  const confirmedCount = items.filter(p=>["Confirmed","Placed","Delayed","Delivered"].includes(p.status)).length;
  const deliveredCount = items.filter(p=>p.status==="Delivered").length;

  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-box"><div class="num">${items.length}</div><div class="lbl">📦 إجمالي المنتجات${items.length!==allProducts.length ? ' (مفلترة)' : ''}</div></div>
    <div class="stat-box"><div class="num">${totalQty.toLocaleString()}</div><div class="lbl">🔢 إجمالي الكمية (قطعة)</div></div>
    <div class="stat-box"><div class="num">${confirmedCount}</div><div class="lbl">✅ مؤكدة</div></div>
    <div class="stat-box"><div class="num">${deliveredCount}</div><div class="lbl">🎉 تم التسليم</div></div>
    <div class="stat-box"><div class="num">${totalFinal.toLocaleString()}</div><div class="lbl">💰 إجمالي القيمة (EGP)</div></div>
    <div class="stat-box"><div class="num">$${totalUsd.toLocaleString()}</div><div class="lbl">💵 إجمالي الدولار (USD)</div></div>
    <div class="stat-box"><div class="num" style="color:var(--success)">${totalPaid.toLocaleString()}</div><div class="lbl">🧾 إجمالي المدفوع (EGP)</div></div>
    <div class="stat-box"><div class="num" style="color:var(--danger)">${totalRemaining.toLocaleString()}</div><div class="lbl">⏳ المتبقي تحصيله (EGP)</div></div>
  `;
}

const STATUS_META = {
  PendingPrice:{label:"⏳ بانتظار السعر",cls:"b-gray"}, PendingApproval:{label:"👤 بانتظار العميل",cls:"b-blue"},
  PendingReview:{label:"🔔 يحتاج مراجعتك",cls:"b-orange"}, Confirmed:{label:"Confirmed ✅",cls:"b-green"},
  Placed:{label:"Placed 📦",cls:"b-blue"}, Delayed:{label:"Delayed ⏳",cls:"b-orange"},
  Delivered:{label:"Delivered 🎉",cls:"b-green"}, Rejected:{label:"❌ Rejected",cls:"b-red"}
};

// 0 = محتاج إجراء مني دلوقتي (تسعير/مراجعة عرض)، 1 = الباقي —
// مستخدمة في الترتيب عشان اللي محتاج إجراء يفضل فوق دايمًا
// 0 = لسه في انتظار (بانتظار السعر / بانتظار العميل / بانتظار
// مراجعتي — أي حالة لسه معلّقة سواء الإجراء عليّ أنا أو على
// العميل)، 1 = خلص إجراءها (مؤكد/تم الشراء/متأخر/تم التسليم/مرفوض)
// — أول ما الحالة "تخلص" بتاخد مكانها العادي حسب وقتها زي أي
// منتج تاني، مش فوق قوة
function needsActionRank(p){
  const pending = ["PendingPrice", "PendingApproval", "PendingReview"];
  return pending.includes(p.status) ? 0 : 1;
}

function jumpToNeedsReview(){
  document.getElementById("searchInput").value = "";
  document.getElementById("filterArrival").value = "";
  document.getElementById("filterStatus").value = "NeedsAction";
  renderList();
  window.scrollTo({top:0, behavior:"smooth"});
}

// ⏱️ تأخير بسيط (250ms) قبل ما البحث يشتغل فعليًا وإنت لسه بتكتب
// — بيقلل إعادة بناء القائمة كاملة مع كل حرف، وده اللي كان بيبطّئ
// الكتابة على قوائم فيها منتجات كتير
function debounce(fn, delay){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}
const debouncedRenderList = debounce(renderList, 250);

function renderList(){
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const statusF = document.getElementById("filterStatus").value;
  const arrivalF = document.getElementById("filterArrival").value;
  let items = allProducts.slice().reverse(); // الأحدث الأول كأساس

  // 👤 أي حد غير هيثم بيشوف بس الطلبات المحتاجة تدخل فعلي —
  // أول ما الطلب يتأكد/يتشترى/يتأخر/يتسلم بيختفي من عنده تمامًا
  if(!isHaitham()){
    items = items.filter(p => !["Confirmed","Placed","Delayed","Delivered"].includes(p.status));
  }

  if(q) items = items.filter(p => (p.productName||"").toLowerCase().includes(q) || (p.link||"").toLowerCase().includes(q) || (p.arrivalDate||"").toLowerCase().includes(q));
  if(statusF === "NeedsAction") items = items.filter(p => p.status==="PendingPrice" || p.status==="PendingReview");
  else if(statusF) items = items.filter(p=>p.status===statusF);
  if(arrivalF) items = items.filter(p=> (p.arrivalDate||"").indexOf(arrivalF) !== -1);

  // 🔝 اللي محتاج مني إجراء دايمًا فوق (الأحدث إضافة فوق جواها).
  // اللي خلص إجراءه (مؤكد/تم الشراء/إلخ) بيترتب حسب وقت آخر تحديث
  // فعلي (بيتحدّث تلقائي وقت ما العميل يأكد الطلب) — آخر حاجة
  // اتأكدت هي اللي تظهر فوق، مش وقت إضافتها الأصلي
  items.sort((a, b) => {
    const rankDiff = needsActionRank(a) - needsActionRank(b);
    if(rankDiff !== 0) return rankDiff;
    if(needsActionRank(a) === 1) return new Date(b.lastUpdated || 0) - new Date(a.lastUpdated || 0);
    return 0;
  });
  lastRenderedItems = items;

  renderStats(items); // ← نفس المجموعة المفلترة اللي هتتعرض تحت

  const box = document.getElementById("productsList");
  if(!items.length){ box.innerHTML = '<div class="card empty-hint">🔍 مفيش نتائج مطابقة</div>'; return; }

  box.innerHTML = items.map(p=>{
    const meta = STATUS_META[p.status] || {label:p.status,cls:"b-gray"};
    let actionsHtml = "";

    if(p.status === "PendingPrice"){
      actionsHtml = `
      ${p.notes ? `<div class="meta-line" style="color:var(--success);">💡 ${escapeHtml(p.notes)} — راجعه على الموقع الأصلي قبل ما تعتمده</div>` : ""}
      <div class="action-box">
        <div class="row">
          <select id="type-${p.id}" onchange="onTypeChange('${p.id}')">
            <option value="capsules">💊 كبسولات</option>
            <option value="gummies">🍬 جميز</option>
            <option value="powder">🥄 بودر</option>
            <option value="liquid">💧 سائل</option>
          </select>
        </div>
        <div class="row" id="pieceRow-${p.id}" style="margin-top:8px;">
          <select id="range-${p.id}"></select>
        </div>
        <div class="row hidden" id="weightRow-${p.id}" style="margin-top:8px;">
          <input type="number" id="manualWeight-${p.id}" placeholder="⚖️ الوزن الفعلي (جرام)">
        </div>
        <div class="row" style="margin-top:8px;">
          <input type="number" id="usd-${p.id}" placeholder="💵 السعر بالدولار" oninput="calcPreview('${p.id}')">
          <div id="preview-${p.id}" style="align-self:center;font-weight:800;color:var(--success);"></div>
        </div>
        <div class="row" style="margin-top:8px;align-items:center;">
          <input type="number" id="customPrice-${p.id}" placeholder="✏️ سعر مخصص (اختياري — يتجاوز الحاسبة)" oninput="calcPreview('${p.id}')">
          <div style="font-size:11px;color:var(--gray);flex:0 0 auto;">لو اتكتب، هيستخدم بدل حساب الحاسبة</div>
        </div>
        <button class="btn-block btn-success" style="margin-top:8px;" onclick="submitPrice('${p.id}')">📤 إرسال السعر للعميل</button>
        <button class="btn-block btn-ghost" style="margin-top:8px;color:var(--danger);" onclick="markUnavailable('${p.id}', this)">🚫 المنتج غير متاح</button>
      </div>`;
    } else if(p.status === "PendingApproval"){
      actionsHtml = `<div class="price-tag" style="font-weight:900;color:var(--primary);">${Number(p.staffEgp).toLocaleString()} EGP / قطعة</div><div class="meta-line">⏳ مستني رد العميل...</div>`;
    } else if(p.status === "PendingReview"){
      actionsHtml = `
        <div class="meta-line" style="font-size:13.5px;">سعرك: <b>${Number(p.staffEgp).toLocaleString()}</b> EGP — عرض العميل: <b style="color:var(--warning)">${Number(p.clientCounterEgp).toLocaleString()}</b> EGP × ${p.quantity}</div>
        <div class="action-box row" style="margin-top:8px;">
          <button class="btn-success" onclick="resolveCounter('${p.id}', true, this)">✅ موافقة على عرض العميل</button>
          <button class="btn-danger" onclick="resolveCounter('${p.id}', false, this)">↩️ رفض والرجوع لسعري</button>
        </div>`;
    } else {
      actionsHtml = `
        <div class="meta-line">💰 سعر القطعة: ${Number(p.staffEgp||0).toLocaleString()} EGP</div>
        <div class="meta-line">🔢 العدد: ${p.quantity||1}</div>
        <div class="price-tag" style="font-weight:900;color:var(--primary);">💵 الإجمالي: ${Number(p.finalEgp||0).toLocaleString()} EGP</div>
        <div class="action-box">
          <div class="row">
            <select id="status-${p.id}">
              <option value="Confirmed" ${p.status==='Confirmed'?'selected':''}>✅ Confirmed</option>
              <option value="Placed" ${p.status==='Placed'?'selected':''}>📦 Placed</option>
              <option value="Delayed" ${p.status==='Delayed'?'selected':''}>⏱️ Delayed</option>
              <option value="Delivered" ${p.status==='Delivered'?'selected':''}>🎉 Delivered</option>
            </select>
            <input type="text" id="arrival-${p.id}" placeholder="📅 موعد الوصول" value="${p.arrivalDate||''}">
          </div>
          <div class="row" style="margin-top:8px;">
            <input type="number" id="deposit-${p.id}" placeholder="💰 العربون" value="${p.deposit||''}">
            <div style="align-self:center;font-size:12.5px;color:var(--gray);">المتبقي: ${Number(p.remaining||0).toLocaleString()} EGP</div>
          </div>
          <button class="btn-block" style="margin-top:8px;" onclick="saveStatus('${p.id}')">💾 حفظ</button>
        </div>`;
    }

    const img = safeUrl(p.imageUrl);
    const link = safeUrl(p.link);
    return `<div class="card">
      <div class="product-card">
        <input type="checkbox" class="bulk-check" data-id="${p.id}" ${selectedIds.has(p.id)?'checked':''} onchange="toggleSelect('${p.id}', this.checked)" style="width:20px;height:20px;flex-shrink:0;margin-top:2px;cursor:pointer;">
        ${img ? `<img class="product-img" src="${escapeHtml(img)}">` : `<div class="product-img"></div>`}
        <div class="product-body">
          <span class="badge ${meta.cls}">${meta.label}</span>
          <div class="product-name">${escapeHtml(p.productName || "منتج بدون اسم")}</div>
          <a class="product-link-btn" href="${escapeHtml(link || "#")}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(p.link)}">🔗 رابط المنتج</a>
          ${actionsHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  // نبني قوائم الكبسولات/الجميز لأي منتج PendingPrice ظاهر دلوقتي
  items.filter(p=>p.status==="PendingPrice").forEach(p => onTypeChange(p.id));
  updateBulkBar();
}

// ✅ تحديد متعدد — بنحدّث الـ Set + شريط التحديد بس من غير ما نعمل
// renderList() كاملة تاني، عشان مانمسحش أي بيانات متكتوبة لسه في
// حقول التسعير/العربون بتاعة منتجات تانية على الشاشة
function toggleSelect(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
}

// ☑️ تحديد/إلغاء تحديد كل المنتجات الظاهرة دلوقتي (بعد أي فلترة/بحث)
// دفعة واحدة، بدل ما تدوس كل Checkbox لوحده
function toggleSelectAll(checked){
  lastRenderedItems.forEach(p => { if(checked) selectedIds.add(p.id); else selectedIds.delete(p.id); });
  document.querySelectorAll(".bulk-check").forEach(cb => { cb.checked = selectedIds.has(cb.dataset.id); });
  updateBulkBar();
}

function updateBulkBar(){
  const bar = document.getElementById("bulkBar");
  document.getElementById("bulkCount").textContent = selectedIds.size;
  bar.classList.toggle("hidden", selectedIds.size === 0);
  // نزامن حالة "تحديد الكل" مع الاختيار الفعلي — متعلّمة (indeterminate)
  // لو جزء بس متحدد، متعلّمة تمامًا لو الكل متحدد
  const selectAllCheck = document.getElementById("selectAllCheck");
  if(selectAllCheck && lastRenderedItems.length){
    const selectedVisible = lastRenderedItems.filter(p => selectedIds.has(p.id)).length;
    selectAllCheck.checked = selectedVisible === lastRenderedItems.length;
    selectAllCheck.indeterminate = selectedVisible > 0 && selectedVisible < lastRenderedItems.length;
  } else if(selectAllCheck){
    selectAllCheck.checked = false;
    selectAllCheck.indeterminate = false;
  }
}

function clearSelection(){
  selectedIds.clear();
  document.querySelectorAll(".bulk-check").forEach(cb => cb.checked = false);
  updateBulkBar();
}

async function applyBulkStatus(){
  if(!selectedIds.size) return;
  const status = document.getElementById("bulkStatus").value;
  if(!confirm(`تأكيد تغيير حالة ${selectedIds.size} منتج لـ "${status}"؟`)) return;

  const btn = document.querySelector('#bulkBar button.btn-success');
  setBtnLoading(btn, "جاري التحديث...");
  try{
    const ids = Array.from(selectedIds);
    const results = await Promise.all(ids.map(id =>
      fetch(RMA_SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"updateStatus", staffToken:getStaffToken(), id, status }) })
        .then(r => r.json())
    ));
    clearBtnLoading(btn);
    const failed = results.filter(r => !r.success).length;
    logActivity("🔄 تحديث جماعي", `${ids.length} منتج`, status);
    selectedIds.clear();
    if(failed) alert(`تم التحديث، لكن ${failed} منتج فشل — راجعهم يدويًا`);
    loadProducts();
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

function onTypeChange(id){
  const type = document.getElementById("type-"+id).value;
  const pieceRow = document.getElementById("pieceRow-"+id);
  const weightRow = document.getElementById("weightRow-"+id);
  if(type==="powder" || type==="liquid"){
    pieceRow.classList.add("hidden"); weightRow.classList.remove("hidden");
  } else {
    weightRow.classList.add("hidden"); pieceRow.classList.remove("hidden");
    const ranges = tryShoppyGetSupplementRanges(type);
    const sel = document.getElementById("range-"+id);
    sel.innerHTML = ranges.map((r,i)=>`<option value="${i}">من ${r.min} إلى ${r.max} حبة</option>`).join("");
  }
  calcPreview(id);
}

function resolveWeight(id){
  const type = document.getElementById("type-"+id).value;
  if(type==="powder" || type==="liquid"){
    return parseFloat(document.getElementById("manualWeight-"+id).value) || 0;
  }
  const ranges = tryShoppyGetSupplementRanges(type);
  const idx = parseInt(document.getElementById("range-"+id).value) || 0;
  return (ranges[idx] && ranges[idx].weight) || 0;
}

function calcPreview(id){
  const preview = document.getElementById("preview-"+id);
  const customEl = document.getElementById("customPrice-"+id);
  const custom = customEl ? parseFloat(customEl.value) : NaN;
  if(custom){ preview.textContent = "✏️ سعر مخصص: " + custom.toLocaleString() + " EGP / قطعة"; return; }
  const usd = parseFloat(document.getElementById("usd-"+id).value);
  const weight = resolveWeight(id);
  if(!usd || !weight){ preview.textContent = ""; return; }
  const { finalPrice } = tryShoppyCalculatePrice({ usd, category:"Vitamin or Supplements", weightGrams:weight, quantity:1 });
  preview.textContent = "≈ " + finalPrice.toLocaleString() + " EGP";
}

async function submitPrice(id){
  const customEl = document.getElementById("customPrice-"+id);
  const custom = customEl ? parseFloat(customEl.value) : NaN;
  const usd = parseFloat(document.getElementById("usd-"+id).value);
  const weight = resolveWeight(id);
  const type = document.getElementById("type-"+id).value;

  if(!weight){ alert("اختار نوع ووزن/كمية المنتج الأول"); return; }
  if(!custom && !usd){ alert("أدخل السعر بالدولار، أو اكتب سعر مخصص بالجنيه"); return; }

  // ✏️ لو الموظف كتب سعر مخصص، بناخده زي ما هو ونتجاوز حساب
  // الحاسبة تمامًا — مفيد لأي حالة السعر الرسمي مش دقيق فيها
  // (خصم خاص، تكلفة إضافية معروفة، إلخ)
  let finalPrice;
  if(custom){
    finalPrice = custom;
  } else {
    ({ finalPrice } = tryShoppyCalculatePrice({ usd, category:"Vitamin or Supplements", weightGrams:weight, quantity:1 }));
  }
  const pieceOrWeight = (type==="powder"||type==="liquid") ? (weight+" جم") : document.getElementById("range-"+id).selectedOptions[0].textContent;

  const p = allProducts.find(x => String(x.id) === String(id));
  const btn = document.querySelector(`button[onclick="submitPrice('${id}')"]`);
  setBtnLoading(btn, "جاري الإرسال...");
  try{
    const res = await fetch(RMA_SCRIPT_URL, { method:"POST", body: JSON.stringify({
      action:"setStaffPrice", staffToken:getStaffToken(), id,
      supplementType:type, pieceOrWeight, staffUsd:usd||0, staffEgp:finalPrice
    })});
    const data = await res.json();
    if(data.success){
      logActivity("💰 تسعير", p ? p.productName : id, `${finalPrice.toLocaleString()} EGP / قطعة`);
      pricedThisSessionCount++;
      await loadProducts();
      // 🎉 لو مفيش حاجة تانية لسه بانتظار تسعير، يبقى خلص "دفعة"
      // كاملة — نعرض بوب أب فيه اقتراح إرسال واتساب للعميل
      const stillPending = allProducts.filter(x=>x.status==="PendingPrice").length;
      if(stillPending === 0 && pricedThisSessionCount > 0) showPricingDoneModal();
    }
    else { clearBtnLoading(btn); alert(data.message||"حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

async function resolveCounter(id, approve, btn){
  const p = allProducts.find(x => String(x.id) === String(id));
  setBtnLoading(btn, approve ? "جاري الموافقة..." : "جاري الرفض...");
  try{
    const res = await fetch(RMA_SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"staffResolveCounter", staffToken:getStaffToken(), id, approve }) });
    const data = await res.json();
    if(data.success){
      logActivity(approve ? "✅ موافقة على عرض عميل" : "↩️ رفض عرض عميل", p ? p.productName : id, "");
      loadProducts();
    }
    else { clearBtnLoading(btn); alert(data.message||"حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

async function saveStatus(id){
  const status = document.getElementById("status-"+id).value;
  const arrivalDate = document.getElementById("arrival-"+id).value;
  const deposit = document.getElementById("deposit-"+id).value;
  const p = allProducts.find(x => String(x.id) === String(id));
  const btn = document.querySelector(`button[onclick="saveStatus('${id}')"]`);
  setBtnLoading(btn, "جاري الحفظ...");
  try{
    const res = await fetch(RMA_SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"updateStatus", staffToken:getStaffToken(), id, status, arrivalDate, deposit }) });
    const data = await res.json();
    if(data.success){
      logActivity("🔄 تحديث حالة", p ? p.productName : id, status);
      loadProducts();
    }
    else { clearBtnLoading(btn); alert(data.message||"حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

// 🚫 المنتج مش متاح على الموقع أصلاً (نفد المخزون، اتشال من
// الموقع..) — بنستخدم نفس أكشن updateStatus الموجود، بس بحالة
// "Rejected" ومعاها سبب اختياري يشوفه العميل
async function markUnavailable(id, btn){
  const reason = prompt("سبب عدم التوفر (هيظهر للعميل، اختياري):", "المنتج غير متاح حاليًا على الموقع");
  if(reason === null) return; // ضغط إلغاء
  const p = allProducts.find(x => String(x.id) === String(id));
  setBtnLoading(btn, "جاري التحديث...");
  try{
    const res = await fetch(RMA_SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"updateStatus", staffToken:getStaffToken(), id, status:"Rejected", notes:reason }) });
    const data = await res.json();
    if(data.success){
      logActivity("🚫 غير متاح", p ? p.productName : id, reason);
      loadProducts();
    }
    else { clearBtnLoading(btn); alert(data.message||"حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}
/* ---------------------------------------------------------
   🪟 نافذة منبثقة عامة (Modal) — بنعيد استخدامها لأي بوب أب
   --------------------------------------------------------- */
function showModal(html){
  document.getElementById("appModalContent").innerHTML = html;
  document.getElementById("appModal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("appModal").classList.add("hidden");
}

/* ---------------------------------------------------------
   📱 بوب أب "خلصت التسعير" — بيظهر أول ما طابور "بانتظار السعر"
   يفضى بعد أي تسعير ناجح، ومعاه رابط واتساب جاهز برسالة للعميل
   --------------------------------------------------------- */
function showPricingDoneModal(){
  const count = pricedThisSessionCount;
  const msg = encodeURIComponent(`مرحبًا 👋، تم تسعير ${count} منتج وجاهزين لمراجعتك على RAMA 🙏`);
  const hasNumber = CLIENT_WHATSAPP && !CLIENT_WHATSAPP.startsWith("PASTE");
  const waLink = hasNumber ? `https://wa.me/${CLIENT_WHATSAPP}?text=${msg}` : "";
  showModal(`
    <div style="font-size:2.2rem;margin-bottom:8px;">🎉</div>
    <h3 style="margin-bottom:8px;">خلصت تسعير ${count} منتج!</h3>
    <p style="color:var(--gray);font-size:13.5px;margin-bottom:16px;">تحب تبعت واتساب للعميل يعرف إن السعر جاهز؟</p>
    ${hasNumber
      ? `<a href="${waLink}" target="_blank" rel="noopener noreferrer" class="btn-block btn-success" style="display:block;text-decoration:none;margin-bottom:8px;box-sizing:border-box;">📱 إرسال واتساب للعميل</a>`
      : `<div style="font-size:12px;color:var(--danger);margin-bottom:12px;">⚠️ حط رقم واتساب العميل في متغيّر CLIENT_WHATSAPP أول الكود عشان الزرار ده يشتغل</div>`}
    <button class="btn-ghost btn-block" onclick="closeModal()">إغلاق</button>
  `);
  pricedThisSessionCount = 0; // نصفّر العداد بعد ما وريناه — الدفعة الجاية تتحسب من جديد
}

/* ---------------------------------------------------------
   📜 سجل نشاط بسيط — محفوظ محليًا في المتصفح بس (localStorage)،
   من غير أي تعديل في الـ.gs أو الشيت. بيسجّل آخر 50 إجراء عملته
   إنت (تسعير/تحديث حالة/موافقة على عرض..) عشان ترجعله لو حبيت
   تتأكد مين غيّر إيه وامتى — لكنه مش مشترك بين الأجهزة/المتصفحات،
   وبيتمسح لو مسحت بيانات المتصفح
   --------------------------------------------------------- */
function logActivity(action, productName, detail){
  try{
    const log = JSON.parse(localStorage.getItem("ramaActivityLog") || "[]");
    log.unshift({ time: Date.now(), action, productName: productName || "—", detail: detail || "" });
    localStorage.setItem("ramaActivityLog", JSON.stringify(log.slice(0, 50)));
  }catch(e){ /* لو التخزين ممتلئ أو مقفول، مش هنكسر العملية الأساسية عشانه */ }
}

function showActivityLog(){
  let log = [];
  try{ log = JSON.parse(localStorage.getItem("ramaActivityLog") || "[]"); }catch(e){}
  const rows = log.length
    ? log.map(e => `
        <div style="text-align:right;border-bottom:1px solid #f1f5f9;padding:8px 0;">
          <div style="font-weight:800;font-size:13px;">${escapeHtml(e.action)} — ${escapeHtml(e.productName)}</div>
          <div style="font-size:11.5px;color:var(--gray);">${escapeHtml(e.detail)} · ${new Date(e.time).toLocaleString("ar-EG")}</div>
        </div>`).join("")
    : `<div class="empty-hint">مفيش نشاط مسجّل لسه</div>`;
  showModal(`
    <h3 style="margin-bottom:4px;">📜 سجل نشاطي</h3>
    <p style="font-size:11.5px;color:var(--gray);margin-bottom:12px;">محفوظ في المتصفح ده بس — مش مشترك مع أجهزة تانية</p>
    <div style="max-height:340px;overflow-y:auto;text-align:right;margin-bottom:12px;">${rows}</div>
    <button class="btn-ghost btn-block" onclick="closeModal()">إغلاق</button>
  `);
}

/* ---------------------------------------------------------
   📊 تصدير CSV — بيصدّر بالظبط نفس المنتجات اللي شايفها دلوقتي
   (بعد أي بحث/فلترة)، مفيد للمحاسبة الشهرية بدل النسخ اليدوي من
   الشيت. كله بيحصل في المتصفح، من غير أي طلب للسيرفر
   --------------------------------------------------------- */
function csvEscape(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(){
  if(!lastRenderedItems.length){ alert("مفيش منتجات ظاهرة دلوقتي عشان تتصدّر"); return; }
  const headers = ["ID","اسم المنتج","الرابط","الحالة","نوع المنتج","الوزن/القطعة","سعر القطعة $","سعر القطعة EGP","الكمية","عرض العميل EGP","الإجمالي EGP","العربون EGP","المتبقي EGP","تاريخ الوصول","تاريخ الإضافة","آخر تحديث","ملاحظات"];
  const rows = lastRenderedItems.map(p => [
    p.id, p.productName, p.link, STATUS_META[p.status]?.label || p.status,
    p.supplementType, p.pieceOrWeight, p.staffUsd, p.staffEgp, p.quantity,
    p.clientCounterEgp, p.finalEgp, p.deposit, p.remaining,
    p.arrivalDate, p.createdDate, p.lastUpdated, p.notes
  ].map(csvEscape).join(","));
  const csv = "\uFEFF" + headers.map(csvEscape).join(",") + "\n" + rows.join("\n"); // BOM عشان إكسل يفتح العربي صح
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rama-products-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
/* ---------------------------------------------------------
   🍞 تنبيه خفيف غير معطّل (Toast) — بديل عن alert() المزعج لأي
   خطأ اتصال/شبكة عابر، بيختفي لوحده من غير ما يحتاج منك تدوس
   "موافق". alert() لسه مستخدم بس للأخطاء اللي محتاجة منك تتصرف
   فيها فعليًا (باسورد غلط، بيانات ناقصة، إلخ)
   --------------------------------------------------------- */
function showToast(msg, type){
  const box = document.getElementById("toastBox");
  if(!box) return;
  const el = document.createElement("div");
  el.textContent = msg;
  const isError = type === "error";
  el.style.cssText = `background:${isError?'#fef2f2':'#f0fdf4'};color:${isError?'var(--danger)':'var(--success)'};border:1px solid ${isError?'#fecaca':'#bbf7d0'};padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:90vw;transition:opacity .3s;`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3500);
}
</script><div id="appModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)closeModal()">
  <div class="card" style="max-width:380px;width:100%;text-align:center;" id="appModalContent"></div>
</div>
<div id="toastBox" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;"></div>
