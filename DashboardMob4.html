<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRY SHOPPY - Fixed DropList</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{ 
  --primary: #0d6efd; 
  --primary-hover: #0b5ed7;
  --bg: #f8fafc; /* خلفية أنعم */
  --white: #ffffff; 
  --text: #1e293b; 
  --text-muted: #64748b;
  --border: #e2e8f0; 
  --success: #10b981; /* أخضر أهدى وعصري */
  --danger: #ef4444; 
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  --hover-shadow: 0 8px 30px rgba(13, 110, 253, 0.08);
}

body{ 
  font-family: 'Cairo', sans-serif; 
  background: var(--bg); 
  margin: 0; 
  padding: 15px 10px; 
  color: var(--text); 
  font-size: 16px; 
}

.container{ 
  max-width: 600px; 
  margin: auto; 
}

header{ 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  border-bottom: 2px solid #e0e7ff; 
  padding: 10px 5px; 
  margin-bottom: 20px; 
}

.logo { 
  font-weight: 900; 
  font-size: 1.3rem; 
  color: var(--primary); 
  letter-spacing: 0.5px;
}

.filters{ 
  background: var(--white); 
  padding: 20px; 
  border-radius: 20px; 
  display: flex; 
  flex-direction: column; 
  gap: 12px; 
  margin-bottom: 20px; 
  box-shadow: var(--card-shadow); 
}

/* ستايل ناعم وموحد للمدخلات */
.filters input, .filters select, .field input, .field select { 
  padding: 12px 15px; 
  border-radius: 12px; 
  border: 1px solid var(--border); 
  background-color: #f8fafc;
  font-family: 'Cairo'; 
  font-size: 14px; 
  box-sizing: border-box; 
  transition: all 0.3s ease;
  color: var(--text);
  font-weight: 600;
}

.filters input, .filters select { width: 100%; }

.field input, .field select {
  width: 140px;
  text-align: center;
  padding: 8px 12px;
}

/* تأثير الـ Focus عند الضغط على المدخلات */
.filters input:focus, .filters select:focus, .field input:focus, .field select:focus {
  border-color: var(--primary);
  background-color: var(--white);
  box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
  outline: none;
}

button {
  transition: all 0.3s ease;
}

.btn-search{ 
  background: var(--primary); 
  color: var(--white); 
  font-weight: bold; 
  cursor: pointer; 
  border: none; 
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
}
.btn-search:hover { background: var(--primary-hover); }

.btn-group{ 
  background: #1e293b; 
  color: var(--white); 
  font-weight: bold; 
  cursor: pointer; 
  border: none; 
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
}
.btn-group:hover { background: #0f172a; }

.cards-container{ 
  display: flex; 
  flex-direction: column; 
  gap: 18px; 
}

/* تصميم الكارت الجديد */
.order-card{ 
  background: var(--white); 
  border-radius: 20px; 
  padding: 20px; 
  box-shadow: var(--card-shadow); 
  border-right: 6px solid var(--primary); 
  position: relative; 
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.order-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--hover-shadow);
}

.order-card.grouped { border-right-color: #1e293b; }

.card-header { 
  display: flex; 
  justify-content: space-between; 
  margin-bottom: 15px; 
  border-bottom: 1px solid #f1f5f9; 
  padding-bottom: 12px; 
}

.order-id { 
  font-weight: 900; 
  color: var(--primary); 
  font-size: 1.1rem;
}

.field{ 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  margin-bottom: 12px; 
}

.field label{ 
  font-weight: 700; 
  color: var(--text-muted); 
  font-size: 14px; 
}

.field span { 
  font-weight: 700; 
  color: var(--text); 
}

/* صندوق الصافي */
.net-box { 
  background: #ecfdf5; 
  padding: 12px; 
  border-radius: 12px; 
  margin: 15px 0; 
  text-align: center; 
  border: 1px dashed #a7f3d0; 
  transition: all 0.3s ease;
}

.net-box:hover {
  background: #d1fae5;
}

.net-label { 
  display: block; 
  font-size: 13px; 
  color: #065f46; 
  font-weight: bold; 
  margin-bottom: 4px;
}

.net-value { 
  font-size: 22px; 
  font-weight: 900; 
  color: var(--success); 
}

.actions{ 
  display: grid; 
  grid-template-columns: 1fr; 
  gap: 12px; 
  margin-top: 15px; 
  padding-top: 15px;
  border-top: 1px solid #f1f5f9;
}

.btn-update{ 
  background: var(--success); 
  color: var(--white); 
  border: none; 
  padding: 12px; 
  border-radius: 12px; 
  font-weight: bold; 
  font-size: 15px;
  cursor: pointer; 
}
.btn-update:hover { background: #059669; }

.link-btn{ 
  background: #eff6ff; 
  color: var(--primary); 
  padding: 12px; 
  border-radius: 12px; 
  text-align: center; 
  text-decoration: none; 
  font-weight: bold; 
  font-size: 14px; 
  transition: background 0.3s;
}
.link-btn:hover { background: #dbeafe; }

.badge { 
  background: #f1f5f9; 
  padding: 4px 10px; 
  border-radius: 8px; 
  font-size: 12px; 
  color: #475569; 
  font-weight: 700; 
}

.spec-row { 
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap; 
  margin-bottom: 15px; 
}

/* تنسيق زر الخروج ومربع الإجمالي في الهيدر */
.header-btn {
  background: #fee2e2;
  color: var(--danger);
  border: none;
  padding: 8px 15px;
  border-radius: 10px;
  font-family: 'Cairo';
  font-weight: bold;
  cursor: pointer;
}
.header-btn:hover { background: #fecaca; }

#totalBox {
  background: #ecfdf5; 
  border: 1px dashed #10b981; 
  color: #065f46; 
  padding: 8px 15px; 
  border-radius: 10px; 
  font-weight: 900; 
  font-size: 14px; 
  text-align: center;
}
</style>
</head>

<body style="display:none;">

<script>
const SESSION_TIME=2*60*60*1000;
const auth=localStorage.getItem("auth");
const loginTime=localStorage.getItem("loginTime");
const now=new Date().getTime();

if(auth==="true"&&loginTime&&(now-loginTime<SESSION_TIME)){
  document.body.style.display="block";
}else{
  const password=prompt("Enter Password:");
  if(password==="12345678"){
    localStorage.setItem("auth","true");
    localStorage.setItem("loginTime",now);
    document.body.style.display="block";
  }else{
    document.body.innerHTML="<h2 style='text-align:center;margin-top:50px; color: var(--danger);'>Access Denied ❌</h2>";
  }
}
</script>

<div class="container">
<header>
  <div class="logo">TRY SHOPPY</div>
  <div id="totalBox" style="display: none;">
    الإجمالي: 0 ج.م
  </div>
  <button class="header-btn" onclick="logout()">خروج</button>
</header>

<div class="filters">
  <div style="display: flex; gap: 10px;">
    <input type="date" id="dateFrom" title="تاريخ الطلب من">
    <input type="date" id="dateTo" title="تاريخ الطلب إلى">
  </div>
  
  <div style="font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: -5px;">📅 فلتر بموعد الوصول:</div>
  <input id="searchArrival" placeholder="🔎 بحث بموعد الوصول">
  
  <input id="searchInput" placeholder="🔍 بحث بالاسم أو التليفون أو الأوردر">
  <select id="searchStatus">
    <option value="">كل الحالات</option>
    <option>Pending Review</option>
    <option>Confirmed Via Try</option>
    <option>Processing</option>
    <option>Placed</option>
    <option>Arrived Cairo HUB</option>
    <option>Shipped To You</option>
    <option>Delivered</option>
    <option>Canceled</option>
    <option>Delayed</option>
  </select>
  <button class="btn-search" onclick="applyFilters()">بحث</button>
  <button class="btn-group" onclick="toggleGrouping()">👥 تجميع / فك تجميع الطلبات</button>
</div>

<div id="cardsContainer" class="cards-container"></div>
</div>

<script>
const scriptURL="https://script.google.com/macros/s/AKfycbzy9-1BfmMJZhCtwiEoIfdzWCFPcWW3CkhfJIRdWo8eyl1Z6tSWK8xHxoAw2cxKDaosrw/exec";
let ordersData=[];
let isGrouped=false;

async function loadData(){
  try {
    const res=await fetch(scriptURL, { redirect: 'follow' });
    ordersData=await res.json();
    applyFilters();
  } catch(e) { alert("خطأ في التحميل - تأكد من الاتصال"); }
}

function renderCards(data){
  const container=document.getElementById("cardsContainer");
  container.innerHTML="";

  data.forEach(o=>{
    const orderId = o.order;
    const cleanOrderId = orderId.toString().split(' + ')[0];
    const qty = o.quantity || 1;
    const weight = o.weight || 0;
    const dims = o.dimensions || "غير محدد";

    const total = parseFloat(o.finalPrice || 0);
    const dep = parseFloat(o.deposit || 0);
    const ship = parseFloat(o.shipping || 0);
    const net = total + ship - dep;

    const currentArrival = o.arrivaldate || "";

    container.innerHTML+=`
   <div class="order-card ${isGrouped ? 'grouped' : ''}">
      <div class="card-header" style="align-items: center;">
        <div style="display: flex; flex-direction: column;">
            <span class="order-id">#${orderId}</span>
            <span style="font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 2px;">
                📅 ${o.date || '—'}
            </span>
        </div>
        <span class="badge" style="height: fit-content; border: 1px solid var(--border);">${o.status || 'Pending'}</span>
      </div>
      
      <div class="field"><label>العميل:</label><span>${o.customerName || "—"}</span></div>
      <div class="field"><label>التليفون:</label><span>${o.phone || "—"}</span></div>

      <div class="spec-row">
        <span class="badge">الكمية: ${qty}</span>
        <span class="badge">الوزن: ${weight} جم</span>
        <span class="badge">المواصفات: ${dims}</span>
      </div>

      <div class="field">
        <label>الإجمالي (EGP):</label>
        <input type="number" id="egp-${cleanOrderId}" value="${total}" oninput="recalc('${cleanOrderId}', ${ship})">
      </div>

      <div class="field">
        <label>المدفوع مقدما:</label>
        <input type="number" id="deposit-${cleanOrderId}" style="color: var(--danger);" value="${dep}" oninput="recalc('${cleanOrderId}', ${ship})">
      </div>

      <div class="net-box">
        <span class="net-label">المبلغ المطلوب تحصيله (الصافي)</span>
        <span class="net-value" id="net-${cleanOrderId}">${net.toLocaleString()} ج.م</span>
      </div>

      <div class="field">
        <label>التكلفة (USD):</label>
        <input type="number" id="usd-${cleanOrderId}" value="${parseFloat(o.usd||0).toFixed(2)}">
      </div>

      <div class="field" style="background: #f1f5f9; padding: 10px; border-radius: 12px;">
        <label style="color: var(--primary)">موعد الوصول:</label>
       <input type="text" id="arrival-${cleanOrderId}" value="${currentArrival}" style="background: white;">
      </div>

      <div class="field">
        <label>تعديل الحالة:</label>
        <select id="status-${cleanOrderId}">
          <option ${o.status==="Pending Review"?"selected":""}>Pending Review</option>
          <option ${o.status==="Confirmed Via Try"?"selected":""}>Confirmed Via Try</option>
          <option ${o.status==="Processing"?"selected":""}>Processing</option>
          <option ${o.status==="Placed"?"selected":""}>Placed</option>
          <option ${o.status==="Arrived Cairo HUB"?"selected":""}>Arrived Cairo HUB</option>
          <option ${o.status==="Shipped To You"?"selected":""}>Shipped To You</option>
          <option ${o.status==="Delivered"?"selected":""}>Delivered</option>
          <option ${o.status==="Canceled"?"selected":""}>Canceled</option>
          <option ${o.status==="Delayed"?"selected":""}>Delayed</option>
        </select>
      </div>

      <div class="actions">
        <a href="${o.link || '#'}" target="_blank" class="link-btn">🔗 معاينة المنتج</a>
        <button class="btn-update" onclick="updateOrder('${cleanOrderId}')">✔ حفظ التعديلات</button>
      </div>
    </div>
    `;
  });
}

function recalc(id, ship) {
    const egp = parseFloat(document.getElementById('egp-'+id).value) || 0;
    const dep = parseFloat(document.getElementById('deposit-'+id).value) || 0;
    document.getElementById('net-'+id).innerText = (egp + ship - dep).toLocaleString() + " ج.م";
}

function applyFilters(){
  const search=document.getElementById("searchInput").value.toLowerCase();
  const searchArr = document.getElementById("searchArrival").value.toLowerCase();
  const from=document.getElementById("dateFrom").value;
  const to=document.getElementById("dateTo").value;
  const status=document.getElementById("searchStatus").value;

  let filtered=ordersData.filter(o=>{
    const d=o.date || "";
    const dateMatch=(!from||d>=from)&&(!to||d<=to);
    const statusMatch=!status||o.status===status;
    
    const arrivalMatch = !searchArr || 
  (o.arrivaldate || "").toString().toLowerCase().includes(searchArr);

    const searchMatch=(o.customerName||"").toLowerCase().includes(search)||
                      (o.phone||"").toString().includes(search)||
                      (o.order||"").toString().includes(search);
    return dateMatch&&statusMatch&&searchMatch&&arrivalMatch;
  });

  if(isGrouped){
    const groups={};
    filtered.forEach(o=>{
      const key=o.phone||"Unknown";
      if(!groups[key]){
        groups[key]={...o, order:o.order};
      }else{
        groups[key].quantity = (parseInt(groups[key].quantity)||0) + (parseInt(o.quantity)||1);
        groups[key].weight = (parseFloat(groups[key].weight)||0) + (parseFloat(o.weight)||0);
        groups[key].finalPrice = (parseFloat(groups[key].finalPrice)||0) + (parseFloat(o.finalPrice)||0);
        groups[key].deposit = (parseFloat(groups[key].deposit)||0) + (parseFloat(o.deposit)||0);
        groups[key].shipping = (parseFloat(groups[key].shipping)||0) + (parseFloat(o.shipping)||0);
        groups[key].usd = (parseFloat(groups[key].usd)||0) + (parseFloat(o.usd)||0);
        groups[key].order+=" + "+o.order;
      }
    });
    filtered=Object.values(groups);
  }
  
  renderCards(filtered.reverse());

  const totalBox = document.getElementById("totalBox");
  if (status === "") {
    totalBox.style.display = "none";
  } else {
    let totalEGP = 0;
    filtered.forEach(o => { totalEGP += parseFloat(o.finalPrice || 0); });
    totalBox.style.display = "block";
    totalBox.innerText = "الإجمالي: " + totalEGP.toLocaleString() + " ج.م";
  }
}

function toggleGrouping(){ isGrouped=!isGrouped; applyFilters(); }

function updateOrder(orderId){
  const newEGP=document.getElementById("egp-"+orderId).value;
  const newDeposit=document.getElementById("deposit-"+orderId).value;
  const newUSD=document.getElementById("usd-"+orderId).value;
  const newStatus=document.getElementById("status-"+orderId).value;
  const newArrival=document.getElementById("arrival-"+orderId).value;

  fetch(scriptURL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      action:"updateStatus",
      order:orderId,
      finalPrice:newEGP,
      deposit:newDeposit,
      usd:newUSD,
      status:newStatus,
      arrivaldate:newArrival
    })
  }).then(()=>{
    alert("تم تحديث الطلب #"+orderId);
    loadData();
  });
}

function logout(){
  localStorage.removeItem("auth");
  localStorage.removeItem("loginTime");
  location.reload();
}

loadData();
</script>
</body>
</html>
