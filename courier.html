<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101B33">
<title>أداة المندوب — Try Shoppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!--
  ═══════════════════════════════════════════════════════════
  🛵 أداة المندوب
  ═══════════════════════════════════════════════════════════
  • البيانات بتتحمّل في الخلفية من مسار خاص صغير (Orders_Code.gs →
    scope=courier): الطلبات اللي "وصلت القاهرة" + اللي المندوب ده نفسه
    حوّلها "في الطريق" بس، بالحقول اللي محتاجها بس. السيرفر كمان
    بيرفض أي تعديل منه على أي طلب غيرهم.
  • مفيش أي بيانات عميل بتظهر على الشاشة غير لما المندوب يبحث.
  • التسليم بيحدّث الحالة + بيضيف المبلغ اللي اتحصل على العربون
    (deposit)، وبيتسجل في History باسم المندوب والمبلغ — سجل دائم
    للفلوس. وبعدها بنقرا الشيت تاني ونتأكد إن التحديث نزل فعلاً.
  ═══════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#101B33;--navy-2:#1B2A4A;--gold:#F5B820;--gold-2:#FFD35C;--gold-ink:#7A5A08;--gold-wash:#FFF8E6;
  --blue:#2563EB;--blue-wash:#EAF1FE;--paper:#F4F6FB;--panel:#FFFFFF;--line:#E3E8F2;--line-2:#EEF2F8;
  --ink:#101B33;--ink-2:#5A6885;--ink-3:#95A1BC;
  --ok:#0F9D6E;--ok-wash:#E6F6F0;--warn:#D97706;--warn-wash:#FEF4E5;--dead:#DC2626;--dead-wash:#FDECEC;
  --hold:#7E22CE;--hold-wash:#F3E8FF;
  --f:'Cairo',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px}
body{min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--fm)}

/* ══ الدخول ══ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}
.lcard{background:var(--panel);border-radius:20px;padding:28px 22px;width:100%;max-width:380px;text-align:center}
.lg{width:52px;height:52px;border-radius:14px;background:var(--gold);color:var(--navy);font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lcard h2{font-size:20px;font-weight:900}
.lcard p{color:var(--ink-2);font-size:13px;margin:4px 0 18px}
.lcard label{display:block;text-align:start;font-size:12.5px;font-weight:800;color:var(--ink-2);margin:10px 0 5px}
.lcard input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#FBFCFE;font-size:15px}
.lcard input:focus{outline:none;border-color:var(--gold)}
#loginError{display:none;color:var(--dead);font-weight:800;font-size:13px;margin-top:10px}
.lbtn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:900;font-size:16px;cursor:pointer}

/* ══ الهيدر ══ */
.hdr{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.hdr-row{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.hdr h1{font-size:17px;font-weight:900;flex:1}
.hdr h1 small{display:block;font-size:11.5px;font-weight:700;color:#AEB6D3}
.sync{font-size:11px;font-weight:800;color:#AEB6D3;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#94A3B8;display:inline-block}
.sync.ok i{background:#34D399}.sync.busy i{background:var(--gold);animation:pulse 1s infinite}.sync.err i{background:#F87171}
@keyframes pulse{50%{opacity:.35}}
.out{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer}

.wrap{max-width:720px;margin:0 auto;padding:12px 14px}

/* ══ تحصيل النهارده ══ */
.today{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;cursor:pointer}
.today b{font-family:var(--fm);font-size:17px;color:var(--ok)}
.today span{font-size:12.5px;color:var(--ink-2);font-weight:700;flex:1}
.today-list{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:-6px 0 12px;padding:6px 14px}
.today-list.open{display:block}
.today-list div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.today-list div:last-child{border-bottom:0}

/* ══ البحث ══ */
.search{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:30;background:var(--paper);padding-bottom:8px}
.sbox{position:relative}
.sbox input{width:100%;padding:15px 46px 15px 14px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font-size:16px;font-weight:700}
.sbox input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,184,32,.18)}
.sbox .ic{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.sbox .clr{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:var(--line-2);width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer;display:none}
.sugs{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:6px;overflow:hidden;box-shadow:0 12px 28px rgba(16,27,51,.12);display:none}
.sugs.open{display:block}
.sug{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.sug:last-child{border-bottom:0}
.sug:active,.sug.on{background:var(--gold-wash)}
.sug-b{flex:1;min-width:0}
.sug-n{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-n mark{background:var(--gold-2);color:inherit;border-radius:3px;padding:0 1px}
.sug-s{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:1px}
.pill{font-size:11.5px;font-weight:900;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.go{background:var(--ok-wash);color:var(--ok)}
.pill.no{background:var(--line-2);color:var(--ink-3)}
.sug-empty{padding:14px;font-size:13px;color:var(--ink-2);font-weight:700;text-align:center}

/* ══ الحالة الفاضية ══ */
.idle{text-align:center;padding:46px 20px;color:var(--ink-2)}
.idle .big{font-size:46px;margin-bottom:8px}
.idle h3{font-size:17px;font-weight:900;color:var(--ink)}
.idle p{font-size:13px;margin-top:4px;line-height:1.7}

/* ══ كارت العميل ══ */
.cust{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.c-head{padding:16px;border-bottom:1px solid var(--line-2)}
.c-name{font-size:20px;font-weight:900;line-height:1.35}
.c-ph{font-family:var(--fm);font-size:15px;color:var(--ink-2);direction:ltr;text-align:right;margin-top:2px}
.c-addr{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:8px;line-height:1.6}
.c-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.c-acts a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:800;border:1px solid var(--line);color:var(--ink);background:#FBFCFE}
.c-acts a b{font-size:19px}
.c-acts a.wa{background:#ECFDF3;border-color:#B7EBCB;color:#166534}

.batches{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.batch{flex-shrink:0;border:1.5px solid var(--line);background:#FBFCFE;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:var(--fm)}
.batch.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.sec{font-size:11.5px;font-weight:900;color:var(--ink-3);letter-spacing:.04em;padding:14px 16px 6px}

.item{display:flex;gap:11px;padding:12px 16px;border-top:1px solid var(--line-2);align-items:flex-start}
.item input{width:22px;height:22px;accent-color:var(--gold);flex-shrink:0;margin-top:2px}
.item-b{flex:1;min-width:0}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item-no{font-family:var(--fm);font-weight:600;font-size:13.5px}
.st{font-size:11px;font-weight:900;border-radius:999px;padding:3px 8px;white-space:nowrap}
.st.hub{background:#CFFAFE;color:#0E7490}.st.out{background:#E0E7FF;color:#4338CA}
.st.done{background:var(--ok-wash);color:var(--ok)}.st.hold{background:var(--hold-wash);color:var(--hold)}
.item-sp{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.item-m{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--ink-2);font-weight:700}
.item-m b{font-family:var(--fm);color:var(--ink)}
.item-m .due b{color:var(--navy)}

.sum{margin:6px 16px 0;background:var(--paper);border-radius:14px;padding:12px 14px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.sum div b{font-family:var(--fm);color:var(--ink)}
.sum .due{border-top:1.5px dashed var(--line);margin-top:4px;padding-top:9px;font-size:15px;color:var(--navy);font-weight:900}
.sum .due b{font-size:20px;color:var(--navy)}

.collect{padding:14px 16px 4px}
.collect label{display:block;font-size:12.5px;font-weight:900;color:var(--ink-2);margin-bottom:6px}
.amt{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:#FBFCFE;overflow:hidden}
.amt:focus-within{border-color:var(--gold)}
.amt input{flex:1;border:0;background:transparent;padding:13px 14px;font-family:var(--fm);font-size:22px;font-weight:600;outline:none;min-width:0;direction:ltr;text-align:right}
.amt span{padding:0 14px;font-weight:900;color:var(--ink-3)}
.amt-hint{font-size:12px;font-weight:800;margin-top:6px;min-height:1em}
.amt-hint.less{color:var(--warn)}.amt-hint.more{color:var(--blue)}

.acts{display:grid;gap:9px;padding:12px 16px 16px}
.btn{border:0;border-radius:14px;padding:15px;font-weight:900;font-size:15.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.deliver{background:var(--ok);color:#fff;font-size:16.5px;padding:17px}
.btn.out{background:var(--blue-wash);color:var(--blue);border:1.5px solid #CBDCFB}
.btn.hold{background:var(--hold-wash);color:var(--hold);border:1.5px solid #E2C9FB}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.nothing{padding:18px 16px;font-size:14px;font-weight:800;color:var(--ink-2);text-align:center;line-height:1.7}
.other{margin:0 16px 14px;background:var(--gold-wash);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:800;color:var(--gold-ink);line-height:1.6}
.hold-note{margin:10px 16px 0;background:var(--hold-wash);color:var(--hold);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:800}

/* ══ 🗺️ خط سير يوم التوصيل ══ */
.rt-new{width:100%;border:2px dashed #C9D6F5;background:var(--blue-wash);color:var(--blue);border-radius:14px;padding:13px;font-weight:900;font-size:14.5px;cursor:pointer;margin-bottom:12px}
.route{background:var(--panel);border:1.5px solid #C9D6F5;border-radius:16px;margin-bottom:12px;overflow:hidden}
.rt-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,#16307A,#2563EB);color:#fff;cursor:pointer}
.rt-head b{flex:1;font-size:15px;font-weight:900}
.rt-head small{font-size:12px;font-weight:800;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;white-space:nowrap}
.rt-body{padding:12px 14px 14px;display:none}
.route.open .rt-body{display:block}
.rt-cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rt-cfg label{font-size:11.5px;font-weight:900;color:var(--ink-2)}
.rt-cfg input,.rt-cfg select{width:100%;margin-top:4px;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:#FBFCFE;font-size:14px;font-weight:700}
.rt-hint{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--gold-wash);border-radius:11px;padding:9px 11px;margin-bottom:10px;line-height:1.6}
.stop{display:flex;align-items:center;gap:9px;padding:10px 4px;border-top:1px solid var(--line-2)}
.stop:first-of-type{border-top:0}
.stop .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:var(--fm);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop.done .n{background:var(--ok);color:#fff}.stop.hold .n{background:var(--hold);color:#fff}
.stop.next{background:var(--gold-wash);border-radius:12px}
.stop-b{flex:1;min-width:0;cursor:pointer}
.stop-nm{font-weight:900;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop.done .stop-nm{text-decoration:line-through;color:var(--ink-3)}
.stop-s{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:1px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.area{font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;background:var(--blue-wash);color:var(--blue)}
.area.unk{background:var(--warn-wash);color:var(--warn)}.area.far{background:var(--dead-wash);color:var(--dead)}
.stop-x{display:flex;gap:4px;flex-shrink:0}
.stop-x button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#FBFCFE;font-size:14px;cursor:pointer}
.stop-x button:disabled{opacity:.3}
.rt-acts{display:grid;gap:8px;margin-top:12px}
.rt-acts .row2{gap:8px}
.btn.sm{padding:12px;font-size:13.5px}
.btn.nav{background:var(--blue);color:#fff}
.btn.sort{background:var(--navy);color:var(--gold)}
.btn.del{background:transparent;color:var(--dead);border:1.5px solid #F5CFCF}
.sug-add{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;font-size:12px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.sug-add.in{background:var(--ok-wash);color:var(--ok)}
.c-route{margin-top:10px;width:100%;border:1.5px solid #C9D6F5;background:var(--blue-wash);color:var(--blue);border-radius:12px;padding:10px;font-weight:900;font-size:13.5px;cursor:pointer}
.c-route.in{background:var(--ok-wash);color:var(--ok);border-color:#B7E4D3}

/* ══ رسالة النتيجة ══ */
.toast{position:fixed;inset-inline:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;max-width:690px;margin:0 auto;border-radius:16px;padding:14px 16px;font-weight:800;font-size:14px;box-shadow:0 14px 36px rgba(16,27,51,.28);display:none;line-height:1.6}
.toast.show{display:block}
.toast.ok{background:var(--navy);color:#fff}.toast.err{background:var(--dead);color:#fff}
.toast a{display:inline-block;margin-top:8px;background:#16A34A;color:#fff;text-decoration:none;border-radius:10px;padding:8px 13px;font-size:13px}
.toast .x{float:left;background:transparent;border:0;color:inherit;font-size:20px;cursor:pointer;line-height:1}

/* ══ تأكيد ══ */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(16,27,51,.55);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:18px;font-weight:900}
.sheet p{font-size:14px;color:var(--ink-2);font-weight:700;margin-top:8px;line-height:1.8}
.sheet p b{color:var(--ink);font-family:var(--fm)}
.sheet .row2{margin-top:16px}
.btn.ghost{background:var(--line-2);color:var(--ink-2)}
</style>
</head>
<body>

<!-- ══ الدخول ══ -->
<div id="loginScreen" style="display:none">
  <div class="lcard">
    <div class="lg">🛵</div>
    <h2>أداة المندوب</h2>
    <p>سجّل الدخول بحساب الموظف</p>
    <label>اسم المستخدم</label>
    <input id="loginUser" type="text" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    <label>كلمة المرور</label>
    <input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginError"></div>
    <button class="lbtn" id="loginBtn" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ══ الأداة ══ -->
<div id="app" style="display:none">
  <header class="hdr">
    <div class="hdr-row">
      <h1>🛵 أداة المندوب<small id="who"></small></h1>
      <span class="sync" id="sync"><i></i><span id="syncTxt">جارٍ التحميل</span></span>
      <button class="out" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="today" onclick="document.getElementById('todayList').classList.toggle('open')">
      <span>💵 تحصيلك اليوم</span>
      <b id="todaySum">0</b><small style="color:var(--ink-3);font-weight:800">ج.م</small>
    </div>
    <div class="today-list" id="todayList"></div>

    <div id="routeBox"></div>

    <div class="search">
      <div class="sbox">
        <span class="ic">🔎</span>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="اسم العميل أو رقم الهاتف">
        <button class="clr" id="clr" aria-label="مسح">×</button>
      </div>
      <div class="sugs" id="sugs"></div>
    </div>

    <div id="view">
      <div class="idle">
        <div class="big">🔎</div>
        <h3>ابحث عن العميل</h3>
        <p>اكتب جزءًا من اسمه أو رقم هاتفه<br>ولن تظهر أي بيانات إلا عند البحث.</p>
      </div>
    </div>
  </div>
</div>

<!-- ══ تأكيد التسليم ══ -->
<div class="sheet-bg" id="confirmBg">
  <div class="sheet">
    <h3 id="cfTitle"></h3>
    <p id="cfBody"></p>
    <div class="row2">
      <button class="btn deliver" id="cfOk">تأكيد</button>
      <button class="btn ghost" id="cfNo">رجوع</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/config.js?v=20261017b"></script>
<script src="assets/app.js?v=20261017b"></script>
<script src="staff-auth.js?v=20261017b"></script>
<script>
const scriptURL = TS_CONFIG.ORDERS_SCRIPT_URL;
/* 🔒 السيرفر بيبعت للمندوب بس: الطلبات اللي "وصلت القاهرة"، + اللي هو
   نفسه حوّلها "في الطريق" (عشان يقدر يسجّل تسليمها). ومش بيسمحله يعدّل
   أي طلب غيرهم — شوف courierCanTouch_ في Orders_Code.gs. */
const HUB = "Arrived Cairo HUB", OUT = "Shipped To You";
const ACTIVE = [HUB, OUT];
const CACHE_KEY = "ts_courier_cache";
const CACHE_MAX_AGE = 30 * 60 * 1000;      // كاش 30 دقيقة للفتح السريع، وبيتحدّث في الخلفية على طول
const REFRESH_EVERY = 3 * 60 * 1000;

let ROWS = [];          // صفوف الطلبات (من السيرفر)
let CUSTOMERS = [];     // متجمّعين بالعميل + مفهرسين للبحث
let current = null;     // العميل المعروض
let currentBatch = "";
let busy = false;

/* ═══════════ الدخول ═══════════ */
function getStaffToken(){ return localStorage.getItem("staffToken") || ""; }
function getCurrentUser(){ return localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || ""; }

async function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if(!u || !p) return;
  const btn = document.getElementById("loginBtn");
  tsSetBtnLoading(btn, "جارٍ التحقق...");
  let res;
  try { res = await tsStaffLogin(u, p); } catch(e){ res = { success:false }; }
  tsClearBtnLoading(btn);
  if(res && res.success){
    localStorage.setItem("currentUser", u.toLowerCase());
    localStorage.setItem("currentUserLabel", res.label || u);
    localStorage.setItem("loginTime", Date.now());
    localStorage.setItem("staffToken", res.token || "");
    localStorage.setItem("isAdmin", res.isAdmin ? "1" : "");
    showApp();
  } else {
    const er = document.getElementById("loginError");
    er.textContent = (res && res.code === "locked") ? "⏳ " + res.message : "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
    er.style.display = "block";
  }
}
function logout(){
  ["currentUser","currentUserLabel","loginTime","staffToken","isAdmin",CACHE_KEY].forEach(k => localStorage.removeItem(k));
  ROWS = []; CUSTOMERS = []; current = null;
  location.reload();
}
function showApp(){
  if (tsGateTool("courier")) return;   // 🔑 صلاحية الأداة من شيت الموظفين
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("who").textContent = getCurrentUser();
  renderToday();
  routeLoad(); renderRoute();
  loadData(true);
  setTimeout(() => document.getElementById("q").focus(), 150);
}

/* ═══════════ البيانات ═══════════ */
function setSync(state, txt){
  const s = document.getElementById("sync");
  s.className = "sync " + state;
  document.getElementById("syncTxt").textContent = txt;
}

async function fetchRows(){
  const url = scriptURL + "?scope=courier&staffToken=" + encodeURIComponent(getStaffToken()) + "&_=" + Date.now();
  const res = await fetch(url, { redirect: "follow" });
  const data = await res.json();
  if(!Array.isArray(data)){
    const err = new Error("unauthorized"); err.auth = true; throw err;
  }
  return data;
}

async function loadData(useCache){
  if(useCache){
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if(c && Date.now() - c.t < CACHE_MAX_AGE && Array.isArray(c.d)){ setRows(c.d); setSync("ok", "جاهز"); }
    }catch(e){}
  }
  setSync("busy", ROWS.length ? "تحديث" : "جارٍ التحميل");
  try{
    const d = await fetchRows();
    setRows(d);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d })); }catch(e){}
    setSync("ok", "جاهز");
  }catch(e){
    if(e.auth){ alert("⚠️ انتهت الجلسة — يُرجى تسجيل الدخول مرة أخرى."); logout(); return; }
    setSync("err", ROWS.length ? "غير متصل" : "لا يوجد إنترنت");
  }
}

/* 🔤 توحيد الأسماء العربي للبحث: أ/إ/آ = ا، ة = ه، ى = ي، من غير تشكيل */
function normName(s){
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[ً-ٰٟـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/\s+/g, " ").trim();
}
function normPhone(p){ return tsToEnDigits(p).replace(/\D/g, "").replace(/^2/, "").replace(/^0/, ""); }
const num = v => parseFloat(tsToEnDigits(v)) || 0;
// 💵 السيرفر بيبعت "المطلوب" جاهز (due) — من غير السعر ولا العربون
const dueOf = o => Math.max(0, num(o.due));
const money = v => Math.round(v).toLocaleString("en-US");

function setRows(d){
  ROWS = d;
  const map = {};
  d.forEach(o => {
    const key = normPhone(o.phone) || ("name:" + normName(o.customerName));
    if(!map[key]) map[key] = { key, name: "", phone: "", gov: "", addr: "", rows: [], last: 0 };
    const c = map[key];
    c.rows.push(o);
    const t = new Date(o.date || 0).getTime() || 0;
    if(t >= c.last){            // أحدث بيانات للعميل
      c.last = t;
      c.name = String(o.customerName || c.name || "").trim();
      c.phone = o.phone || c.phone; c.gov = o.governorate || c.gov; c.addr = o.address || c.addr;
    }
  });
  CUSTOMERS = Object.values(map).map(c => {
    c.nName = normName(c.name);
    c.nPhone = normPhone(c.phone);
    c.active = c.rows.filter(o => ACTIVE.indexOf(String(o.status).trim()) !== -1).length;
    return c;
  });
  // لو فيه عميل معروض، نحدّثه بالبيانات الجديدة
  if(current){
    const fresh = CUSTOMERS.find(c => c.key === current.key);
    // لو العميل خرج من القايمة (كل طلباته اتسلّمت/اتأجلت)، الكارت يفضل
    // باسمه بس من غير منتجات — عشان مايفضلش يعرض منتجات قديمة تتداس تاني
    current = fresh || Object.assign({}, current, { rows: [], active: 0 });
    renderCustomer();
  }
  if(document.getElementById("q").value.trim()) renderSugs();
  renderRoute();
}

/* ═══════════ البحث ═══════════ */
function search(q){
  const raw = q.trim();
  if(raw.length < 2) return [];
  const digits = tsToEnDigits(raw).replace(/\D/g, "");
  const isPhone = digits.length >= 3 && digits.length >= raw.replace(/\s/g, "").length * 0.6;
  const nq = normName(raw);
  const tokens = nq.split(" ").filter(Boolean);
  const res = [];
  CUSTOMERS.forEach(c => {
    let score = -1;
    if(isPhone){
      const d = digits.replace(/^2/, "").replace(/^0/, "");
      if(d && c.nPhone.indexOf(d) !== -1) score = c.nPhone.endsWith(d) ? 3 : 2;
    } else if(tokens.every(t => c.nName.indexOf(t) !== -1)){
      score = c.nName.startsWith(tokens[0]) ? 3 : (c.nName.split(" ").some(w => w.startsWith(tokens[0])) ? 2 : 1);
    }
    if(score >= 0) res.push({ c, score });
  });
  // اللي عندهم طلبات واصلة الأول، بعدين الأقرب في الاسم، بعدين الأحدث
  res.sort((a, b) => (b.c.active > 0) - (a.c.active > 0) || b.score - a.score || b.c.last - a.c.last);
  return res.slice(0, 8).map(r => r.c);
}

function hl(name, q){
  const safe = tsEscapeHtml(name);
  const t = q.trim().split(/\s+/)[0];
  if(!t || /\d/.test(t)) return safe;
  const i = name.indexOf(t);
  if(i === -1) return safe;
  return tsEscapeHtml(name.slice(0, i)) + "<mark>" + tsEscapeHtml(name.slice(i, i + t.length)) + "</mark>" + tsEscapeHtml(name.slice(i + t.length));
}

let SUGS = [];
function renderSugs(){
  const q = document.getElementById("q").value;
  const box = document.getElementById("sugs");
  document.getElementById("clr").style.display = q ? "block" : "none";
  if(q.trim().length < 2){ box.className = "sugs"; box.innerHTML = ""; SUGS = []; return; }
  if(!ROWS.length){
    box.className = "sugs open";
    box.innerHTML = '<div class="sug-empty">⏳ لحظة، جارٍ تحميل البيانات...</div>';
    return;
  }
  SUGS = search(q);
  box.className = "sugs open";
  box.innerHTML = SUGS.length ? SUGS.map((c, i) => {
    const tail = c.nPhone ? "•••" + c.nPhone.slice(-4) : "";
    return '<div class="sug" onclick="pick(' + i + ')">' +
      '<div class="sug-b"><div class="sug-n">' + hl(c.name || "(بدون اسم)", q) + '</div>' +
      '<div class="sug-s">' + tsEscapeHtml(c.gov || "") + (c.gov && tail ? " · " : "") + '<span class="mono" dir="ltr">' + tail + '</span></div></div>' +
      (c.active ? '<span class="pill go">📦 ' + c.active + ' جاهز</span>' : '<span class="pill no">لا يوجد ما وصل</span>') +
      (ROUTE ? '<button class="sug-add' + (routeHas(c.key) ? ' in' : '') + '" onclick="routeAddSug(' + i + ', event)">' + (routeHas(c.key) ? '✓ في الخط' : '➕ أضف') + '</button>' : '') +
    '</div>';
  }).join("") : '<div class="sug-empty">لا يوجد عميل بهذا الاسم أو الرقم في الطلبات الأخيرة</div>';
}

function pick(i){
  const c = SUGS[i];
  if(!c) return;
  current = c;
  currentBatch = "";
  document.getElementById("sugs").className = "sugs";
  document.getElementById("q").blur();
  renderCustomer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ═══════════ كارت العميل ═══════════ */
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
/* قراءة موعد الوصول كتاريخ عشان نختار "الموعد اللي شغال عليه" (الأحدث) —
   نفس منطق فلتر المواعيد في الداشبورد */
function arrValue(raw){
  const t = String(raw || "").trim().toUpperCase().replace(/^[A-Z0-9]{1,3}[-–—\s]+(?=\d)/, "");
  if(!t) return -1;
  if(/^\d{7,8}$/.test(t)){ const y=+t.slice(-4), r=t.slice(0,-4), m=+r.slice(-2), d=+r.slice(0,-2); return new Date(y, m-1, d).getTime(); }
  const mi = MONTHS.findIndex(m => t.indexOf(m) !== -1);
  if(mi !== -1){
    const nums = t.replace(new RegExp(MONTHS[mi] + "[A-Z]*"), " ").match(/\d+/g) || [];
    let day = null, year = null;
    nums.forEach(n => { if(n.length === 4) year = +n; else if(day === null) day = +n; });
    if(year && day) return new Date(year, mi, day).getTime();
  }
  const p = t.split(/[^0-9]+/).filter(Boolean).map(Number);
  if(p.length === 3){ const y = String(p[0]).length === 4 ? p[0] : p[2], d = String(p[0]).length === 4 ? p[2] : p[0]; return new Date(y, p[1]-1, d).getTime(); }
  return 0;
}
const batchKey = v => String(v || "").trim().toLowerCase().replace(/\s+/g, " ");

function renderCustomer(){
  const c = current;
  const view = document.getElementById("view");
  if(!c){ view.innerHTML = ""; return; }
  custLang();   // نحفظ لغة العميل قبل أي تسليم (شوف custLang)

  const active = c.rows.filter(o => ACTIVE.indexOf(String(o.status).trim()) !== -1);
  const held = c.rows.filter(o => String(o.status).trim() === "On Hold");
  const pending = c.rows.filter(o => ACTIVE.indexOf(String(o.status).trim()) === -1 && !tsIsClosedStatus(o.status) && String(o.status).trim() !== "On Hold");

  // المواعيد اللي فيها حاجة جاهزة — الأحدث الأول
  const batches = {};
  active.forEach(o => { const k = batchKey(o.arrivaldate); if(!batches[k]) batches[k] = { label: String(o.arrivaldate || "").trim() || "بدون موعد", v: arrValue(o.arrivaldate), rows: [] }; batches[k].rows.push(o); });
  const bKeys = Object.keys(batches).sort((a, b) => batches[b].v - batches[a].v);
  if(!currentBatch || !batches[currentBatch]) currentBatch = bKeys[0] || "";
  const rows = currentBatch ? batches[currentBatch].rows : [];

  const phoneDisp = tsDisplayPhone(c.phone) || "—";
  const mapQ = encodeURIComponent([c.addr, c.gov, "مصر"].filter(Boolean).join(" "));
  BATCH_KEYS = bKeys;

  let h = '<div class="cust">' +
    '<div class="c-head">' +
      '<div class="c-name">' + tsEscapeHtml(c.name || "(بدون اسم)") + '</div>' +
      '<div class="c-ph">' + tsEscapeHtml(phoneDisp) + '</div>' +
      (c.addr || c.gov ? '<div class="c-addr">📍 ' + tsEscapeHtml([c.gov, c.addr].filter(Boolean).join(" — ")) + '</div>' : '') +
      '<div class="c-acts">' +
        '<a href="tel:' + tsEscapeHtml(tsDisplayPhone(c.phone) || "") + '"><b>📞</b>اتصال</a>' +
        '<a class="wa" href="#" onclick="waOnTheWay();return false"><b>💬</b>واتساب</a>' +
        '<a href="https://www.google.com/maps/search/?api=1&query=' + mapQ + '" target="_blank" rel="noopener"><b>🗺️</b>الخريطة</a>' +
      '</div>' +
      (ROUTE ? '<button class="c-route' + (routeHas(c.key) ? ' in' : '') + '" onclick="routeAddCurrent()">' +
        (routeHas(c.key) ? '✓ في خط سير يوم ' + routeDateHtml(ROUTE.date) + ' — اضغط للإزالة' : '➕ أضف إلى خط سير يوم ' + routeDateHtml(ROUTE.date)) + '</button>' : '') +
    '</div>';

  if(held.length){
    h += '<div class="hold-note">⏸️ ' + held.length + ' منتج معلّق' + (held[0].statusNote ? ': ' + tsEscapeHtml(held[0].statusNote) : '') + '</div>';
  }

  if(!active.length){
    h += '<div class="nothing">📭 لا توجد طلبات وصلت إلى القاهرة لهذا العميل حاليًا.</div>';
  } else {
    if(bKeys.length > 1){
      h += '<div class="batches">' + bKeys.map((k, i) =>
        '<button class="batch' + (k === currentBatch ? ' on' : '') + '" onclick="pickBatch(' + i + ')">📅 ' +
        tsEscapeHtml(batches[k].label) + ' (' + batches[k].rows.length + ')</button>').join("") + '</div>';
    }
    h += '<div class="sec">📦 الجاهز للتسليم — موعد ' + tsEscapeHtml(batches[currentBatch].label) + '</div>';
    h += rows.map(o => {
      const st = String(o.status).trim();
      const q = num(o.quantity) || 1, d = dueOf(o);
      return '<label class="item">' +
        '<input type="checkbox" class="pick" value="' + tsEscapeHtml(o.order) + '" checked onchange="updateTotals()">' +
        '<div class="item-b">' +
          '<div class="item-top"><span class="item-no">' + tsEscapeHtml(o.order) + '</span>' +
            '<span class="st ' + (st === OUT ? 'out' : 'hub') + '">' + tsEscapeHtml(tsStatusLabel(st)) + '</span></div>' +
          (o.dimensions && o.dimensions !== "-" ? '<div class="item-sp">📝 ' + tsEscapeHtml(o.dimensions) + '</div>' : '') +
          // 💵 المطلوب بس — من غير الإجمالي ولا المدفوع مقدمًا
          '<div class="item-m"><span>الكمية <b>' + q + '</b></span>' +
            (d ? '<span class="due">المطلوب <b>' + money(d) + '</b></span>' : '<span class="due" style="color:var(--ok)">✅ مدفوع</span>') + '</div>' +
        '</div></label>';
    }).join("");

    h += '<div class="sum" id="sum"></div>' +
      '<div class="collect"><label>💵 المبلغ المحصَّل</label>' +
        '<div class="amt"><input id="amt" inputmode="decimal" autocomplete="off" oninput="amtHint()"><span>ج.م</span></div>' +
        '<div class="amt-hint" id="amtHint"></div></div>' +
      '<div class="acts">' +
        '<button class="btn deliver" id="btnDeliver" onclick="askDeliver()">✅ تم التسليم والتحصيل</button>' +
        '<div class="row2">' +
          '<button class="btn out" id="btnOut" onclick="markOut()">🚚 خرجتُ للتوصيل</button>' +
          '<button class="btn hold" id="btnHold" onclick="markHold()">⏸️ مؤجل</button>' +
        '</div>' +
      '</div>';
  }

  if(pending.length){
    const dates = [...new Set(pending.map(o => String(o.arrivaldate || "").trim()).filter(Boolean))];
    h += '<div class="other">🕐 للعميل ' + pending.length + ' منتج آخر لم يصل بعد' + (dates.length ? ' (موعد: ' + tsEscapeHtml(dates.join("، ")) + ')' : '') + ' — لا يُسلَّم الآن.</div>';
  }
  h += '</div>';
  view.innerHTML = h;
  updateTotals(true);
}

let BATCH_KEYS = [];
function pickBatch(i){ if(BATCH_KEYS[i] !== undefined){ currentBatch = BATCH_KEYS[i]; renderCustomer(); } }

/* 💬 "أنا في الطريق ليك" — أرقام الطلبات + المطلوب تحصيله بس.
   ⚠️ مفيش أي ذكر للمدفوع مقدمًا ولا لإجمالي الشحنة. لو مفيش مطلوب،
   بنقول "مدفوع بالكامل" من غير أرقام.
   طرق الدفع: إنستاباي ← تحويل بنكي ← كاش، والمحفظة في الآخر كاختيار
   "لو أسهل ليك". مفيش أرقام حسابات هنا — العميل بيقول هيحوّل إزاي
   وبيتبعتله البيانات. */
function waOnTheWay(){
  if(!current) return;
  const sel = selectedRows().length ? selectedRows() : current.rows.filter(o => ACTIVE.indexOf(String(o.status).trim()) !== -1);
  const due = sel.reduce((s, o) => s + dueOf(o), 0);
  const first = String(current.name || "").trim().split(/\s+/)[0] || "";
  // 🌐 العميل اللي طلب بالإنجليزي (عمود lang) بتوصله الرسالة إنجليزي
  const en = custLang() === "en";
  const lines = (en
    ? ["Hi " + (first || "there") + " 👋", "This is your Try Shoppy courier 🛵 — your order is on its way to you today 📦", ""]
    : ["أهلًا " + first + " 👋", "معاك مندوب Try Shoppy 🛵 — طلبك في الطريق ليك النهارده إن شاء الله 📦", ""]
  ).concat(sel.map(o => "• " + o.order)).concat([""]);
  if(due > 0){
    if(en){
      lines.push("💵 Amount due on delivery: " + money(due) + " EGP");
      lines.push("Pay however suits you: InstaPay, bank transfer, or cash on delivery — a mobile wallet works too if that's easier. If you'd like to transfer, just tell me and I'll send the details 🙏");
    } else {
      lines.push("💵 المطلوب عند الاستلام: " + money(due) + " ج.م");
      lines.push("الدفع زي ما يريحك: إنستاباي، أو تحويل بنكي، أو كاش وقت الاستلام — والمحفظة الإلكترونية كمان متاحة لو أسهل ليك. لو هتحوّل، قولّي وهبعتلك البيانات 🙏");
    }
  } else {
    lines.push(en ? "✅ Your order is fully paid — nothing to pay on delivery." : "✅ طلبك مدفوع بالكامل — مفيش أي مبلغ مطلوب عند الاستلام.");
  }
  lines.push("");
  lines.push(en
    ? "📍 Please share your location here, plus anything that helps me find you (building number, floor, a landmark) if it's not in the address."
    : "📍 لو تسمح، ابعتلي اللوكيشن هنا، وأي تفاصيل تسهّل الوصول (رقم العمارة، الدور، علامة مميزة) لو مش مكتوبة في العنوان.");
  lines.push("");
  lines.push(en ? "Thank you for trusting Try Shoppy 🌟" : "شكرًا لثقتك في Try Shoppy 🌟");
  tsWaOpen(current.phone || "", lines.join("\n"));
}
/** لغة العميل الحالي — لو أي طلب من طلباته متسجل إنجليزي (عمود lang) */
function custLang(){
  if(!current) return "ar";
  // بعد التسليم current.rows بتتفضى (العميل بيختفي من القايمة) — فاللغة بتتحفظ
  // على current نفسه أول ما تتحسب، والإيصال بعد كده بياخدها من هنا
  if(current.rows.length) current.langCache = current.rows.some(o => tsWaLang(o.lang) === "en") ? "en" : "ar";
  return current.langCache || "ar";
}
let LAST_RECEIPT = null;
function waReceipt(){ if(LAST_RECEIPT) tsWaOpen(LAST_RECEIPT.phone, LAST_RECEIPT.text); }

function selectedRows(){
  const ids = [...document.querySelectorAll(".pick:checked")].map(i => i.value);
  return current ? current.rows.filter(o => ids.indexOf(String(o.order)) !== -1) : [];
}

function updateTotals(resetAmt){
  const sel = selectedRows();
  const due = sel.reduce((s, o) => s + dueOf(o), 0);
  const sum = document.getElementById("sum");
  if(!sum) return;
  sum.innerHTML =
    '<div>المنتجات المحددة<b>' + sel.length + '</b></div>' +
    (due ? '<div class="due">المطلوب تحصيله<b>' + money(due) + '</b></div>'
         : '<div class="due" style="color:var(--ok)">✅ مدفوع بالكامل — لا يوجد تحصيل<b></b></div>');
  const amt = document.getElementById("amt");
  if(amt && (resetAmt || amt.dataset.auto !== "0")){ amt.value = sel.length ? Math.round(due) : ""; amt.dataset.auto = "1"; }
  const noSel = !sel.length;
  ["btnDeliver","btnOut","btnHold"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = noSel; });
  const bo = document.getElementById("btnOut");
  if(bo && !noSel) bo.disabled = !sel.some(o => String(o.status).trim() === HUB);
  amtHint();
}

function amtHint(){
  const el = document.getElementById("amt"), hint = document.getElementById("amtHint");
  if(!el || !hint) return;
  if(document.activeElement === el) el.dataset.auto = "0";
  const due = selectedRows().reduce((s, o) => s + dueOf(o), 0);
  const v = num(el.value);
  if(el.value.trim() === "" || Math.round(v) === Math.round(due)){ hint.className = "amt-hint"; hint.textContent = ""; }
  else if(v < due){ hint.className = "amt-hint less"; hint.textContent = "⚠️ أقل من المطلوب بـ " + money(due - v) + " ج.م — سيبقى المتبقي مسجلًا على العميل"; }
  else { hint.className = "amt-hint more"; hint.textContent = "ℹ️ أكثر من المطلوب بـ " + money(v - due) + " ج.م"; }
}

/* ═══════════ التحديث ═══════════ */
function confirmSheet(title, body, okLabel){
  return new Promise(resolve => {
    document.getElementById("cfTitle").textContent = title;
    document.getElementById("cfBody").innerHTML = body;
    const ok = document.getElementById("cfOk"), no = document.getElementById("cfNo"), bg = document.getElementById("confirmBg");
    ok.textContent = okLabel || "تأكيد";
    bg.classList.add("open");
    const done = v => { bg.classList.remove("open"); ok.onclick = no.onclick = bg.onclick = null; resolve(v); };
    ok.onclick = () => done(true);
    no.onclick = () => done(false);
    bg.onclick = e => { if(e.target === bg) done(false); };
  });
}

function toast(kind, html, ms){
  const t = document.getElementById("toast");
  t.className = "toast show " + kind;
  t.innerHTML = '<button class="x" onclick="this.parentNode.className=\'toast\'">×</button>' + html;
  clearTimeout(t._h);
  if(ms) t._h = setTimeout(() => { t.className = "toast"; }, ms);
}

/** بيبعت التحديثات واحد ورا التاني (نفس سبب سلة الداشبورد: كتابتين في نفس
 *  اللحظة على الشيت ممكن تضيّع صف)، وبعدين يقرا الشيت تاني ويتأكد إن كل
 *  طلب بقى بالحالة والعربون المتوقعين — tsPostScript مابيقدرش يقرا رد
 *  السيرفر (no-cors)، فده التأكيد الحقيقي الوحيد. */
async function sendUpdates(updates){
  for(let i = 0; i < updates.length; i++){
    // الحقول اللي بتبدأ بـ _ للشاشة بس، مابتتبعتش للسيرفر
    const payload = { action: "updateStatus", user: getCurrentUser(), staffToken: getStaffToken(), source: "courier" };
    Object.keys(updates[i]).forEach(k => { if(k[0] !== "_") payload[k] = updates[i][k]; });
    try{ await tsPostScript(scriptURL, payload); }catch(e){}
    if(i < updates.length - 1) await new Promise(r => setTimeout(r, 350));
  }
  for(let attempt = 0; attempt < 3; attempt++){
    await new Promise(r => setTimeout(r, attempt ? 1500 : 700));
    try{
      // ⚠️ مش من القايمة: بعد التسليم/التأجيل الطلب بيخرج من قايمة المندوب،
      // فبنسأل السيرفر عن حالة وعربون الطلبات دي بالاسم (scope=courier&check)
      const states = await fetchCheck(updates.map(u => u.order));
      const failed = updates.filter(u => {
        const o = states.find(x => String(x.order) === String(u.order));
        if(!o || o.missing) return true;
        if(u.status && String(o.status).trim() !== u.status) return true;
        // التحصيل نزل لو "المطلوب" قل بالمبلغ اللي اتحصّل (من غير ما نعرف العربون)
        if(u._expectDue !== undefined && Math.round(num(o.due)) !== Math.round(u._expectDue)) return true;
        return false;
      });
      if(!failed.length || attempt === 2){
        try{
          const fresh = await fetchRows();
          setRows(fresh);
          localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: fresh }));
        }catch(e){}
        return failed;
      }
    }catch(e){ if(e.auth){ alert("⚠️ انتهت الجلسة — يُرجى تسجيل الدخول مرة أخرى."); logout(); return updates; } }
  }
  return null;   // مقدرناش نتأكد
}

/** حالة + عربون طلبات محددة بس (من غير أي بيانات عميل) */
async function fetchCheck(orders){
  const url = scriptURL + "?scope=courier&check=" + encodeURIComponent(orders.join(",")) +
              "&staffToken=" + encodeURIComponent(getStaffToken()) + "&_=" + Date.now();
  const res = await fetch(url, { redirect: "follow" });
  const data = await res.json();
  if(!Array.isArray(data)){ const err = new Error("unauthorized"); err.auth = true; throw err; }
  return data;
}

function lockUI(on){
  busy = on;
  ["btnDeliver","btnOut","btnHold"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = on; });
  setSync(on ? "busy" : "ok", on ? "جارٍ الحفظ" : "جاهز");
}

/* ✅ تسليم + تحصيل */
async function askDeliver(){
  if(busy) return;
  const sel = selectedRows();
  if(!sel.length) return;
  const amtEl = document.getElementById("amt");
  const amount = num(amtEl.value);
  const due = sel.reduce((s, o) => s + dueOf(o), 0);
  if(amtEl.value.trim() === ""){ amtEl.focus(); return toast("err", "اكتب المبلغ المحصَّل (وإذا لم يدفع العميل شيئًا فاكتب 0)", 3500); }

  let warn = "";
  if(Math.round(amount) < Math.round(due)) warn = '<br>⚠️ <b>' + money(due - amount) + '</b> ج.م ستبقى مطلوبة من العميل.';
  if(Math.round(amount) > Math.round(due)) warn = '<br>ℹ️ المبلغ أكثر من المطلوب بـ <b>' + money(amount - due) + '</b> ج.م.';
  const ok = await confirmSheet("✅ تأكيد التسليم",
    'ستسجّل تسليم <b>' + sel.length + '</b> منتج لـ ' + tsEscapeHtml(current.name) +
    '<br>والمبلغ المحصَّل: <b>' + money(amount) + '</b> ج.م' + warn, "تأكيد التسليم");
  if(!ok) return;

  lockUI(true);
  toast("ok", "⏳ جارٍ تسجيل التسليم...");
  // ⚠️ بنقرا العربون من الشيت **دلوقتي** قبل ما نحسب — لو حد في المكتب عدّل
  // العربون من شوية، مانكتبش فوقه بقيمة قديمة
  let fresh;
  try{ fresh = await fetchRows(); setRows(fresh); }catch(e){ lockUI(false); return toast("err", "❌ لا يوجد اتصال — لم يُسجَّل شيء. حاول مرة أخرى.", 5000); }
  const ids = sel.map(o => String(o.order));
  const live = ids.map(id => fresh.find(o => String(o.order) === id)).filter(Boolean);
  if(live.length !== ids.length){ lockUI(false); return toast("err", "❌ يوجد طلب غير موجود في الشيت — حدّث الصفحة وحاول مرة أخرى.", 6000); }

  // 💵 توزيع المبلغ: كل منتج بياخد المطلوب عليه بالترتيب، والزيادة (لو فيه) على آخر واحد
  let left = amount;
  const updates = live.map((o, i) => {
    const take = i === live.length - 1 ? left : Math.min(dueOf(o), left);
    left = Math.max(0, left - take);
    // collected = اللي اتحصّل بس — السيرفر هو اللي بيجمعه على العربون
    const got = Math.round(Math.max(0, take) * 100) / 100;
    return { order: String(o.order), status: "Delivered", collected: got,
             _take: got, _expectDue: Math.max(0, dueOf(o) - got) };
  });

  const failed = await sendUpdates(updates);
  lockUI(false);
  if(failed === null){
    return toast("err", "⚠️ أُرسلت التحديثات، لكن لم نتمكن من التأكد من تسجيلها (ربما بسبب الإنترنت). <b>لا تُعِد الإرسال</b> — تواصل مع المكتب للتأكد من الشيت.");
  }
  const okCount = updates.length - failed.length;
  if(okCount) logCollection(current.name, updates.filter(u => failed.indexOf(u) === -1));
  // 🐛→✅ الإيصال كان بيعدّ كل الطلبات حتى اللي ماتسجلتش — دلوقتي اللي نجح بس
  // 🌐 وبلغة العميل
  const okList = updates.filter(u => failed.indexOf(u) === -1).map(u => "• " + u.order).join("\n");
  LAST_RECEIPT = { phone: current.phone || "", text: custLang() === "en"
    ? "Hi " + (current.name || "") + " 👋\nYour Try Shoppy order has been delivered ✅\n" + okList +
      "\nAmount paid: " + money(amount) + " EGP\nThank you for your trust 🌟"
    : "أهلًا " + (current.name || "") + " 👋\nتم تسليم طلبك من Try Shoppy ✅\n" + okList +
      "\nالمبلغ المدفوع: " + money(amount) + " ج.م\nشكرًا لثقتك 🌟" };
  if(failed.length){
    toast("err", "⚠️ سُجِّل " + okCount + " من " + updates.length + ". لم تُسجَّل الطلبات التالية: " + failed.map(f => f.order).join("، ") + " — أعد المحاولة لها فقط.");
  } else {
    toast("ok", "✅ تم تسجيل التسليم وتحصيل " + money(amount) + " ج.م" +
      '<br><a href="#" onclick="waReceipt();return false">📲 أرسل إيصالًا للعميل عبر واتساب</a>' + routeMark(current.key, "done"));
  }
  renderCustomer();
}

function todayKey(){ return "ts_courier_log_" + (localStorage.getItem("currentUser") || "") + "_" + new Date().toLocaleDateString("en-CA"); }
function logCollection(name, ups){
  let log = [];
  try{ log = JSON.parse(localStorage.getItem(todayKey()) || "[]"); }catch(e){}
  const amount = ups.reduce((s, u) => s + (u._take || 0), 0);
  log.push({ t: new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }), name, n: ups.length, amount });
  try{ localStorage.setItem(todayKey(), JSON.stringify(log)); }catch(e){}
  renderToday();
}

  let log = [];
  try{ log = JSON.parse(localStorage.getItem(todayKey()) || "[]"); }catch(e){}
  const total = log.reduce((s, x) => s + (x.amount || 0), 0);
  document.getElementById("todaySum").textContent = money(total);

    ? log.slice().reverse().map(x => '<div><span>' + tsEscapeHtml(x.t) + ' · ' + tsEscapeHtml(x.name) + ' (' + x.n + ')</span><b class="mono">' + money(x.amount) + '</b></div>').join("")

  // العنوان الأول — المحافظة بس لو العنوان مفيهوش منطقة ("الجيزة" ماتغلبش "شارع الهرم")
  const t = routeNorm(addr);
  for(const x of ROUTE_KEYS){ if(x.re.test(t)) return x.i; }
  const g = routeNorm(gov);
  for(const x of ROUTE_KEYS){ if(x.re.test(g)) return x.i; }
  return -1;
}
function routeInZone(gov, areaIdx){
  if(areaIdx !== -1 && ROUTE_ZONE_EXTRA.indexOf(ROUTE_AREAS[areaIdx][0]) !== -1) return true;
  const g = routeNorm(gov);
  return !g || ROUTE_ZONE_GOVS.some(z => g.indexOf(z) !== -1);
}
function routeDist(a, b){   // كم (هافرسين) — كفاية للترتيب
  const R = 6371, r = Math.PI / 180;
  const dLa = (b[2] - a[2]) * r, dLo = (b[3] - a[3]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[2] * r) * Math.cos(b[2] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let ROUTE = null;
function routeKey(){ return "ts_courier_route_" + (localStorage.getItem("currentUser") || ""); }
function routeLoad(){ try{ ROUTE = JSON.parse(localStorage.getItem(routeKey()) || "null"); }catch(e){ ROUTE = null; } }
function routeSave(){ try{ ROUTE ? localStorage.setItem(routeKey(), JSON.stringify(ROUTE)) : localStorage.removeItem(routeKey()); }catch(e){} }
function routeDateTxt(iso){ const p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : iso; }
// ⚠️ التاريخ بالأرقام والشرَط بيتقلب في RTL (18-10-2026 بيبان 2026-10-18) — فبيتلف في span باتجاه ltr
function routeDateHtml(iso){ return '<span dir="ltr" style="unicode-bidi:isolate">' + tsEscapeHtml(routeDateTxt(iso)) + '</span>'; }
function routeStartArea(){ const i = ROUTE_AREAS.findIndex(a => a[0] === (ROUTE && ROUTE.start)); return i === -1 ? ROUTE_AREAS.findIndex(a => a[0] === ROUTE_DEFAULT_START) : i; }

function routeNew(){
  ROUTE = { date: new Date().toLocaleDateString("en-CA"), start: ROUTE_DEFAULT_START, stops: [], manual: false, open: true };
  routeSave(); renderRoute();
  toast("ok", "🗺️ تم إنشاء خط السير — ابحث عن العميل واضغط «➕ أضف»", 4000);
  setTimeout(() => document.getElementById("q").focus(), 100);
}
function routeHas(key){ return !!(ROUTE && ROUTE.stops.some(s => s.key === key)); }
function routeAdd(c){
  if(!ROUTE || !c || routeHas(c.key)) return;
  if(!c.active) return toast("err", "لا توجد طلبات جاهزة للتسليم لـ " + tsEscapeHtml(c.name || "هذا العميل") + " — لم يُضف إلى الخط.", 3500);
  const area = routeAreaOf(c.addr, c.gov);
  ROUTE.stops.push({ key: c.key, name: c.name || "", phone: c.phone || "", addr: c.addr || "", gov: c.gov || "", area, done: false, hold: false });
  if(!ROUTE.manual) routeSortStops();
  routeSave(); renderRoute();
  const s = ROUTE.stops.find(x => x.key === c.key);
  toast("ok", "➕ أُضيف " + tsEscapeHtml(c.name || "العميل") + " — محطة رقم " + (ROUTE.stops.indexOf(s) + 1) +
    (area === -1 ? "<br>⚠️ لم نتعرف على المنطقة من العنوان، فوُضع في آخر الخط" : " (" + tsEscapeHtml(ROUTE_AREAS[area][0]) + ")"), 3500);
}
function routeAddCurrent(){ if(current){ routeHas(current.key) ? routeRemove(current.key) : routeAdd(current); renderCustomer(); } }
function routeAddSug(i, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const c = SUGS[i]; if(!c) return;
  routeHas(c.key) ? routeRemove(c.key) : routeAdd(c);
  renderSugs();
}
function routeRemove(key){
  if(!ROUTE) return;
  ROUTE.stops = ROUTE.stops.filter(s => s.key !== key);
  routeSave(); renderRoute();
}
/** أقصر مسار مفتوح يبدأ من start ويمر على كل النقاط مرة واحدة.
 *  لحد 13 منطقة: الحل الدقيق (Held-Karp) — أقل من ثانية على الموبايل.
 *  أكتر من كده: "الأقرب فالأقرب" + تحسين بنقل نقطة واحدة لأحسن مكان. */
function routeBestOrder(start, pts){
  const n = pts.length;
  if(n <= 1) return n ? [0] : [];
  if(n <= 13){
    const FULL = (1 << n) - 1, INF = 1e9;
    const dp = new Float64Array((1 << n) * n).fill(INF), par = new Int8Array((1 << n) * n).fill(-1);
    for(let j = 0; j < n; j++) dp[(1 << j) * n + j] = routeDist(start, pts[j]);
    for(let m = 1; m <= FULL; m++){
      for(let j = 0; j < n; j++){
        const cur = dp[m * n + j];
        if(cur >= INF || !(m & (1 << j))) continue;
        for(let k = 0; k < n; k++){
          if(m & (1 << k)) continue;
          const nm = m | (1 << k), v = cur + routeDist(pts[j], pts[k]);
          if(v < dp[nm * n + k]){ dp[nm * n + k] = v; par[nm * n + k] = j; }
        }
      }
    }
    let end = 0;
    for(let j = 1; j < n; j++) if(dp[FULL * n + j] < dp[FULL * n + end]) end = j;
    const out = [];
    for(let m = FULL, j = end; j !== -1; ){ out.push(j); const pj = par[m * n + j]; m &= ~(1 << j); j = pj; }
    return out.reverse();
  }
  // كتير: الأقرب فالأقرب + or-opt
  const left = pts.map((_, i) => i), ord = [];
  let at = start;
  while(left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p, i) => { const d = routeDist(at, pts[p]); if(d < bd){ bd = d; bi = i; } });
    at = pts[left[bi]]; ord.push(left.splice(bi, 1)[0]);
  }
  const len = a => a.reduce((t, p, k) => t + routeDist(k ? pts[a[k - 1]] : start, pts[p]), 0);
  for(let improved = true, guard = 0; improved && guard < 30; guard++){
    improved = false;
    for(let k = 0; k < ord.length; k++){
      const rest = ord.slice(0, k).concat(ord.slice(k + 1));
      let best = null, bestLen = len(ord) - 0.05;
      for(let pos = 0; pos <= rest.length; pos++){
        const c = rest.slice(0, pos).concat([ord[k]], rest.slice(pos)), L = len(c);
        if(L < bestLen){ bestLen = L; best = c; }
      }
      if(best){ ord.splice(0, ord.length, ...best); improved = true; }
    }
  }
  return ord;
}
/** ترتيب المحطات: أقصر مسار من نقطة البداية (routeBestOrder). اللي
 *  اتسلّم بيفضل فوق بترتيبه، والمنطقة المجهولة/خارج النطاق في الآخر */
function routeSortStops(){
  const done = ROUTE.stops.filter(s => s.done || s.hold);
  const left = ROUTE.stops.filter(s => !s.done && !s.hold);
  const known = left.filter(s => s.area !== -1), unknown = left.filter(s => s.area === -1);
  const start = ROUTE_AREAS[routeStartArea()];
  // نجمّع المحطات حسب المنطقة (نفس المنطقة = ورا بعض)، ونرتّب المناطق نفسها
  const areas = [...new Set(known.map(s => s.area))];
  const order = routeBestOrder(start, areas.map(i => ROUTE_AREAS[i]));
  const ordered = [];
  order.forEach(k => known.filter(s => s.area === areas[k]).forEach(s => ordered.push(s)));
  // المجهول جوه النطاق قبل اللي خارج النطاق
  unknown.sort((a, b) => routeInZone(b.gov, b.area) - routeInZone(a.gov, a.area));
  ROUTE.stops = done.concat(ordered, unknown);
}
function routeResort(){ if(!ROUTE) return; ROUTE.manual = false; routeSortStops(); routeSave(); renderRoute(); toast("ok", "🔀 تم ترتيب الخط حسب الأقرب من " + tsEscapeHtml(ROUTE.start), 2500); }
function routeMove(i, d){
  if(!ROUTE) return;
  const j = i + d;
  if(j < 0 || j >= ROUTE.stops.length) return;
  [ROUTE.stops[i], ROUTE.stops[j]] = [ROUTE.stops[j], ROUTE.stops[i]];
  ROUTE.manual = true; routeSave(); renderRoute();
}
function routeSetStart(v){ ROUTE.start = v; if(!ROUTE.manual) routeSortStops(); routeSave(); renderRoute(); }
function routeSetDate(v){ if(v){ ROUTE.date = v; routeSave(); renderRoute(); } }
async function routeClear(){
  if(!ROUTE) return;
  const ok = await confirmSheet("🗑 مسح خط السير", "سيُحذف خط سير يوم <b>" + routeDateHtml(ROUTE.date) + "</b> من هذا الموبايل. لن يتغير أي شيء في الطلبات نفسها.", "مسح");
  if(!ok) return;
  ROUTE = null; routeSave(); renderRoute(); renderSugs(); if(current) renderCustomer();
}
function routeToggle(){ if(ROUTE){ ROUTE.open = !ROUTE.open; routeSave(); renderRoute(); } }
/** حالة المحطة لايف: لسه عليها طلبات جاهزة؟ ولا اتسلّمت/اتأجلت */
function routeLive(s){
  const c = CUSTOMERS.find(x => x.key === s.key);
  return { c, ready: c ? c.active : 0, done: s.done || (ROWS.length > 0 && (!c || c.active === 0) && !s.hold), hold: s.hold };
}
function routeOpen(i){
  const s = ROUTE && ROUTE.stops[i]; if(!s) return;
  const c = CUSTOMERS.find(x => x.key === s.key);
  if(!c) return toast("err", "لا توجد طلبات جاهزة لهذا العميل الآن (ربما تم تسليمها).", 3500);
  current = c; currentBatch = ""; renderCustomer();
  document.getElementById("view").scrollIntoView({ behavior: "smooth", block: "start" });
}
function routeNextIndex(){
  if(!ROUTE) return -1;
  return ROUTE.stops.findIndex(s => { const l = routeLive(s); return !l.done && !l.hold; });
}
/** بعد التسليم/التأجيل — بنعلّم المحطة ونقترح اللي بعدها */
function routeMark(key, kind){
  if(!ROUTE) return "";
  const s = ROUTE.stops.find(x => x.key === key);
  if(!s) return "";
  if(kind === "done"){ s.done = true; s.hold = false; } else s.hold = true;
  routeSave(); renderRoute();
  const n = routeNextIndex();
  return n === -1 ? '<br>🎉 خلصت كل محطات خط السير' :
    '<br><a href="#" style="background:var(--blue)" onclick="routeOpen(' + n + ');document.getElementById(\'toast\').className=\'toast\';return false">➡️ المحطة التالية: ' + tsEscapeHtml(ROUTE.stops[n].name || "") + '</a>';
}
/** 🧭 Google Maps بالترتيب — الرابط بياخد لحد 9 محطات وسطانية + الوجهة،
 *  فلو الخط أطول بنقسّمه لرحلات (كل رحلة بتبدأ من آخر محطة في اللي قبلها) */
function routeMapsLegs(){
  // المنطقة المجهولة وخارج النطاق مابيدخلوش الخريطة — Google هيخمّن مكانهم غلط
  const left = ROUTE.stops.filter(s => { const l = routeLive(s); return !l.done && !l.hold && s.area !== -1 && routeInZone(s.gov, s.area); });
  const q = s => [s.addr, s.area !== -1 ? ROUTE_AREAS[s.area][0] : "", s.gov, "مصر"].filter(Boolean).join(" ");
  const legs = [];
  let origin = ROUTE.start + " القاهرة مصر";
  for(let i = 0; i < left.length; i += 10){
    const part = left.slice(i, i + 10);
    const dest = part[part.length - 1], way = part.slice(0, -1);
    legs.push({ from: i + 1, to: i + part.length, url: "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(origin) +
      "&destination=" + encodeURIComponent(q(dest)) + (way.length ? "&waypoints=" + encodeURIComponent(way.map(q).join("|")) : "") });
    origin = q(dest);
  }
  return legs;
}
/** 🚚 خرجت للتوصيل لكل محطات الخط مرة واحدة (اللي لسه "وصل القاهرة" بس) */
async function routeMarkOutAll(){
  if(busy || !ROUTE) return;
  const keys = ROUTE.stops.filter(s => { const l = routeLive(s); return !l.done && !l.hold; }).map(s => s.key);
  const rows = ROWS.filter(o => String(o.status).trim() === HUB && keys.indexOf(normPhone(o.phone) || ("name:" + normName(o.customerName))) !== -1);
  if(!rows.length) return toast("err", "لا توجد منتجات بحالة «وصل مخزن القاهرة» في خط السير — ربما سجّلت خروجك لها بالفعل.", 4000);
  const ok = await confirmSheet("🚚 خرجتُ للتوصيل — كل الخط",
    "ستحوّل <b>" + rows.length + "</b> منتج لـ <b>" + keys.length + "</b> عميل إلى «في الطريق إليك»، وستصل إلى كل عميل رسالة بريد إلكتروني بأن طلبه خرج للتوصيل.", "تأكيد");
  if(!ok) return;
  lockUI(true);
  toast("ok", "⏳ جارٍ التسجيل... (" + rows.length + " منتج)");
  const failed = await sendUpdates(rows.map(o => ({ order: String(o.order), status: OUT })));
  lockUI(false);
  if(failed === null) return toast("err", "⚠️ لم نتمكن من التأكد من تسجيل التحديث — لا تُعِد الإرسال، وتواصل مع المكتب.");
  toast(failed.length ? "err" : "ok", failed.length ? "⚠️ لم تُسجَّل الطلبات التالية: " + failed.map(f => f.order).join("، ") : "✅ تم تسجيل خروجك للتوصيل لكل الخط", failed.length ? 0 : 3500);
  renderRoute(); if(current) renderCustomer();
}

function renderRoute(){
  const box = document.getElementById("routeBox");
  if(!box) return;
  if(!ROUTE){ box.innerHTML = '<button class="rt-new" onclick="routeNew()">🗺️ إضافة خط سير ليوم توصيل</button>'; return; }
  const live = ROUTE.stops.map(routeLive);
  const doneN = live.filter(l => l.done).length;
  const next = routeNextIndex();
  let h = '<div class="route' + (ROUTE.open ? ' open' : '') + '">' +
    '<div class="rt-head" onclick="routeToggle()"><b>🗺️ خط سير يوم ' + routeDateHtml(ROUTE.date) + '</b>' +
      '<small>تم ' + doneN + ' من ' + ROUTE.stops.length + '</small><span>' + (ROUTE.open ? '▲' : '▼') + '</span></div>' +
    '<div class="rt-body">' +
      '<div class="rt-cfg">' +
        '<label>📅 يوم التوصيل<input type="date" value="' + tsEscapeHtml(ROUTE.date) + '" onchange="routeSetDate(this.value)"></label>' +
        '<label>📍 نقطة البداية<select onchange="routeSetStart(this.value)">' +
          ROUTE_AREAS.map(a => '<option' + (a[0] === ROUTE.start ? ' selected' : '') + '>' + tsEscapeHtml(a[0]) + '</option>').join("") +
        '</select></label>' +
      '</div>';
  if(!ROUTE.stops.length){
    h += '<div class="rt-hint">🔎 ابحث عن العميل في خانة البحث، واضغط <b>➕ أضف</b> بجانب اسمه — وسيترتب الخط تلقائيًا حسب الأقرب من ' + tsEscapeHtml(ROUTE.start) + '.</div>';
  } else {
    if(ROUTE.manual) h += '<div class="rt-hint">✋ رتّبت الخط يدويًا — اضغط «🔀 رتّب حسب الأقرب» للرجوع للترتيب التلقائي.</div>';
    h += ROUTE.stops.map((s, i) => {
      const l = live[i];
      const inZone = routeInZone(s.gov, s.area);
      const areaTag = !inZone && s.area === -1 ? '<span class="area far">⛔ خارج نطاق المندوب' + (s.gov ? ' (' + tsEscapeHtml(s.gov) + ')' : '') + '</span>'
        : s.area === -1 ? '<span class="area unk">⚠️ منطقة غير معروفة</span>'
        : '<span class="area' + (inZone ? '' : ' far') + '">' + tsEscapeHtml(ROUTE_AREAS[s.area][0]) + (inZone ? '' : ' · خارج النطاق') + '</span>';
      const st = l.done ? '✅ تم التسليم' : l.hold ? '⏸️ مؤجل' : (l.ready ? '📦 ' + l.ready + ' جاهز' : '');
      return '<div class="stop' + (l.done ? ' done' : l.hold ? ' hold' : '') + (i === next ? ' next' : '') + '">' +
        '<span class="n">' + (l.done ? '✓' : i + 1) + '</span>' +
        '<div class="stop-b" onclick="routeOpen(' + i + ')"><div class="stop-nm">' + tsEscapeHtml(s.name || "(بدون اسم)") + '</div>' +
          '<div class="stop-s">' + areaTag + (st ? '<span>' + st + '</span>' : '') + '</div></div>' +
        '<div class="stop-x">' +
          '<button onclick="routeMove(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="لأعلى">⬆️</button>' +
          '<button onclick="routeMove(' + i + ',1)"' + (i === ROUTE.stops.length - 1 ? ' disabled' : '') + ' aria-label="لأسفل">⬇️</button>' +
          '<button onclick="routeRemove(\'' + tsJsAttr(s.key) + '\')" aria-label="إزالة">✕</button>' +
        '</div></div>';
    }).join("");
    const legs = routeMapsLegs();
    h += '<div class="rt-acts">' +
      '<div class="row2"><button class="btn sm sort" onclick="routeResort()">🔀 رتّب حسب الأقرب</button>' +
        '<button class="btn sm out" onclick="routeMarkOutAll()">🚚 خرجتُ للتوصيل (الكل)</button></div>' +
      legs.map(l => '<a class="btn sm nav" style="text-decoration:none" href="' + tsSafeHref(l.url) + '" target="_blank" rel="noopener">🧭 افتح في Google Maps' +
        (legs.length > 1 ? ' — الجزء ' + Math.ceil(l.from / 10) : '') + '</a>').join("") +
      (ROUTE.stops.some(s => !routeLive(s).done && !routeLive(s).hold && s.area === -1) ? '<div class="rt-hint" style="margin:0">⚠️ المحطات «منطقة غير معروفة» ليست في الخريطة — افتحها من كارت العميل (🗺️ الخريطة).</div>' : '') +
    '</div>';
  }
  h += '<div class="rt-acts"><button class="btn sm del" onclick="routeClear()">🗑 مسح خط السير</button></div></div></div>';
  box.innerHTML = h;
}

/* ═══════════ التشغيل ═══════════ */
const qEl = document.getElementById("q");
qEl.addEventListener("input", renderSugs);
qEl.addEventListener("focus", renderSugs);
qEl.addEventListener("keydown", e => { if(e.key === "Enter" && SUGS.length){ e.preventDefault(); pick(0); } });
document.getElementById("clr").onclick = () => { qEl.value = ""; renderSugs(); qEl.focus(); };
document.addEventListener("click", e => { if(!e.target.closest(".search")) document.getElementById("sugs").className = "sugs"; });

// تحديث في الخلفية كل 3 دقايق + أول ما الموبايل يرجع للصفحة
setInterval(() => { if(document.visibilityState === "visible" && getStaffToken() && !busy) loadData(false); }, REFRESH_EVERY);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && getStaffToken() && !busy) loadData(false); });

(function init(){
  const t = +localStorage.getItem("loginTime") || 0;
  if(getStaffToken() && Date.now() - t < 12 * 60 * 60 * 1000) showApp();
  else document.getElementById("loginScreen").style.display = "flex";
})();
