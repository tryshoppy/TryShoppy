<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRY SHOPPY - Quick Order</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fe;
  --white:#fff;
  --text:#1e293b;
  --border:#cbd5e1;
}
body{ font-family:'Cairo',sans-serif; background:var(--bg); margin:0; padding:20px; }
.container{ max-width:500px; margin:auto; }
.card{ background:white; border-radius:20px; padding:25px; box-shadow:0 5px 20px rgba(0,0,0,.08); }
h2{ margin-top:0; text-align:center; color:var(--primary); font-weight:900; }
.input-group{ margin-bottom:15px; }
.input-group label{ display:block; margin-bottom:6px; font-weight:bold; color:#475569; }
.input-group input{ width:100%; padding:14px; border:1px solid var(--border); border-radius:12px; font-family:'Cairo'; box-sizing:border-box; font-size:15px; }
button{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--primary); color:white; font-family:'Cairo'; font-size:16px; font-weight:bold; cursor:pointer; }
button:hover{ opacity:.9; }
.customer-box{ background:#eff6ff; padding:15px; border-radius:12px; margin-bottom:15px; display:none; }
.customer-box div{ margin-bottom:5px; font-weight:700; }
.spinner{ display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-left:8px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ── Login Screen ── */
#loginScreen{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
  box-sizing:border-box;
}
.login-box{
  background:#fff; border-radius:24px; padding:35px 30px; width:100%; max-width:380px;
  box-shadow:0 10px 40px rgba(0,0,0,0.08); border:1px solid #e2e8f0;
}
.login-logo{ font-size:2rem; font-weight:900; color:#2563eb; text-align:center; margin-bottom:6px; }
.login-sub{ font-size:13px; color:#94a3b8; text-align:center; margin-bottom:26px; font-weight:600; }
.login-label{ font-weight:700; font-size:14px; color:#334155; display:block; margin-bottom:7px; }
.login-input{
  width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid #e2e8f0;
  font-family:'Cairo'; font-size:15px; background:#f8fafc; box-sizing:border-box; margin-bottom:16px;
  transition:all 0.2s;
}
.login-input:focus{ outline:none; border-color:#2563eb; background:#fff; }
.login-error{
  display:none; color:#ef4444; font-size:13px; font-weight:700; text-align:center;
  margin-bottom:14px; background:#fef2f2; padding:10px; border-radius:10px; border:1px solid #fecaca;
}
.btn-login{
  width:100%; padding:14px; background:#2563eb; color:#fff; border:none; border-radius:12px;
  font-family:'Cairo'; font-weight:900; font-size:15px; cursor:pointer;
  box-shadow:0 4px 12px rgba(37,99,235,0.3); transition:all 0.2s;
}
.btn-login:hover{ background:#1d4ed8; }

/* ── Main Content ── */
#mainContent{ display:none; }
</style>
</head>
<body>

<!-- ====== شاشة الدخول ====== -->
<div id="loginScreen" style="display:flex;">
  <div class="login-box">
    <div class="login-logo">TRY SHOPPY</div>
    <div class="login-sub">سجّل دخولك للمتابعة</div>
    <label class="login-label">اسم المستخدم</label>
    <input id="loginUser" type="text" class="login-input" placeholder="أدخل اسم المستخدم" autocomplete="username">
    <label class="login-label">كلمة المرور</label>
    <input id="loginPass" type="password" class="login-input" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();">
    <div id="loginError" class="login-error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ====== المحتوى الرئيسي ====== -->
<div id="mainContent">
<div class="container">
<div class="card">

<h2>➕ إضافة أوردر سريع</h2>
<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:16px;">
  <span id="qUserBadge" style="background:#ede9fe; color:#6366f1; padding:5px 14px; border-radius:10px; font-weight:800; font-size:13px; border:1px solid #c4b5fd;"></span>
  <button onclick="qLogout()" style="width:auto; padding:7px 16px; font-size:13px; background:#ef4444; border-radius:10px;">خروج</button>
</div>

<div class="input-group">
  <label>رقم التليفون</label>
  <input type="text" id="phone" placeholder="01xxxxxxxxx">
</div>

<button onclick="searchCustomer()">بحث عن العميل</button>

<div id="customerBox" class="customer-box">
  <div id="customerName"></div>
  <div id="customerAddress"></div>
</div>

<div class="input-group">
  <label>البريد الإلكتروني (اختياري) — لإرسال تأكيد الطلب</label>
  <input type="email" id="customerEmail" placeholder="name@example.com">
</div>

<div class="input-group">
  <label>لينك المنتج الجديد</label>
  <input type="text" id="link">
</div>

<div class="input-group">
  <label>الكمية</label>
  <input type="number" id="qty" value="1" min="1">
</div>

<div class="input-group">
  <label>السعر بالدولار ($)</label>
  <input type="number" id="usd">
</div>

<div class="input-group">
  <label>السعر بالمصري (EGP)</label>
  <input type="number" id="egp">
</div>

<div class="input-group">
  <label>المواصفات الخاصة (SPCS)</label>
  <input type="text" id="dimensions" placeholder="مثال: Size: L | Color: Red | Notes: ...">
</div>
    
<button id="createBtn" onclick="createOrder()">إنشاء الأوردر</button>

<div id="waContainer" style="display:none; margin-top:14px;">
  <button onclick="sendWhatsApp()" style="background:#25D366;">💬 تأكيد الأوردر عبر واتساب</button>
  <button onclick="sendCustomerSummary()" style="background:#0ea5e9; margin-top:10px;">📩 إرسال ملخص الطلب للعميل</button>
</div>

</div>
</div>
</div>



<script src="staff-auth.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const SESSION_TIME = 2 * 60 * 60 * 1000;
const scriptURL = TS_CONFIG.ORDERS_SCRIPT_URL;

// ── التحقق من الجلسة — بيتأكد بس إن فيه جلسة محفوظة صالحة.
// التحقق الفعلي من الباسورد حصل مرة واحدة وقت doLogin على السيرفر،
// مفيش أي قائمة يوزرز/باسوردات محفوظة في المتصفح خالص. ──
function getStaffToken(){ return localStorage.getItem("staffToken") || ""; }

function checkSession() {
  const storedKey = localStorage.getItem("currentUser");
  const loginTime = localStorage.getItem("loginTime");
  const now = new Date().getTime();
  return !!(storedKey && loginTime && (now - loginTime < SESSION_TIME) && getStaffToken());
}

function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainContent").style.display = "none";
}

function showMain() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";

  const label = localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
  const badge = document.getElementById("qUserBadge");
  if (badge) badge.textContent = label ? "👤 " + label : "";

  loadData();
}

async function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if (!u || !p) return;
  const btn = document.getElementById("loginBtn");
  tsSetBtnLoading(btn, "جاري التحقق...");

  let res;
  try {
    res = await tsStaffLogin(u, p);
  } catch (err) {
    res = { success: false, message: "تعذر الاتصال بالسيرفر" };
  }

  if (res && res.success) {
    localStorage.setItem("currentUser", u.toLowerCase());
    localStorage.setItem("currentUserLabel", res.label || u);
    localStorage.setItem("loginTime", new Date().getTime());
    localStorage.setItem("staffToken", res.token || "");
    document.getElementById("loginError").style.display = "none";
    showMain();
  } else {
    tsClearBtnLoading(btn);
    document.getElementById("loginError").textContent =
      (res && res.code === "locked") ? "⏳ " + res.message : "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
    document.getElementById("loginError").style.display = "block";
  }
}

function qLogout() {
  localStorage.removeItem("currentUser");
  localStorage.removeItem("currentUserLabel");
  localStorage.removeItem("loginTime");
  localStorage.removeItem("staffToken");
  showLogin();
}

// ── تشغيل عند تحميل الصفحة ──
function initAuth() {
  if (checkSession()) {
    showMain();
  } else {
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUserLabel");
    localStorage.removeItem("loginTime");
    localStorage.removeItem("staffToken");
    showLogin();
  }
}
initAuth();

// ── currentUser للإرسال ──
function getCurrentUser() {
  return localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
}

// ── باقي الكود ──
let ordersData = [];
let selectedCustomer = null;

async function loadData() {
  try {
    const url = scriptURL + "?staffToken=" + encodeURIComponent(getStaffToken());
    const res = await fetch(url);
    const data = await res.json();
    if (!Array.isArray(data)) {
      alert("⚠️ الجلسة انتهت أو مش صالحة — سجّل دخول تاني.");
      qLogout();
      return;
    }
    ordersData = data;
  } catch(e) {
    alert("خطأ في تحميل البيانات");
  }
}

function normalizePhone(phone) {
  return String(phone || "").replace(/\D/g,'').replace(/^2/,'').replace(/^0/,'');
}

function searchCustomer() {
  const phone = normalizePhone(document.getElementById("phone").value);
  if (!phone) return alert("ادخل رقم التليفون");

  selectedCustomer = ordersData.find(o => normalizePhone(o.phone) === phone);

  if (!selectedCustomer) {
    document.getElementById("customerBox").style.display = "none";
    return alert("العميل غير موجود");
  }

  document.getElementById("customerBox").style.display = "block";
  document.getElementById("customerName").innerText = "👤 " + (selectedCustomer.customerName || "-");
  document.getElementById("customerAddress").innerText = "📍 " + (selectedCustomer.address || "-");
}

function generateTryOrderId() {
  return "TRY" + Math.floor(100000 + Math.random() * 900000);
}

let lastOrderData = {};

function sendWhatsApp() {
  const d = lastOrderData;
  const qty = parseInt(d.quantity || 1);
  const finalEGP = parseFloat(d.newEgp || 0).toLocaleString();
  const specsLine = d.dimensions && d.dimensions.trim() ? "\n📝 SPCS: " + d.dimensions.trim() : "";
  const msg =
    "مرحبًا Try Shoppy 👋\n" +
    "عايز أأكد الطلب ده:\n\n" +
    "🔖 " + d.newOrder + "\n" +
    "🔗 " + d.newLink + "\n" +
    "📦 Qty: " + qty + specsLine + "\n" +
    "💵 سعر القطعة (EGP): " + parseFloat(d.unitEgp || 0).toLocaleString() + " ج.م\n" +
    "💵 سعر القطعة (USD): " + d.unitUsd + " $\n" +
    "💰 الإجمالي (EGP): " + finalEGP + " ج.م\n" +
    "💰 الإجمالي (USD): " + d.newUsd + " $\n\n" +
    "👤 الاسم: " + d.customerName + "\n" +
    "📞 الموبايل: " + d.phone + "\n" +
    "📍 المحافظة: " + (d.governorate || "") + "\n" +
    "🏠 العنوان: " + (d.address || "") + "\n\n" +
    "مستني تأكيدكم 🙏";
  window.open(`https://wa.me/201005609642?text=${encodeURIComponent(msg)}`);
}

function sendCustomerSummary() {
  const d = lastOrderData;
  const phone = String(d.phone || "").replace(/\D/g, "").replace(/^0/, "");
  const qty = parseInt(d.quantity || 1);
  const piecePrice = parseFloat(d.unitEgp || 0);
  const total = parseFloat(d.newEgp || 0);
  const specsLine = d.dimensions && d.dimensions.trim() ? `📝 المواصفات: ${d.dimensions.trim()}\n` : "";

  const msg = `السلام عليكم ${d.customerName ? "أ/ " + d.customerName : "حضرتك"} 👋
تم تسجيل طلب حضرتك بنجاح في TRY SHOPPY ✅

🔖 رقم الطلب: ${d.newOrder}
🔗 المنتج: ${d.newLink}
📦 العدد: ${qty}
${specsLine}💵 سعر القطعة: ${piecePrice.toLocaleString()} ج.م
💰 الإجمالي: ${total.toLocaleString()} ج.م

🚚 يمكنك تتبع هذا المنتج في أي وقت من هنا برقم الطلب:
🔗 https://tryshoppy.github.io/TryShoppy/track

📞 لأي استفسار، تواصل معنا في أي وقت 🙏`;

  window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(msg)}`);
}

function createOrder() {
  if (!selectedCustomer) return alert("ابحث عن العميل أولاً");

  const link = document.getElementById("link").value.trim();
  const qty  = parseFloat(document.getElementById("qty").value) || 1;
  const usd  = parseFloat(document.getElementById("usd").value) || 0;
  const egp  = parseFloat(document.getElementById("egp").value) || 0;
  const dimensions = document.getElementById("dimensions").value.trim();

  if (!link || !usd || !egp) return alert("يرجى ملء كل البيانات");

  // ✅ الإجمالي = سعر الوحدة × الكمية
  const totalUsd = (usd * qty).toFixed(2);
  const totalEgp = (egp * qty).toFixed(2);

  const newOrderId = generateTryOrderId();
  const btn = document.getElementById("createBtn");
  btn.disabled = true;
  btn.innerHTML = 'جاري التسجيل... <span class="spinner"></span>';

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({
      action: "duplicateOrder",
      originalOrder: selectedCustomer,
      newOrder: newOrderId,
      newLink: link,
      newQty: qty,
      newUsd: totalUsd,
      newEgp: totalEgp,
      newDimensions: dimensions,
      newEmail: document.getElementById("customerEmail").value.trim(),
      user: getCurrentUser(),   // ✅
      staffToken: getStaffToken()
    })
  }).then(res => res.text()).then(text => {
    btn.disabled = false;
    btn.innerHTML = "إنشاء الأوردر";

    if (!(text && text.indexOf("Success") !== -1)) {
      alert("❌ حصل خطأ أثناء تسجيل الطلب: " + (text || "سبب غير معروف") + "\n(الطلب مش اتسجّل)");
      return;
    }
    alert("✅ تم إنشاء الأوردر: " + newOrderId);

    lastOrderData = { ...selectedCustomer, newOrder: newOrderId, newLink: link, quantity: qty, unitUsd: usd, unitEgp: egp, newUsd: totalUsd, newEgp: totalEgp, dimensions };
    document.getElementById("waContainer").style.display = "block";
    document.getElementById("link").value = "";
    document.getElementById("qty").value  = "1";
    document.getElementById("usd").value  = "";
    document.getElementById("egp").value  = "";
    document.getElementById("dimensions").value = "";
  }).catch(() => {
    btn.disabled = false;
    btn.innerHTML = "إنشاء الأوردر";
    alert("❌ تعذر الاتصال بالسيرفر — الطلب مش اتسجّل. تأكد من الإنترنت وحاول تاني.");
  });
}
</script>
</body>
</html>
