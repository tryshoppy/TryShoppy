<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRY SHOPPY - Quick Order</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#2563eb;
    --bg:#f4f7fe;
    --white:#fff;
    --text:#1e293b;
    --border:#cbd5e1;
}

body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    text-align:center;
    color:var(--primary);
    font-weight:900;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#475569;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    font-family:'Cairo';
    box-sizing:border-box;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-family:'Cairo';
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.customer-box{
    background:#eff6ff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    display:none;
}

.customer-box div{
    margin-bottom:5px;
    font-weight:700;
}

.spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>➕ إضافة أوردر سريع</h2>

<div class="input-group">
<label>رقم التليفون</label>
<input type="text" id="phone" placeholder="01xxxxxxxxx">
</div>

<button onclick="searchCustomer()">بحث عن العميل</button>

<div id="customerBox" class="customer-box">
<div id="customerName"></div>
<div id="customerAddress"></div>
</div>

<div class="input-group">
<label>لينك المنتج الجديد</label>
<input type="text" id="link">
</div>

<div class="input-group">
<label>السعر بالدولار ($)</label>
<input type="number" id="usd">
</div>

<div class="input-group">
<label>المواصفات الخاصة (SPCS)</label>
<input type="text" id="dimensions" placeholder="مثال: Size: L | Color: Red | Notes: ...">
</div>

<div class="input-group">
<label>السعر بالمصري (EGP)</label>
<input type="number" id="egp">
</div>

<button id="createBtn" onclick="createOrder()">إنشاء الأوردر</button>

<div id="waContainer" style="display:none; margin-top:14px;">
  <button onclick="sendWhatsApp()" style="background:#25D366;">
    💬 تأكيد الأوردر عبر واتساب
  </button>
</div>

</div>
</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbyW8meVFC4R5TOyVwjYuxTBPDFFeEVUDFdrYeEfmj9scJ_VxG5DBLYsH5koM9PbxQiWlA/exec";

let ordersData = [];
let selectedCustomer = null;

async function loadData(){
    try{
        const res = await fetch(scriptURL);
        ordersData = await res.json();
    }catch(e){
        alert("خطأ في تحميل البيانات");
    }
}

function normalizePhone(phone){
    return String(phone || "")
    .replace(/\D/g,'')
    .replace(/^2/,'')
    .replace(/^0/,'');
}

function searchCustomer(){

    const phone = normalizePhone(
        document.getElementById("phone").value
    );

    if(!phone){
        return alert("ادخل رقم التليفون");
    }

    selectedCustomer = ordersData.find(o =>
        normalizePhone(o.phone) === phone
    );

    if(!selectedCustomer){
        document.getElementById("customerBox").style.display="none";
        return alert("العميل غير موجود");
    }

    document.getElementById("customerBox").style.display="block";

    document.getElementById("customerName").innerText =
        "👤 " + (selectedCustomer.customerName || "-");

    document.getElementById("customerAddress").innerText =
        "📍 " + (selectedCustomer.address || "-");
}

function generateTryOrderId(){
    const randomNum =
        Math.floor(100000 + Math.random() * 900000);

    return "TRY" + randomNum;
}

let lastOrderData = {};

function sendWhatsApp() {
    const d = lastOrderData;
    const phone = String(d.phone || "").replace(/\D/g, "").replace(/^0/, "");

    const qty = parseInt(d.quantity || 1);
    const usdTotal = (parseFloat(d.newUsd || 0) * qty).toFixed(2);
    const finalEGP = (parseFloat(d.newEgp || 0) * qty).toLocaleString();

    const msg =
`TRY SHOPPY Order
Order No: ${d.newOrder}
Name: ${d.customerName}
Phone: ${d.phone}
Governorate: ${d.governorate || ""}
Address: ${d.address || ""}
Quantity: ${qty}
Unit Price USD: ${d.newUsd} USD
Unit Price EGP: ${d.newEgp} EGP

Total USD: ${usdTotal} USD
Total Price: ${finalEGP} EGP
Product: ${d.newLink}
SPCS: ${d.dimensions || ""}`;

     window.open(`https://wa.me/201005609642?text=${encodeURIComponent(msg)}`);
}

function createOrder(){

    if(!selectedCustomer){
        return alert("ابحث عن العميل أولاً");
    }

    const link =
        document.getElementById("link").value.trim();

    const usd =
        document.getElementById("usd").value.trim();

    const egp =
        document.getElementById("egp").value.trim();

    const dimensions =
        document.getElementById("dimensions").value.trim();

    if(!link || !usd || !egp){
        return alert("يرجى ملء كل البيانات");
    }

    const newOrderId = generateTryOrderId();

    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    btn.innerHTML = 'جاري التسجيل... <span class="spinner"></span>';

    fetch(scriptURL,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify({

            action:"duplicateOrder",

            originalOrder:selectedCustomer,

            newOrder:newOrderId,

            newLink:link,

            newUsd:usd,

            newEgp:egp,

            newDimensions:dimensions
        })
    })
    .then(()=>{

        btn.disabled = false;
        btn.innerHTML = "إنشاء الأوردر";
        alert("✅ تم إنشاء الأوردر: " + newOrderId);

        // تخزين البيانات لإرسال واتساب
        lastOrderData = {
            ...selectedCustomer,
            newOrder: newOrderId,
            newLink: link,
            newUsd: usd,
            newEgp: egp,
            dimensions: dimensions
        };

        // إظهار زرار واتساب
        document.getElementById("waContainer").style.display = "block";

        document.getElementById("link").value="";
        document.getElementById("usd").value="";
        document.getElementById("egp").value="";
        document.getElementById("dimensions").value="";

    })
    .catch(()=>{
        btn.disabled = false;
        btn.innerHTML = "إنشاء الأوردر";
        alert("❌ حدث خطأ");
    });
}

loadData();

</script>

</body>
</html>
