<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRY SHOPPY - Quick Order</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fe;
  --white:#fff;
  --text:#1e293b;
  --border:#cbd5e1;
}
body{ font-family:'Cairo',sans-serif; background:var(--bg); margin:0; padding:20px; }
.container{ max-width:500px; margin:auto; }
.card{ background:white; border-radius:20px; padding:25px; box-shadow:0 5px 20px rgba(0,0,0,.08); }
h2{ margin-top:0; text-align:center; color:var(--primary); font-weight:900; }
.input-group{ margin-bottom:15px; }
.input-group label{ display:block; margin-bottom:6px; font-weight:bold; color:#475569; }
.input-group input{ width:100%; padding:14px; border:1px solid var(--border); border-radius:12px; font-family:'Cairo'; box-sizing:border-box; font-size:15px; }
button{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--primary); color:white; font-family:'Cairo'; font-size:16px; font-weight:bold; cursor:pointer; }
button:hover{ opacity:.9; }
.customer-box{ background:#eff6ff; padding:15px; border-radius:12px; margin-bottom:15px; display:none; }
.customer-box div{ margin-bottom:5px; font-weight:700; }
.spinner{ display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-left:8px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ── Login Screen ── */
#loginScreen{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
  box-sizing:border-box;
}
.login-box{
  background:#fff; border-radius:24px; padding:35px 30px; width:100%; max-width:380px;
  box-shadow:0 10px 40px rgba(0,0,0,0.08); border:1px solid #e2e8f0;
}
.login-logo{ font-size:2rem; font-weight:900; color:#2563eb; text-align:center; margin-bottom:6px; }
.login-sub{ font-size:13px; color:#94a3b8; text-align:center; margin-bottom:26px; font-weight:600; }
.login-label{ font-weight:700; font-size:14px; color:#334155; display:block; margin-bottom:7px; }
.login-input{
  width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid #e2e8f0;
  font-family:'Cairo'; font-size:15px; background:#f8fafc; box-sizing:border-box; margin-bottom:16px;
  transition:all 0.2s;
}
.login-input:focus{ outline:none; border-color:#2563eb; background:#fff; }
.login-error{
  display:none; color:#ef4444; font-size:13px; font-weight:700; text-align:center;
  margin-bottom:14px; background:#fef2f2; padding:10px; border-radius:10px; border:1px solid #fecaca;
}
.btn-login{
  width:100%; padding:14px; background:#2563eb; color:#fff; border:none; border-radius:12px;
  font-family:'Cairo'; font-weight:900; font-size:15px; cursor:pointer;
  box-shadow:0 4px 12px rgba(37,99,235,0.3); transition:all 0.2s;
}
.btn-login:hover{ background:#1d4ed8; }

/* ── Main Content ── */
#mainContent{ display:none; }

/* ── Cart ── */
.cart-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--white)}
.cart-item-link{font-size:12px;color:#64748b;margin-top:3px;word-break:break-all}
.cart-item-link a{color:#64748b}
.cart-item-meta{font-size:12.5px;color:#64748b;margin-top:5px}
.cart-item-right{text-align:left;flex-shrink:0}
.cart-item-price{font-weight:800;font-size:15px;color:var(--primary)}
.cart-item-remove{width:auto;padding:0;margin-top:8px;background:none;border:none;color:#ef4444;font-size:12.5px;font-weight:700;cursor:pointer}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;font-weight:800;font-size:17px;border-top:2px dashed var(--border);margin-top:4px;margin-bottom:16px}
.cart-total-row span:last-child{color:#16a34a}
.btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary);}
.btn-secondary:hover{opacity:.85;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ====== شكل السلة العائم (يظهر بس لو فيه منتجات، ويوديك للسلة على طول) ====== -->
<div id="cartFab" class="hidden" onclick="showStep('cart')" title="ارجع للسلة" style="position:fixed;top:16px;left:16px;background:var(--primary);color:#fff;border-radius:50px;padding:10px 18px;font-weight:900;font-size:14px;box-shadow:0 6px 18px rgba(37,99,235,.35);cursor:pointer;z-index:40;display:flex;align-items:center;gap:8px;">
  🛒 <span id="cartFabCount">0</span> منتج
</div>

<!-- ====== شاشة الدخول ====== -->
<div id="loginScreen" style="display:flex;">
  <div class="login-box">
    <div class="login-logo">TRY SHOPPY</div>
    <div class="login-sub">سجّل دخولك للمتابعة</div>
    <label class="login-label">اسم المستخدم</label>
    <input id="loginUser" type="text" class="login-input" placeholder="أدخل اسم المستخدم" autocomplete="username">
    <label class="login-label">كلمة المرور</label>
    <input id="loginPass" type="password" class="login-input" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();">
    <div id="loginError" class="login-error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ====== المحتوى الرئيسي ====== -->
<div id="mainContent">
<div class="container">
<div class="card">

<h2>➕ إضافة أوردر سريع</h2>
<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:16px;">
  <span id="qUserBadge" style="background:#ede9fe; color:#6366f1; padding:5px 14px; border-radius:10px; font-weight:800; font-size:13px; border:1px solid #c4b5fd;"></span>
  <button onclick="qLogout()" style="width:auto; padding:7px 16px; font-size:13px; background:#ef4444; border-radius:10px;">خروج</button>
</div>

<div class="input-group">
  <label>اسم العميل أو رقم التليفون</label>
  <input type="text" id="customerSearch" placeholder="اكتب رقم التليفون أو جزء من الاسم" onkeydown="if(event.key==='Enter')searchCustomer()">
</div>

<button onclick="searchCustomer()">🔍 بحث عن العميل</button>

<!-- 🆕 نتايج البحث بالاسم — بتظهر بس لو فيه أكتر من عميل واحد بنفس
     الاسم (أو اسم قريب)، عشان الموظف يتأكد من رقم الهاتف الصح قبل
     ما يختار، بدل ما نفترض إحنا مين العميل المقصود ونغلط بينهم -->
<div id="nameMatchesBox" style="display:none;margin-top:10px">
  <div style="background:#fff7ed;border:1.5px solid #fb923c;color:#9a3412;padding:10px 14px;border-radius:10px;font-weight:800;font-size:13px;margin-bottom:8px">
    ⚠️ فيه أكتر من عميل بنفس الاسم — تأكد من رقم التليفون الصح قبل ما تختار
  </div>
  <div id="nameMatchesList"></div>
</div>

<div id="customerBox" class="customer-box">
  <div id="customerName"></div>
  <div id="customerAddress"></div>
</div>

<div class="input-group">
  <label>البريد الإلكتروني (اختياري) — لإرسال تأكيد الطلب</label>
  <input type="email" id="customerEmail" placeholder="name@example.com">
</div>

<!-- ================= STEP 1: إضافة منتج ================= -->
<div id="stepProduct">
<hr style="border:0;border-top:1.5px dashed var(--border);margin:20px 0;">

<div class="input-group">
  <label>لينك المنتج الجديد</label>
  <input type="text" id="link">
</div>

<div class="input-group">
  <label>الكمية</label>
  <input type="number" id="qty" value="1" min="1">
</div>

<div class="input-group">
  <label>السعر بالدولار ($)</label>
  <input type="number" id="usd">
</div>

<div class="input-group">
  <label>السعر بالمصري (EGP)</label>
  <input type="number" id="egp">
</div>

<div class="input-group">
  <label>المواصفات الخاصة (SPCS)</label>
  <input type="text" id="dimensions" placeholder="مثال: Size: L | Color: Red | Notes: ...">
</div>

<button id="createBtn" onclick="addCurrentToCart()">➕ أضف للسلة</button>
</div><!-- end stepProduct -->

<!-- ================= STEP 2: السلة ================= -->
<div id="stepCart" class="hidden">
  <h2 style="font-size:1.2rem;margin-top:20px;">🛒 سلة الطلب</h2>
  <div id="cartItemsList"></div>
  <div class="cart-total-row">
    <span>الإجمالي</span>
    <span id="cartTotalDisplay">0 EGP</span>
  </div>
  <button class="btn-secondary" onclick="backToAddItem()">➕ أضف منتج تاني</button>
  <button id="checkoutBtn" style="margin-top:12px" onclick="checkoutAll()">✅ إتمام كل الطلبات</button>
</div><!-- end stepCart -->

<!-- ================= STEP 3: نجاح ================= -->
<div id="stepSuccess" class="hidden">
<div id="waContainer" style="margin-top:14px;">
  <button onclick="sendWhatsApp()" style="background:#25D366;">💬 تأكيد الأوردر عبر واتساب</button>
  <button onclick="sendCustomerSummary()" style="background:#0ea5e9; margin-top:10px;">📩 إرسال ملخص الطلب للعميل</button>
  <button class="btn-secondary" style="margin-top:12px" onclick="startNewCart()">➕ أوردر جديد لعميل تاني</button>
</div>
</div><!-- end stepSuccess -->

</div>
</div>
</div>



<script src="staff-auth.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const SESSION_TIME = 2 * 60 * 60 * 1000;
const scriptURL = TS_CONFIG.ORDERS_SCRIPT_URL;

// ── التحقق من الجلسة — بيتأكد بس إن فيه جلسة محفوظة صالحة.
// التحقق الفعلي من الباسورد حصل مرة واحدة وقت doLogin على السيرفر،
// مفيش أي قائمة يوزرز/باسوردات محفوظة في المتصفح خالص. ──
function getStaffToken(){ return localStorage.getItem("staffToken") || ""; }

function checkSession() {
  const storedKey = localStorage.getItem("currentUser");
  const loginTime = localStorage.getItem("loginTime");
  const now = new Date().getTime();
  return !!(storedKey && loginTime && (now - loginTime < SESSION_TIME) && getStaffToken());
}

function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainContent").style.display = "none";
  document.getElementById("cartFab").classList.add("hidden");
}

function showMain() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";

  const label = localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
  const badge = document.getElementById("qUserBadge");
  if (badge) badge.textContent = label ? "👤 " + label : "";

  loadData();
  // لو فيه سلة محفوظة من قبل (مثلاً قفلت المتصفح قبل ما تخلّص)، ارجعله عليها
  if (tsGetQuickCart().length) { renderCart(); showStep('cart'); }
}

async function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if (!u || !p) return;
  const btn = document.getElementById("loginBtn");
  tsSetBtnLoading(btn, "جاري التحقق...");

  let res;
  try {
    res = await tsStaffLogin(u, p);
  } catch (err) {
    res = { success: false, message: "تعذر الاتصال بالسيرفر" };
  }

  if (res && res.success) {
    localStorage.setItem("currentUser", u.toLowerCase());
    localStorage.setItem("currentUserLabel", res.label || u);
    localStorage.setItem("loginTime", new Date().getTime());
    localStorage.setItem("staffToken", res.token || "");
    document.getElementById("loginError").style.display = "none";
    showMain();
  } else {
    tsClearBtnLoading(btn);
    document.getElementById("loginError").textContent =
      (res && res.code === "locked") ? "⏳ " + res.message : "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
    document.getElementById("loginError").style.display = "block";
  }
}

function qLogout() {
  localStorage.removeItem("currentUser");
  localStorage.removeItem("currentUserLabel");
  localStorage.removeItem("loginTime");
  localStorage.removeItem("staffToken");
  showLogin();
}

// ── تشغيل عند تحميل الصفحة ──
function initAuth() {
  if (checkSession()) {
    showMain();
  } else {
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUserLabel");
    localStorage.removeItem("loginTime");
    localStorage.removeItem("staffToken");
    showLogin();
  }
}
initAuth();

// ── currentUser للإرسال ──
function getCurrentUser() {
  return localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
}

// ── باقي الكود ──
let ordersData = [];
let selectedCustomer = null;

async function loadData() {
  try {
    const url = scriptURL + "?staffToken=" + encodeURIComponent(getStaffToken());
    const res = await fetch(url);
    const data = await res.json();
    if (!Array.isArray(data)) {
      alert("⚠️ الجلسة انتهت أو مش صالحة — سجّل دخول تاني.");
      qLogout();
      return;
    }
    ordersData = data;
  } catch(e) {
    alert("خطأ في تحميل البيانات");
  }
}

function normalizePhone(phone) {
  return String(phone || "").replace(/\D/g,'').replace(/^2/,'').replace(/^0/,'');
}

function searchCustomer() {
  const raw = (document.getElementById("customerSearch").value || "").trim();
  if (!raw) return alert("اكتب رقم التليفون أو اسم العميل");

  document.getElementById("nameMatchesBox").style.display = "none"; // نقفل أي ليستة اختيار قديمة من بحث سابق

  // 🆕 خانة واحدة للاتنين — نحدد تلقائيًا هل ده رقم تليفون ولا اسم:
  // لو 60% على الأقل من الحروف المكتوبة أرقام، نعتبره رقم تليفون
  // ونبحث بالمطابقة التامة زي الأول. غير كده، نعتبره اسم ونبحث
  // بالاحتواء الجزئي (contains) بين كل العملاء.
  const digitsOnly = raw.replace(/\D/g, "");
  const looksLikePhone = raw.length > 0 && (digitsOnly.length / raw.replace(/\s/g, "").length) >= 0.6 && digitsOnly.length >= 6;

  if (looksLikePhone) {
    searchByPhone(digitsOnly);
  } else {
    searchByName(raw);
  }
}

function searchByPhone(rawDigits) {
  const phone = normalizePhone(rawDigits);
  if (!phone) return alert("رقم التليفون غير صحيح");

  // ⚠️ لو السلة فيها منتجات لعميل تاني، لازم تأكيد قبل ما نغيّر
  // العميل الحالي — عشان مايحصلش خلط بين طلبات عميلين في نفس السلة
  if (tsGetQuickCart().length && selectedCustomer && normalizePhone(selectedCustomer.phone) !== phone) {
    if (!confirm("السلة فيها منتجات لعميل تاني. لو غيّرت العميل دلوقتي، السلة هتتصفّر. تكمل؟")) return;
    tsClearQuickCart();
    renderCart();
    showStep('product');
  }

  const found = ordersData.find(o => normalizePhone(o.phone) === phone);

  if (!found) {
    document.getElementById("customerBox").style.display = "none";
    selectedCustomer = null;
    return alert("العميل غير موجود");
  }

  applySelectedCustomer(found);
}

// 🆕 بحث بالاسم — بيدوّر جزئيًا (contains، من غير حساسية لحالة
// الحروف) وسط كل الطلبات، وبعدين بيجمّع العملاء الفريدين (بالموبايل
// كمفتاح، عشان نفس العميل ممكن يبقى ليه كذا طلب/صف). لو لقى أكتر من
// عميل مختلف بنفس الاسم أو اسم قريب، بيوقف ويوري تحذير + ليستة
// اختيار بدل ما يفترض هو مين المقصود ويغلط.
function searchByName(rawName) {
  const q = rawName.trim().toLowerCase();
  if (!q) return alert("اكتب اسم العميل أو جزء منه");

  document.getElementById("customerBox").style.display = "none";
  selectedCustomer = null;

  const matches = ordersData.filter(o => String(o.customerName || "").toLowerCase().includes(q));
  if (!matches.length) return alert("مفيش عميل بالاسم ده — جرب رقم التليفون بدل كده");

  // تجميع بالموبايل — نفس العميل ممكن يظهر في أكتر من صف طلب
  const byPhone = new Map();
  matches.forEach(o => {
    const key = normalizePhone(o.phone);
    if (!byPhone.has(key)) byPhone.set(key, o);
  });
  const unique = [...byPhone.values()];

  if (unique.length === 1) {
    // عميل واحد بس مطابق — نختاره على طول (بنفس حماية "السلة فيها عميل تاني")
    if (tsGetQuickCart().length && selectedCustomer && normalizePhone(selectedCustomer.phone) !== normalizePhone(unique[0].phone)) {
      if (!confirm("السلة فيها منتجات لعميل تاني. لو غيّرت العميل دلوقتي، السلة هتتصفّر. تكمل؟")) return;
      tsClearQuickCart();
      renderCart();
      showStep('product');
    }
    applySelectedCustomer(unique[0]);
    return;
  }

  // أكتر من عميل مختلف بنفس الاسم — نوقف ونوري تحذير + ليستة اختيار
  const box = document.getElementById("nameMatchesBox");
  const list = document.getElementById("nameMatchesList");
  list.innerHTML = unique.map(o => `
    <div onclick="pickNameMatch('${String(o.phone).replace(/'/g, "\\'")}')"
         style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s"
         onmouseover="this.style.borderColor='#6366f1'" onmouseout="this.style.borderColor='#e2e8f0'">
      <div style="font-weight:800;font-size:14px">👤 ${o.customerName || "-"}</div>
      <div style="font-size:13px;color:#475569;margin-top:3px">📞 ${o.phone || "-"}</div>
      <div style="font-size:12.5px;color:#94a3b8;margin-top:2px">📍 ${o.address || "-"}</div>
    </div>
  `).join("");
  box.style.display = "block";
}

// لما الموظف يدوس على عميل من ليستة الاختيار
function pickNameMatch(phone) {
  document.getElementById("nameMatchesBox").style.display = "none";
  searchByPhone(phone);
}

// 🆕 نقطة واحدة مشتركة لتفعيل العميل المختار (سواء جاي من بحث
// تليفون مباشر، أو بحث اسم اتحل لعميل واحد، أو اختيار من ليستة) —
// عشان مفيش تكرار كود بين المسارات التلاتة
function applySelectedCustomer(customer) {
  selectedCustomer = customer;
  document.getElementById("customerSearch").value = customer.phone; // نوري رقمه في الخانة تأكيدًا
  document.getElementById("customerBox").style.display = "block";
  document.getElementById("customerName").innerText = "👤 " + (selectedCustomer.customerName || "-");
  document.getElementById("customerAddress").innerText = "📍 " + (selectedCustomer.address || "-");
}

function generateTryOrderId() {
  return "TRY" + Math.floor(100000 + Math.random() * 900000);
}

// ── السلة (منفصلة تمامًا عن سلة الحاسبة العامة وسلة الديركت أوردر) ──
function tsGetQuickCart(){ try{ return JSON.parse(localStorage.getItem('ts_quick_cart')) || []; }catch(e){ return []; } }
function tsSaveQuickCart(c){ localStorage.setItem('ts_quick_cart', JSON.stringify(c)); }
function tsAddToQuickCart(item){ const c=tsGetQuickCart(); item.tempId=Date.now()+'-'+Math.floor(Math.random()*10000); c.push(item); tsSaveQuickCart(c); return c; }
function tsRemoveFromQuickCart(id){ const c=tsGetQuickCart().filter(i=>i.tempId!==id); tsSaveQuickCart(c); return c; }
function tsClearQuickCart(){ tsSaveQuickCart([]); }
function tsQuickCartTotal(){ return tsGetQuickCart().reduce((s,i)=>s+(parseFloat(i.totalEgp)||0),0); }

function showStep(step){
  document.getElementById('stepProduct').classList.toggle('hidden', step!=='product');
  document.getElementById('stepCart').classList.toggle('hidden', step!=='cart');
  document.getElementById('stepSuccess').classList.toggle('hidden', step!=='success');
  window.scrollTo({top:0,behavior:'smooth'});
  updateCartFab();
}

// 🛒 شكل السلة العائم — بيظهر بس لو فيه منتجات ومش واقف في شاشة
// السلة نفسها أصلاً (عشان مايبقاش زرار يودّيك لمكانك)
function updateCartFab(){
  const fab = document.getElementById("cartFab");
  if(!fab) return;
  const cart = tsGetQuickCart();
  const onCartStep = !document.getElementById("stepCart").classList.contains("hidden");
  const loginShowing = document.getElementById("loginScreen").style.display !== "none";
  if(cart.length && !onCartStep && !loginShowing){
    document.getElementById("cartFabCount").textContent = cart.length;
    fab.classList.remove("hidden");
  } else {
    fab.classList.add("hidden");
  }
}

let lastOrders = []; // [{orderNo, item}] — بعد آخر عملية checkout ناجحة، تستخدمها رسايل الواتساب

function addCurrentToCart(){
  if (!selectedCustomer) return alert("ابحث عن العميل أولاً");

  const link = document.getElementById("link").value.trim();
  const qty  = parseFloat(document.getElementById("qty").value) || 1;
  const usd  = parseFloat(document.getElementById("usd").value) || 0;
  const egp  = parseFloat(document.getElementById("egp").value) || 0;
  const dimensions = document.getElementById("dimensions").value.trim();

  if (!link || !usd || !egp) return alert("يرجى ملء كل بيانات المنتج (اللينك، الدولار، والمصري)");

  tsAddToQuickCart({
    link, qty, unitUsd: usd, unitEgp: egp, dimensions,
    totalUsd: +(usd * qty).toFixed(2),
    totalEgp: +(egp * qty).toFixed(2)
  });

  // تنضيف الفورم لمنتج جديد
  document.getElementById("link").value = "";
  document.getElementById("qty").value = "1";
  document.getElementById("usd").value = "";
  document.getElementById("egp").value = "";
  document.getElementById("dimensions").value = "";

  renderCart();
  showStep('cart');
}

function renderCart(){
  const cart = tsGetQuickCart();
  const list = document.getElementById("cartItemsList");
  list.innerHTML = cart.map(item=>{
    const linkHtml = item.link ? '<a href="'+item.link+'" target="_blank" rel="noopener">'+(item.link.length>42?item.link.slice(0,42)+'…':item.link)+'</a>' : '—';
    const specsLine = item.dimensions ? '<div class="cart-item-meta">📝 '+item.dimensions+'</div>' : '';
    return '<div class="cart-item">'+
      '<div><div class="cart-item-link">'+linkHtml+'</div>'+
      '<div class="cart-item-meta">الكمية: '+item.qty+'</div>'+specsLine+'</div>'+
      '<div class="cart-item-right"><div class="cart-item-price">'+item.totalEgp.toLocaleString()+' EGP</div>'+
      '<button class="cart-item-remove" onclick="removeCartItem(\''+item.tempId+'\')">🗑 حذف</button></div>'+
    '</div>';
  }).join('');
  document.getElementById("cartTotalDisplay").textContent = tsQuickCartTotal().toLocaleString()+' EGP';
  updateCartFab();
}

function removeCartItem(tempId){
  tsRemoveFromQuickCart(tempId);
  renderCart();
  if (tsGetQuickCart().length === 0) showStep('product');
}

function backToAddItem(){ showStep('product'); }

function startNewCart(){
  selectedCustomer = null;
  document.getElementById("customerBox").style.display = "none";
  document.getElementById("nameMatchesBox").style.display = "none";
  document.getElementById("customerSearch").value = "";
  document.getElementById("customerEmail").value = "";
  showStep('product');
}

function checkoutAll(){
  const cart = tsGetQuickCart();
  if (!cart.length) { alert("السلة فاضية — أضف منتج واحد على الأقل الأول"); return; }
  if (!selectedCustomer) { alert("ابحث عن العميل أولاً"); showStep('product'); return; }

  const email = document.getElementById("customerEmail").value.trim();
  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true;

  // ⚠️ بقى بيمشي بنفس مبدأ DirectOrder.html بالظبط: من غير action
  // ومن غير staffToken في نفس طلب الحفظ (مسار "NEW ORDER" العام في
  // Orders_Code.gs، مش duplicateOrder) — عشان يستخدم بالظبط نفس
  // مسار الإيميل المُثبَت إنه شغال صح مع emailSummary/cartTotal.
  // ده قرار واعي منك إنك مقتنع بفقد التحقق من staffToken هنا مقابل
  // ثبات سلوك الإيميل زي Direct Order بالظبط.
  const c = selectedCustomer;
  const cartWithOrders = cart.map(item => ({ item, orderNo: generateTryOrderId() }));
  const label = c.category || "Quick Order";
  // 📧 ملخص إيميل واحد مجمّع لكل منتجات السلة (نفس الفورمات اللي
  // بيفهمها sendOrderEmails في Orders_Code.gs)، بدل ما العميل ياخد
  // إيميل منفصل لكل منتج في نفس عملية الـcheckout
  // 🆕 حقل سادس للمواصفات — هنا المواصفات حقل واحد (dimensions)
  // بيكتبه الموظف، فبنبعته زي ما هو بعد تنضيفه
  const cleanSpec = v => String(v||"").replace(/::/g,":").replace(/[\r\n]+/g," ").trim();
  const emailSummary = cartWithOrders.map(({item, orderNo}) =>
    [orderNo, item.link || "", label, item.qty, item.totalEgp, cleanSpec(item.dimensions)].join("::")
  ).join("\n");
  const cartTotal = tsQuickCartTotal();

  // 🐛→✅ الإصلاح الأساسي: كنا بنبعت كل طلبات السلة مع بعض بـ
  // Promise.all (خمس نداءات fetch في نفس اللحظة بالظبط). Orders_Code.gs
  // بيعمل mainSheet.appendRow() من غير أي LockService حواليها — لما
  // كذا نداء متزامن يوصلوا لنفس الشيت في نفس اللحظة، بعضهم بيضيع
  // (نفس المشكلة اللي queueNotification() في نفس السكريبت اتعملها
  // LockService عشانها فعلاً، بس المسار ده مكنش متوقع يتنادى بالتوازي
  // قبل QuickOrder). الحل: نبعت الطلبات **واحد ورا التاني بالتتابع**
  // (await جوه for-loop)، مش كلهم مع بعض — كده كل appendRow بيخلص
  // قبل ما اللي بعده يبدأ، ومفيش أي احتمال تصادم خالص.
  (async () => {
    const succeeded = [];
    const failed = [];

    for (let idx = 0; idx < cartWithOrders.length; idx++) {
      const { item, orderNo } = cartWithOrders[idx];
      btn.innerHTML = 'جاري تسجيل الطلب ' + (idx + 1) + ' من ' + cartWithOrders.length + '... <span class="spinner"></span>';
      try {
        const res = await fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify({
            order: orderNo,
            customerName: c.customerName,
            phone: c.phone,
            email: email,
            country: c.country,
            address: c.address,
            governorate: c.governorate,
            link: item.link,
            quantity: item.qty,
            usd: item.totalUsd,
            weight: c.weight,
            dimensions: item.dimensions,
            category: c.category,
            finalPrice: item.totalEgp,
            user: getCurrentUser(),
            // 🔇 كل منتج بعد الأول ميبعتش إيميل مستقل — الملخص المجمّع
            // بيتبعت مرة واحدة بس مع أول منتج في الدفعة
            suppressEmail: idx > 0,
            emailSummary: idx === 0 ? emailSummary : "",
            cartTotal: idx === 0 ? cartTotal : undefined
          })
        });
        const text = await res.text();
        // ⚠️ المسار ده بيرجع "Order Saved" مش "Success" (مسار مختلف
        // عن duplicateOrder اللي كان بيرجع "Success")
        if (text && text.indexOf("Order Saved") !== -1) {
          succeeded.push({ orderNo, item, tempId: item.tempId });
        } else {
          failed.push({ orderNo, item, tempId: item.tempId, reason: text });
        }
      } catch (err) {
        failed.push({ orderNo, item, tempId: item.tempId, reason: "Network error" });
      }
    }

    btn.disabled = false;
    btn.innerHTML = "✅ إتمام كل الطلبات";

    if (failed.length) {
      // 🛡️ منتجات فشلت فقط هي اللي بتتسيب في السلة عشان تقدر تعيد
      // المحاولة عليها بس — اللي نجح فعلاً بيتشال من السلة عادي، عشان
      // ميتكررش لو دُست الزرار تاني بالغلط
      const remaining = succeeded.length
        ? tsGetQuickCart().filter(i => failed.some(f => f.tempId === i.tempId))
        : tsGetQuickCart();
      tsSaveQuickCart(remaining);
      renderCart();
      alert(
        "⚠️ " + succeeded.length + " من " + cartWithOrders.length + " طلبات اتسجلت بنجاح.\n" +
        "الطلبات دي فشلت وفضلت في السلة عشان تعيد المحاولة:\n" +
        failed.map(f => "• " + f.orderNo + (f.item.link ? " — " + f.item.link : "")).join("\n")
      );
      return;
    }

    lastOrders = succeeded.map(s => ({ orderNo: s.orderNo, item: s.item }));
    tsClearQuickCart();
    showStep('success');
  })().catch(() => {
    btn.disabled = false;
    btn.innerHTML = "✅ إتمام كل الطلبات";
    alert("❌ تعذر الاتصال بالسيرفر — راجع الشيت للتأكد قبل ما تبلغ العميل، وحاول تاني لو محتاج.");
  });
}

function sendWhatsApp() {
  const itemsLines = lastOrders.map(o => {
    const item = o.item;
    const specsLine = item.dimensions ? "\n📝 SPCS: " + item.dimensions : "";
    return "🔖 " + o.orderNo + "\n🔗 " + item.link + "\n📦 Qty: " + item.qty + specsLine +
      "\n💵 سعر القطعة (EGP): " + item.unitEgp.toLocaleString() + " ج.م" +
      "\n💰 الإجمالي (EGP): " + item.totalEgp.toLocaleString() + " ج.م";
  }).join("\n\n");
  const total = lastOrders.reduce((s,o)=>s+(o.item.totalEgp||0), 0);
  const c = selectedCustomer || {};
  const msg =
    "مرحبًا Try Shoppy 👋\n" +
    "عايز أأكد الطلب ده:\n\n" +
    itemsLines + "\n\n" +
    "💰 الإجمالي الكلي: " + total.toLocaleString() + " ج.م\n\n" +
    "👤 الاسم: " + (c.customerName||"") + "\n" +
    "📞 الموبايل: " + (c.phone||"") + "\n" +
    "📍 المحافظة: " + (c.governorate||"") + "\n" +
    "🏠 العنوان: " + (c.address||"") + "\n\n" +
    "مستني تأكيدكم 🙏";
  window.open(`https://wa.me/201005609642?text=${encodeURIComponent(msg)}`);
}

function sendCustomerSummary() {
  const c = selectedCustomer || {};
  const phone = String(c.phone || "").replace(/\D/g, "").replace(/^0/, "");
  const itemsLines = lastOrders.map(o => {
    const item = o.item;
    const specsLine = item.dimensions ? `📝 المواصفات: ${item.dimensions}\n` : "";
    return `🔖 ${o.orderNo}\n🔗 ${item.link}\n📦 العدد: ${item.qty}\n${specsLine}💵 سعر القطعة: ${item.unitEgp.toLocaleString()} ج.م\n💰 الإجمالي: ${item.totalEgp.toLocaleString()} ج.م`;
  }).join("\n\n");
  const total = lastOrders.reduce((s,o)=>s+(o.item.totalEgp||0), 0);

  const msg = `السلام عليكم ${c.customerName ? "أ/ " + c.customerName : "حضرتك"} 👋
تم تسجيل طلباتك بنجاح في TRY SHOPPY ✅

${itemsLines}

💰 الإجمالي الكلي: ${total.toLocaleString()} ج.م

🚚 يمكنك تتبع كل منتج في أي وقت من هنا برقم الطلب الخاص به:
🔗 https://tryshoppy.github.io/TryShoppy/track

📞 لأي استفسار، تواصل معنا في أي وقت 🙏`;

  window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(msg)}`);
}
