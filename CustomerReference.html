<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TRY SHOPPY - مرجع طلبات العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fe;
  --white:#fff;
  --text:#1e293b;
  --border:#cbd5e1;
  --gray:#64748b;
}
*{box-sizing:border-box;}
body{ font-family:'Cairo',sans-serif; background:var(--bg); margin:0; padding:20px; color:var(--text); }
.container{ max-width:760px; margin:auto; }
.card{ background:white; border-radius:20px; padding:25px; box-shadow:0 5px 20px rgba(0,0,0,.08); margin-bottom:18px; }
h2{ margin-top:0; text-align:center; color:var(--primary); font-weight:900; }
.input-group{ margin-bottom:15px; }
.input-group label{ display:block; margin-bottom:6px; font-weight:bold; color:#475569; }
.input-group input{ width:100%; padding:14px; border:1px solid var(--border); border-radius:12px; font-family:'Cairo'; box-sizing:border-box; font-size:15px; }
button{ padding:14px; border:none; border-radius:12px; background:var(--primary); color:white; font-family:'Cairo'; font-size:16px; font-weight:bold; cursor:pointer; }
button:hover{ opacity:.9; }
.search-row{ display:flex; gap:10px; }
.search-row input{ flex:1; min-width:0; }   /* من غيره الزرار كان بيتزق بره الشاشة على الموبايل */
.search-row button{ flex-shrink:0; padding:14px 22px; }

/* ── Login Screen ── */
#loginScreen{
  display:none; min-height:100vh; align-items:center; justify-content:center;
  flex-direction:column; padding:20px; box-sizing:border-box;
}
.login-box{
  background:#fff; border-radius:24px; padding:35px 30px; width:100%; max-width:380px;
  box-shadow:0 10px 40px rgba(0,0,0,0.08); border:1px solid #e2e8f0;
}
.login-logo{ font-size:2rem; font-weight:900; color:#2563eb; text-align:center; margin-bottom:6px; }
.login-sub{ font-size:13px; color:#94a3b8; text-align:center; margin-bottom:26px; font-weight:600; }
.login-label{ font-weight:700; font-size:14px; color:#334155; display:block; margin-bottom:7px; }
.login-input{
  width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid #e2e8f0;
  font-family:'Cairo'; font-size:15px; background:#f8fafc; box-sizing:border-box; margin-bottom:16px;
}
.login-input:focus{ outline:none; border-color:#2563eb; background:#fff; }
.login-error{
  display:none; color:#ef4444; font-size:13px; font-weight:700; text-align:center;
  margin-bottom:14px; background:#fef2f2; padding:10px; border-radius:10px; border:1px solid #fecaca;
}
.btn-login{
  width:100%; padding:14px; background:#2563eb; color:#fff; border:none; border-radius:12px;
  font-family:'Cairo'; font-weight:900; font-size:15px; cursor:pointer;
  box-shadow:0 4px 12px rgba(37,99,235,0.3);
}
.btn-login:hover{ background:#1d4ed8; }

/* ── Main Content ── */
#mainContent{ display:none; }
.topbar{ display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:16px; }
.user-badge{ background:#ede9fe; color:#6366f1; padding:5px 14px; border-radius:10px; font-weight:800; font-size:13px; border:1px solid #c4b5fd; }
.btn-logout{ width:auto; padding:7px 16px; font-size:13px; background:#ef4444; border-radius:10px; }

.empty-hint{ text-align:center; color:#94a3b8; font-weight:700; padding:20px 0; }
.spinner{ display:inline-block; width:16px; height:16px; border:3px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-left:8px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* customer summary */
.cust-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.cust-name{ font-size:1.3rem; font-weight:900; color:var(--text); }
.cust-sub{ color:var(--gray); font-size:13px; font-weight:700; margin-top:4px; }
.stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:6px; }
.stat-box{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:14px 10px; text-align:center; }
.stat-box .num{ font-size:1.4rem; font-weight:900; color:var(--primary); }
.stat-box.open .num{ color:#d97706; }
.stat-box.spent .num{ color:#16a34a; font-size:1.1rem; }
.stat-box .lbl{ font-size:11.5px; color:var(--gray); font-weight:700; margin-top:3px; }

/* orders list */
.order-row{ border:1px solid #e2e8f0; border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
.order-row:hover{ border-color:#c7d2fe; }
.order-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.order-id{ font-weight:900; color:var(--text); }
.order-date{ font-size:12px; color:var(--gray); font-weight:700; }
.order-meta{ display:flex; gap:14px; margin-top:8px; font-size:13px; color:#475569; font-weight:700; flex-wrap:wrap; }
.order-detail-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed #e2e8f0; }
.order-detail-grid .dl{ display:flex; flex-direction:column; gap:2px; }
.order-detail-grid .dt{ font-size:11px; color:#94a3b8; font-weight:800; }
.order-detail-grid .dd{ font-size:13.5px; color:var(--text); font-weight:800; }
.order-detail-grid .dd a{ color:var(--primary); text-decoration:none; }
.order-detail-grid .dd a:hover{ text-decoration:underline; }
.order-detail-grid .dd.total{ color:#16a34a; }
.order-history{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed #e2e8f0; font-size:12.5px; color:#64748b; }
.order-history div{ margin-bottom:4px; }
.badge{ display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:800; }
.b-gray{ background:#f1f5f9; color:#475569; }
.b-blue{ background:#eff6ff; color:#2563eb; }
.b-orange{ background:#fff7ed; color:#c2410c; }
.b-green{ background:#f0fdf4; color:#16a34a; }
.b-red{ background:#fef2f2; color:#dc2626; }
.b-yellow{ background:#fffbeb; color:#a16207; }
.b-purple{ background:#F3EEFF; color:#6D28D9; }   /* معلّق */
.b-slate{ background:#E8EDF3; color:#334155; }    /* مرتجع */

/* تنبيه تشابه أسماء العملاء */
.duplicate-warning{ background:#fffbeb; border:1px solid #fde68a; color:#92400e; }
.duplicate-warning h3{ margin:0 0 7px; font-size:1rem; }
.duplicate-warning p{ margin:0; font-size:13px; font-weight:700; }
.customer-choice{ width:100%; margin-top:10px; padding:12px 14px; text-align:right; background:#fff; color:var(--text); border:1px solid #fde68a; box-shadow:none; }
.customer-choice:hover{ background:#fffbeb; opacity:1; }
.customer-choice small{ display:block; margin-top:3px; color:var(--gray); font-weight:700; }
</style>
</head>
<body>

<!-- ====== شاشة الدخول ====== -->
<div id="loginScreen" style="display:flex;">
  <div class="login-box">
    <div class="login-logo">TRY SHOPPY</div>
    <div class="login-sub">مرجع طلبات العملاء — دخول موظفين مصرّح لهم فقط</div>
    <label class="login-label">اسم المستخدم</label>
    <input id="loginUser" type="text" class="login-input" placeholder="أدخل اسم المستخدم" autocomplete="username">
    <label class="login-label">كلمة المرور</label>
    <input id="loginPass" type="password" class="login-input" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();">
    <div id="loginError" class="login-error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ====== المحتوى الرئيسي ====== -->
<div id="mainContent">
<div class="container">

  <div class="card">
    <h2>📇 مرجع طلبات العملاء</h2>
    <div class="topbar">
      <span id="userBadge" class="user-badge"></span>
      <button class="btn-logout" onclick="doLogout()">خروج</button>
    </div>

    <div class="search-row">
      <input type="text" id="customerSearchInput" placeholder="اسم العميل أو رقم الموبايل (01xxxxxxxxx)" autocomplete="off" oninput="searchAsYouType()" onkeydown="if(event.key==='Enter') doSearch();">
      <button id="searchBtn" onclick="doSearch()">🔍 بحث</button>
    </div>
    <!-- ⚡ حالة التحميل: أحدث 100 فورًا، والباقي في الخلفية -->
    <div id="loadState" style="font-size:12.5px;font-weight:700;color:#64748b;margin-top:8px"></div>
  </div>

  <div id="resultArea"></div>

</div>
</div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="staff-auth.js"></script>
<script>
/* ============================================================
   🔐 صفحة داخلية مقيّدة — الدخول محتاج تحقق من خطوتين مع بعض:
   1) tsStaffLogin  → نفس حساب الموظف العادي (يوزر + باسورد)،
      وده اللي بيدّينا staffToken لقراءة كل الطلبات من Orders_Code.gs
   2) tsMartAdminLogin → نفس التحقق اللي بتستخدمه mart-admin.html
      بالظبط، وهو بيرفض أي حد عمود CanManageMart بتاعه FALSE.
      استخدمنا نفس العمود ده هنا بدل ما نضيف عمود صلاحية جديد في
      شيت الموظفين — يعني "اللي يقدر يدير المارت" هو نفسه "اللي
      يقدر يفتح مرجع الطلبات ده"، زي ما اتطلب بالظبط.
   لازم الاتنين ينجحوا مع بعض، وإلا مفيش دخول للصفحة خالص.
   ============================================================ */
const SESSION_TIME = 2 * 60 * 60 * 1000;
const scriptURL = TS_CONFIG.ORDERS_SCRIPT_URL;

function getStaffToken(){ return localStorage.getItem("crefStaffToken") || ""; }

function checkSession(){
  const key = localStorage.getItem("crefUser");
  const time = localStorage.getItem("crefLoginTime");
  const now = new Date().getTime();
  return !!(key && time && (now - time < SESSION_TIME) && getStaffToken());
}

function showLogin(){
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainContent").style.display = "none";
}
function showMain(){
  if (tsGateTool("customerRef")) return;   // 🔑 صلاحية الأداة من شيت الموظفين
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  document.getElementById("userBadge").textContent = "👤 " + (localStorage.getItem("crefUserLabel") || "");
  setTimeout(startLoading, 0);   // ⚡ أحدث 100 فورًا والباقي في الخلفية
}

async function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const errBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  if(!u || !p) return;

  errBox.style.display = "none";
  tsSetBtnLoading(btn, "جاري التحقق...");

  let staffRes, martRes;
  try{
    staffRes = await tsStaffLogin(u, p);
  }catch(err){
    staffRes = { success:false, message:"تعذر الاتصال بالسيرفر" };
  }

  if(!staffRes || !staffRes.success){
    tsClearBtnLoading(btn);
    errBox.textContent = (staffRes && staffRes.code === "locked") ? "⏳ " + staffRes.message : "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
    errBox.style.display = "block";
    return;
  }

  try{
    martRes = await tsMartAdminLogin(u, p);
  }catch(err){
    martRes = { success:false };
  }

  tsClearBtnLoading(btn);

  if(!martRes || !martRes.success){
    // اليوزر والباسورد صح، بس مفيش صلاحية وصول للأداة دي تحديدًا
    errBox.textContent = "🚫 حسابك مش عنده صلاحية الدخول لمرجع الطلبات";
    errBox.style.display = "block";
    return;
  }

  localStorage.setItem("crefUser", u.toLowerCase());
  localStorage.setItem("crefUserLabel", martRes.label || staffRes.label || u);
  localStorage.setItem("crefLoginTime", new Date().getTime());
  localStorage.setItem("crefStaffToken", staffRes.token || "");
  document.getElementById("loginPass").value = "";
  showMain();
}

function doLogout(){
  localStorage.removeItem("crefUser");
  localStorage.removeItem("crefUserLabel");
  localStorage.removeItem("crefLoginTime");
  localStorage.removeItem("crefStaffToken");
  document.getElementById("resultArea").innerHTML = "";
  document.getElementById("customerSearchInput").value = "";
  nameSearchCandidates = [];
  resetOrders();
  showLogin();
}

function initAuth(){
  if(checkSession()){ showMain(); }
  else{ doLogout(); }
}
initAuth();

/* ---------- ⚡ تحميل الطلبات مرة واحدة + بحث فوري في الذاكرة ----------
   🐛→✅ قبل كده كل بحث بالاسم كان بيحمّل *كل* طلبات الشركة (بالتاريخ
   بتاعها) من السيرفر من الأول ويفلترها — فكل بحث كان بياخد وقت طويل
   جدًا، وكل ما الطلبات تزيد يبطأ أكتر. دلوقتي:
     1) أول ما تدخل: أحدث 100 طلب بس (limit=100) — بيوصلوا في ثواني
     2) باقي الطلبات بتتحمّل في الخلفية مرة واحدة وتفضل في الذاكرة
     3) البحث نفسه بقى في الذاكرة — فوري، وبيشتغل وانت بتكتب
     4) لو بحثت قبل ما الباقي يخلص: بتشوف النتايج من اللي اتحمّل، ولما
        التحميل يخلص النتايج بتتحدّث لوحدها
   البيانات في الذاكرة بس (مش localStorage) — بتتمسح مع الخروج أو قفل الصفحة. */
var ALL_ORDERS = [], FULL_LOADED = false, LOADING = null, LOAD_GEN = 0, PINNED_PICK = false;
const RECENT_LIMIT = 100;

async function fetchOrders(extra){
  const res = await fetch(scriptURL + "?staffToken=" + encodeURIComponent(getStaffToken()) + (extra || ""));
  const data = await res.json();
  if(!Array.isArray(data)){
    alert("⚠️ الجلسة انتهت أو مش صالحة — سجّل دخول تاني.");
    doLogout();
    throw new Error("Unauthorized");
  }
  return data;
}

/* الاسم بشكل موحّد للبحث: أ/إ/آ = ا ، ة = ه ، ى = ي ، من غير تشكيل */
function normName(s){
  return String(s || "").toLocaleLowerCase()
    .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
    .replace(/[ً-ْـ]/g, "").replace(/\s+/g, " ").trim();
}
function prepOrders(list){
  list.forEach(o => { o._p = normPhone(o.phone); o._n = normName(o.customerName); });
  return list;
}
function setLoadState(t){ const el = document.getElementById("loadState"); if(el) el.textContent = t; }

function resetOrders(){
  LOAD_GEN++; ALL_ORDERS = []; FULL_LOADED = false; LOADING = null; PINNED_PICK = false;
  setLoadState("");
}

function startLoading(){
  if(LOADING) return LOADING;
  const gen = ++LOAD_GEN;
  const t0 = Date.now();
  const secs = () => ((Date.now() - t0) / 1000).toFixed(1);
  const finish = () => {
    FULL_LOADED = true;
    setLoadState("✓ كل الطلبات محمّلة (" + ALL_ORDERS.length.toLocaleString("en-US") + " طلب) — البحث فوري");
    rerunSearch();
  };
  setLoadState("⏳ جاري تحميل أحدث " + RECENT_LIMIT + " طلب…");
  LOADING = (async () => {
    try{
      const recent = await fetchOrders("&limit=" + RECENT_LIMIT);
      if(gen !== LOAD_GEN) return;
      ALL_ORDERS = prepOrders(recent);
      // السيرفر لسه بالنسخة القديمة (من غير limit) → رجّع الكل من أول مرة
      if(recent.length > RECENT_LIMIT) return finish();
      setLoadState("✓ أحدث " + recent.length + " طلب جاهزين (" + secs() + " ث) — باقي الطلبات بتتحمّل في الخلفية…");
      rerunSearch();
      const all = await fetchOrders("");
      if(gen !== LOAD_GEN) return;
      ALL_ORDERS = prepOrders(all);
      finish();
    }catch(e){
      if(gen !== LOAD_GEN) return;
      LOADING = null;
      if(e.message !== "Unauthorized") setLoadState("⚠️ تعذر تحميل الطلبات — اضغط بحث للمحاولة تاني");
    }
  })();
  return LOADING;
}

/* لما بيانات أكتر توصل، نعيد آخر بحث — إلا لو الموظف اختار عميل بعينه من قايمة التشابه */
function rerunSearch(){
  const v = document.getElementById("customerSearchInput").value.trim();
  if(v && !PINNED_PICK) doSearch(true);
}

let typeTimer = null;
function searchAsYouType(){
  PINNED_PICK = false;
  clearTimeout(typeTimer);
  const v = document.getElementById("customerSearchInput").value.trim();
  if(!v){ document.getElementById("resultArea").innerHTML = ""; return; }
  const digits = v.replace(/\D/g, "");
  if(isPhoneSearch(v) ? digits.length < 4 : v.length < 2) return;
  typeTimer = setTimeout(() => doSearch(true), 250);
}

// يبقى الرقم نصًا طوال الوقت؛ لا نستخدم parseInt حتى لا تضيع الأصفار من الشمال.
function normPhone(v){
  // 🐛→✅ الأرقام العربي (٠١٠…) كانت بتتمسح كلها — tsToEnDigits بيحوّلها الأول
  const digits = tsToEnDigits(String(v || "")).replace(/\D/g, "");
  // نقبل 010... و 2010... كرقم واحد، مع الإبقاء على المقارنة النصية.
  return digits.replace(/^2/, "").replace(/^0/, "");
}
/* بحث بالموبايل = أرقام بس (مسموح مسافات و + و -). قبل كده أي رقم في
   الكلام كان بيحوّل البحث لموبايل، فاسم فيه رقم كان بيدوّر في التليفونات */
function isPhoneSearch(v){ const s = tsToEnDigits(String(v || "")).trim(); return /\d/.test(s) && /^[\d\s+()-]+$/.test(s); }
function fmt(v){ return parseFloat(v||0).toLocaleString(); }
var nameSearchCandidates = [];

function escapeHtml(v){
  return String(v || "").replace(/[&<>\"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" })[c]);
}

function showCustomerCandidate(index){
  const orders = nameSearchCandidates[index];
  if(orders){ PINNED_PICK = true; renderCustomer(orders); }
}

function showNameSearchWarning(groups){
  const area = document.getElementById("resultArea");
  nameSearchCandidates = groups.map(g => g.orders);
  let h = '<div class="card duplicate-warning" role="alert">';
  h += '<h3>⚠️ تنبيه: يوجد ' + groups.length + ' عملاء بأرقام مختلفة مطابقون للاسم</h3>';
  h += '<p>اختَر رقم العميل الصحيح قبل عرض طلباته، حتى لا تختلط بيانات العملاء.</p>';
  groups.forEach((group, index) => {
    const latest = [...group.orders].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0))[0];
    const name = escapeHtml(latest.customerName || "بدون اسم");
    const phone = escapeHtml(tsDisplayPhone(latest.phone) || "بدون رقم");
    const details = [latest.governorate, latest.address].filter(Boolean).map(escapeHtml).join(' • ');
    h += '<button class="customer-choice" onclick="showCustomerCandidate(' + index + ')">👤 ' + name + ' — 📞 ' + phone +
      '<small>' + (details || 'عدد الطلبات: ' + group.orders.length) + '</small></button>';
  });
  h += '</div>';
  area.innerHTML = h;
}

const OPEN_STATUSES_LABELS = { "Pending Review":"قيد المراجعة","Confirmed Via Try":"تم التأكيد","Processing":"جاري التجهيز","Placed":"تم الشراء من المتجر","Arrived USA HUB":"وصل مخزن أمريكا","In transit":"في الشحن الدولي","Arrived Cairo HUB":"وصل مخزن القاهرة","Shipped To You":"في الطريق إليك","On Hold":"معلّق مؤقتًا","Delayed":"متأخر" };
const STATUS_LABELS = Object.assign({ "Delivered":"تم التسليم 🎉","Canceled":"ملغي","Returned":"مرتجع","Lost":"مفقود" }, OPEN_STATUSES_LABELS);
const STATUS_BADGE_CLASS = { "Delivered":"b-green","Canceled":"b-red","Lost":"b-red","Returned":"b-slate","Delayed":"b-yellow","On Hold":"b-purple","Pending Review":"b-gray","Confirmed Via Try":"b-blue","Processing":"b-orange","Placed":"b-orange","Arrived USA HUB":"b-blue","In transit":"b-blue","Arrived Cairo HUB":"b-blue","Shipped To You":"b-blue" };

function statusLabel(s){ return STATUS_LABELS[s] || s || "—"; }
function statusClass(s){ return STATUS_BADGE_CLASS[s] || "b-gray"; }
// المرتجع والمفقود مقفولين زي الملغي (TS_CLOSED_STATUSES في assets/app.js)
function isOpenStatus(s){ return !tsIsClosedStatus(s); }

/* 🔍 البحث — في الذاكرة (فوري). quiet = من الكتابة أو تحديث تلقائي (من غير رسايل تحذير) */
async function doSearch(quiet){
  const raw = document.getElementById("customerSearchInput").value.trim();
  const area = document.getElementById("resultArea");
  if(!quiet) PINNED_PICK = false;
  if(!raw){ area.innerHTML = '<div class="card empty-hint">اكتب اسم العميل أو رقم موبايله الأول</div>'; return; }

  const searchBy = isPhoneSearch(raw) ? "phone" : "name";
  const target = searchBy === "phone" ? normPhone(raw) : normName(raw);
  if(searchBy === "phone" && !target){ area.innerHTML = '<div class="card empty-hint">اكتب رقم موبايل صحيح</div>'; return; }

  // لسه مفيش ولا طلب متحمّل → نبدأ (أو نعيد) التحميل، والبحث بيتعاد لوحده أول ما يوصل
  if(!ALL_ORDERS.length){
    area.innerHTML = '<div class="card empty-hint">⏳ جاري تحميل أحدث الطلبات…</div>';
    startLoading();
    return;
  }

  let complete = FULL_LOADED;   // النتايج كاملة؟ (كل الطلبات محمّلة، أو السيرفر رد بكل طلبات الرقم)
  let matches = ALL_ORDERS.filter(o => searchBy === "phone" ? (o._p && o._p.indexOf(target) !== -1) : o._n.indexOf(target) !== -1);

  // 📞 رقم كامل والباقي لسه بيتحمّل: نسأل السيرفر عن العميل ده بس (سريع) عشان طلباته تبان كاملة
  if(searchBy === "phone" && !FULL_LOADED && target.length >= 9){
    try{
      const exact = prepOrders(await fetchOrders("&customerPhone=" + encodeURIComponent(target)));
      if(exact.length){ matches = exact; complete = true; }
    }catch(e){ if(e.message === "Unauthorized") return; }
    if(document.getElementById("customerSearchInput").value.trim() !== raw) return;   // الموظف كتب حاجة تانية في الوقت ده
  }

  const partialNote = complete ? "" :
    '<div class="card empty-hint" style="padding:10px 0;color:#B45309">⏳ دي نتايج من أحدث ' + ALL_ORDERS.length +
    ' طلب بس — باقي الطلبات بتتحمّل، والنتايج هتتحدّث لوحدها</div>';

  if(matches.length === 0){
    area.innerHTML = FULL_LOADED
      ? '<div class="card empty-hint">🚫 مفيش أي طلبات مسجّلة بالاسم أو الرقم ده</div>'
      : '<div class="card empty-hint">⏳ مش لاقيه في أحدث الطلبات — بندوّر في باقي الطلبات أول ما تخلص تحميل…</div>';
    return;
  }

  // أكتر من عميل (أرقام مختلفة) مطابقين → الموظف يختار الأول، عشان الطلبات ماتختلطش
  const byPhone = new Map();
  matches.forEach(order => {
    const key = order._p || normPhone(order.phone) || String(order.phone || "بدون رقم").trim();
    if(!byPhone.has(key)) byPhone.set(key, []);
    byPhone.get(key).push(order);
  });
  if(byPhone.size > 1){
    showNameSearchWarning([...byPhone.values()].map(orders => ({ orders })));
    if(partialNote) area.insertAdjacentHTML("afterbegin", partialNote);
    return;
  }

  renderCustomer(matches);
  if(partialNote) area.insertAdjacentHTML("afterbegin", partialNote);
}

function renderCustomer(orders){
  const area = document.getElementById("resultArea");
  // الأحدث الأول
  const sorted = [...orders].sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
  const latest = sorted[0];

  const totalOrders = sorted.length;
  const openOrders = sorted.filter(o => isOpenStatus(o.status));
  const deliveredOrders = sorted.filter(o => o.status === "Delivered");
  const canceledOrders = sorted.filter(o => o.status === "Canceled");
  const totalSpent = sorted.reduce((sum,o) => {
    // بنجمع بس الطلبات اللي مش ملغية — الملغي مش حصل فيه تحصيل فعلي غالبًا
    if(o.status === "Canceled") return sum;
    const end = (o.EndPrice !== undefined && o.EndPrice !== null && o.EndPrice !== "")
      ? parseFloat(o.EndPrice) : (parseFloat(o.finalPrice||0) + parseFloat(o.shipping||0) - parseFloat(o.deposit||0));
    return sum + (isNaN(end) ? 0 : end);
  }, 0);

  let h = '<div class="card">';
  h += '<div class="cust-head"><div>';
  h += '<div class="cust-name">👤 ' + escapeHtml(latest.customerName || "—") + '</div>';
  h += '<div class="cust-sub">📞 ' + escapeHtml(tsDisplayPhone(latest.phone) || "—") + (latest.governorate ? ' &nbsp;•&nbsp; 📍 ' + escapeHtml(latest.governorate) : '') + '</div>';
  if(latest.address) h += '<div class="cust-sub">🏠 ' + escapeHtml(latest.address) + '</div>';
  h += '</div></div>';

  h += '<div class="stats-grid">';
  h += '<div class="stat-box"><div class="num">' + totalOrders + '</div><div class="lbl">إجمالي الطلبات</div></div>';
  h += '<div class="stat-box open"><div class="num">' + openOrders.length + '</div><div class="lbl">طلبات مفتوحة/جارية</div></div>';
  h += '<div class="stat-box"><div class="num">' + deliveredOrders.length + '</div><div class="lbl">تم التسليم</div></div>';
  h += '<div class="stat-box"><div class="num">' + canceledOrders.length + '</div><div class="lbl">ملغية</div></div>';
  h += '<div class="stat-box spent"><div class="num">' + fmt(totalSpent) + '</div><div class="lbl">إجمالي المحصّل (EGP)</div></div>';
  h += '</div></div>';

  h += '<div class="card"><h2 style="font-size:1.05rem;">📦 كل الطلبات (' + totalOrders + ')</h2>';
  sorted.forEach((o, idx) => {
    const rowId = "hist_" + idx;
    h += '<div class="order-row" onclick="toggleHistory(\'' + rowId + '\')">';
    h += '<div class="order-top"><span class="order-id">🔖 ' + escapeHtml(o.order || "—") + '</span><span class="badge ' + statusClass(o.status) + '">' + statusLabel(o.status) + '</span></div>';
    h += '<div class="order-meta">';
    h += '<span>📅 ' + (o.date ? new Date(o.date).toLocaleDateString('ar-EG') : "—") + '</span>';
    if(o.arrivaldate) h += '<span>🚚 وصول متوقع: ' + escapeHtml(o.arrivaldate) + '</span>';
    h += '</div>';

    // المنتج (لينك) + الكمية + سعر القطعة + الإجمالي — تفاصيل كاملة لكل صف
    const qty = parseFloat(o.quantity) || 1;
    const total = (o.EndPrice !== undefined && o.EndPrice !== null && o.EndPrice !== "")
      ? parseFloat(o.EndPrice) : parseFloat(o.finalPrice || 0);
    const unitPrice = qty > 0 ? (total / qty) : total;

    h += '<div class="order-detail-grid">';
    h += '<div class="dl"><span class="dt">المنتج</span><span class="dd">' +
         (o.link ? '<a href="' + tsSafeHref(o.link) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 فتح اللينك</a>' : '—') +
         '</span></div>';
    h += '<div class="dl"><span class="dt">الكمية</span><span class="dd">' + qty + ' قطعة</span></div>';
    h += '<div class="dl"><span class="dt">سعر القطعة</span><span class="dd">' + fmt(unitPrice) + ' جنيه</span></div>';
    h += '<div class="dl"><span class="dt">الإجمالي</span><span class="dd total">' + fmt(total) + ' جنيه</span></div>';
    h += '</div>';
    h += '<div class="order-history" id="' + rowId + '">';
    if(o.history && o.history.length){
      o.history.forEach(ev => { h += '<div>• ' + statusLabel(ev.status) + ' — ' + escapeHtml(ev.time) + (ev.note ? ' (' + escapeHtml(ev.note) + ')' : '') + '</div>'; });
    } else {
      h += '<div>مفيش سجل تحديثات لسه لهذا الطلب</div>';
    }
    h += '</div></div>';
  });
  h += '</div>';

  area.innerHTML = h;
}

function toggleHistory(id){
  const el = document.getElementById(id);
  if(el) el.style.display = (el.style.display === "block") ? "none" : "block";
}
</script>
