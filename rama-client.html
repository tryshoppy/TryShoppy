<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRY SHOPPY — RAMA Vitamins</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb; --bg:#f4f7fe; --white:#fff; --text:#1e293b; --border:#cbd5e1;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --gray:#64748b;
  /* 💛💙 هوية البحث: أصفر + أزرق غامق */
  --accent:#facc15; --accent-dark:#eab308; --accent-ink:#1e3a8a;
}
*{box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);margin:0;padding:20px;color:var(--text);}
.container{max-width:640px;margin:auto;}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:16px;}
h2{margin:0 0 20px;text-align:center;color:var(--primary);font-weight:900;}
.input-group{margin-bottom:14px;}
.input-group label{display:block;margin-bottom:6px;font-weight:700;color:#475569;font-size:13.5px;}
input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;font-family:'Cairo';box-sizing:border-box;font-size:14.5px;min-height:46px;}
button{padding:13px 20px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-family:'Cairo';font-size:14.5px;font-weight:800;cursor:pointer;min-height:46px;transition:opacity .15s,transform .1s;}
button:hover{opacity:.9;}
button:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-ghost{background:#f1f5f9;color:var(--text);}
.btn-success{background:var(--success);}
.btn-warning{background:var(--warning);}
.btn-danger{background:var(--danger);}
/* 💛💙 زرار البحث — أصفر بنص أزرق غامق وإطار أزرق */
.btn-search{background:var(--accent);color:var(--accent-ink);border:2px solid var(--primary);
  box-shadow:0 3px 0 0 var(--primary);font-weight:900;}
.btn-search:hover{background:var(--accent-dark);opacity:1;}
.btn-search:active{transform:translateY(2px);box-shadow:0 1px 0 0 var(--primary);}
/* شريط البحث نفسه ياخد نفس الهوية عشان يبان إنهم وحدة واحدة */
.search-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;
  background:linear-gradient(90deg,rgba(250,204,21,.16),rgba(37,99,235,.10));
  border:1.5px solid var(--accent);border-radius:14px;padding:10px;}
.search-bar input{flex:1;min-width:150px;border-color:var(--primary);background:#fff;}
.search-bar button{flex:0 0 auto;min-width:112px;}
/* على الموبايل: الحقل سطر لوحده، والزرارين تحته جنب بعض بدل ما
   زرار المسح ينزل لوحده في سطر فاضي */
@media(max-width:480px){
  .search-bar{padding:8px;}
  .search-bar input{flex:1 1 100%;min-width:0;}
  .search-bar button{flex:1 1 0;min-width:0;}
}
/* شرايط فلترة سريعة (أزرار مختصرة بدل ما تفتح القايمة المنسدلة) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip{flex:0 0 auto;min-width:0;padding:8px 14px;font-size:12.5px;min-height:38px;border-radius:999px;
  background:#eff6ff;color:var(--primary);border:1.5px solid #bfdbfe;font-weight:800;}
.chip:hover{opacity:1;background:#dbeafe;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--primary);}
.hidden{display:none !important;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;min-width:120px;}

/* حلقة تركيز واضحة لأي عنصر تفاعلي — مهم لاستخدام لوحة المفاتيح */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2.5px solid var(--primary);outline-offset:2px;
}

/* login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:22px;padding:32px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center;}

/* product cards */
.product-card{border:1.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;display:flex;gap:14px;transition:box-shadow .15s,border-color .15s;}
@media(hover:hover){.product-card:hover{border-color:#93c5fd;box-shadow:0 4px 16px rgba(37,99,235,.08);}}
.product-img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#f1f5f9;flex-shrink:0;}
.product-body{flex:1;min-width:0;}
.product-name{font-weight:800;font-size:14.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.product-link{font-size:12px;color:var(--gray);text-decoration:none;display:block;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.product-link-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--primary);text-decoration:none;background:#eef2ff;border:1px solid #c7d2fe;padding:7px 14px;border-radius:9px;margin-bottom:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s,transform .1s;}
.product-link-btn:hover{background:#e0e7ff;}
.product-link-btn:active{transform:scale(.97);}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:8px;}
.b-gray{background:#f1f5f9;color:#475569;}
.b-blue{background:#eff6ff;color:#2563eb;}
.b-orange{background:#fff7ed;color:#c2410c;}
.b-green{background:#f0fdf4;color:#16a34a;}
.b-red{background:#fef2f2;color:#dc2626;}
.price-tag{font-weight:900;font-size:16px;color:var(--primary);margin:6px 0;}
.mini-input{padding:9px 10px;font-size:13px;border-radius:9px;min-height:40px;}
.mini-btn{padding:9px 14px;font-size:13px;border-radius:9px;min-height:40px;}
.meta-line{font-size:12.5px;color:var(--gray);margin-top:4px;}
.empty-hint{text-align:center;color:#94a3b8;font-weight:700;padding:24px 0;}
/* تجميع أدوات الرد (موافقة/اقتراح سعر) في مربّع مميز عن باقي بيانات
   المنتج — بيسهّل تمييز "بيانات المنتج" عن "الإجراء المطلوب مني" */
.action-box{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px;border:1px solid #f1f5f9;}
.topbar{display:flex;justify-content:flex-end;margin-bottom:4px;}
.notif-badge{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;padding:6px 14px;border-radius:20px;font-weight:800;font-size:13px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.stat-box{background:#fff;border-radius:14px;padding:13px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.stat-box .num{font-size:1.2rem;font-weight:900;color:var(--primary);}
.stat-box .lbl{font-size:11px;color:var(--gray);font-weight:700;margin-top:3px;}
.cart-item{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:10px;}
.cart-item img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#f1f5f9;flex-shrink:0;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cart-item .link{font-size:11px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.cart-item .remove-btn{background:none;color:var(--danger);font-size:12px;font-weight:700;padding:6px 10px;flex-shrink:0;min-height:auto;}
.spinner{display:inline-block;width:14px;height:14px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
#refreshBtn.spinning{animation:spin .8s linear infinite;}
.notif-badge:not(.hidden){animation:pulseBadge 2s ease-in-out infinite;}
@keyframes pulseBadge{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35);} 50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}
#paymentsBtn{background:var(--warning);color:#fff;font-weight:900;animation:pulseGold 2.2s ease-in-out infinite;}
#paymentsBtn:hover{opacity:.9;}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.45);} 50%{box-shadow:0 0 0 7px rgba(217,119,6,0);}}

/* موبايل: مساحات أضيق ومريحة أكتر بدل ما تتزنق */
@media(max-width:480px){
  body{padding:12px;}
  .card{padding:16px;border-radius:16px;}
  .login-box{padding:24px;}
  .product-card{padding:12px;gap:10px;}
  .product-img{width:56px;height:56px;}
  .stats-grid{gap:8px;}
  .stat-box{padding:10px;}
  .stat-box .num{font-size:1.05rem;}
  h2{font-size:1.1rem;}
}

/* احترام تفضيل تقليل الحركة — بيوقف الحركات الزخرفية بس، مش
   السبينر (بيفضل يلف عشان لسه بيدل على إن حاجة شغالة) */
@media(prefers-reduced-motion:reduce){
  button,.product-link-btn,.product-card{transition:none;}
  .notif-badge:not(.hidden){animation:none;}
  #paymentsBtn{animation:none;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:1.6rem;font-weight:900;color:var(--primary);margin-bottom:6px;">TRY SHOPPY</div>
    <div style="font-size:13px;color:#94a3b8;font-weight:700;margin-bottom:24px;">💊 بوابة RAMA — الفيتامينات والمكملات</div>
    <input id="passcodeInput" type="password" placeholder="🔒 كلمة المرور" style="margin-bottom:14px;" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginError" class="hidden" style="color:var(--danger);font-size:13px;font-weight:700;margin-bottom:12px;">❌ كلمة المرور غلط</div>
    <button class="btn-block" onclick="doLogin()">🔐 دخول ←</button>
  </div>
</div>

<div id="mainContent" class="hidden">
<div class="container">

  <div class="card">
    <h2>➕ إضافة منتج جديد</h2>
    <div class="input-group">
      <label>رابط المنتج</label>
      <div class="row">
        <input id="newLink" placeholder="https://amazon.com/...">
        <button id="fetchBtn" onclick="fetchProduct()" style="flex:0 0 auto;">🔍 جلب البيانات</button>
      </div>
    </div>
    <div id="fetchPreview" class="hidden" style="display:flex;gap:12px;align-items:center;background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:14px;">
      <img id="previewImg" class="product-img" style="width:52px;height:52px;">
      <div id="previewName" style="font-weight:700;font-size:13.5px;"></div>
    </div>
    <div class="input-group">
      <label>✏️ اسم المنتج (يدوي لو الجلب التلقائي متعذّرش)</label>
      <input id="manualName" placeholder="اسم المنتج">
    </div>
    <button class="btn-block" id="addToCartBtn" onclick="addToCart()">➕ أضف للسلة</button>
  </div>

  <div id="cartCard" class="card hidden">
    <h2 style="font-size:1.1rem;">🛒 منتجات جاهزة للإرسال</h2>
    <div id="cartList"></div>
    <button class="btn-block btn-success" id="sendAllBtn" onclick="sendAllCart()">✅ إرسال كل المنتجات للفريق</button>
  </div>

  <div class="topbar" style="justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="lastRefreshLbl" style="font-size:11px;color:var(--gray);"></span>
      <button id="refreshBtn" class="btn-ghost" onclick="manualRefresh(this)" title="تحديث القائمة" style="padding:8px 12px;">🔄</button>
      <button class="btn-ghost" onclick="exportCSV()" title="تصدير طلباتي كـ CSV" style="padding:8px 12px;">📊</button>
      <button id="paymentsBtn" class="btn-ghost" onclick="openPaymentsModal()" title="دفعات الوصول" style="padding:8px 12px;">💰 دفعات</button>
    </div>
    <div id="notifBadge" class="notif-badge hidden" style="cursor:pointer;" onclick="jumpToNeedsReview()" title="اضغط للانتقال للمنتجات المحتاجة ردك"></div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="card">
    <div class="search-bar">
      <input id="searchInput" placeholder="🔍 دوّر باسم المنتج أو اللينك أو موعد الوصول..."
             oninput="debouncedRenderList()" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn-search" id="searchBtn" onclick="doSearch()">🔍 بحث</button>
      <button class="btn-ghost" style="flex:0 0 auto;min-width:0;padding:13px 14px;" onclick="clearSearch()" title="مسح البحث">✖️</button>
    </div>
    <div class="chips" id="quickChips"></div>
    <div class="row" style="margin-top:10px;">
      <select id="filterStatus" onchange="renderList()">
        <option value="">📋 كل الحالات</option>
        <option value="PendingPrice">⏳ بانتظار السعر</option>
        <option value="PendingApproval">👀 بانتظار موافقتك</option>
        <option value="PendingReview">💬 عرضك قيد المراجعة</option>
        <option value="Confirmed">✅ تم التأكيد</option>
        <option value="Placed">📦 تم الشراء</option>
        <option value="Delayed">⏱️ متأخر</option>
        <option value="Delivered">🎉 تم التسليم</option>
      </select>
      <select id="filterArrival" onchange="renderList()">
        <option value="">📅 كل مواعيد الوصول</option>
      </select>
      <button class="btn-ghost" style="flex:0 0 auto;" onclick="document.getElementById('searchInput').value='';document.getElementById('filterStatus').value='';document.getElementById('filterArrival').value='';renderList();">🧹 مسح</button>
    </div>
  </div>

  <div id="productsList"></div>

</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu7m7lEOZc_s9dXN9RuYGz41uWziWM2KMXf2GcunZM6QMdsBLpo-p-dEpoHJgL4dr83Q/exec"; // ⚠️ حط هنا رابط RMA_Vitamins_Code.gs بعد النشر

// رقم واتساب الأدمن — نفس رقم TS_CONFIG.SUPPORT_PHONE بتاع الموقع
// الرئيسي (بصيغة دولية من غير + أو صفر). غيّره هنا لو الرقم اتغيّر
const ADMIN_WHATSAPP = "201005609642";
// رقم واتساب مخصص لإشعارات "التأكيد" بس (بعد ما العميل يوافق على
// منتجات) — مختلف عن ADMIN_WHATSAPP اللي لسه مستخدم لإشعارات
// "طلب التسعير" (بعد إرسال السلة للفريق) زي ما هو
const CONFIRM_WHATSAPP = "13022521911";

// ⚠️ لازم يتعرّف قبل initSession() تحت — أول مرة اتحطت في آخر
// الملف بالغلط وده كسر التحميل كله (TDZ error لأنها متعرّفة بـlet
// مش hoisted زي الدوال)
let loadingInProgress = null;

/* اسم/صورة المنتج ممكن يكونوا جايين من موقع خارجي (جلب تلقائي
   بـ og:title/JSON-LD..) مش تحت سيطرتنا، فلازم ننضفهم قبل ما
   نحطهم في innerHTML أو في href/src عشان نمنع XSS */
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// بيرجع اللينك بس لو بروتوكول http/https عادي، وإلا يرجع فاضي
// (بيمنع حاجات زي javascript: أو data: لو حد حط لينك خبيث بدل رابط منتج)
function safeUrl(u){
  const s = String(u || "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}

/* 🐞 كان بيتحط الـid الخام جوه onclick="fn('...')" — أي id فيه
   علامة تنصيص/شرطة مايلة بيكسر الـhandler كله (SyntaxError) والزرار
   بيبقى ميّت. jsAttr بتهرّب للـJS الأول وبعدين للـHTML، بالترتيب
   العكسي اللي المتصفح بيفك بيه (HTML ← JS) */
function jsAttr(v){
  return escapeHtml(String(v == null ? "" : v).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}
/* 🐞 وكمان ${p.staffEgp} كان بيتحط كرقم جوه الـhandler — لو العمود
   فاضي بيطلع updateQtyPreview('5', ) وده SyntaxError كمان. دلوقتي
   أي قيمة مش رقم بتبقى 0 */
function numAttr(v){
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}
// عرض رقم بشكل آدمي — من غير "NaN" لو العمود فاضي
function fmtNum(v){
  const n = parseFloat(v);
  return (isFinite(n) ? n : 0).toLocaleString();
}

/* ---------------------------------------------------------
   📅 مواعيد الوصول — توحيد وترتيب
   الموعد بيتكتب بإيد الفريق كنص حر (زي O-27SEP2026)، فساعات
   بيتسجّل كابيتال وساعات سمول. بنوحّد الكل كابيتال عشان
   "O-27sep2026" و"O-27SEP2026" يبقوا نفس الموعد الواحد، مش
   اتنين منفصلين في الفلتر ولا في حساب الدفعات
   --------------------------------------------------------- */
function normArrival(v){
  return String(v == null ? "" : v).trim().replace(/\s+/g, " ").toUpperCase();
}

const ARRIVAL_MONTHS = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5,
  JUL:6, AUG:7, SEP:8, SEPT:8, OCT:9, NOV:10, DEC:11 };

/* بيطلّع تاريخ حقيقي من نص زي "O-27SEP2026" عشان الترتيب يبقى
   بالتاريخ الفعلي مش أبجدي — أبجديًا "O-3OCT2026" بييجي قبل
   "O-27SEP2026" وده غلط تمامًا. بيفهم كمان صيغة 2026-09-27 */
function parseArrivalDate(v){
  const s = normArrival(v);
  if(!s) return null;
  let m = s.match(/(\d{1,2})\s*-?\s*([A-Z]{3,4})\s*-?\s*(\d{4})/); // 27SEP2026
  if(m && ARRIVAL_MONTHS[m[2]] !== undefined){
    return new Date(Date.UTC(+m[3], ARRIVAL_MONTHS[m[2]], +m[1]));
  }
  m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); // 2026-09-27
  if(m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  return null;
}

// آخر 7 مواعيد وصول — من الأحدث للأقدم، من غير تكرار
const ARRIVAL_FILTER_LIMIT = 7;
function getRecentArrivals(){
  const seen = new Map(); // الكابيتال هو المفتاح، فالسمول بيندمج فيه تلقائي
  allProducts.forEach(p => {
    const key = normArrival(p.arrivalDate);
    if(key && !seen.has(key)) seen.set(key, parseArrivalDate(key));
  });
  return Array.from(seen.entries())
    .sort((a, b) => {
      if(a[1] && b[1]) return b[1] - a[1];      // الاتنين مفهومين → الأحدث فوق
      if(a[1]) return -1;                        // اللي ليه تاريخ مفهوم قبل اللي ملوش
      if(b[1]) return 1;
      return b[0].localeCompare(a[0]);           // حل أخير: ترتيب نصي
    })
    .slice(0, ARRIVAL_FILTER_LIMIT)
    .map(e => e[0]);
}

function renderArrivalFilter(){
  const sel = document.getElementById("filterArrival");
  if(!sel) return;
  const current = sel.value;
  const dates = getRecentArrivals();
  sel.innerHTML = `<option value="">📅 كل مواعيد الوصول</option>`
    + dates.map(d => `<option value="${escapeHtml(d)}">📅 ${escapeHtml(d)}</option>`).join("");
  // نحافظ على اللي إنت مختاره طالما لسه موجود بعد التحديث
  sel.value = (current && dates.indexOf(current) !== -1) ? current : "";
}

// 🕑 الجلسة بقت باقية يومين بدل ما تتقفل كل ما تقفل المتصفح —
// localStorage بيفضل موجود حتى بعد إغلاق التاب/المتصفح (بعكس
// sessionStorage اللي كان بيتمسح كل مرة)، وبنحط تاريخ انتهاء
// صريح بنفسنا (48 ساعة) عشان مايفضلش أبد الآبدين. السيرفر برضه
// بيتحقق من الباسورد الحقيقي في كل ريكوست زي ما هو، فده مجرد
// راحة — مش بديل عن الحماية الفعلية
const CLIENT_SESSION_TIME = 2 * 24 * 60 * 60 * 1000; // يومين

function getPasscode(){
  const savedAt = parseInt(localStorage.getItem("ramaClientLoginTime")) || 0;
  if(!savedAt || (Date.now() - savedAt) > CLIENT_SESSION_TIME){
    clearPasscode();
    return "";
  }
  return localStorage.getItem("rmaPasscode") || "";
}
function setPasscode(p){
  localStorage.setItem("rmaPasscode", p);
  localStorage.setItem("ramaClientLoginTime", String(Date.now()));
}
function clearPasscode(){
  localStorage.removeItem("rmaPasscode");
  localStorage.removeItem("ramaClientLoginTime");
}

// 🔐 دلوقتي بيتحقق من الباسورد فعليًا مع السيرفر قبل ما يفتح
// التطبيق — قبل كده كان بيقفل شاشة الدخول ويوريك كل حاجة لأي نص
// مش فاضي تكتبه، من غير أي تحقق خالص
async function doLogin(){
  const p = document.getElementById("passcodeInput").value.trim();
  if(!p) return;
  const btn = document.querySelector("#loginScreen button.btn-block");
  setBtnLoading(btn, "جاري التحقق...");
  setPasscode(p);
  const result = await loadProducts();
  clearBtnLoading(btn);
  const errBox = document.getElementById("loginError");
  if(result === "ok"){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("mainContent").classList.remove("hidden");
    errBox.classList.add("hidden");
    renderCart();
    renderQuickChips();
    // 🐞 loadProducts اشتغلت وإحنا لسه مخبّيين mainContent، فالرسم
    // حصل على عناصر مخفية — نرسم تاني دلوقتي بعد ما بانت
    renderList();
    startAutoRefresh();
  } else if(result === "unauthorized"){
    clearPasscode();
    errBox.textContent = "❌ كلمة المرور غلط";
    errBox.classList.remove("hidden");
  } else {
    // مشكلة شبكة — مش دليل إن الباسورد غلط، فمنمسحوش، بس منفتحش
    // التطبيق كمان من غير ما نتأكد
    clearPasscode();
    errBox.textContent = "⚠️ تعذر الاتصال بالسيرفر — حاول تاني";
    errBox.classList.remove("hidden");
  }
}

// جلسة سابقة محفوظة (خلال آخر يومين)؟ منوريش التطبيق غير بعد ما
// نتأكد إن الباسورد المحفوظ لسه صحيح (ممكن يكون اتغيّر من عند
// الفريق من وقتها)
// ⚠️ جسم initSession() اتنقل لآخر السكريبت خالص — كان بينده على
// دوال بتستخدم متغيرات (allProducts / lastDataHash / STATUS_META)
// متعرّفة بـlet/const تحت في الملف، وده TDZ ReferenceError بيكسر
// التحميل كله. الدوال بتتعمل لها hoisting، المتغيرات لأ

function setBtnLoading(btn, text){
  if(!btn || btn.dataset.loading==='1') return;
  btn.dataset.loading='1'; btn.dataset.orig=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> '+text;
}
function clearBtnLoading(btn){
  if(!btn || btn.dataset.loading!=='1') return;
  btn.disabled=false; btn.innerHTML=btn.dataset.orig;
  delete btn.dataset.loading; delete btn.dataset.orig;
}

let fetchedInfo = null;

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// 🔁 الجلب التلقائي أحيانًا بيفشل من أول محاولة (الموقع بيرفض
// طلب، شبكة بطيئة..) وبعدين ينجح لو جربت تاني — فبقينا نعيد
// المحاولة لوحدنا في الخلفية (لحد 5 مرات) بدل ما تدوس الزرار
// كذا مرة بإيدك. بنوقف فورًا أول ما تنجح محاولة، ولو الخمسة كلها
// فشلت، بترجع لحالة "اكتبها يدويًا" زي الأول بالظبط
async function fetchProduct(){
  const link = document.getElementById("newLink").value.trim();
  if(!link){ alert("الصق رابط المنتج الأول"); return; }
  const btn = document.getElementById("fetchBtn");
  if(btn.dataset.loading==='1') return; // شغال أصلاً، متضاعفش الطلبات لو داس تاني
  // 🐞 كانت 15 محاولة ورا بعض من غير أي مهلة لكل محاولة — لو
  // السيرفر بيهنّج، الزرار كان بيفضل "بيحمّل" لدقايق من غير أي
  // طريقة توقّفه. دلوقتي 6 محاولات، لكل واحدة سقف 12 ثانية
  const MAX_ATTEMPTS = 6;
  const ATTEMPT_TIMEOUT = 12000;
  let data = null;

  setBtnLoading(btn, `جاري الجلب... (1/${MAX_ATTEMPTS})`);
  for(let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++){
    btn.innerHTML = `<span class="spinner"></span> جاري الجلب... (${attempt}/${MAX_ATTEMPTS})`;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ATTEMPT_TIMEOUT);
    try{
      const res = await fetch(SCRIPT_URL, { method:"POST", signal: ctrl.signal, body: JSON.stringify({ action:"fetchProductInfo", link }) });
      data = await res.json();
      if(data && data.success) break; // نجحت المحاولة دي، منكملش تاني
    }catch(e){
      data = null; // مشكلة شبكة في المحاولة دي بالذات — نجرب تاني لو لسه فيه فرصة
    } finally {
      clearTimeout(t);
    }
    if(attempt < MAX_ATTEMPTS) await sleep(350); // فاصل بسيط قبل المحاولة الجاية، مش ضربة واحدة على السيرفر
  }

  clearBtnLoading(btn);
  if(data && data.success){
    fetchedInfo = { productName: data.productName, imageUrl: data.imageUrl, suggestedUsdPrice: data.suggestedUsdPrice };
    // 🐞 كان بيحط src="" لما الصورة مش موجودة — المتصفح ساعتها
    // بيعتبرها رابط الصفحة نفسها ويعيد تحميلها كصورة (طلب زيادة
    // + أيقونة صورة مكسورة). دلوقتي بنخفي الصورة أصلاً
    const prevImg = document.getElementById("previewImg");
    const imgUrl = safeUrl(data.imageUrl);
    if(imgUrl){ prevImg.src = imgUrl; prevImg.classList.remove("hidden"); }
    else { prevImg.removeAttribute("src"); prevImg.classList.add("hidden"); }
    let previewText = escapeHtml(data.productName || "(بدون اسم — اكتبه يدويًا)");
    if(data.suggestedUsdPrice){
      previewText += ` <span style="color:var(--gray);font-weight:700;">— 💵 السعر على الموقع تقريبًا: $${escapeHtml(String(data.suggestedUsdPrice))}</span>`;
    }
    document.getElementById("previewName").innerHTML = previewText;
    document.getElementById("fetchPreview").classList.remove("hidden");
    if(data.productName) document.getElementById("manualName").value = data.productName;
  } else {
    alert((data && data.message) || `تعذر الجلب بعد ${MAX_ATTEMPTS} محاولات — اكتب بيانات المنتج يدويًا`);
  }
}

/* ---------- السلة (منتجات جاهزة تتبعت مرة واحدة) ---------- */
function getCart(){ try{ return JSON.parse(localStorage.getItem("rmaCart")) || []; }catch(e){ return []; } }
function saveCart(c){ localStorage.setItem("rmaCart", JSON.stringify(c)); }

function addToCart(){
  const link = document.getElementById("newLink").value.trim();
  const name = document.getElementById("manualName").value.trim();
  if(!link){ alert("الصق رابط المنتج"); return; }

  const cart = getCart();
  cart.push({
    tempId: Date.now() + "-" + Math.floor(Math.random()*10000),
    link,
    productName: name || (fetchedInfo && fetchedInfo.productName) || "",
    imageUrl: (fetchedInfo && fetchedInfo.imageUrl) || "",
    notes: (fetchedInfo && fetchedInfo.suggestedUsdPrice) ? `💵 السعر على الموقع وقت الإضافة (تقريبي): $${fetchedInfo.suggestedUsdPrice}` : ""
  });
  saveCart(cart);

  document.getElementById("newLink").value = "";
  document.getElementById("manualName").value = "";
  document.getElementById("fetchPreview").classList.add("hidden");
  fetchedInfo = null;

  renderCart();
}

function renderCart(){
  const cart = getCart();
  const card = document.getElementById("cartCard");
  if(!cart.length){ card.classList.add("hidden"); return; }
  card.classList.remove("hidden");
  document.getElementById("cartList").innerHTML = cart.map(item => {
    const img = safeUrl(item.imageUrl);
    return `
    <div class="cart-item">
      ${img ? `<img src="${escapeHtml(img)}">` : `<img>`}
      <div class="info">
        <div class="name">${escapeHtml(item.productName || "منتج بدون اسم")}</div>
        <span class="link">${escapeHtml(item.link)}</span>
      </div>
      <button class="remove-btn" onclick="removeFromCart('${escapeHtml(item.tempId)}')">🗑 حذف</button>
    </div>
  `;
  }).join("");
}

function removeFromCart(tempId){
  saveCart(getCart().filter(i => i.tempId !== tempId));
  renderCart();
}

async function sendAllCart(){
  const cart = getCart();
  if(!cart.length) return;
  const btn = document.getElementById("sendAllBtn");
  setBtnLoading(btn, "جاري إرسال " + cart.length + " منتج...");

  // 🐞 كان بيستخدم Promise.all: أول منتج يفشل في الشبكة بيرمي،
  // فالباقي كله بيتحسب فاشل ومفيش أي واحد بيتسجّل. وأخطر من كده،
  // في الحالة الناجحة جزئيًا كان بيعمل saveCart([]) على طول —
  // يعني المنتجات اللي فشلت كانت بتتمسح من السلة خالص وتضيع،
  // ومكانش قدامك أي طريقة ترجّعها غير إنك تلصق اللينك من الأول.
  // allSettled بتخلي كل منتج مستقل، والفاشلين بس بيفضلوا في السلة
  try{
    const results = await Promise.allSettled(cart.map(item =>
      fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({
        action:"addLink", passcode:getPasscode(), link:item.link,
        productName:item.productName, imageUrl:item.imageUrl, notes:item.notes || ""
      })}).then(r=>r.json())
    ));
    clearBtnLoading(btn);

    const failedItems = cart.filter((item, i) =>
      !(results[i].status === "fulfilled" && results[i].value && results[i].value.success));
    const successCount = cart.length - failedItems.length;

    saveCart(failedItems); // ✅ اللي فشل بس هو اللي بيفضل في السلة
    renderCart();
    loadProducts();

    if(failedItems.length){
      alert(`⚠️ ${successCount} من ${cart.length} اتبعتوا بنجاح.\nالـ${failedItems.length} الباقيين لسه في السلة — دوس "إرسال" تاني للي فيها.`);
    }
    if(successCount > 0) showOrderSentModal(successCount);
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر — السلة لسه محفوظة، حاول تاني");
  }
}

  PendingPrice:   { label:"⏳ بانتظار السعر من الفريق", cls:"b-gray" },
  PendingApproval:{ label:"👀 بانتظار موافقتك", cls:"b-blue" },
  PendingReview:  { label:"💬 عرضك قيد مراجعة الفريق", cls:"b-orange" },
  Confirmed:      { label:"تم التأكيد ✅", cls:"b-green" },
  Placed:         { label:"تم الشراء 📦", cls:"b-blue" },
  Delayed:        { label:"متأخر ⏳", cls:"b-orange" },
  Delivered:      { label:"تم التسليم 🎉", cls:"b-green" },
  Rejected:       { label:"❌ مرفوض", cls:"b-red" }

let allProducts = [];
let lastRenderedItems = []; // آخر مجموعة اتعرضت فعليًا (بعد البحث/الفلترة) — يستخدمها تصدير CSV
let confirmedThisSessionCount = 0; // لعداد "أكّدت X منتج" وقت ما طابور الموافقة يفضى

// منع طلبين متزامنين (مثلاً لو دوس تحديث وهو لسه بيحمّل من نفسه)
// — بيرجّع نفس الـpromise الشغالة بدل ما يبدأ طلب جديد فوقه
// 🐞 أخطر باج كان هنا: لو loadProductsInner رمت استثناء (مش مجرد
// رجّعت خطأ)، السطر اللي بيصفّر loadingInProgress مكانش بيتنفّذ
// خالص، فالمتغير بيفضل ماسك promise مرفوضة للأبد — وكل تحديث بعد
// كده (يدوي أو تلقائي أو بعد أي أكشن) بيرجّع نفس المرفوضة من غير
// ما يعمل أي طلب. ده اللي كان بيخلي الصفحة "تقف" فجأة وتفضل واقفة
// لحد ما تعمل Refresh كامل. finally بتضمن التصفير في كل الحالات
async function loadProducts(){
  if(loadingInProgress) return loadingInProgress;
  loadingInProgress = loadProductsInner().catch(e => {
    console.error("loadProducts crashed:", e);
    return "network"; // مهما حصل، مش هنرمي على اللي نادى علينا
  });
  try{
    return await loadingInProgress;
  } finally {
    loadingInProgress = null;
  }
}

async function loadProductsInner(retrying){
  let data;
  // 🐞 الجلب والرسم كانوا جوه نفس الـtry — فأي خطأ في الرسم كان
  // بيتحسب "فشل شبكة"، يعمل طلب تاني كامل من غير داعي، ويوري رسالة
  // "تعذر الاتصال" والنت شغال. دلوقتي كل واحد لوحده
  try{
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 15000); // سقف 15 ثانية بدل ما يفضل معلّق للأبد
    try{
      const res = await fetch(SCRIPT_URL + "?scope=client&passcode=" + encodeURIComponent(getPasscode()), { signal: ctrl.signal });
      data = await res.json(); // لو السيرفر رجع HTML/نص مش JSON، هيقع هنا وننزل على catch تحت
    } finally {
      clearTimeout(timeout); // 🐞 كان بيتنسى على مسار الخطأ فيفضل تايمر معلّق
    }
  }catch(e){
    console.error("loadProducts failed:", e);
    // 🔁 أول فشل شبكة، بنجرب تاني تلقائي بصمت مرة واحدة قبل ما
    // نزعجك برسالة — كتير من الحالات بتكون تهنيجة شبكة لحظية
    // بتتصلح لوحدها من غير أي إجراء منك
    if(!retrying) return loadProductsInner(true);
    const box = document.getElementById("productsList");
    if(box && !allProducts.length) box.innerHTML = '<div class="card empty-hint">تعذر تحميل المنتجات — تأكد من الاتصال بالإنترنت وحاول تاني</div>';
    else showToast("⚠️ تعذر تحديث البيانات — هنجرب تاني", "error");
    return "network";
  }

  if(!Array.isArray(data)){
    // السيرفر دلوقتي بيرفض من غير باسورد صحيح ({success:false,...})
    // بدل ما يرجع كل البيانات لأي حد — ده الفرق بين "باسورد غلط"
    // و"مشكلة شبكة" اللي بنميزها في catch فوق
    console.warn("loadProducts: unauthorized or unexpected response", data);
    return "unauthorized";
  }

  applyProducts(data, true);
  return "ok";
}

/* ⚡ رسم البيانات + حفظها كنسخة محلية.
   - fromServer=true → نحفظ نسخة في المتصفح عشان الفتحة الجاية
     تبان فورًا من غير انتظار الشبكة.
   - لو البيانات مااتغيرتش عن آخر مرة، مابنعملش إعادة رسم خالص —
     ده اللي بيخلي التحديث التلقائي مايمسحش الكمية اللي بتكتبها
     ولا يقفل المربعات المفتوحة تحت إيدك */
let lastDataHash = "";
let pendingRefresh = false;
// إنت بتكتب دلوقتي في حقل جوه القايمة (كمية / سعر مقترح)؟
function isEditingList(){
  const a = document.activeElement;
  return !!(a && (a.tagName === "INPUT" || a.tagName === "SELECT")
    && a.closest && a.closest("#productsList"));
}
function applyProducts(data, fromServer){
  const hash = JSON.stringify(data);
  allProducts = data;
  if(fromServer){
    try{ localStorage.setItem("rmaProductsCache", hash); }catch(e){ /* التخزين ممتلئ — مش مشكلة */ }
  }
  if(hash === lastDataHash){ updateLastRefreshLabel(); return false; }

  // 🔒 فيه جديد بس إنت بتكتب الكمية أو سعرك المقترح — نستنى ما
  // تخلص بدل ما إعادة الرسم تمسح اللي تحت إيدك
  if(isEditingList()){
    if(!pendingRefresh){
      pendingRefresh = true;
      showToast("🔔 فيه تحديث جديد — هيتطبّق أول ما تخلص", "success");
    }
    return false;
  }

  pendingRefresh = false;
  lastDataHash = hash;
  renderNotifBadge(); // ⚠️ دايمًا بيعكس كل المنتجات، بغض النظر عن الفلتر — عشان محدش يفوّته رد لازم يبعته
  renderList();
  updateLastRefreshLabel();
  return true;
}
// أول ما تسيب الحقل، بنطبّق التحديث المؤجّل
document.addEventListener("focusout", () => {
  if(!pendingRefresh) return;
  setTimeout(() => { if(!isEditingList()) applyProducts(allProducts, false); }, 150);
});

// ⚡ أول رسم من النسخة المحفوظة في المتصفح — بيبان في أقل من جزء من
// الثانية بدل ما تستنى رد Google Script (اللي بياخد ثواني)، وبعدها
// البيانات الحقيقية بتنزل في الخلفية وتستبدلها لو فيه جديد
function renderFromCache(){
  try{
    const raw = localStorage.getItem("rmaProductsCache");
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!Array.isArray(data) || !data.length) return false;
    applyProducts(data, false);
    const lbl = document.getElementById("lastRefreshLbl");
    if(lbl) lbl.textContent = "نسخة محفوظة — بيتم التحديث...";
    return true;
  }catch(e){ return false; }
}

/* 🔄 تحديث تلقائي كل 30 ثانية — بس وإنت فاتح التاب فعلاً.
   قبل كده مكانش فيه أي تحديث تلقائي خالص: لو الفريق سعّر منتج،
   مكنتش تشوفه غير لما تدوس 🔄 بإيدك أو تعمل Refresh للصفحة.
   بنوقف المؤقّت وإنت مش شايف الصفحة عشان مانضربش على السيرفر
   ببلاش، وبنحدّث فورًا أول ما ترجع للتاب */
const AUTO_REFRESH_MS = 30000;
let autoRefreshTimer = null;
function startAutoRefresh(){
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => {
    if(document.visibilityState !== "visible" || !getPasscode()) return;
    // احتياطي لو رسم مؤجّل فضل معلّق من غير focusout
    if(pendingRefresh && !isEditingList()) applyProducts(allProducts, false);
    loadProducts();
  }, AUTO_REFRESH_MS);
}
function stopAutoRefresh(){
  if(autoRefreshTimer){ clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && getPasscode()) loadProducts();
});

// 🔄 تحديث يدوي — من غير ما يأثر على شكل الصفحة، بس أيقونة الزرار
// بتلف وهي بتحمّل عشان تحس إنها فعلاً بتحصل
function updateLastRefreshLabel(){
  const lbl = document.getElementById("lastRefreshLbl");
  if(!lbl) return;
  const now = new Date();
  lbl.textContent = "آخر تحديث: " + now.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
}

async function manualRefresh(btn){
  btn.classList.add("spinning");
  btn.disabled = true;
  await loadProducts();
  btn.classList.remove("spinning");
  btn.disabled = false;
}

function renderNotifBadge(){
  const needsAction = allProducts.filter(p => p.status === "PendingApproval").length;
  const badge = document.getElementById("notifBadge");
  if(needsAction > 0){ badge.textContent = "🔔 " + needsAction + " منتج محتاج ردك"; badge.classList.remove("hidden"); }
  else badge.classList.add("hidden");
}

// ✅ بتاخد "items" (بعد الفلترة/البحث) بدل allProducts كله — الأرقام
// فوق بتتبع بالظبط اللي شايفه في القائمة تحتها
function renderStats(items, paymentsTotal, statusF){
  paymentsTotal = paymentsTotal || 0;
  const confirmedLike = items.filter(p => ["Confirmed","Placed","Delayed","Delivered"].includes(p.status));
  const totalFinal = confirmedLike.reduce((s,p)=> s + (parseFloat(p.finalEgp)||0), 0);
  // ⚠️ المتبقي بيتحسب مباشرة من finalEgp-deposit، مش من عمود
  // "remaining" المخزّن، عشان الإجمالي = المدفوع + المتبقي يفضل
  // متطابق رياضيًا حتى لو حصل عدم تطابق تاريخي في البيانات
  const totalRemaining = Math.max(0, confirmedLike.reduce((s,p)=> s + Math.max(0, (parseFloat(p.finalEgp)||0) - (parseFloat(p.deposit)||0)), 0) - paymentsTotal);
  const totalQty = items.reduce((s,p)=> s + (parseInt(p.quantity)||1), 0);
  const deliveredCount = items.filter(p=>p.status==="Delivered").length;

  // 💡 القيمة/المتبقي بتظهر بس لو فيه فلتر حالة محدد فعليًا، مش
  // وإنت شايف كل الحالات مع بعض
  const showMoney = !!statusF;
  // 🆕 "إجمالي القيمة" بيتخفى تحديدًا لما الفلتر يكون "Delivered"
  // بالظبط. "إجمالي المدفوع" اتشال خالص، مش محتاجينه هنا
  const showTotalValue = statusF !== "Delivered";
  const moneyBoxes = showMoney ? `
    ${showTotalValue ? `<div class="stat-box"><div class="num">${totalFinal.toLocaleString()}</div><div class="lbl">💰 إجمالي القيمة (EGP)</div></div>` : ""}

  ` : "";

  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-box"><div class="num">${items.length}</div><div class="lbl">📦 إجمالي المنتجات${items.length !== allProducts.filter(p=>p.status!=="Payment").length ? ' (مفلترة)' : ''}</div></div>

}

// ⏱️ تأخير بسيط (250ms) قبل ما البحث يشتغل فعليًا وإنت لسه بتكتب
// — بيقلل إعادة بناء القائمة كاملة مع كل حرف
function debounce(fn, delay){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}
const debouncedRenderList = debounce(renderList, 250);

function renderList(){
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  const statusF = document.getElementById("filterStatus").value;
  const arrivalF = document.getElementById("filterArrival").value;

  // 💰 صفوف "Payment" مش منتجات عميل — دي سجلات داخلية لتتبع
  // دفعات دفعة الوصول، ملهاش أي داعي تظهر للعميل خالص
  let items = allProducts.filter(p => p.status !== "Payment").slice().reverse(); // الأحدث الأول كأساس
  // 🔍 البحث بيقارن الطرفين بحروف صغيرة، فالبحث بموعد الوصول
  // بيشتغل سواء كتبته كابيتال أو سمول (27sep / 27SEP / O-27Sep)
  if(q) items = items.filter(p => (p.productName||"").toLowerCase().includes(q) || (p.link||"").toLowerCase().includes(q) || normArrival(p.arrivalDate).toLowerCase().includes(q));
  if(statusF) items = items.filter(p => p.status === statusF);
  // 🐞 كان بيقارن بالـindexOf على النص الخام والفلتر كان
  // <input type="date"> بيطلّع "2026-09-27" — ده عمره ما هيطابق
  // "O-27SEP2026"، يعني فلتر موعد الوصول كان ميّت تمامًا. دلوقتي
  // قايمة من المواعيد الفعلية، والمقارنة بعد التوحيد كابيتال
  if(arrivalF) items = items.filter(p => normArrival(p.arrivalDate) === normArrival(arrivalF));

  // 🔝 اللي محتاج ردك (بانتظار موافقتك) دايمًا فوق، والأحدث فوق جوه
  // نفس المجموعة (الـsort مستقر، فترتيب "الأحدث فوق" اللي عملناه
  // فوق بيتحافظ عليه جوه كل مجموعة من غير كود إضافي)
  // 🔝 اللي محتاج ردك دايمًا فوق (الأحدث إضافة فوق جواها). اللي
  // اتأكد بالفعل بيترتب حسب وقت آخر تحديث فعلي (بيتحدّث تلقائي
  // وقت ما تأكد الطلب) — آخر حاجة أكّدتها هي اللي تظهر فوق
  items.sort((a, b) => {
    const rankDiff = needsActionRank(a) - needsActionRank(b);
    if(rankDiff !== 0) return rankDiff;
    if(needsActionRank(a) === 1) return new Date(b.lastUpdated || 0) - new Date(a.lastUpdated || 0);
    return 0;
  });
  lastRenderedItems = items;

  // 💰 دفعات موعد الوصول اتشالت من items فوق، لكن لازم تتحسب في
  // إجمالي المدفوع/المتبقي — بنفس فلتر تاريخ الوصول لو مستخدم
  const paymentsTotal = allProducts
    .filter(p => p.status === "Payment")
    .filter(p => !arrivalF || normArrival(p.arrivalDate) === normArrival(arrivalF))
    .reduce((s,p)=> s + (parseFloat(p.deposit)||0), 0);

  renderStats(items, paymentsTotal, statusF); // ← نفس المجموعة المفلترة اللي هتتعرض تحت
  renderProducts(items);
  renderQuickChips();    // الشرايح السريعة تفضل مزامنة مع الفلتر والأعداد
  renderArrivalFilter(); // قايمة آخر 7 مواعيد وصول تفضل محدّثة
}

// 0 = محتاج ردك دلوقتي (بانتظار موافقتك)، 1 = الباقي
function needsActionRank(p){
  return p.status === "PendingApproval" ? 0 : 1;
}

        <div class="action-box">

          </div>

          <div class="row" style="margin-top:8px;">
            <button class="mini-btn btn-success" style="flex:1;min-width:96px;padding:9px 6px;" onclick="confirmProduct('${jid}')">✅ موافق</button>

            <button class="mini-btn btn-danger" style="flex:1;min-width:96px;padding:9px 6px;" onclick="rejectProduct('${jid}')">❌ إلغاء</button>
          </div>

function toggleCounter(id){
  const box = requireEl("counterBox-"+id); // 🐞 كان بيرمي null error لو الكارت اتبدّل
  if(!box) return;
  box.classList.toggle("hidden");
  const input = document.getElementById("counter-"+id);
  if(input && !box.classList.contains("hidden")) input.focus();
}

// 🔢 معاينة حية للإجمالي وإنت بتغيّر الكمية — بتوريك "الكمية ×
// سعر القطعة = الإجمالي" أول بأول قبل ما توافق أو تقترح سعر
function updateQtyPreview(id, unitPrice){
  const qtyEl = document.getElementById("qty-"+id);
  const previewEl = document.getElementById("qtyPreview-"+id);
  if(!qtyEl || !previewEl) return;
  const qty = parseInt(qtyEl.value) || 1;
  const total = qty * (parseFloat(unitPrice) || 0);
  previewEl.textContent = `= ${qty} × ${Number(unitPrice).toLocaleString()} = ${total.toLocaleString()} EGP إجمالي`;
}

/* 🐞 كل الدوال دي كانت بتقرا .value من عنصر من غير ما تتأكد إنه
   لسه موجود. أي إعادة رسم للقايمة (تحديث/بعد أكشن تاني) بتبدّل
   الكروت، فالعنصر القديم بيختفي و getElementById بترجع null →
   "Cannot read properties of null" والزرار بيموت لحد ما تعمل
   Refresh. دلوقتي بنتأكد الأول وبنطلب تحديث بدل ما نضرب */
function requireEl(id, msg){
  const el = document.getElementById(id);
  if(!el){ showToast(msg || "⚠️ القائمة اتحدّثت — جرّب تاني", "error"); loadProducts(); return null; }
  return el;
}
// 🐞 الـselector ده كان بيتبني بالـid الخام — id فيه " أو ] بيرمي
// SyntaxError من querySelector نفسها. CSS.escape بتأمّنه
function findActionBtn(fn, id){
  const sel = `button[onclick="${fn}('${String(id).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"]`;
  try{ return document.querySelector(sel); }catch(e){ return null; }
}

async function confirmProduct(id){
  const qtyEl = requireEl("qty-"+id);
  if(!qtyEl) return;
  const qty = Math.max(1, parseInt(qtyEl.value) || 1);
  const btn = findActionBtn("confirmProduct", id);
  setBtnLoading(btn, "جاري التأكيد...");
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"clientConfirm", passcode:getPasscode(), id, quantity:qty }) });
    const data = await res.json();
    if(data.success){
      confirmedThisSessionCount++;
      await loadProducts();
      // 🎉 لو مفيش منتج تاني لسه بانتظار موافقتك، يبقى خلصت "دفعة"
      // تأكيدات كاملة — نعرض بوب أب فيه اقتراح إرسال واتساب للأدمن
      const stillPending = allProducts.filter(p=>p.status==="PendingApproval").length;
      if(stillPending === 0 && confirmedThisSessionCount > 0) showConfirmDoneModal();
    }
    else { clearBtnLoading(btn); alert(data.message || "حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

// ❌ إلغاء المنتج المعروض عليك — بيتحوّل لـ"مرفوض" ومش هيظهرلك
// تاني كطلب مفتوح. فيه تأكيد قبل الإرسال عشان مايتعملش بالغلط
async function rejectProduct(id){
  if(!confirm("متأكد إنك عايز تلغي طلب المنتج ده؟")) return;
  const btn = findActionBtn("rejectProduct", id);
  setBtnLoading(btn, "جاري الإلغاء...");
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"clientReject", passcode:getPasscode(), id }) });
    const data = await res.json();
    if(data.success){ loadProducts(); }
    else { clearBtnLoading(btn); alert(data.message || "حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

async function sendCounter(id){
  const qtyEl = requireEl("qty-"+id);
  const counterEl = document.getElementById("counter-"+id);
  if(!qtyEl || !counterEl) return;
  const qty = Math.max(1, parseInt(qtyEl.value) || 1);
  const counterEgp = parseFloat(counterEl.value);
  if(!counterEgp || counterEgp <= 0){ alert("اكتب السعر المقترح (رقم أكبر من صفر)"); return; }
  const btn = findActionBtn("sendCounter", id);
  setBtnLoading(btn, "جاري الإرسال...");
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"clientCounter", passcode:getPasscode(), id, quantity:qty, counterEgp }) });
    const data = await res.json();
    if(data.success){ alert("✅ اتبعت عرضك، هيراجعه الفريق قريب"); loadProducts(); }
    else { clearBtnLoading(btn); alert(data.message || "حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر");
  }
}

// 🔁 إعادة طلب نفس المنتج (بعد ما اتوصّل قبل كده) — بناخد نفس
// الرابط/الاسم/الصورة المحفوظين ونبعتهم كطلب جديد تمامًا (زي لو
// العميل لصق اللينك تاني بنفسه)، فبيدخل الفريق يسعّره من الأول
// ويتأكد إن السعر على الموقع ماتغيرش، بدل ما نفترض إن السعر القديم
// لسه صحيح
async function reorderProduct(id, btn){
  const p = allProducts.find(x => String(x.id) === String(id));
  if(!p || !p.link){ alert("تعذر إيجاد بيانات المنتج ده"); return; }
  if(!confirm("هل تريد طلب نفس المنتج تاني؟ هيتبعت للفريق كطلب جديد عشان يراجعوا السعر الحالي على الموقع.")) return;

  setBtnLoading(btn, "جاري إرسال الطلب...");
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({
      action:"addLink", passcode:getPasscode(), link:p.link,
      productName:p.productName || "", imageUrl:p.imageUrl || ""
    })});
    const data = await res.json();
    clearBtnLoading(btn);
    if(data.success){ alert("✅ اتبعت طلب إعادة الشراء للفريق — هيراجعوا السعر الحالي ويرجعولك بيه قريب"); loadProducts(); }
    else { alert(data.message || "حصل خطأ"); }
  }catch(e){
    clearBtnLoading(btn);
    alert("تعذر الاتصال بالسيرفر — حاول تاني");
  }
}

/* ---------------------------------------------------------
   📊 تصدير CSV — بيصدّر بالظبط نفس المنتجات اللي شايفها دلوقتي
   (بعد أي بحث/فلترة). كله بيحصل في المتصفح، من غير أي طلب للسيرفر
   --------------------------------------------------------- */
function csvEscape(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(){
  if(!lastRenderedItems.length){ alert("مفيش منتجات ظاهرة دلوقتي عشان تتصدّر"); return; }
  const headers = ["اسم المنتج","الرابط","الحالة","سعر الوحدة EGP","الكمية","الإجمالي EGP","العربون EGP","المتبقي EGP","تاريخ الوصول"];
  const rows = lastRenderedItems.map(p => [
    p.productName, p.link, STATUS_META[p.status]?.label || p.status,
    p.staffEgp, p.quantity, p.finalEgp, p.deposit, Math.max(0, (parseFloat(p.finalEgp)||0) - (parseFloat(p.deposit)||0)), normArrival(p.arrivalDate)
  ].map(csvEscape).join(","));
  const csv = "\uFEFF" + headers.map(csvEscape).join(",") + "\n" + rows.join("\n"); // BOM عشان إكسل يفتح العربي صح
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rama-my-orders-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   💰 دفعات موعد الوصول (للعميل — عرض بس، من غير أي إضافة).
   نفس منطق حساب الأدمن بالظبط: كل موعد وصول قائم بذاته
   --------------------------------------------------------- */
// تنسيق تاريخ/وقت تسجيل الدفعة نفسها (مش موعد الوصول)
function formatPaymentDate(d){
  if(!d) return "";
  try{
    return new Date(d).toLocaleString("ar-EG", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
  }catch(e){ return ""; }
}

function getArrivalBatches(){
  const byDate = {};
  const ensure = (d) => { if(!byDate[d]) byDate[d] = { arrivalDate: d, total: 0, paidFromProducts: 0, payments: [] }; return byDate[d]; };

  allProducts.forEach(p => {
    // 🐞 كان بيجمّع على النص الخام — "O-27sep2026" و"O-27SEP2026"
    // كانوا بيتحسبوا موعدين منفصلين، فالإجمالي والمدفوع والمتبقي
    // بيتقسموا على كارتين بدل ما يبقوا موعد واحد صح
    const d = normArrival(p.arrivalDate);
    if(!d) return;
    if(p.status === "Payment"){
      ensure(d).payments.push(p);
      return;
    }
    if(!["Confirmed","Placed","Delayed","Delivered"].includes(p.status)) return;
    const b = ensure(d);
    b.total += parseFloat(p.finalEgp) || 0;
    b.paidFromProducts += parseFloat(p.deposit) || 0;
  });

  return Object.values(byDate)
    .filter(b => b.total > 0 || b.payments.length)
    .map(b => {
      const paidFromPayments = b.payments.reduce((s,p)=> s + (parseFloat(p.deposit)||0), 0);
      const paid = b.paidFromProducts + paidFromPayments;
      return Object.assign({}, b, { paidFromPayments, paid, remaining: b.total - paid });
    })
    // ترتيب بالتاريخ الفعلي مش أبجدي (أبجديًا 3OCT بييجي قبل 27SEP)
    .sort((a,b) => {
      const da = parseArrivalDate(a.arrivalDate), db = parseArrivalDate(b.arrivalDate);
      if(da && db) return db - da;
      if(da) return -1;
      if(db) return 1;
      return (b.arrivalDate||"").localeCompare(a.arrivalDate||"");
    });
}

function openPaymentsModal(){
  const batches = getArrivalBatches();
  if(!batches.length){
    showModal(`
      <h3 style="margin-bottom:10px;">💰 دفعات الوصول</h3>
      <div class="empty-hint">مفيش أي موعد وصول عليه منتجات مؤكدة أو دفعات مسجّلة لسه</div>
      <button class="btn-ghost btn-block" style="margin-top:12px;" onclick="closeModal()">إغلاق</button>
    `);
    return;
  }
  const cardsHtml = batches.map(b => `
    <div style="border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;text-align:right;">
      <div style="font-weight:900;color:var(--primary);margin-bottom:8px;">📅 ${escapeHtml(b.arrivalDate)}</div>
      <div class="meta-line">💰 الإجمالي: ${b.total.toLocaleString()} EGP</div>
      <div class="meta-line" style="color:var(--success);">✅ المدفوع: ${b.paid.toLocaleString()} EGP</div>
      <div class="meta-line" style="color:var(--danger);font-weight:800;">⏳ المتبقي: ${b.remaining.toLocaleString()} EGP</div>
      ${b.payments.length ? `
        <div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;">
          <div style="font-size:12px;color:var(--gray);font-weight:800;margin-bottom:6px;">سجل الدفعات:</div>
          ${b.payments.map(p => `
            <div style="font-size:12.5px;margin-bottom:6px;">
              <div>${fmtNum(p.deposit)} EGP${p.notes ? " — " + escapeHtml(p.notes) : ""}</div>
              <div style="font-size:11px;color:var(--gray);margin-top:2px;">🕒 ${formatPaymentDate(p.createdDate)}</div>
            </div>
          `).join("")}
        </div>` : ""
      }
    </div>
  `).join("");
  showModal(`
    <h3 style="margin-bottom:12px;">💰 دفعات الوصول</h3>
    <div style="max-height:420px;overflow-y:auto;">${cardsHtml}</div>
    <button class="btn-ghost btn-block" style="margin-top:8px;" onclick="closeModal()">إغلاق</button>
  `);
}
/* ---------------------------------------------------------
   🍞 تنبيه خفيف غير معطّل (Toast) — بديل عن alert() المزعج لأي
   خطأ اتصال/شبكة عابر، بيختفي لوحده من غير ما يحتاج منك تدوس
   "موافق". alert() لسه مستخدم بس للأخطاء اللي محتاجة منك تتصرف
   فيها فعليًا (بيانات ناقصة، إلخ)
   --------------------------------------------------------- */
function showToast(msg, type){
  // 🐞 #toastBox متكتوب في الـHTML *بعد* السكريبت، فأي toast بيتنده
  // عليه أثناء التحميل الأول كان بيلاقيه null ويختفي في صمت (رسائل
  // فشل الاتصال الأولى كانت بتضيع كده). دلوقتي بنعمله لو مش موجود
  let box = document.getElementById("toastBox");
  if(!box){
    box = document.createElement("div");
    box.id = "toastBox";
    box.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;";
    document.body.appendChild(box);
  }
  const el = document.createElement("div");
  el.textContent = msg;
  const isError = type === "error";
  el.style.cssText = `background:${isError?'#fef2f2':'#f0fdf4'};color:${isError?'var(--danger)':'var(--success)'};border:1px solid ${isError?'#fecaca':'#bbf7d0'};padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:90vw;transition:opacity .3s;`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3500);
}

/* ---------------------------------------------------------
   🔍 زرار البحث + فلاتر سريعة
   البحث بقى ليه زرار صريح (أصفر بنص أزرق) غير الكتابة الحية —
   بيشتغل كمان بـEnter، وبيلغي أي تأخير debounce فيدوّر على طول،
   وبينزلك على أول نتيجة. وبيوريك عدد النتائج
   --------------------------------------------------------- */
function doSearch(){
  const input = document.getElementById("searchInput");
  if(!input) return;
  renderList(); // فورًا، من غير انتظار الـ250ms بتاعة الكتابة الحية
  const q = input.value.trim();
  if(q){
    showToast(lastRenderedItems.length
      ? `🔍 ${lastRenderedItems.length} نتيجة لـ"${q}"`
      : `🔍 مفيش نتايج لـ"${q}"`, lastRenderedItems.length ? "success" : "error");
  }
  const list = document.getElementById("productsList");
  if(list) list.scrollIntoView({ behavior:"smooth", block:"start" });
}

function clearSearch(){
  const input = document.getElementById("searchInput");
  if(input){ input.value = ""; input.focus(); }
  renderList();
}

/* ⚡ فلاتر سريعة بضغطة واحدة بدل ما تفتح القايمة المنسدلة وتدوّر.
   عدد المنتجات جوه كل فلتر بيبان على الشريحة نفسها، فتعرف فيه إيه
   مستنيك من غير ما تضغط أصلاً */
const QUICK_FILTERS = [
  { key:"",                label:"📋 الكل" },
  { key:"PendingApproval", label:"🔔 محتاج ردك" },
  { key:"PendingPrice",    label:"⏳ بانتظار السعر" },
  { key:"Confirmed",       label:"✅ مؤكدة" },
  { key:"Delivered",       label:"🎉 اتسلّمت" }
];

function renderQuickChips(){
  const box = document.getElementById("quickChips");
  if(!box) return;
  const current = (document.getElementById("filterStatus") || {}).value || "";
  box.innerHTML = QUICK_FILTERS.map(f => {
    const n = f.key ? allProducts.filter(p => p.status === f.key).length
                    : allProducts.filter(p => p.status !== "Payment").length;
    return `<button class="chip${f.key === current ? " active" : ""}" onclick="applyQuickFilter('${jsAttr(f.key)}')">${f.label}${n ? ` (${n})` : ""}</button>`;
  }).join("");
}

function applyQuickFilter(key){
  const sel = document.getElementById("filterStatus");
  if(sel) sel.value = key;
  const arrival = document.getElementById("filterArrival");
  if(arrival) arrival.value = "";
  renderList();
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------------------------------------------------------
   🚀 بدء الجلسة — لازم يفضل آخر حاجة في السكريبت خالص عشان كل
   المتغيرات (let/const) اللي فوق تكون اتعرّفت فعلاً قبل ما ننده
   على أي دالة بتستخدمها
   --------------------------------------------------------- */
(async function initSession(){
  if(!getPasscode()) return;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainContent").classList.remove("hidden");
  renderCart();
  renderFromCache(); // ⚡ البيانات بتبان فورًا من نسخة المتصفح قبل ما الشبكة ترد
  renderQuickChips();
  const result = await loadProducts();
  if(result === "unauthorized"){
    clearPasscode();
    stopAutoRefresh();
    try{ localStorage.removeItem("rmaProductsCache"); }catch(e){}
    document.getElementById("mainContent").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
    const errBox = document.getElementById("loginError");
    errBox.textContent = "⚠️ انتهت صلاحية جلستك — سجّل دخول تاني";
    errBox.classList.remove("hidden");
  } else {
    startAutoRefresh();
  }
  // لو "network": سيبنا الصفحة زي ما هي، loadProducts نفسها بتعرض
  // رسالة خطأ الاتصال جوه productsList (والنسخة المحفوظة ظاهرة أصلاً)
})();
