<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY SHOPPY - Pro Dashboard v7.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f4f7f9; /* خلفية أهدى قليلاً */
            --surface: #ffffff;
            --text-main: #334155; /* لون نص ناعم بدل الأسود الصريح */
            --text-muted: #64748b;
            --border: #e2e8f0; /* حدود ناعمة جداً */
            --border-hover: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.04);
            --shadow-hover: 0 8px 25px rgba(0,0,0,0.06);
            --radius: 12px; /* حواف أكثر دوراناً */
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        /* Header Styles */
        header { 
            background: var(--surface); 
            padding: 15px 30px; 
            box-shadow: var(--shadow-sm); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        header h1::before { content: '🚀'; font-size: 1.5rem; }

        .btn-logout {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fee2e2;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo';
            transition: all 0.3s ease;
        }
        .btn-logout:hover { background: #fee2e2; transform: translateY(-1px); }

        .container { max-width: 98%; margin: 25px auto; padding: 0 10px; } 
        
        /* Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--surface); 
            padding: 22px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.7rem; font-weight: 800; color: var(--text-main); line-height: 1; }

        /* Control Panel */
        .control-panel {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .controls-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px dashed var(--border);
        }
        .controls-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .input-group { display: flex; gap: 12px; flex: 1; min-width: 250px; }
        
        input, select { 
            padding: 12px 18px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-family: 'Cairo'; 
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: var(--text-main);
            font-weight: 500;
        }
        input:focus, select:focus { 
            border-color: var(--primary); 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        button { font-family: 'Cairo'; font-weight: 700; cursor: pointer; border: none; transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        
        .btn-search { background: var(--primary); color: white; padding: 12px 28px; border-radius: 10px; }
        .btn-search:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }

        .btn-action { background: #334155; color: white; padding: 12px 22px; border-radius: 10px; }
        .btn-action.active { background: var(--warning); color: #000; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-print { background: #7c3aed; color: white; padding: 12px 22px; border-radius: 10px; }
        .btn-print:hover { background: #6d28d9; transform: translateY(-1px); }
        .btn-csv { background: #059669; color: white; padding: 12px 22px; border-radius: 10px; }
        .btn-csv:hover { background: #047857; transform: translateY(-1px); }

        /* Table - ناعم ومتباعد */
        .table-wrapper { 
            background: transparent; /* إزالة خلفية الحاوية لجعل الصفوف ككروت */
            box-shadow: none; 
            border: none;
            overflow-x: auto;
            max-height: 70vh; 
            padding-bottom: 20px;
        }
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0 12px; /* مسافة عمودية بين كل صف والتاني (شكل الكروت) */
            text-align: right; 
        }
        
        th { 
            background: transparent; 
            padding: 10px 24px; /* مسافات أفقية أوسع للأعمدة */
            color: var(--text-muted); 
            font-size: 0.85rem; 
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        
        /* تصميم صفوف الجدول كأنها كروت ناعمة */
        td { 
            padding: 18px 24px; /* مسافة أوسع داخل الخلايا لراحة العين */
            font-size: 0.9rem; 
            vertical-align: middle; 
            color: var(--text-main);
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        
        tr td:first-child { 
            border-right: 1px solid var(--border); 
            border-top-right-radius: 14px; 
            border-bottom-right-radius: 14px; 
        }
        tr td:last-child { 
            border-left: 1px solid var(--border); 
            border-top-left-radius: 14px; 
            border-bottom-left-radius: 14px; 
        }

        tr:hover td { 
            background: #f8fafc; 
            border-color: var(--border-hover);
        }
        /* إعطاء ظل خفيف للصف بالكامل عند الوقوف عليه */
        tr:hover td:first-child { box-shadow: 4px 4px 15px rgba(0,0,0,0.02); }

        /* --- حقول الإدخال الناعمة داخل الجدول --- */
        .price-input { 
            width: 95px; 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: #f8fafc; 
            font-weight: 700; 
            text-align: center; 
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        .price-input:focus { 
            background: #ffffff;
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .deposit-input { color: var(--danger); }
        .deposit-input:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

        /* Badges */
        .spec-badge { 
            background: #eef2ff; 
            color: #4338ca; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block; 
            margin: 2px 2px; 
        }
        
        .dim-text {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
            font-style: italic;
        }
        
        .end-price-cell { 
            font-weight: 900; 
            color: #059669; 
            font-size: 1.15rem; 
            background: #ecfdf5;
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #d1fae5;
            display: inline-block;
            min-width: 80px;
        }

        /* Status Select Soft */
        td select {
            padding: 10px 12px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            min-width: 150px;
            background: #f8fafc;
            font-weight: 600;
        }

        .btn-icon { 
            width: 38px; 
            height: 38px; 
            border-radius: 8px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0; 
            border: 1px solid transparent; 
            font-size: 1.1rem;
        }
        .btn-update { background: #dcfce7; color: #166534; }
        .btn-update:hover { background: #bbf7d0; transform: scale(1.05); }
        .btn-print-sm { background: #e0f2fe; color: #075985; }
        .btn-print-sm:hover { background: #bae6fd; transform: scale(1.05); }

        .link-btn { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.85rem; 
            background: #eef2ff;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .link-btn:hover { background: #e0e7ff; }

        @media (max-width: 768px) {
            .controls-row { flex-direction: column; align-items: stretch; }
            .input-group { flex-direction: column; }
            th, td { padding: 12px 15px; }
        }
    </style>
</head>
<body style="display:none;">

<script>
const SESSION_TIME = 2 * 60 * 60 * 1000;
const auth = localStorage.getItem("auth");
const loginTime = localStorage.getItem("loginTime");
const now = new Date().getTime();

if(auth === "true" && loginTime && (now - loginTime < SESSION_TIME)){
  document.body.style.display = "block";
}else{
  const password = prompt("Enter Password:");
  if(password === "945992"){
    localStorage.setItem("auth","true");
    localStorage.setItem("loginTime", now);
    document.body.style.display = "block";
  }else{
    document.body.innerHTML="<div style='display:flex;height:100vh;justify-content:center;align-items:center;flex-direction:column;color:#ef4444;font-family:sans-serif;'><h1>🚫 Access Denied</h1><p>Incorrect Password</p></div>";
  }
}
</script>

<header>
    <h1>TRY SHOPPY <span style="font-size:0.7em; opacity:0.6; font-weight:400; margin-right:10px;">Pro Dashboard v7.1</span></h1>
    <button onclick="logout()" class="btn-logout">تسجيل الخروج</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card" style="border-right: 4px solid var(--primary);">
            <h3>إجمالي المبيعات (EGP)</h3>
            <div id="totalEGP" class="value">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid var(--success);">
            <h3>صافي التحصيل (End Price)</h3>
            <div id="totalNet" class="value" style="color:var(--success)">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid var(--warning);">
            <h3>عدد الشحنات</h3>
            <div id="totalCount" class="value">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid #6366f1;">
            <h3>التكلفة (USD)</h3>
            <div id="totalUSD" class="value">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid #16a34a;">
            <h3>أرباح الطلبات (Profit)</h3>
            <div id="totalProfit" class="value" style="color:#16a34a">0</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="controls-row">
            <div class="input-group" style="flex: 2;">
                <input id="searchInput" placeholder="🔍 بحث سريع (اسم، موبايل، رقم طلب)...">
                <input id="searchArrival" placeholder="🔎 بحث بموعد الوصول">
               <button class="btn-search" onclick="applyFilters()">بحث</button>
            </div>
            <div class="input-group">
                <input type="date" id="dateFrom" title="من تاريخ">
                <span style="align-self:center; color:#94a3b8; font-weight:bold;">إلى</span>
                <input type="date" id="dateTo" title="إلى تاريخ">
            </div>
            <div class="input-group">
                <select id="searchStatus">
                    <option value="">📂 كل الحالات</option>
                    <option value="Pending Review">Pending Review</option>
                    <option value="Confirmed Via Try">Confirmed Via Try</option>
                    <option value="Placed">Placed</option>
                    <option value="Processing">Processing</option>
                    <option value="Arrived USA HUB">Arrived USA HUB</option>
                    <option value="Arrived Cairo HUB">Arrived Cairo HUB</option>
                    <option value="Shipped To You">Shipped To You</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Delayed">Delayed</option>
                    <option value="Canceled">Canceled</option>
                </select>
                <button class="btn-search" onclick="applyFilters()">بحث</button>
            </div>
        </div>

        <div class="controls-row" style="justify-content: space-between;">
            <div class="input-group">
                <select id="bulkStatus" style="max-width: 220px;">
                    <option value="">⚡ تغيير حالة المحدد...</option>
                    <option value="Pending Review">Pending Review</option>
                    <option value="Confirmed Via Try">Confirmed Via Try</option>
                    <option value="Placed">Placed</option>
                    <option value="Processing">Processing</option>
                    <option value="Arrived Cairo HUB">Arrived Cairo HUB</option>
                    <option value="Shipped To You">Shipped To You</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Canceled">Canceled</option>
                    <option value="Delayed">Delayed</option>
                </select>
                <button class="btn-action" onclick="applyBulkStatus()">تطبيق الحالة</button>
            </div>

            <div style="display:flex; gap:12px;">
                <button id="groupBtn" class="btn-action" onclick="toggleGrouping()">🔄 تجميع الطلبات</button>
                <button class="btn-print" onclick="printAllDisplayed()">🖨️ طباعة الجدول</button>
                <button class="btn-csv" onclick="exportCSV()">⬇️ CSV</button>	
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="checkAll" onclick="toggleAll(this)" style="width:18px;height:18px;"></th>
                    <th>رقم الطلب / التاريخ</th>
                    <th>العميل</th>
                    <th>المواصفات (الوصف/الأبعاد)</th>
                    <th style="text-align:center;">الإجمالي (EGP)</th>
                    <th style="text-align:center;">العربون</th>
                    <th style="text-align:center;">الصافي (تحصيل)</th>
                    <th style="text-align:center;">التكلفة (USD)</th>
                    <th>رقم الوصول</th>
                    <th>الحالة</th>
                    <th style="text-align:center;">حفظ</th>
                    <th style="text-align:center;">طباعة</th>
                    <th style="text-align:center;">لينك</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzy9-1BfmMJZhCtwiEoIfdzWCFPcWW3CkhfJIRdWo8eyl1Z6tSWK8xHxoAw2cxKDaosrw/exec";
let ordersData = [];
let currentFilteredData = [];
let isGrouped = false;

async function loadData() {
    try {
        const res = await fetch(scriptURL, { redirect: 'follow' });
        ordersData = await res.json();
        applyFilters(); 
    } catch(e) { console.error("Data Load Error", e); }
}

function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    data.forEach(o => {
        const cur = o.status || "Pending Review";
        const printPhone = o.phone ? o.phone.toString().replace(/\s/g, '') : '';
        const printOrder = o.order ? o.order.toString().split(' + ')[0] : 'N/A';
        
        const qty = isGrouped ? o.totalQty : (o.quantity || 1);
        const weight = parseFloat(isGrouped ? o.totalWeight : (o.weight || 0)).toFixed(2);
        const dims = isGrouped ? "متعددة" : (o.dimensions || "غير محددة");

        const ship = isGrouped ? (parseFloat(o.totalShipping) || 0) : (parseFloat(o.shipping) || 0);
        const finalP = parseFloat(o.finalPrice || 0);
        const dep = parseFloat(o.deposit || 0);
        const endP = finalP + ship - dep;

        let statusColor = "#e2e8f0";
        if(cur.includes("Delivered")) statusColor = "var(--success)";
        if(cur.includes("Canceled")) statusColor = "var(--danger)";
        if(cur.includes("Pending")) statusColor = "var(--warning)";

        tbody.innerHTML += `<tr>
            <td><input type="checkbox" class="row-check" value="${printOrder}" style="width:18px;height:18px;"></td>
            <td>
                <span style="font-weight:800; color:var(--primary); font-size:1.05rem;">${o.order}</span>
                ${o.date ? `<div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">📅 ${new Date(o.date).toISOString().split('T')[0]}</div>` : ``}
            </td>
            <td>
                <div style="font-weight:700; font-size:0.95rem;">${o.customerName}</div>
                <div style="font-size:0.85rem; color:#64748b; margin-top:4px;">📱 ${o.phone}</div>
            </td>
            <td>
                <span class="spec-badge">x${qty}</span>
                <span class="spec-badge">${weight} gm</span>
                <div class="dim-text">📦 ${dims}</div>
            </td>
            <td style="text-align:center;"><input type="number" id="egp-${printOrder}" class="price-input" value="${finalP}" placeholder="EGP"></td>
            <td style="text-align:center;"><input type="number" id="deposit-${printOrder}" class="price-input deposit-input" value="${dep}" placeholder="0"></td>
            <td style="text-align:center;"><div class="end-price-cell">${endP.toLocaleString()}</div></td>
            <td style="text-align:center;"><input type="number" id="usd-${printOrder}" class="price-input" value="${parseFloat(o.usd || 0).toFixed(2)}" style="color:#6366f1"></td>
            <td>
                <input type="text"
                       id="arrival-${printOrder}"
                       class="price-input"
                       value="${o.arrivaldate || ''}"
                       placeholder="موعد الوصول"
                       style="width: 110px;">
            </td>
            <td>
                <select id="status-${printOrder}" style="border-right: 4px solid ${statusColor}">
                    <option value="Pending Review" ${cur==='Pending Review'?'selected':''}>Pending Review</option>
					<option value="Confirmed Via Try" ${cur==='Confirmed Via Try'?'selected':''}>Confirmed Via Try</option>
					<option value="Placed" ${cur==='Placed'?'selected':''}>Placed</option>
                    <option value="Processing" ${cur==='Processing'?'selected':''}>Processing</option>
					<option value="Arrived Cairo HUB" ${cur==='Arrived Cairo HUB'?'selected':''}>Arrived Cairo HUB</option>
                    <option value="Shipped To You" ${cur==='Shipped To You'?'selected':''}>Shipped To You</option>
                    <option value="Delivered" ${cur==='Delivered'?'selected':''}>Delivered</option>
					<option value="Canceled" ${cur==='Canceled'?'selected':''}>Canceled</option>
                    <option value="Delayed" ${cur==='Delayed'?'selected':''}>Delayed</option>
                </select>
            </td>
            <td style="text-align:center;"><button class="btn-icon btn-update" onclick="updateOrder('${printOrder}')" title="حفظ التعديلات">💾</button></td>
            <td style="text-align:center;"><button class="btn-icon btn-print-sm" onclick="printLabel('${printPhone}', '${printOrder}')" title="طباعة بوليصة">📄</button></td>
            <td style="text-align:center;">${o.link ? `<a href="${o.link}" target="_blank" class="link-btn">رابط</a>` : '<span style="color:#cbd5e1">-</span>'}</td>
        </tr>`;
    });
}

function applyFilters() {
     const arrivalSearch = document.getElementById("searchArrival").value.toLowerCase();
       const from = document.getElementById("dateFrom").value;
    const to = document.getElementById("dateTo").value;
    const search = document.getElementById("searchInput").value.toLowerCase();
    const status = document.getElementById("searchStatus").value;
    const USD_RATE = 50; 

    let filtered = ordersData.filter(o => {
        const d = o.date ? new Date(o.date).toISOString().split('T')[0] : "";
        const dateMatch = (!from || d >= from) && (!to || d <= to);
        const cleanOrder = String(o.order || "").toLowerCase().replace(/\s/g, "");

const searchMatch =
    (o.customerName || "").toLowerCase().includes(search) ||
    (o.phone || "").toString().includes(search) ||
    cleanOrder.includes(search.replace(/\s/g, ""));
        const statusMatch = !status || o.status === status;
        const arrivalMatch = !arrivalSearch ||
    (o.arrivaldate || "").toString().toLowerCase().includes(arrivalSearch);

return dateMatch && searchMatch && statusMatch && arrivalMatch;
    });
    
    filtered = filtered.reverse();

    if (isGrouped) {
        const groups = {};
        filtered.forEach(o => {
            const key = o.phone ? o.phone.toString().replace(/\s/g, '') : 'Unknown';
            if (!groups[key]) {
                groups[key] = { 
                    ...o, order: [o.order], 
                    totalQty: parseInt(o.quantity || 1), 
                    totalWeight: parseFloat(o.weight || 0), 
                    totalShipping: parseFloat(o.shipping || 0),
                    finalPrice: parseFloat(o.finalPrice || 0), 
                    deposit: parseFloat(o.deposit || 0),
                    usd: parseFloat(o.usd || 0) 
                };
            } else {
                groups[key].order.push(o.order);
                groups[key].totalQty += parseInt(o.quantity || 1);
                groups[key].totalWeight += parseFloat(o.weight || 0);
                groups[key].totalShipping += parseFloat(o.shipping || 0);
                groups[key].finalPrice += parseFloat(o.finalPrice || 0);
                groups[key].deposit += parseFloat(o.deposit || 0);
                groups[key].usd += parseFloat(o.usd || 0);
            }
        });
        filtered = Object.values(groups).map(g => ({ ...g, order: g.order.join(' + ') }));
    }
	
    const totalEGP = filtered.reduce((a,b) => a + parseFloat(b.finalPrice || 0), 0);
    const totalUSD = filtered.reduce((a,b) => a + parseFloat(b.usd || 0), 0);
    const totalNet = filtered.reduce((a,b) => {
        const ship = isGrouped ? (parseFloat(b.totalShipping)||0) : (parseFloat(b.shipping)||0);
        return a + (parseFloat(b.finalPrice||0) + ship - parseFloat(b.deposit||0));
    }, 0);
    const totalProfit = totalEGP - (totalUSD * USD_RATE);
    
    document.getElementById("totalEGP").innerText = totalEGP.toLocaleString() + " EGP";
    document.getElementById("totalUSD").innerText = totalUSD.toLocaleString() + " $";
    document.getElementById("totalNet").innerText = totalNet.toLocaleString() + " ج.م";
    document.getElementById("totalProfit").innerText = totalProfit.toLocaleString() + " ج.م";
    document.getElementById("totalCount").innerText = filtered.length;
    
    currentFilteredData = filtered; 
    renderTable(filtered);
}

function toggleGrouping() {
    isGrouped = !isGrouped;
    const btn = document.getElementById("groupBtn");
    if(isGrouped) {
        btn.innerHTML = "🚫 فك التجميع";
        btn.classList.add("active");
    } else {
        btn.innerHTML = "🔄 تجميع الطلبات";
        btn.classList.remove("active");
    }
    applyFilters(); 
}

function updateOrder(orderId) {
    const newStatus = document.getElementById(`status-${orderId}`).value;
    const newEGP = document.getElementById(`egp-${orderId}`).value;
    const newUSD = document.getElementById(`usd-${orderId}`).value;
    const newDeposit = document.getElementById(`deposit-${orderId}`).value;
       const newArrival = document.getElementById(`arrival-${orderId}`).value;

    const btn = document.querySelector(`button[onclick="updateOrder('${orderId}')"]`);
    const originalText = btn.innerHTML;
    btn.innerHTML = "⏳";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ 
            action: "updateStatus", 
            order: orderId, 
            status: newStatus,
            finalPrice: newEGP,
            usd: newUSD,
            deposit: newDeposit,
                   arrivaldate: newArrival
        })
    }).then(() => {
        alert("تم تحديث الطلب #" + orderId);
        btn.innerHTML = originalText;
        loadData();
    });
}

function getBarcodeScript() {
    return `
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
    <script>
        window.addEventListener('load', function () {
            document.querySelectorAll('svg.barcode').forEach(function (svg) {
                var val = svg.getAttribute('data-barcode');
                if (!val) return;
                try {
                    JsBarcode(svg, val, {
                        format:       'CODE128',
                        width:        2.2,
                        height:       55,
                        displayValue: true,
                        fontSize:     12,
                        margin:       5,
                        background:   'transparent',
                        lineColor:    '#000',
                        font:         "Cairo, Tahoma, Arial"
                    });
                } catch (e) {
                    svg.closest('.bc-wrap').style.display = 'none';
                }
            });
            setTimeout(function () { window.print(); }, 450);
        });
    <\/script>`;
}

function printLabel(phone, orderId) {
    const subset  = ordersData.filter(
        x => x.phone && x.phone.toString().replace(/\s/g, '') === phone
    );
    let toPrint = isGrouped
        ? currentFilteredData.find(x => x.phone.toString().replace(/\s/g, '') === phone)
        : subset.find(x => x.order.toString() === orderId.toString());

    if (!toPrint) return;

    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html>
        <html dir="rtl" lang="ar">
        <head><meta charset="UTF-8">${getLabelStyles()}</head>
        <body>
            ${generateLabelHTML(toPrint)}
            ${getBarcodeScript()}
        </body></html>`);
    win.document.close();
}

function exportCSV(){
        let csv = '\uFEFF'; // BOM لدعم العربية
        csv += "اسم العميل,العنوان,رقم التليفون,إجمالي الأوردر,المدفوع,المطلوب عند الاستلام\n";

        currentFilteredData.forEach(o => {
            const finalP = parseFloat(o.finalPrice) || 0;
            const ship = parseFloat(o.shipping) || 0;
            const dep = parseFloat(o.deposit) || 0;
            const net = finalP + ship - dep;

            // تنظيف النصوص من الفواصل
            const name = (o.customerName || "").replace(/,/g, " ");
            const address = (o.address || "").replace(/,/g, " - ") + " " + (o.governorate || "");
            const phone = (o.phone || "").toString().replace(/,/g, ""); 

            csv += `"${name}","${address}","${phone}","${finalP}","${dep}","${net}"\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "TryShoppy_Orders_" + new Date().toISOString().slice(0,10) + ".csv";
        link.click();
    }
