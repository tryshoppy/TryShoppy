<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY SHOPPY - Pro Dashboard v7.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1; /* جعلت الحدود أغمق قليلاً للوضوح */
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 10px;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        /* Header Styles */
        header { 
            background: var(--surface); 
            padding: 15px 30px; 
            box-shadow: var(--shadow-sm); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        header h1::before { content: '🚀'; font-size: 1.5rem; }

        .btn-logout {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo';
            transition: 0.2s;
        }
        .btn-logout:hover { background: #fecaca; }

        .container { max-width: 98%; margin: 25px auto; padding: 0 10px; } 
        
        /* Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.6rem; font-weight: 800; color: var(--text-main); line-height: 1; }

        /* Control Panel */
        .control-panel {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border);
        }
        .controls-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .input-group { display: flex; gap: 10px; flex: 1; min-width: 250px; }
        
        input, select { 
            padding: 10px 15px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: 'Cairo'; 
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
        }
        input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { font-family: 'Cairo'; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-search { background: var(--primary); color: white; padding: 10px 25px; border-radius: 8px; }
        .btn-search:hover { background: var(--primary-hover); }

        .btn-action { background: var(--text-main); color: white; padding: 10px 20px; border-radius: 8px; }
        .btn-action.active { background: var(--warning); color: #000; }
        .btn-action:hover { opacity: 0.9; }

        .btn-print { background: #7c3aed; color: white; padding: 10px 20px; border-radius: 8px; }
        .btn-csv { background: #059669; color: white; padding: 10px 20px; border-radius: 8px; }

        /* Table */
        .table-wrapper { 
            background: var(--surface); 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-md); 
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 70vh; 
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: right; }
        
        th { 
            background: #f1f5f9; 
            padding: 15px; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        
        td { 
            padding: 12px 15px; 
            border-bottom: 1px solid var(--border); 
            font-size: 0.9rem; 
            vertical-align: middle; 
            color: var(--text-main);
            transition: background 0.1s;
        }
        
        tr:hover td { background: #f8fafc; }
        tr:last-child td { border-bottom: none; }

        /* --- تعديل الحقول لتكون واضحة كحقول إدخال --- */
        .price-input { 
            width: 90px; 
            padding: 8px; 
            border: 1px solid #cbd5e1; /* حدود واضحة */
            border-radius: 6px; 
            background: #ffffff; /* خلفية بيضاء */
            font-weight: bold; 
            text-align: center; 
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); /* ظل خفيف */
            transition: all 0.2s ease;
        }
        .price-input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .deposit-input { color: var(--danger); border-color: #fecaca; background: #fff5f5; }
        .deposit-input:focus { border-color: var(--danger); }

        /* Badges */
        .spec-badge { 
            background: #e0e7ff; 
            color: #3730a3; 
            padding: 2px 8px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block; 
            margin: 2px 0; 
        }
        
        .dim-text {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
            font-style: italic;
        }
        
        .end-price-cell { 
            font-weight: 900; 
            color: var(--success); 
            font-size: 1.1rem; 
            background: #ecfdf5;
            padding: 5px 10px !important;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #d1fae5;
        }

        /* Status Select */
        td select {
            padding: 6px;
            font-size: 0.85rem;
            border-color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            min-width: 140px;
            background: #fff;
        }

        .btn-icon { width: 34px; height: 34px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; }
        .btn-update { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .btn-update:hover { background: #bbf7d0; }
        .btn-print-sm { background: #e0f2fe; color: #075985; border-color: #bae6fd; }
        .btn-print-sm:hover { background: #bae6fd; }

        .link-btn { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.8rem; 
            background: #eef2ff;
            padding: 5px 10px;
            border-radius: 6px;
            display: inline-block;
            border: 1px solid #c7d2fe;
        }
        .link-btn:hover { background: #e0e7ff; }

        @media (max-width: 768px) {
            .controls-row { flex-direction: column; align-items: stretch; }
            .input-group { flex-direction: column; }
        }
    </style>
</head>

<header>
    <h1>TRY SHOPPY <span style="font-size:0.7em; opacity:0.6; font-weight:400; margin-right:10px;">Pro Dashboard v7.1</span></h1>
    <button onclick="logout()" class="btn-logout">تسجيل الخروج</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card" style="border-right: 4px solid var(--primary);">
            <h3>إجمالي المبيعات (EGP)</h3>
            <div id="totalEGP" class="value">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid var(--success);">
            <h3>صافي التحصيل (End Price)</h3>
            <div id="totalNet" class="value" style="color:var(--success)">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid var(--warning);">
            <h3>عدد الشحنات</h3>
            <div id="totalCount" class="value">0</div>
        </div>
        <div class="stat-card" style="border-right: 4px solid #6366f1;">
            <h3>التكلفة (USD)</h3>

        </div>
        <div class="stat-card" style="border-right: 4px solid #16a34a;">

    <div class="control-panel">
        <div class="controls-row">
            <div class="input-group" style="flex: 2;">
                <input id="searchInput" placeholder="🔍 بحث سريع (اسم، موبايل، رقم طلب)...">
            </div>
            <div class="input-group">
                <input type="date" id="dateFrom" title="من تاريخ">

                <input type="date" id="dateTo" title="إلى تاريخ">

            <div class="input-group">

                    <option value="Placed">Placed</option>

                    <option value="Arrived USA HUB">Arrived USA HUB</option>
                    <option value="Arrived Cairo HUB">Arrived Cairo HUB</option>
                    <option value="Shipped To You">Shipped To You</option>
                    <option value="Delivered">Delivered</option>

                <button class="btn-search" onclick="applyFilters()">بحث</button>
            </div>
        </div>

        <div class="controls-row" style="justify-content: space-between;">
            <div class="input-group">
                <select id="bulkStatus" style="max-width: 200px;">
                    <option value="">⚡ تغيير حالة المحدد...</option>
                    <option value="Pending Review">Pending Review</option>
                    <option value="Confirmed Via Try">Confirmed Via Try</option>
                    <option value="Placed">Placed</option>
                    <option value="Processing">Processing</option>
                    <option value="Arrived Cairo HUB">Arrived Cairo HUB</option>
                    <option value="Shipped To You">Shipped To You</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Canceled">Canceled</option>
                    <option value="Delayed">Delayed</option>
                </select>
                <button class="btn-action" onclick="applyBulkStatus()">تطبيق الحالة</button>

            <div style="display:flex; gap:10px;">
                <button id="groupBtn" class="btn-action" onclick="toggleGrouping()">🔄 تجميع الطلبات</button>
                <button class="btn-print" onclick="printAllDisplayed()">🖨️ طباعة الجدول</button>
                <button class="btn-csv" onclick="exportCSV()">⬇️ CSV</button>	
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                    <th>رقم الطلب / التاريخ</th>

                    <th>المواصفات (الوصف/الأبعاد)</th>
                    <th>الإجمالي (EGP)</th>
                    <th>العربون</th>
                    <th>الصافي (تحصيل)</th>
                    <th>التكلفة (USD)</th>
                    <th>الحالة</th>
                    <th>حفظ</th>
                    <th>طباعة</th>
                    <th>لينك</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycby-HrSH3DwpAPJAuhiAPlBJAngy-_qUZ7-O925hTA7FnbBVHkrjprfJavEA-WKyofIdlg/exec";
let ordersData = [];
let currentFilteredData = [];
let isGrouped = false;

async function loadData() {
    try {
        const res = await fetch(scriptURL, { redirect: 'follow' });
        ordersData = await res.json();
        applyFilters(); 
    } catch(e) { console.error("Data Load Error", e); }
}

function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    data.forEach(o => {
        const cur = o.status || "Pending Review";
        const printPhone = o.phone ? o.phone.toString().replace(/\s/g, '') : '';
        const printOrder = o.order ? o.order.toString().split(' + ')[0] : 'N/A';
        
        const qty = isGrouped ? o.totalQty : (o.quantity || 1);
        const weight = parseFloat(isGrouped ? o.totalWeight : (o.weight || 0)).toFixed(2);
        // هنا تم إعادة الأبعاد/الوصف
        const dims = isGrouped ? "متعددة" : (o.dimensions || "غير محددة");

        const ship = isGrouped ? (parseFloat(o.totalShipping) || 0) : (parseFloat(o.shipping) || 0);
        const finalP = parseFloat(o.finalPrice || 0);
        const dep = parseFloat(o.deposit || 0);
        const endP = finalP + ship - dep;

        let statusColor = "#333";
        if(cur.includes("Delivered")) statusColor = "var(--success)";
        if(cur.includes("Canceled")) statusColor = "var(--danger)";
        if(cur.includes("Pending")) statusColor = "var(--warning)";

        tbody.innerHTML += `<tr>
            <td><input type="checkbox" class="row-check" value="${printOrder}"></td>
            <td>
                <span style="font-weight:800; color:var(--primary);">${o.order}</span>
                ${o.date ? `<div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">📅 ${new Date(o.date).toISOString().split('T')[0]}</div>` : ``}
            </td>
            <td>
                <div style="font-weight:700;">${o.customerName}</div>
                <div style="font-size:0.8rem; color:#64748b; margin-top:2px;">📱 ${o.phone}</div>
            </td>
            <td>
                <span class="spec-badge">x${qty}</span>
                <span class="spec-badge">${weight} gm</span>
                <div class="dim-text">📦 ${dims}</div>
            </td>
            <td><input type="number" id="egp-${printOrder}" class="price-input" value="${finalP}" placeholder="EGP"></td>
            <td><input type="number" id="deposit-${printOrder}" class="price-input deposit-input" value="${dep}" placeholder="0"></td>
            <td><div class="end-price-cell">${endP.toLocaleString()}</div></td>
            <td><input type="number" id="usd-${printOrder}" class="price-input" value="${parseFloat(o.usd || 0).toFixed(2)}" style="color:#6366f1"></td>
            <td>
                <select id="status-${printOrder}" style="border-left: 3px solid ${statusColor}">
                    <option value="Pending Review" ${cur==='Pending Review'?'selected':''}>Pending Review</option>
					<option value="Confirmed Via Try" ${cur==='Confirmed Via Try'?'selected':''}>Confirmed Via Try</option>
					<option value="Placed" ${cur==='Placed'?'selected':''}>Placed</option>
                    <option value="Processing" ${cur==='Processing'?'selected':''}>Processing</option>
					<option value="Arrived Cairo HUB" ${cur==='Arrived Cairo HUB'?'selected':''}>Arrived Cairo HUB</option>
                    <option value="Shipped To You" ${cur==='Shipped To You'?'selected':''}>Shipped To You</option>
                    <option value="Delivered" ${cur==='Delivered'?'selected':''}>Delivered</option>
					<option value="Canceled" ${cur==='Canceled'?'selected':''}>Canceled</option>
                    <option value="Delayed" ${cur==='Delayed'?'selected':''}>Delayed</option>
                </select>
            </td>
            <td style="text-align:center;"><button class="btn-icon btn-update" onclick="updateOrder('${printOrder}')" title="حفظ التعديلات">💾</button></td>
            <td style="text-align:center;"><button class="btn-icon btn-print-sm" onclick="printLabel('${printPhone}', '${printOrder}')" title="طباعة بوليصة">📄</button></td>
            <td style="text-align:center;">${o.link ? `<a href="${o.link}" target="_blank" class="link-btn">رابط</a>` : '<span style="color:#ccc">-</span>'}</td>
        </tr>`;
    });
}

function applyFilters() {
    const from = document.getElementById("dateFrom").value;
    const to = document.getElementById("dateTo").value;
    const search = document.getElementById("searchInput").value.toLowerCase();
    const status = document.getElementById("searchStatus").value;
    const USD_RATE = 50; 

    let filtered = ordersData.filter(o => {
        const d = o.date ? new Date(o.date).toISOString().split('T')[0] : "";
        const dateMatch = (!from || d >= from) && (!to || d <= to);
        const searchMatch = (o.customerName||"").toLowerCase().includes(search) || 
                            (o.phone||"").toString().includes(search) || 
                            (o.order||"").toString().toLowerCase().includes(search);
        const statusMatch = !status || o.status === status;
        return dateMatch && searchMatch && statusMatch;
    });
    
    filtered = filtered.reverse();

    if (isGrouped) {
        const groups = {};
        filtered.forEach(o => {
            const key = o.phone ? o.phone.toString().replace(/\s/g, '') : 'Unknown';
            if (!groups[key]) {
                groups[key] = { 
                    ...o, order: [o.order], 
                    totalQty: parseInt(o.quantity || 1), 
                    totalWeight: parseFloat(o.weight || 0), 
                    totalShipping: parseFloat(o.shipping || 0),
                    finalPrice: parseFloat(o.finalPrice || 0), 
                    deposit: parseFloat(o.deposit || 0),
                    usd: parseFloat(o.usd || 0) 
                };
            } else {
                groups[key].order.push(o.order);
                groups[key].totalQty += parseInt(o.quantity || 1);
                groups[key].totalWeight += parseFloat(o.weight || 0);
                groups[key].totalShipping += parseFloat(o.shipping || 0);
                groups[key].finalPrice += parseFloat(o.finalPrice || 0);
                groups[key].deposit += parseFloat(o.deposit || 0);
                groups[key].usd += parseFloat(o.usd || 0);
            }
        });
        filtered = Object.values(groups).map(g => ({ ...g, order: g.order.join(' + ') }));
    }
	
    const totalEGP = filtered.reduce((a,b) => a + parseFloat(b.finalPrice || 0), 0);
    const totalUSD = filtered.reduce((a,b) => a + parseFloat(b.usd || 0), 0);
    const totalNet = filtered.reduce((a,b) => {
        const ship = isGrouped ? (parseFloat(b.totalShipping)||0) : (parseFloat(b.shipping)||0);
        return a + (parseFloat(b.finalPrice||0) + ship - parseFloat(b.deposit||0));
    }, 0);
    const totalProfit = totalEGP - (totalUSD * USD_RATE);
    
    document.getElementById("totalEGP").innerText = totalEGP.toLocaleString() + " EGP";
    document.getElementById("totalUSD").innerText = totalUSD.toLocaleString() + " $";
    document.getElementById("totalNet").innerText = totalNet.toLocaleString() + " ج.م";
    document.getElementById("totalProfit").innerText = totalProfit.toLocaleString() + " ج.م";
    document.getElementById("totalCount").innerText = filtered.length;
    
    currentFilteredData = filtered; 
    renderTable(filtered);
}

function toggleGrouping() {
    isGrouped = !isGrouped;
    const btn = document.getElementById("groupBtn");
    if(isGrouped) {
        btn.innerHTML = "🚫 فك التجميع";
        btn.classList.add("active");
    } else {
        btn.innerHTML = "🔄 تجميع الطلبات";
        btn.classList.remove("active");
    }
    applyFilters(); 
}

function updateOrder(orderId) {
    const newStatus = document.getElementById(`status-${orderId}`).value;
    const newEGP = document.getElementById(`egp-${orderId}`).value;
    const newUSD = document.getElementById(`usd-${orderId}`).value;
    const newDeposit = document.getElementById(`deposit-${orderId}`).value; 

    const btn = document.querySelector(`button[onclick="updateOrder('${orderId}')"]`);
    const originalText = btn.innerHTML;
    btn.innerHTML = "⏳";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ 
            action: "updateStatus", 
            order: orderId, 
            status: newStatus,
            finalPrice: newEGP,
            usd: newUSD,
            deposit: newDeposit 
        })
    }).then(() => {
        alert("تم تحديث الطلب #" + orderId);
        btn.innerHTML = originalText;
        loadData();
    });
}

function generateLabelHTML(data, isBulk = false) {
    const ship = isGrouped ? (parseFloat(data.totalShipping) || 0) : (parseFloat(data.shipping) || 0);
    const finalP = parseFloat(data.finalPrice || 0);
    const dep = parseFloat(data.deposit || 0);
    const endP = finalP + ship - dep;
    const totalW = parseFloat(data.totalWeight || data.weight || 0).toFixed(2);
    const totalQ = data.totalQty || data.quantity || 1;

    return `
        <div class="card" style="${isBulk ? 'page-break-after: always;' : ''}">
            <div class="top">
                <div class="logo">TRY SHOPPY</div>
                <div style="font-size: 10pt; text-align: center; border: 1px solid #000; padding: 5px;">AIRWAY BILL<br>OFFICIAL</div>
            </div>
            <div class="info">
                <span>إلى السيد/ة:</span>
                <b>${data.customerName}</b>
                📍 ${data.governorate} - ${data.address}<br>

function exportCSV(){
        let csv = '\uFEFF'; // BOM لدعم العربية
        csv += "اسم العميل,العنوان,رقم التليفون,إجمالي الأوردر,المدفوع,المطلوب عند الاستلام\n";

        currentFilteredData.forEach(o => {
            const finalP = parseFloat(o.finalPrice) || 0;
            const ship = parseFloat(o.shipping) || 0;
            const dep = parseFloat(o.deposit) || 0;
            const net = finalP + ship - dep;

            // تنظيف النصوص من الفواصل
            const name = (o.customerName || "").replace(/,/g, " ");
            const address = (o.address || "").replace(/,/g, " - ") + " " + (o.governorate || "");
            const phone = (o.phone || "").toString().replace(/,/g, ""); 

            csv += `"${name}","${address}","${phone}","${finalP}","${dep}","${net}"\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "TryShoppy_Orders_" + new Date().toISOString().slice(0,10) + ".csv";
        link.click();
    }
function toggleAll(el){
    document.querySelectorAll(".row-check").forEach(c=>{
        c.checked = el.checked;
    });
}

function applyBulkStatus(){
    const status = document.getElementById("bulkStatus").value;
    if(!status) return alert("اختار الحالة");

    const selected = [...document.querySelectorAll(".row-check:checked")]
                     .map(c=>c.value);

    if(selected.length === 0)
        return alert("مفيش طلبات متعلمة");

    selected.forEach(orderId=>{
        fetch(scriptURL,{
            method:"POST",
            mode:"no-cors",
            body: JSON.stringify({
                action:"updateStatus",
                order: orderId,
                status: status
            })
        });
    });

    alert("تم تحديث الحالات");
    loadData();
}
