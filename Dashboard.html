<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY SHOPPY - Pro Dashboard v8.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ألوان عصرية أكثر */
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
        }

        /* Header */
        header { 
            background: var(--surface); 
            padding: 15px 40px; 
            box-shadow: var(--shadow); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fee2e2;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo';
            transition: 0.3s;
        }
        .btn-logout:hover { background: var(--danger); color: white; }

        .container { max-width: 98%; margin: 30px auto; padding: 0 20px; } 
        
        /* Stats Cards */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--surface); 
            padding: 24px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }

        /* Control Panel */
        .control-panel {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end; /* محاذاة العناصر للأسفل */
            margin-bottom: 20px;
        }
        .controls-row:last-child { margin-bottom: 0; padding-top: 20px; border-top: 1px dashed var(--border); }

        .input-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

        input, select { 
            padding: 10px 14px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: 'Cairo'; 
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            background: #f9fafb;
            height: 42px; /* توحيد الارتفاع */
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { font-family: 'Cairo'; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; }
        
        .btn-search { background: var(--primary); color: white; padding: 0 25px; }
        .btn-search:hover { background: #4338ca; }

        .btn-action { background: #374151; color: white; padding: 0 20px; }
        .btn-action.active { background: var(--warning); color: #000; }
        .btn-action:hover { opacity: 0.9; }

        .btn-print { background: #7c3aed; color: white; padding: 0 20px; }
        .btn-csv { background: #059669; color: white; padding: 0 20px; }

        /* Table Styling */
        .table-wrapper { 
            background: var(--surface); 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border);
            overflow: hidden;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        
        th { 
            background: #f8fafc; 
            padding: 16px; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 800;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        
        td { 
            padding: 12px 16px; 
            border-bottom: 1px solid var(--border); 
            font-size: 0.9rem; 
            vertical-align: middle; 
            color: var(--text-main);
        }
        tr:hover td { background: #f9fafb; }

        /* Inputs inside table */
        .price-input { 
            width: 80px; 
            padding: 6px; 
            text-align: center; 
            font-weight: bold; 
            border-radius: 6px;
            height: 36px;
        }
        .deposit-input { color: var(--danger); background: #fef2f2; border-color: #fecaca; }
        
        /* New Date Input Style */
        .date-input-table {
            width: 130px;
            padding: 4px 8px;
            font-size: 0.8rem;
            height: 36px;
        }

        .spec-badge { 
            background: var(--primary-light); 
            color: var(--primary); 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            display: inline-block; 
            margin-right: 4px;
        }
        
        .end-price-cell { 
            font-weight: 800; 
            color: var(--success); 
            background: var(--success-bg);
            padding: 6px 12px;
            border-radius: 6px;
            text-align: center;
            display: inline-block;
            min-width: 60px;
        }

        td select {
            padding: 6px 10px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            min-width: 130px;
            height: 36px;
            font-weight: 600;
        }

        .btn-icon { width: 36px; height: 36px; border-radius: 8px; padding: 0; }
        .btn-update { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .btn-update:hover { background: #059669; color: white; }
        
        .btn-print-sm { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-print-sm:hover { background: #2563eb; color: white; }

        .link-btn { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 700; 
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        
        /* Checkbox styling */
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

    </style>
</head>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzTo-YoIBY6wcJ4-SOwc_KqD_-qvZ4fEwAM8WeFUFJpXGPkag5PVtf8CH-g9AeYU9JwPQ/exec";
let ordersData = [];
let currentFilteredData = [];
let isGrouped = false;

async function loadData() {
    try {
        const res = await fetch(scriptURL, { redirect: 'follow' });
        ordersData = await res.json();
        applyFilters(); 
    } catch(e) { console.error("Data Load Error", e); }
}

function formatDateCustom(dateValue){
    if(!dateValue) return "";
    const date = new Date(dateValue);
    const day = String(date.getDate()).padStart(2, '0');
    const month = date.toLocaleString('en-GB', { month: 'short' });
    const year = date.getFullYear();
    return `${day}-${month}-${year}`;
}

// دالة مساعدة لتحويل التاريخ لصيغة Input
function formatDateForInput(dateValue) {
    if (!dateValue) return "";

    const d = new Date(dateValue);
    if (isNaN(d.getTime())) return "";

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    data.forEach(o => {
        const cur = o.status || "Pending Review";
        const printPhone = o.phone ? o.phone.toString().replace(/\s/g, '') : '';
        const printOrder = o.order ? o.order.toString().split(' + ')[0] : 'N/A';
        
        const qty = isGrouped ? o.totalQty : (o.quantity || 1);
        const weight = parseFloat(isGrouped ? o.totalWeight : (o.weight || 0)).toFixed(2);
        const dims = isGrouped ? "متعددة" : (o.dimensions || "غير محددة");

        const ship = isGrouped ? (parseFloat(o.totalShipping) || 0) : (parseFloat(o.shipping) || 0);
        const finalP = parseFloat(o.finalPrice || 0);
        const dep = parseFloat(o.deposit || 0);
        const endP = finalP + ship - dep;

        let statusColor = "#94a3b8"; // رمادي افتراضي
        if(cur.includes("Delivered")) statusColor = "var(--success)";
        if(cur.includes("Canceled")) statusColor = "var(--danger)";
        if(cur.includes("Pending")) statusColor = "var(--warning)";
        if(cur.includes("Placed")) statusColor = "var(--primary)";

        // تجهيز قيمة التاريخ للحقل
        const arrivalVal = o.endprice ? formatDateForInput(o.endprice) : "";

        tbody.innerHTML += `<tr>
            <td><input type="checkbox" class="row-check" value="${printOrder}"></td>
            <td>
                <span style="font-weight:800; color:var(--primary); font-size:0.95rem;">${o.order}</span>
                ${o.date ? `<div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">📅 ${new Date(o.date).toISOString().split('T')[0]}</div>` : ``}
            </td>
            <td>
                <div style="font-weight:700;">${o.customerName}</div>
                <div style="font-size:0.8rem; color:#64748b; margin-top:2px;">📱 ${o.phone}</div>
            </td>
            <td>
                <span class="spec-badge">x${qty}</span>
                <span class="spec-badge">${weight} gm</span>
                <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">📦 ${dims}</div>
            </td>
            <td><input type="number" id="egp-${printOrder}" class="price-input" value="${finalP}" placeholder="EGP"></td>
            <td><input type="number" id="deposit-${printOrder}" class="price-input deposit-input" value="${dep}" placeholder="0"></td>
            <td><div class="end-price-cell">${endP.toLocaleString()}</div></td>
            <td><input type="number" id="usd-${printOrder}" class="price-input" value="${parseFloat(o.usd || 0).toFixed(2)}" style="color:#6366f1"></td>
            
            <td>
                <input type="date" id="arrival-${printOrder}" class="date-input-table" value="${arrivalVal}">
            </td>

            <td>
                <select id="status-${printOrder}" style="border-right: 4px solid ${statusColor};">
                    <option value="Pending Review" ${cur==='Pending Review'?'selected':''}>Pending Review</option>
					<option value="Confirmed Via Try" ${cur==='Confirmed Via Try'?'selected':''}>Confirmed Via Try</option>
					<option value="Placed" ${cur==='Placed'?'selected':''}>Placed</option>
                    <option value="Processing" ${cur==='Processing'?'selected':''}>Processing</option>
					<option value="Arrived USA HUB" ${cur==='Arrived USA HUB'?'selected':''}>Arrived USA HUB</option>
					<option value="Arrived Cairo HUB" ${cur==='Arrived Cairo HUB'?'selected':''}>Arrived Cairo HUB</option>
                    <option value="Shipped To You" ${cur==='Shipped To You'?'selected':''}>Shipped To You</option>
                    <option value="Delivered" ${cur==='Delivered'?'selected':''}>Delivered</option>
					<option value="Canceled" ${cur==='Canceled'?'selected':''}>Canceled</option>
                    <option value="Delayed" ${cur==='Delayed'?'selected':''}>Delayed</option>
                </select>
            </td>
            <td style="text-align:center;"><button class="btn-icon btn-update" onclick="updateOrder('${printOrder}')" title="حفظ التعديلات">💾</button></td>
            <td style="text-align:center;"><button class="btn-icon btn-print-sm" onclick="printLabel('${printPhone}', '${printOrder}')" title="طباعة بوليصة">📄</button></td>
            <td style="text-align:center;">${o.link ? `<a href="${o.link}" target="_blank" class="link-btn">رابط</a>` : '<span style="color:#ccc">-</span>'}</td>
        </tr>`;
    });
}

function applyFilters() {
    const from = document.getElementById("dateFrom").value;
    const to = document.getElementById("dateTo").value;
    const arrivalDateFilter = document.getElementById("arrivalDate").value;
    const search = document.getElementById("searchInput").value.toLowerCase();
    const status = document.getElementById("searchStatus").value;
    const USD_RATE = 50; 

    let filtered = ordersData.filter(o => {
        const d = o.date ? new Date(o.date).toISOString().split('T')[0] : "";
        const arrivalDate = o.endprice ? new Date(o.endprice).toLocaleDateString('en-CA') : ""; // Format yyyy-mm-dd
        const arrivalMatch = !arrivalDateFilter || arrivalDate === arrivalDateFilter;

        const dateMatch = (!from || d >= from) && (!to || d <= to);
        const searchMatch = (o.customerName||"").toLowerCase().includes(search) || 
                            (o.phone||"").toString().includes(search) || 
                            (o.order||"").toString().toLowerCase().includes(search);
        const statusMatch = !status || o.status === status;
        return dateMatch && searchMatch && statusMatch && arrivalMatch;
    });
    
    filtered = filtered.reverse();

    if (isGrouped) {
        const groups = {};
        filtered.forEach(o => {
            const key = o.phone ? o.phone.toString().replace(/\s/g, '') : 'Unknown';
            if (!groups[key]) {
                groups[key] = { 
                    ...o, order: [o.order], 
                    totalQty: parseInt(o.quantity || 1), 
                    totalWeight: parseFloat(o.weight || 0), 
                    totalShipping: parseFloat(o.shipping || 0),
                    finalPrice: parseFloat(o.finalPrice || 0), 
                    deposit: parseFloat(o.deposit || 0),
                    usd: parseFloat(o.usd || 0) 
                };
            } else {
                groups[key].order.push(o.order);
                groups[key].totalQty += parseInt(o.quantity || 1);
                groups[key].totalWeight += parseFloat(o.weight || 0);
                groups[key].totalShipping += parseFloat(o.shipping || 0);
                groups[key].finalPrice += parseFloat(o.finalPrice || 0);
                groups[key].deposit += parseFloat(o.deposit || 0);
                groups[key].usd += parseFloat(o.usd || 0);
            }
        });
        filtered = Object.values(groups).map(g => ({ ...g, order: g.order.join(' + ') }));
    }
	
    const totalEGP = filtered.reduce((a,b) => a + parseFloat(b.finalPrice || 0), 0);
    const totalUSD = filtered.reduce((a,b) => a + parseFloat(b.usd || 0), 0);
    const totalNet = filtered.reduce((a,b) => {
        const ship = isGrouped ? (parseFloat(b.totalShipping)||0) : (parseFloat(b.shipping)||0);
        return a + (parseFloat(b.finalPrice||0) + ship - parseFloat(b.deposit||0));
    }, 0);
    const totalProfit = totalEGP - (totalUSD * USD_RATE);
    
    document.getElementById("totalEGP").innerText = totalEGP.toLocaleString() + " EGP";
    document.getElementById("totalUSD").innerText = totalUSD.toLocaleString() + " $";
    document.getElementById("totalNet").innerText = totalNet.toLocaleString() + " ج.م";
    document.getElementById("totalProfit").innerText = totalProfit.toLocaleString() + " ج.م";
    document.getElementById("totalCount").innerText = filtered.length;
    
    currentFilteredData = filtered; 
    renderTable(filtered);
}

function toggleGrouping() {
    isGrouped = !isGrouped;
    const btn = document.getElementById("groupBtn");
    if(isGrouped) {
        btn.innerHTML = "🚫 فك التجميع";
        btn.classList.add("active");
    } else {
        btn.innerHTML = "🔄 تجميع";
        btn.classList.remove("active");
    }
    applyFilters(); 
}

function updateOrder(orderId) {
    const newStatus = document.getElementById(`status-${orderId}`).value;
    const newEGP = document.getElementById(`egp-${orderId}`).value;
    const newUSD = document.getElementById(`usd-${orderId}`).value;
    const newDeposit = document.getElementById(`deposit-${orderId}`).value;
    
    // سحب قيمة التاريخ الجديد
    const newArrivalDate = document.getElementById(`arrival-${orderId}`).value;

    const btn = document.querySelector(`button[onclick="updateOrder('${orderId}')"]`);
    const originalText = btn.innerHTML;
    btn.innerHTML = "⏳";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ 
            action: "updateStatus", 
            order: orderId, 
            status: newStatus,
            finalPrice: newEGP,
            usd: newUSD,
            deposit: newDeposit,
            endprice: newArrivalDate // إرسال التاريخ الجديد للسيرفر
        })
    }).then(() => {
        alert("تم تحديث الطلب #" + orderId + " بنجاح");
        btn.innerHTML = originalText;
        loadData();
    });
}

function generateLabelHTML(data, isBulk = false) {
    const ship = isGrouped ? (parseFloat(data.totalShipping) || 0) : (parseFloat(data.shipping) || 0);
    const finalP = parseFloat(data.finalPrice || 0);
    const dep = parseFloat(data.deposit || 0);
    const endP = finalP + ship - dep;
    const totalW = parseFloat(data.totalWeight || data.weight || 0).toFixed(2);
    const totalQ = data.totalQty || data.quantity || 1;

    return `
        <div class="card" style="${isBulk ? 'page-break-after: always;' : ''}">
            <div class="top">
                <div class="logo">TRY SHOPPY</div>
                <div style="font-size: 10pt; text-align: center; border: 1px solid #000; padding: 5px;">AIRWAY BILL<br>OFFICIAL</div>
            </div>
            <div class="info">
                <span>إلى السيد/ة:</span>
                <b>${data.customerName}</b>
                📍 ${data.governorate} - ${data.address}<br>
                📞 ${data.phone}
            </div>
            <div class="shipping-box">
                <div>الوزن الإجمالي: <b>${totalW} جرام</b></div>
                <div>إجمالي القطع: <b>${totalQ}</b></div>
            </div>
            <div class="ids-strip">أرقام الطلبات: ${data.order}</div>
            <div class="cod-area">
                <span>المبلغ المطلوب تحصيله (C.O.D)</span>
                <div class="cod-val">${endP} EGP</div>
            </div>
            <div class="footer">تراي شوبي تتمني لكم تجربة سعيده</div>
        </div>
    `;
}

function logout(){
  localStorage.removeItem("auth");
  localStorage.removeItem("loginTime");
  location.reload();
}

function exportCSV(){
    let csv = "Order,Customer,Phone,Status,FinalPrice,USD,Date\n";
    currentFilteredData.forEach(o=>{
        const d = o.date ? new Date(o.date).toISOString().split('T')[0] : "";
        csv += `"${o.order}","${o.customerName}","${o.phone}","${o.status}","${o.finalPrice}","${o.usd}","${d}"\n`;
    });

    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "orders.csv";
    link.click();
}
function toggleAll(el){
    document.querySelectorAll(".row-check").forEach(c=>{
        c.checked = el.checked;
    });
}

function applyBulkStatus(){
    const status = document.getElementById("bulkStatus").value;
    if(!status) return alert("اختار الحالة");

    const selected = [...document.querySelectorAll(".row-check:checked")]
                     .map(c=>c.value);

    if(selected.length === 0)
        return alert("مفيش طلبات متعلمة");

    selected.forEach(orderId=>{
        fetch(scriptURL,{
            method:"POST",
            mode:"no-cors",
            body: JSON.stringify({
                action:"updateStatus",
                order: orderId,
                status: status
            })
        });
    });

    alert("تم تحديث الحالات");
    loadData();
}

loadData();
