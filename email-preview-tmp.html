<!doctype html><meta charset="utf-8"><title>Email preview</title>
<body style="margin:0;background:#e8ebf2">
<script>
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function buildDetailsRowsHtml(orderNo, dateStr, data) {
  let h = "";
  h += emailRow("Order No / رقم الطلب", escapeHtml(orderNo), true);
  h += emailRow("Date / التاريخ", escapeHtml(dateStr));
  h += emailRow("Name / الاسم", escapeHtml(data.customerName || ""));
  h += emailRow("Phone / الموبايل", escapeHtml(displayPhone_(data.phone)));
  if (data.governorate) h += emailRow("Governorate / المحافظة", escapeHtml(data.governorate));
  if (data.address) h += emailRow("Address / العنوان", escapeHtml(data.address));
  return h;
}

/* جدول المنتجات — منتج واحد بتفاصيله، أو أكتر من منتج (المارت) سطر لكل واحد */
function buildItemsRowsHtml(data) {
  if (data.emailSummary) {
    return String(data.emailSummary).split("\n").filter(Boolean).map(function (line, i) {
      const borderTop = i === 0 ? "" : "border-top:1px solid #eef1f6;";
      // 🔖 الشكل المنظّم: orderNo::link::label::qty::price::specs
      // 🆕 الحقل السادس (specs) هو المواصفات والملاحظات اللي كتبها
      // العميل (مقاس/لون/ملاحظة). الشكل القديم كان 5 حقول بس والمواصفات
      // كانت بتضيع من الإيميل خالص — دلوقتي بنقراها لو موجودة، ولو
      // الطلب جاي من نسخة فرونت إند قديمة (5 حقول) بيشتغل عادي من غيرها.
      const parts = line.split("::");
      if (parts.length >= 5) {
        const orderNo = parts[0], link = parts[1], label = parts[2], qty = parts[3], price = parts[4];
        const specs = parts.length >= 6 ? parts.slice(5).join("::") : "";
        const orderLabel = link
          ? '<a href="' + escapeHtml(link) + '" style="color:#2563eb;text-decoration:none;">🔖 ' + escapeHtml(orderNo) + '</a>'
          : '🔖 ' + escapeHtml(orderNo);
        const specsHtml = (specs && specs !== "-")
          ? '<div style="font-size:12px;color:#64748b;font-weight:600;margin-top:4px;line-height:1.6;">📝 ' + escapeHtml(specs) + '</div>'
          : "";
        return '<tr><td style="padding:10px 0;' + borderTop + 'color:#171C30;font-size:13px;font-weight:700;">' +
          orderLabel + ' — ' + escapeHtml(label) + ' — ' + escapeHtml(qty) + ' × ' + escapeHtml(price) + ' EGP' +
          specsHtml + '</td></tr>';
      }
      // نص عادي بدون تنسيق (المارت، أو أي مصدر قديم) — نلينكفي أي رابط
      // ظاهر بداخله بس، من غير ما نفترض شكل منظّم
      const linkified = escapeHtml(line).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" style="color:#2563eb;text-decoration:none;">$1</a>');
      return '<tr><td style="padding:8px 0;' + borderTop + 'color:#171C30;font-size:13px;font-weight:700;">' + linkified + '</td></tr>';
    }).join("");
  }
  const qty = parseFloat(data.quantity) || 1;
  const total = parseFloat(data.finalPrice) || 0;
  const unitPrice = qty > 0 ? (total / qty) : total;
  const productHtml = data.link
    ? '<a href="' + escapeHtml(data.link) + '" style="color:#2563eb;text-decoration:none;word-break:break-all;">' + escapeHtml(data.link) + '</a>'
    : "—";
  let h = "";
  h += emailRow("Product / المنتج", productHtml, true);
  if (data.dimensions) h += emailRow("SPCS and Notes / المواصفات والملاحظات", escapeHtml(data.dimensions));
  h += emailRow("Quantity / الكمية", qty);
  h += emailRow("Unit price / سعر القطعة", Math.round(unitPrice) + " EGP");
  return h;
}

/* الإطار العام للإيميل — هيدر أصفر/أسود بهوية Try Shoppy، كارت أبيض،
   جدول تفاصيل، جدول منتجات، وشريط إجمالي أخضر لو موجود سعر نهائي.
   استخدمنا <table> بدل flexbox/grid عشان تتفتح صح في Outlook وكل
   عملاء البريد، مش بس Gmail. */
function buildOrderEmailHtml(orderNo, dateStr, data, greetingHtml, footerHtml) {
  const detailsRows = buildDetailsRowsHtml(orderNo, dateStr, data);
  const itemsRows = buildItemsRowsHtml(data);
  // 🧮 لو الطلب متعدد المنتجات (مارت)، cartTotal هو إجمالي السلة
  // الحقيقي. finalPrice في الحالة دي بيكون بس سعر أول منتج في
  // السلة (لأن كل منتج بيتسجل في صف لوحه بسعره هو بس) — استخدامه
  // هنا غلط ومضلل للعميل، فلازم نفضّل cartTotal لو موجود.
  const displayTotal = data.cartTotal !== undefined ? data.cartTotal : data.finalPrice;
  const totalHtml = displayTotal
    ? '<table role="presentation" width="100%" style="border-collapse:collapse;margin-top:14px;background:#f0fdf4;border-radius:12px;">' +
      '<tr><td style="padding:13px 18px;font-size:13.5px;font-weight:800;color:#166534;">Total / الإجمالي</td>' +
      '<td style="padding:13px 18px;font-size:17px;font-weight:900;color:#0E9F6E;text-align:left;">' + escapeHtml(String(displayTotal)) + ' EGP</td></tr></table>'
    : "";

  return '' +
  '<div style="font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;padding:24px 12px;">' +
    '<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;border-collapse:collapse;">' +
      '<tr><td style="background:#2D3250;padding:22px;border-radius:16px 16px 0 0;text-align:center;">' +
        '<span style="color:#F9C22E;font-size:20px;font-weight:900;letter-spacing:.5px;">TRY SHOPPY</span>' +
      '</td></tr>' +
      '<tr><td style="background:#ffffff;padding:26px 24px;border-radius:0 0 16px 16px;">' +
        greetingHtml +
        '<table role="presentation" width="100%" style="border-collapse:collapse;margin-top:6px;">' + detailsRows + '</table>' +
        '<div style="height:1px;background:#eef1f6;margin:18px 0 10px;"></div>' +
        '<div style="font-size:11.5px;color:#94a3b8;font-weight:800;letter-spacing:.03em;margin-bottom:4px;">ITEMS / المنتجات</div>' +
        '<table role="presentation" width="100%" style="border-collapse:collapse;">' + itemsRows + '</table>' +
        totalHtml +
        footerHtml +
      '</td></tr>' +
      '<tr><td style="text-align:center;color:#b0b8c4;font-size:11px;padding:14px 0 0;">© Try Shoppy</td></tr>' +
    '</table>' +
  '</div>';
}

function emailRow(label, valueHtml, isFirst) {
  const borderTop = isFirst ? "" : "border-top:1px solid #eef1f6;";
  return '<tr>' +
    '<td style="padding:9px 0;' + borderTop + 'color:#64748b;font-size:12.5px;font-weight:700;white-space:nowrap;vertical-align:top;">' + label + '</td>' +
    '<td style="padding:9px 0 9px 14px;' + borderTop + 'color:#171C30;font-size:13.5px;font-weight:800;text-align:right;">' + valueHtml + '</td>' +
  '</tr>';
}
function displayPhone_(v) {
  var raw = String(v == null ? "" : v).trim();
  if (!raw) return "";
  var d = raw.replace(/\D/g, "");
  if (!d) return raw;
  if (d.length > 12 && d.slice(0, 2) === "00") d = d.slice(2);
  if (d.length === 12 && d.slice(0, 3) === "201") d = d.slice(2);
  if (d.length === 11 && d.slice(0, 2) === "01") return d;
  if (d.length === 10 && d.charAt(0) === "1") return "0" + d;
  return raw;
}
</script>
<div id="out"></div>
<script>

  governorate:"القاهرة", address:"١٢ ش النيل، المعادي",

var custFooter =

  '</div>' +
  '<p style="text-align:center;color:#94a3b8;font-size:12px;margin-top:16px;">لأي استفسار: <a href="https://wa.me/201005609642" style="color:#16a34a;font-weight:700;text-decoration:none;">واتساب</a></p>';

var adminGreeting = '<p style="font-size:14px;color:#171C30;font-weight:800;margin:0 0 14px;">🆕 وصل طلب جديد على الموقع</p>';

function label(t,s){return '<div style="max-width:560px;margin:26px auto 8px;font:700 13px Tahoma;color:#2D3250;direction:rtl">'+t+' <span style="font-weight:400;color:#7b849b">'+s+'</span></div>';}

document.getElementById('out').innerHTML =

  label('٢ · إشعار الطلب الجديد للفريق','(Subject: 🆕 طلب جديد TRY12345678 — أحمد محمود)') +
  buildOrderEmailHtml(data.order, dateStr, data, adminGreeting, adminFooter);
</script>
