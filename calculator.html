<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY SHOPPY - Smart Order System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --success: #22c55e;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            max-width: 180px;
            margin-bottom: 10px;
        }

        .slogan {
            color: var(--secondary);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2 {
            color: var(--text-dark);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--primary);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 25px 0 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #fcfcfc;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-calculate {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-calculate:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .btn-track {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--border);
            margin-top: 20px;
            font-weight: 600;
        }

        .result-box {
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            border-radius: 20px;
            padding: 25px;
            margin: 30px 0;
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        .final-price {
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 800;
            margin: 10px 0;
        }

        .order-badge {
            background: var(--accent);
            color: white;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid #fee2e2;
            text-align: center;
        }

        .hidden { display: none; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        hr { border: 0; border-top: 1px solid var(--border); margin: 35px 0; }

        @media (max-width: 480px) {
            .row { grid-template-columns: 1fr; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo-section">
            <img src="logo.png" alt="TRY SHOPPY">
            <div class="slogan">Your Global Shopping Partner</div>
        </div>

        <h2>حساب وتأكيد الطلب <br> <span style="font-size: 0.9rem; font-weight: normal; color: var(--secondary);">Calculate & Confirm Order</span></h2>

        <div class="input-group">
            <label>رابط المنتج | Product Link</label>
            <input id="productLink" type="url" placeholder="https://amazon.com/...">
        </div>
		<div class="input-group">
             <label>الكمية | Quantity</label>
             <input id="quantity" type="number" value="1" min="1">
         </div>

        <div class="row">
            <div class="input-group">
                <label>دولة الشراء | Country</label>
                <select id="country" onchange="checkCountry()">
                    <option value="USA">USA 🇺🇸 (أمريكا)</option>
                    <option value="OTHER">Other Countries (دول أخرى)</option>
                </select>
            </div>
            <div class="input-group">
                <label>السعر شامل شحن الموقع ($) | *Total Price in USD</label>
                <input id="price" type="number" placeholder="0.00">
            </div>
        </div>

        <div id="countryMsg" class="error-msg hidden"></div>

        <div class="row">
            <div class="input-group">
                <label>الوزن (جرام) | *Weight (g)</label>
                <input id="weight" type="number" placeholder="مثلاً: 500">
            </div>
            <div class="input-group">
                <label>الفئة | *Category</label>
                <select id="category">
                    <option value="">اختر الفئة (Select)...</option>
                    <option value="Clothes (Regular)">ملابس عادية | Clothes (Regular)</option>
                    <option value="Jacket or BALTO">جاكيت أو بالتو | Jacket or BALTO</option>
                    <option value="Electronics">إلكترونيات | Electronics</option>
                    <option value="Shoes (Regular)">أحذية عادية | Shoes (Regular)</option>
                    <option value="Shoes (Boot)">أحذية بوت | Shoes (Boot)</option>
                    <option value="Watches">ساعات | Watches</option>
                    <option value="Accessories">إكسسوارات | Accessories</option>
                    <option value="Cosmetics">مستحضرات تجميل | Cosmetics</option>
                    <option value="Sunglasses">نظارات شمسية | Sunglasses</option>
                    <option value="Food">أغذية | Food</option>
                    <option value="CarParts">قطع غيار سيارات | CarParts</option>
                    <option value="Vitamin or Supplements">فيتامينات ومكملات | Vitamin or Supplements</option>
                    <option value="Shampoo or Conditioner">شامبو وبلسم | Shampoo or Conditioner</option>
                    <option value="Small Size Hand bag (women)">حقيبة يد صغيرة | Small Hand bag</option>
                    <option value="Back bag (or Lap bag)">حقيبة ظهر / لابتوب | Back bag</option>
                    <option value="Large Size Hand bag (women)">حقيبة يد كبيرة | Large Hand bag</option>
                    <option value="Stationary">أدوات مكتبية | Stationary</option>
                </select>
            </div>
        </div>

       <label>وصف إضافي (اختياري) | Additional Description (Optional)</label>
        <div class="dimensions-grid" style="margin-bottom: 25px;">
            <input id="length" type="text" placeholder="المقاس | Size">
            <input id="width" type="text" placeholder="اللون | Color">
            <input id="height" type="text" placeholder="ملاحظات أخرى | Other Notes">
        </div>

        <button class="btn-calculate" onclick="calculatePrice()">
            <span>احسب السعر النهائي | Calculate Price</span>
        </button>

        <div id="resultArea" class="hidden">
            <div class="result-box">
                <div id="orderNoBadge" class="order-badge"></div>
                <div style="font-weight: 500;">إجمالي التكلفة شاملة الشحن والجمارك:</div>
                <div style="font-size: 0.8rem; color: var(--secondary);">Total Cost (Shipping & Customs included)</div>
                <div id="priceDetails" class="final-price"></div>
                <div style="font-size: 0.9rem; color: var(--success); font-weight: 500;"> الدفع عند الاستلام لحد 10000ج بدون اي زيادة✓| التأكيد النهائي بعد المراجعة</div>
            </div>

            <hr>

            <div class="section-title">
                <span>📍 بيانات الشحن | Shipping Details</span>
            </div>
            
            <div class="input-group">
                <label>الاسم بالكامل | Full Name</label>
                <input id="customerName" placeholder="أدخل اسمك بالكامل">
            </div>
            
            <div class="row">
                <div class="input-group">
                    <label>رقم الهاتف | Phone Number</label>
                    <input id="phone" placeholder="01xxxxxxxxx">
                </div>
                <div class="input-group">
                    <label>المحافظة | Governorate</label>
                    <select id="governorate">
                        <option value="">اختر المحافظة (Select)...</option>
                        <option value="القاهرة">القاهرة | Cairo</option>
                        <option value="الجيزة">الجيزة | Giza</option>
                        <option value="الإسكندرية">الإسكندرية | Alexandria</option>
                        <option value="الدقهلية">الدقهلية | Dakahlia</option>
                        <option value="الشرقية">الشرقية | Sharqia</option>
                        <option value="الغربية">الغربية | Gharbia</option>
                        <option value="المنوفية">المنوفية | Monufia</option>
                        <option value="القليوبية">القليوبية | Qalyubia</option>
                        <option value="البحيرة">البحيرة | Beheira</option>
                        <option value="كفر الشيخ">كفر الشيخ | Kafr El Sheikh</option>
                        <option value="دمياط">دمياط | Damietta</option>
                        <option value="بورسعيد">بورسعيد | Port Said</option>
                        <option value="الإسماعيلية">الإسماعيلية | Ismailia</option>
                        <option value="السويس">السويس | Suez</option>
                        <option value="الفيوم">الفيوم | Faiyum</option>
                        <option value="بني سويف">بني سويف | Beni Suef</option>
                        <option value="المنيا">المنيا | Minya</option>
                        <option value="أسيوط">أسيوط | Asyut</option>
                        <option value="سوهاج">سوهاج | Sohag</option>
                        <option value="قنا">قنا | Qena</option>
                        <option value="الأقصر">الأقصر | Luxor</option>
                        <option value="أسوان">أسوان | Aswan</option>
                        <option value="البحر الأحمر">البحر الأحمر | Red Sea</option>
                        <option value="الوادي الجديد">الوادي الجديد | New Valley</option>
                        <option value="مطروح">مطروح | Matrouh</option>
                        <option value="شمال سيناء">شمال سيناء | North Sinai</option>
                        <option value="جنوب سيناء">جنوب سيناء | South Sinai</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>العنوان بالتفصيل | Detailed Address</label>
                <textarea id="address" rows="2" placeholder="رقم المبنى، اسم الشارع، الشقة..."></textarea>
            </div>

            <button id="confirmBtn" class="btn-calculate" style="background: var(--success);" onclick="confirmOrder()">
                تأكيد الطلب الآن | Confirm Order Now
            </button>
            
            <button id="whatsappBtn" class="btn-whatsapp hidden" onclick="sendWhatsApp()">
                إرسال واتساب للتأكيد | Send WhatsApp Confirmation
            </button>
        </div>

        <button class="btn-track" onclick="window.open('track.html','_blank')">
            🔍 تتبع شحنتك | Track Your Order
        </button>
    </div>
</div>

<script>
let finalPrice = 0;
let orderNumber = "";
let usdTotal = 0;

function roundSmart(price) {
  let round50 = Math.round(price / 50) * 50;
  let round100 = Math.round(price / 100) * 100;
  return Math.abs(price - round50) < Math.abs(price - round100) ? round50 : round100;
}

function generateOrder(){
  return "TRY-2026-" + Math.floor(100000 + Math.random()*900000);
}

function checkCountry(){
  let country = document.getElementById("country").value;
  let msg = document.getElementById("countryMsg");
  if(country === "OTHER"){
    msg.innerHTML = "نعتذر، حالياً نوفر الطلبات من أمريكا فقط. <br> Sorry, we only serve orders from USA currently.";
    msg.classList.remove("hidden");
  } else {
    msg.classList.add("hidden");
  }
}

function calculatePrice(){
  let country = document.getElementById("country").value;
  if(country === "OTHER"){ alert("Orders available from USA only"); return; }

  let usd = parseFloat(document.getElementById("price").value);
  let weightG = parseFloat(document.getElementById("weight").value);
  let cat = document.getElementById("category").value;
  let quantity = parseInt(document.getElementById("quantity").value) || 1;
  usdTotal = parseFloat(document.getElementById("price").value) * 
           (parseInt(document.getElementById("quantity").value) || 1);


  
  if(!usd || !cat || !weightG){ alert("برجاء إدخال السعر، الفئة، والوزن الفعلي (جرام)"); return; }

  let base = 0, extra = 0, mult = 1;
  if(usd <= 31.99){ mult = 2.50; base = usd * 27.5; extra = 50; } 
  else if(usd <= 71.99){ mult = 2.60; base = usd * 26; extra = 80; }
  else if(usd <= 180.99){ mult = 2.70; base = usd * 24; extra = 80; }
  else { mult = 2.80; base = usd * 24; extra = 80; }

  const categoryBase = {
   "Clothes (Regular)":150, "Jacket or BALTO":400, "Electronics":400, "Shoes (Regular)":450,
   "Food":200, "Sunglasses":300, "Shoes (Boot)":500, "Watches":150, "Accessories":200,
   "Cosmetics":300, "CarParts":400, "Vitamin or Supplements":370, "Shampoo or Conditioner":300,
   "Small Size Hand bag (women)":150, "Back bag (or Lap bag)":400, "Large Size Hand bag (women)":350, "Stationary":200
  };

  const weightRates = {
   "Clothes (Regular)":30, "Jacket or BALTO":30, "Electronics":80, "Shoes (Regular)":35,
   "Food":35, "Sunglasses":40, "Shoes (Boot)":35, "Watches":30, "Accessories":40,
   "Cosmetics":80, "CarParts":50, "Vitamin or Supplements":110, "Shampoo or Conditioner":110,
   "Small Size Hand bag (women)":35, "Back bag (or Lap bag)":35, "Large Size Hand bag (women)":35, "Stationary":35
  };

  let basicPrice = ((base + categoryBase[cat] + extra) * mult);
  let weightPrice = basicPrice;
  if(weightG > 300){
    weightPrice = ((base + categoryBase[cat] + extra + (weightG/1000 * weightRates[cat]*50)));
  }

  finalPrice = roundSmart(Math.max(basicPrice, weightPrice) * quantity);
  document.getElementById("priceDetails").innerHTML = finalPrice + " EGP";
  orderNumber = generateOrder();
  document.getElementById("orderNoBadge").innerText = "رقم الطلب | Order No: " + orderNumber;
  document.getElementById("resultArea").classList.remove("hidden");
  document.getElementById("resultArea").scrollIntoView({ behavior: 'smooth' });
}

function confirmOrder(){
  const name = document.getElementById("customerName").value;
  if(!name){ alert("برجاء إدخال الاسم"); return; }

  fetch("https://script.google.com/macros/s/AKfycby-HrSH3DwpAPJAuhiAPlBJAngy-_qUZ7-O925hTA7FnbBVHkrjprfJavEA-WKyofIdlg/exec", {
    method: "POST",
    body: JSON.stringify({
      order: orderNumber,
      customerName: name,
      phone: document.getElementById("phone").value,
      country: document.getElementById("country").value,
      address: document.getElementById("address").value,
      governorate: document.getElementById("governorate").value,
      link: document.getElementById("productLink").value,
	  quantity: document.getElementById("quantity").value,
      usd: usdTotal,
      weight: document.getElementById("weight").value,
      dimensions: document.getElementById("length").value + "x" + document.getElementById("width").value + "x" + document.getElementById("height").value,
      category: document.getElementById("category").value,
      finalPrice: finalPrice
    })
  });

  alert("تم تأكيد طلبك بنجاح! برجاء الضغط على زر الواتساب اسفل الصفحة للتواصل والتأكيدالنهائي.");
  document.getElementById("whatsappBtn").classList.remove("hidden");
  document.getElementById("confirmBtn").classList.add("hidden");
}
	
function sendWhatsApp(){

  const spcs =
    "Size: " + document.getElementById("length").value +
    " | Color: " + document.getElementById("width").value +
    " | Notes: " + document.getElementById("height").value;

  let msg = `TRY SHOPPY Order
Order No: ${orderNumber}
Name: ${document.getElementById("customerName").value}
Governorate: ${document.getElementById("governorate").value}
Quantity: ${document.getElementById("quantity").value}
Final Price: ${finalPrice} EGP
Product: ${document.getElementById("productLink").value}
SPCS: ${spcs}`;

  window.open(`https://wa.me/201005609642?text=${encodeURIComponent(msg)}`);
}


</script>
</body>
</html>
