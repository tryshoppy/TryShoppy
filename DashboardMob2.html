<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRY SHOPPY - Fixed DropList</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0d6efd; --bg:#f4f7fe; --white:#fff; --text:#1e293b; --border:#cbd5e1; --success:#22c55e; --danger:#dc2626; }
body{ font-family:'Cairo',sans-serif; background:var(--bg); margin:0; padding:10px; color:var(--text); font-size:16px; }
.container{ max-width:600px; margin:auto; }
header{ display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--primary); padding:10px 5px; margin-bottom:15px; }
.logo { font-weight: 900; font-size: 1.2rem; color: var(--primary); }
.filters{ background:#fff; padding:15px; border-radius:15px; display:flex; flex-direction:column; gap:12px; margin-bottom:15px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.filters input, .filters select, .filters button{ padding:12px; border-radius:10px; border:1px solid var(--border); font-family:'Cairo'; width:100%; font-size:15px; box-sizing: border-box; }
.btn-search{ background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; border:none; }
.btn-group{ background:#1a1a1a; color:#fff; font-weight:bold; cursor:pointer; border:none; }
.cards-container{ display:flex; flex-direction:column; gap:15px; }
.order-card{ background:#fff; border-radius:18px; padding:15px; box-shadow:0 3px 12px rgba(0,0,0,0.06); border-right:8px solid var(--primary); position: relative; }
.order-card.grouped { border-right-color: #000; }
.card-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
.order-id { font-weight: 900; color: var(--primary); }
.field{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.field label{ font-weight:700; color:#64748b; font-size: 14px; }
.field span { font-weight: 600; color: var(--text); }
.field input, .field select{ width:130px; padding:8px; border-radius:8px; border:1px solid var(--border); text-align:center; font-family:'Cairo'; font-size:14px; font-weight: bold; }
.net-box { background: #f0fdf4; padding: 10px; border-radius: 10px; margin: 10px 0; text-align: center; border: 1px solid #dcfce7; }
.net-label { display: block; font-size: 12px; color: #166534; font-weight: bold; }
.net-value { font-size: 20px; font-weight: 900; color: var(--success); }
.actions{
  display:grid;
  grid-template-columns: 1fr 1fr; /* 👈 بدل عمود واحد خليهم اتنين */
  gap:8px;
  margin-top:10px;
}
.actions.grouped {
  grid-template-columns: 1fr 1fr;
}

.btn-update{ background:var(--success); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; }
.link-btn{ background: #eff6ff; color: var(--primary); padding: 10px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: bold; font-size: 14px; }
.badge { background: #f1f5f9; padding: 3px 8px; border-radius: 5px; font-size: 12px; color: #475569; font-weight: 600; }
.spec-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
</style>
</head>

<body style="display:none;">

<script>
const SESSION_TIME=2*60*60*1000;
const auth=localStorage.getItem("auth");
const loginTime=localStorage.getItem("loginTime");
const now=new Date().getTime();

if(auth==="true"&&loginTime&&(now-loginTime<SESSION_TIME)){
  document.body.style.display="block";
}else{
  const password=prompt("Enter Password:");
  if(password==="12345678"){
    localStorage.setItem("auth","true");
    localStorage.setItem("loginTime",now);
    document.body.style.display="block";
  }else{
    document.body.innerHTML="<h2 style='text-align:center;margin-top:50px;'>Access Denied ❌</h2>";
  }
}
</script>

<div class="container">
<header>
  <div class="logo">TRY SHOPPY</div>
  <div id="totalBox" style="display: none; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:6px 10px; border-radius:10px; font-weight:900; font-size:14px; text-align:center;">
    الإجمالي: 0 ج.م
  </div>
  <button onclick="logout()" style="background:#dc2626;color:white;border:none;padding:6px 12px;border-radius:8px; font-family: 'Cairo';">خروج</button>
</header>

<div class="filters">
  <div style="display: flex; gap: 5px;">
    <input type="date" id="dateFrom" title="تاريخ الطلب من">
    <input type="date" id="dateTo" title="تاريخ الطلب إلى">
  </div>
  
  <div style="font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: -8px;">📅 فلتر بموعد الوصول:</div>
 <input id="searchArrival" placeholder="🔎 بحث بموعد الوصول">
  
  <input id="searchInput" placeholder="🔍 بحث بالاسم أو التليفون أو الأوردر">
  <select id="searchStatus">
    <option value="">كل الحالات</option>
    <option>Pending Review</option>
    <option>Confirmed Via Try</option>
    <option>On Hold</option>
    <option>Placed</option>
    <option>Arrived Cairo HUB</option>
    <option>Shipped To You</option>
    <option>Delivered</option>
    <option>Canceled</option>
    <option>Delayed</option>
  </select>
  <button class="btn-search" onclick="applyFilters()">بحث</button>
  <button class="btn-group" onclick="toggleGrouping()">👥 تجميع / فك تجميع الطلبات</button>
</div>

<div id="cardsContainer" class="cards-container"></div>
</div>

<script>
// ⚠️ هام: استبدل الرابط أدناه برابط السكريبت الخاص بك
const scriptURL="https://script.google.com/macros/s/AKfycbzy9-1BfmMJZhCtwiEoIfdzWCFPcWW3CkhfJIRdWo8eyl1Z6tSWK8xHxoAw2cxKDaosrw/exec";
let ordersData=[];
let currentViewData = []; // 👈 متغير جديد لحفظ البيانات المعروضة حالياً عشان الفاتورة
let isGrouped=false;
let renderTimer;

async function loadData(){
  try {
    const res=await fetch(scriptURL, { redirect: 'follow' });
    ordersData=await res.json();
    applyFilters();
    checkPendingReview(); 
  } catch(e) { alert("خطأ في التحميل - تأكد من الاتصال"); }
}

function renderCards(data, append = false){
  const container = document.getElementById("cardsContainer");
  
  if(!append) container.innerHTML = ""; 
  
  let htmlString = ""; 

  data.forEach(o => {
    let phone = String(o.phone || "").replace(/\D/g, "").replace(/^0/, "");
    const orderId = o.order;
    const cleanOrderId = orderId.toString().split(' + ')[0];
    const qty = o.quantity || 1;
    const weight = o.weight || 0;
    const dims = o.dimensions || "غير محدد";

    const total = parseFloat(o.finalPrice || 0);
    const dep = parseFloat(o.deposit || 0);
    const ship = parseFloat(o.shipping || 0);
    const net = total + ship - dep;
    const currentArrival = o.arrivaldate || "";

    let linksHTML = "";
    if (isGrouped && o.items) {
      linksHTML = o.items.map((item, i) => `
        <a href="${item.link}" target="_blank" class="link-btn">
          🔗 منتج ${i + 1} - ${parseFloat(item.price).toLocaleString()} ج.م
        </a>
      `).join('');
    } else {
      linksHTML = `
        <a href="${o.link || '#'}" target="_blank" class="link-btn">
          🔗 معاينة المنتج
        </a>
      `;
    }

   let message = `السلام عليكم ${o.customerName ? "أ/ " + o.customerName : "حضرتك"} 👋
الأوردر الخاص بحضرتك من تراي شوبي -Try Shoppy وصل مصر 🇪🇬 وجاهز للتسليم 🚚

سيتم التوصيل خلال:
📍 يومين عمل داخل القاهرة
📍 3 أيام عمل للمحافظات

📍 العنوان: ${o.address || "غير متوفر"}
📞 التليفون: ${o.phone || "غير متوفر"}

📦 التفاصيل:\n`;

// 🧮 حساب إجمالي الكمية وتفاصيل المنتجات
let totalQty = 0;

if (isGrouped && o.items) {
  o.items.forEach((item, i) => {
    const unitPrice = parseFloat(item.price || 0);
    const itemQty = parseInt(item.qty || 1);
    totalQty += itemQty;

    message += `---
🔗 منتج ${i + 1}: ${item.link}
📦 العدد: ${itemQty}
💰 السعرالاجمالي : ${unitPrice.toLocaleString()} ج.م
`;
  });
} else {
  const unitPrice = parseFloat(o.finalPrice || 0);
  const itemQty = parseInt(o.quantity || 1);
  totalQty = itemQty;

  message += `🔗 المنتج: ${o.link}
📦 العدد: ${itemQty}
💰 السعرالاجمالي: ${unitPrice.toLocaleString()} ج.م
`;
}

// 💰 الجزء المالي النهائي
message += `
━━━━━━━━━━━━
📦 إجمالي عدد المنتجات: ${totalQty}
💰 إجمالي الحساب: ${total.toLocaleString()} ج.م
🚚 الشحن الداخلي: هدية مننا لحضرتك 🎁✨
💵 المدفوع مقدمًا: ${dep.toLocaleString()} ج.م
📌 المطلوب عند الاستلام: *${net.toLocaleString()} ج.م*

📞 برجاء تأكيد تواجد حضرتك للاستلام 🙏`;

let whatsappBtn = "";

if (o.status === "Arrived Cairo HUB") {
  // التأكد إن التجميع متفعل الأول قبل إظهار زر الإرسال
  if (isGrouped) {
    whatsappBtn = `
      <a 
        href="https://wa.me/20${phone}?text=${encodeURIComponent(message)}" 
        target="_blank" 
        class="link-btn"
        style="background:#25D366; color:white;"
      >
        💬 واتساب
      </a>
    `;
  } else {
    // إظهار زر غير مفعل يطلب من المستخدم الضغط على التجميع أولاً
    whatsappBtn = `
      <button 
        onclick="alert('عفواً، يجب الضغط على زر (تجميع / فك تجميع الطلبات) أعلى الصفحة أولاً لإمكانية إرسال رسالة الواتساب.');" 
        class="link-btn"
        style="background:#94a3b8; color:white; border:none; cursor:not-allowed; font-family:'Cairo';"
      >
        💬 واتساب (مغلق)
      </button>
    `;
  }
}

    htmlString += `
    <div class="order-card ${isGrouped ? 'grouped' : ''}">
      <div class="card-header" style="align-items: center;">
        <div style="display: flex; flex-direction: column;">
            <span class="order-id">${orderId}</span>
            <span style="font-size: 11px; color: #94a3b8; font-weight: 600; margin-top: -2px;">
                📅 ${o.date || '—'}
            </span>
        </div>
        <span class="badge" style="height: fit-content;">${o.status || 'Pending'}</span>
      </div>
      
      <div class="field"><label>العميل:</label><span>${o.customerName || "—"}</span></div>
      <div class="field"><label>التليفون:</label><span>${o.phone || "—"}</span></div>

      <div class="spec-row">
        <span class="badge">الكمية: ${qty}</span>
        <span class="badge">الوزن: ${weight} جم</span>
        <span class="badge">المواصفات: ${dims}</span>
      </div>

      <div class="field">
        <label>الإجمالي (EGP):</label>
        <input type="number" id="egp-${cleanOrderId}" value="${total}" oninput="recalc('${cleanOrderId}', ${ship})">
      </div>

      <div class="field">
        <label>المدفوع مقدما:</label>
        <input type="number" id="deposit-${cleanOrderId}" style="color:red" value="${dep}" oninput="recalc('${cleanOrderId}', ${ship})">
      </div>

      <div class="net-box">
        <span class="net-label">المبلغ المطلوب تحصيله (الصافي)</span>
        <span class="net-value" id="net-${cleanOrderId}">${net.toLocaleString()} ج.م</span>
      </div>

      <div class="field">
        <label>التكلفة (USD):</label>
        <input type="number" id="usd-${cleanOrderId}" value="${parseFloat(o.usd||0).toFixed(2)}">
      </div>

      <div class="field" style="background: #f8fafc; padding: 5px; border-radius: 8px;">
        <label style="color:var(--primary)">موعد الوصول:</label>
       <input type="text" id="arrival-${cleanOrderId}" value="${currentArrival}">
      </div>

      <div class="field">
        <label>تعديل الحالة:</label>
        <select id="status-${cleanOrderId}">
          <option ${o.status==="Pending Review"?"selected":""}>Pending Review</option>
          <option ${o.status==="Confirmed Via Try"?"selected":""}>Confirmed Via Try</option>
          <option ${o.status==="On Hold"?"selected":""}>On Hold</option>
          <option ${o.status==="Placed"?"selected":""}>Placed</option>
          <option ${o.status==="Arrived Cairo HUB"?"selected":""}>Arrived Cairo HUB</option>
          <option ${o.status==="Shipped To You"?"selected":""}>Shipped To You</option>
          <option ${o.status==="Delivered"?"selected":""}>Delivered</option>
          <option ${o.status==="Canceled"?"selected":""}>Canceled</option>
          <option ${o.status==="Delayed"?"selected":""}>Delayed</option>
        </select>
      </div>

      <div class="actions">
        ${linksHTML}
       <button class="btn-update"
  ${isGrouped ? 'style="background:#ccc;cursor:not-allowed"' : ''}
  onclick="${isGrouped ? 'groupLockMsg()' : `updateOrder('${cleanOrderId}')`}">
  ✔ حفظ التعديلات
</button>
        <button class="btn-group" onclick="openInvoice('${cleanOrderId}')">🧾 فاتورة</button>
        ${whatsappBtn}
      </div>
    </div>
    `;
  });

  if(append){
      container.insertAdjacentHTML('beforeend', htmlString);
  } else {
      container.innerHTML = htmlString;
  }
}

function recalc(id, ship) {
    const egp = parseFloat(document.getElementById('egp-'+id).value) || 0;
    const dep = parseFloat(document.getElementById('deposit-'+id).value) || 0;
    document.getElementById('net-'+id).innerText = (egp + ship - dep).toLocaleString() + " ج.م";
}

function applyFilters(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const searchArr = document.getElementById("searchArrival").value.toLowerCase();
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value;
  const status = document.getElementById("searchStatus").value;

  let filtered = ordersData.filter(o=>{
    const d = o.date || "";
    const dateMatch = (!from||d>=from) && (!to||d<=to);
    const statusMatch = !status||o.status===status;
    const arrivalMatch = !searchArr || (o.arrivaldate || "").toString().toLowerCase().includes(searchArr);
    const cleanOrder = String(o.order || "").toLowerCase().replace(/\s/g, "");

    const searchMatch = (o.customerName||"").toLowerCase().includes(search)||
                      (o.phone||"").toString().includes(search)||
                      cleanOrder.includes(search.replace(/\s/g, "")); 
                      
    return dateMatch && statusMatch && searchMatch && arrivalMatch;
  });

   if(isGrouped){
    const groups={};
    filtered.forEach(o=>{
      const key=o.phone||"Unknown";
      if(!groups[key]){
        groups[key]={
          ...o,
          order:o.order,
          // أضفنا qty هنا لكل عنصر
          items: [{link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1}]
        };
      }else{
        groups[key].items.push({link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1}); 
        groups[key].quantity = (parseInt(groups[key].quantity)||0) + (parseInt(o.quantity)||1);
        groups[key].weight = (parseFloat(groups[key].weight)||0) + (parseFloat(o.weight)||0);
        groups[key].finalPrice = (parseFloat(groups[key].finalPrice)||0) + (parseFloat(o.finalPrice)||0);
        groups[key].deposit = (parseFloat(groups[key].deposit)||0) + (parseFloat(o.deposit)||0);
        groups[key].shipping = (parseFloat(groups[key].shipping)||0) + (parseFloat(o.shipping)||0);
        groups[key].usd = (parseFloat(groups[key].usd)||0) + (parseFloat(o.usd)||0);
        groups[key].order += " + " + o.order;
      }
    });
    filtered = Object.values(groups);
  }
  
  let finalData = filtered.reverse();
  
  // 👈 نحفظ البيانات هنا عشان نقدر نستدعيها براحتنا في الفاتورة بدون أخطاء
  currentViewData = finalData; 

  if(renderTimer) clearTimeout(renderTimer);

  renderCards(finalData.slice(0, 30), false);

  if(finalData.length > 30) {
    renderTimer = setTimeout(() => {
        renderCards(finalData.slice(30), true); 
    }, 500); 
  }

  const totalBox = document.getElementById("totalBox");
  if (status === "") {
    totalBox.style.display = "none";
  } else {
    let totalEGP = 0;
    filtered.forEach(o => { totalEGP += parseFloat(o.finalPrice || 0); });
    totalBox.style.display = "block";
    totalBox.innerText = "الإجمالي: " + totalEGP.toLocaleString() + " ج.م";
  }
}

function toggleGrouping(){ isGrouped=!isGrouped; applyFilters(); }

function updateOrder(orderId){
  const newEGP=document.getElementById("egp-"+orderId).value;
  const newDeposit=document.getElementById("deposit-"+orderId).value;
  const newUSD=document.getElementById("usd-"+orderId).value;
  const newStatus=document.getElementById("status-"+orderId).value;
  const newArrival=document.getElementById("arrival-"+orderId).value; 

  fetch(scriptURL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      action:"updateStatus",
      order:orderId,
      finalPrice:newEGP,
      deposit:newDeposit,
      usd:newUSD,
      status:newStatus,
      arrivaldate:newArrival
    })
  }).then(()=>{
    alert("تم تحديث الطلب #"+orderId);
    loadData();
  });
}

function logout(){
  localStorage.removeItem("auth");
  localStorage.removeItem("loginTime");
  location.reload();
}

loadData();

function checkPendingReview() {
  const pendingOrders = ordersData.filter(o => o.status === "Pending Review");

  if (pendingOrders.length > 0) {
    let message = `⚠️ عندك ${pendingOrders.length} أوردر Pending Review\n\n`;

    pendingOrders.slice(0,5).forEach(o => {
      message += `#${o.order} - ${o.customerName}\n`;
    });

    if (pendingOrders.length > 5) {
      message += `\n... و المزيد`;
    }

    alert(message);
  }
}

// 👈 دالة جديدة وسيطة بتدور على الأوردر وتفتح الفاتورة بأمان
function openInvoice(orderId) {
  const order = currentViewData.find(o => String(o.order).split(' + ')[0] === orderId);
  if (order) {
    generateInvoice(order);
  }
}

function generateInvoice(order){
  let itemsHTML = "";
  let total = 0;

  if(order.items){
    order.items.forEach((item,i)=>{
      const price = parseFloat(item.price || 0);
      total += price;

      itemsHTML += `
        <tr>
          <td>Personal imported item ${i+1}</td>
          <td><a href="${item.link}" target="_blank">Link</a></td>
          <td>${price.toLocaleString()} ج.م</td>
        </tr>
      `;
    });
  }else{
    const price = parseFloat(order.finalPrice || 0);
    total = price;

    itemsHTML += `
      <tr>
        <td>Personal imported item</td>
        <td><a href="${order.link}" target="_blank">Link</a></td>
        <td>${price.toLocaleString()} ج.م</td>
      </tr>
    `;
  }

  const invoiceWindow = window.open("", "_blank");

  invoiceWindow.document.write(`
    <html dir="rtl">
    <head>
      <title>Invoice</title>
      <style>
        body { font-family: Arial; padding:20px; }
        h2 { margin-bottom:5px; }
        table { width:100%; border-collapse: collapse; margin-top:20px; }
        th, td { border:1px solid #ddd; padding:10px; text-align:center; }
        th { background:#f5f5f5; }
      </style>
    </head>
    <body>

      <h2>TRY SHOPPY</h2>
      <p>Zahraa Maadi Cairo Egypt</p>
      <p>201094112666</p>

      <hr>

      <h3>بيانات العميل</h3>
      <p>الاسم: ${order.customerName || "-"}</p>
      <p>العنوان: ${order.address || "-"}</p>
      <p>التليفون: ${order.phone || "-"}</p>

      <hr>

      <h3>تفاصيل المنتجات</h3>

      <table>
        <tr>
          <th>المنتج</th>
          <th>الرابط</th>
          <th>السعر</th>
        </tr>
        ${itemsHTML}
      </table>

      <h3 style="margin-top:20px;">
        Total for personal imported items: ${total.toLocaleString()} ج.م
      </h3>

    </body>
    </html>
  `);

  invoiceWindow.document.close();
}
function groupLockMsg(){
  alert("⚠️ تم تفعيل التجميع\n\n✋ لا يمكن التعديل أثناء التجميع\nيرجى فك التجميع للتعديل في منتج فردي فقط");
}
</script>
</body>
</html>
