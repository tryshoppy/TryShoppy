<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<title>الطلبات — Try Shoppy</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   لوحة الطلبات — موبايل أولًا
   ---------------------------------------------------------
   الأساس إن ده بيتفتح من الموبايل في الشارع وقت الشغل، فكل
   قرار تصميم اتاخد للشاشة الصغيرة الأول:
     • هيدر مضغوط ثابت فيه الإجمالي دايمًا قدامك
     • الفلاتر في لوحة منسدلة مش فاردة الصفحة
     • الكارت مقسّم لمناطق واضحة: هوية / بيانات / مبالغ / إجراءات
     • كل زرار وحقل مساحة لمسه ≥ 44px
   الألوان: أصفر ذهبي (الفعل) + أزرق (المعلومة) على حبر كحلي.
   ═══════════════════════════════════════════════════════════ */
:root{
  --navy:#0F1B33; --navy-2:#1B2B4D;
  --gold:#F5B820; --gold-2:#FFD35C; --gold-wash:#FFF7E3; --gold-ink:#7A5A08;
  --blue:#2563EB; --blue-wash:#EAF1FE; --blue-2:#1D4ED8;
  --paper:#F3F6FC; --panel:#FFFFFF;
  --line:#E2E8F4; --line-2:#EFF3FA;
  --ink:#0F1B33; --ink-2:#57647F; --ink-3:#94A1BC;
  --ok:#0F9D6E; --ok-wash:#E6F7F1;
  --warn:#D97706; --warn-wash:#FEF5E7;
  --dead:#DC2626; --dead-wash:#FDEDED;
  --late:#7C3AED; --late-wash:#F3EDFE;
  --f:'Cairo',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* ══ الهيدر الثابت ══ */
.hdr{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr .lg{width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.hdr .ttl{font-weight:900;font-size:15px;line-height:1.2;flex:1;min-width:0}
.hdr .ttl small{display:block;font-size:10.5px;color:#8FA0C4;font-weight:600}
.hdr .who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:800;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.hdr .out{background:rgba(220,38,38,.25);border:1px solid rgba(220,38,38,.45);color:#FFC2C2;padding:7px 11px;border-radius:9px;font-weight:800;font-size:12px;cursor:pointer;flex:none}
.totbar{margin-top:9px;background:var(--gold);color:var(--navy);border-radius:11px;padding:9px 13px;font-weight:900;font-size:14.5px;text-align:center;display:none}
.totbar b{font-family:var(--fm)}

/* ══ شريط الأدوات ══ */
.tools{position:sticky;top:0;z-index:30;background:var(--paper);padding:10px 14px 8px;display:flex;gap:8px}
.tool{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.tool.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.tool .n{background:var(--gold);color:var(--navy);border-radius:20px;padding:1px 7px;font-size:11px;font-family:var(--fm)}

/* ══ لوحة الفلاتر المنسدلة ══ */
.fpanel{margin:0 14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:none}
.fpanel.open{display:block}
.fpanel-in{padding:13px}
.fgrp{margin-bottom:11px}
.fgrp:last-child{margin-bottom:0}
.fgrp>label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.fpanel input,.fpanel select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#FBFCFE;min-height:46px}
.fpanel input:focus,.fpanel select:focus{border-color:var(--gold);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(245,184,32,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{width:100%;padding:13px;border-radius:11px;border:none;font-weight:900;font-size:14px;cursor:pointer;min-height:48px;margin-top:4px}
.fbtn.go{background:var(--gold);color:var(--navy)}
.fbtn.go:active{background:var(--gold-2)}
.fbtn.alt{background:var(--blue-wash);color:var(--blue);border:1px solid #CBDCFB}
.fbtn.ghost{background:var(--line-2);color:var(--ink-2)}

/* ══ الكروت ══ */
.wrap{padding:0 14px 30px}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.ocard::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line)}
.ocard.grouped{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
.oc-id b{display:block;font-family:var(--fm);font-size:14px;font-weight:600;color:var(--navy);word-break:break-all;line-height:1.35}
.oc-id time{display:block;font-size:11px;color:var(--ink-3);font-weight:700;margin-top:3px}
.oc-tags{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.st{font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap}
.st-done{background:var(--ok-wash);color:var(--ok)}
.st-dead{background:var(--dead-wash);color:var(--dead)}
.st-wait{background:var(--warn-wash);color:var(--warn)}
.st-late{background:var(--late-wash);color:var(--late)}
.st-move{background:var(--blue-wash);color:var(--blue)}
.who{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--navy);color:var(--gold-2);white-space:nowrap}
.oc-cust{background:var(--line-2);border-radius:11px;padding:10px 12px;margin-bottom:10px}
.oc-cust .nm{font-weight:900;font-size:14.5px}
.oc-cust .ph{font-family:var(--fm);font-size:13px;color:var(--blue);direction:ltr;display:inline-block;margin-top:2px;text-decoration:none;font-weight:600}
.oc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--blue-wash);color:var(--blue);font-family:var(--fm)}
.chip.wide{flex:1;min-width:100%;font-family:var(--f);background:var(--gold-wash);color:var(--gold-ink);line-height:1.5}
.oc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.fl{display:block}
.fl>span{display:block;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px}
.fl input,.fl select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFCFE;font-family:var(--fm);font-size:14px;min-height:46px}
.fl input:focus,.fl select:focus{border-color:var(--gold);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(245,184,32,.15)}
.fl input.neg{color:var(--dead);background:var(--dead-wash);border-color:#F5CFCF}
.fl input.usd{color:var(--blue);background:var(--blue-wash);border-color:#CBDCFB}
.fl input.arr{background:var(--gold-wash);border-color:#F2DFAE;font-family:var(--f);font-weight:700}
.fl.full{margin-bottom:12px}
.fl select.stsel{font-family:var(--f);font-weight:800}
.oc-net{background:var(--ok-wash);border:1px solid #B9E7D6;border-radius:11px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.oc-net span{font-size:12px;font-weight:800;color:var(--ok)}
.oc-net b{font-family:var(--fm);font-size:17px;font-weight:600;color:var(--ok)}
.oc-links{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.link-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:10px;background:var(--blue-wash);color:var(--blue);text-decoration:none;font-weight:800;font-size:13px;border:1px solid #CBDCFB;min-height:44px}
.link-btn .qty-tag{font-family:var(--fm);font-size:11px;background:var(--blue);color:#fff;padding:3px 8px;border-radius:7px;flex:none}
.oc-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;cursor:pointer;min-height:46px;color:var(--ink)}
.ab.primary{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:900}
.ab.primary:active{background:var(--gold-2)}
.ab.wide{grid-column:1/-1;background:var(--navy);color:#fff;border-color:var(--navy)}
.ab.wa{background:#22C55E;border-color:#22C55E;color:#fff}
.ab.sum{background:var(--blue);border-color:var(--blue);color:#fff}
.ab:disabled{background:var(--line-2);border-color:var(--line);color:var(--ink-3);cursor:not-allowed}

/* ══ المودال ══ */
/* الكود بيفتح المودال بـ element.style.display="flex" مباشرة،
   والـ inline style بيتغلّب على ده — فده كافي ومفيش داعي لكلاس */
.modal-overlay{position:fixed;inset:0;background:rgba(15,27,51,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-content{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.modal-content h3{margin:0 0 14px;font-size:17px;font-weight:900;text-align:center}
.modal-content input,.modal-content select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#FBFCFE;margin-bottom:10px;min-height:48px}
.modal-content input:focus,.modal-content select:focus{border-color:var(--gold);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(245,184,32,.15)}
@media(min-width:640px){.modal-overlay{align-items:center}.modal-content{border-radius:20px}}

/* ══ شاشة الدخول ══ */
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--navy);display:none;align-items:center;justify-content:center;padding:20px}
.lcard{background:#fff;border-radius:20px;padding:32px 26px;width:100%;max-width:380px}
.lcard .lg{width:58px;height:58px;border-radius:16px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:19px;margin:0 auto 14px}
.lcard h2{margin:0 0 4px;text-align:center;font-size:19px;font-weight:900}
.lcard p{margin:0 0 22px;text-align:center;font-size:13px;color:var(--ink-2)}
.lcard label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.lcard input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:#FBFCFE;margin-bottom:13px;min-height:48px}
.lcard input:focus{border-color:var(--gold);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(245,184,32,.15)}
#loginError{display:none;background:var(--dead-wash);color:var(--dead);border:1px solid #F6CFCF;padding:11px;border-radius:11px;font-size:13px;font-weight:800;text-align:center;margin-bottom:13px}
.lbtn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--gold);color:var(--navy);font-weight:900;font-size:15.5px;cursor:pointer;min-height:50px}

.empty{text-align:center;padding:50px 20px;color:var(--ink-2)}
.empty .big{font-size:2.4rem;margin-bottom:10px}
@media(min-width:760px){
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 40px}
  .tools,.fpanel{max-width:900px;margin-inline:auto}
  .hdr-row{max-width:900px;margin:0 auto}
  .totbar{max-width:900px;margin-inline:auto;margin-top:9px}
  .oc-acts{grid-template-columns:repeat(4,1fr)}
  .ab.wide{grid-column:1/-1}
}
</style>
</head>
<body>

<!-- ══ شاشة الدخول ══ -->
<div id="loginScreen">
  <div class="lcard">
    <div class="lg">TS</div>
    <h2>لوحة الطلبات</h2>
    <p>سجّل دخولك للمتابعة</p>
    <label>اسم المستخدم</label>
    <input id="loginUser" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" onkeydown="if(event.key==='Enter') doLogin();">
    <label>كلمة المرور</label>
    <input id="loginPass" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();">
    <div id="loginError">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <button class="lbtn" onclick="doLogin()">دخول ←</button>
  </div>
</div>

<!-- ══ المحتوى ══ -->
<div id="mainContent" style="display:none;">

  <header class="hdr">
    <div class="hdr-row">
      <div class="lg">TS</div>
      <div class="ttl">الطلبات<small>Try Shoppy</small></div>
      <div id="headerUserBadge" class="who"></div>
      <button class="out" onclick="logout()">خروج</button>
    </div>
    <div id="totalBox" class="totbar">الإجمالي: 0 ج.م</div>
  </header>

  <div class="tools">
    <button class="tool" id="filterToggle" onclick="toggleFilters()">⚙️ الفلاتر <span class="n" id="fCount" style="display:none">0</span></button>
    <button class="tool" onclick="toggleGrouping()">👥 تجميع</button>
  </div>

  <div class="fpanel" id="fpanel">
    <div class="fpanel-in">
      <div class="fgrp">
        <label>بحث</label>
        <input id="searchInput" placeholder="🔍 الاسم أو التليفون أو رقم الأوردر" onkeydown="if(event.key==='Enter'){applyFilters();closeFilters();}">
      </div>
      <div class="fgrp">
        <label>📅 موعد الوصول</label>
        <input id="searchArrival" placeholder="🔎 بحث بموعد الوصول" onkeydown="if(event.key==='Enter'){applyFilters();closeFilters();}">
      </div>
      <div class="fgrp">
        <label>تاريخ الطلب</label>
        <div class="two">
          <input type="date" id="dateFrom" title="من">
          <input type="date" id="dateTo" title="إلى">
        </div>
      </div>
      <div class="fgrp">
        <label>الحالة</label>
        <select id="searchStatus">
          <option value="">كل الحالات</option>
          <option>Pending Review</option>
          <option>Confirmed Via Try</option>
          <option>Processing</option>
          <option>Placed</option>
          <option>Arrived Cairo HUB</option>
          <option>Shipped To You</option>
          <option>Delivered</option>
          <option>Canceled</option>
          <option>Delayed</option>
        </select>
      </div>
      <div class="fgrp">
        <label>الموظف</label>
        <select id="searchUser"><option value="">👤 كل الموظفين</option></select>
      </div>
      <button class="fbtn go" onclick="applyFilters();closeFilters()">🔍 بحث</button>
      <button class="fbtn ghost" onclick="clearFilters()">مسح الفلاتر</button>
    </div>
  </div>

  <div class="wrap">
    <div id="cardsContainer"></div>
  </div>

  <!-- ══ مودال إضافة منتج ══ -->
  <div id="dupModal" class="modal-overlay">
    <div class="modal-content">
      <h3>📋 إضافة منتج لنفس العميل</h3>
      <input type="text" id="dupOrderId" placeholder="رقم الأوردر الجديد">
      <input type="text" id="dupLink" placeholder="رابط المنتج الجديد">
      <input type="number" id="dupQty" placeholder="الكمية" min="1" value="1">
      <input type="number" id="dupUsd" placeholder="السعر بالدولار ($)">
      <input type="number" id="dupEgp" placeholder="السعر بالمصري (EGP)">
      <input type="text" id="dupDimensions" placeholder="المواصفات الخاصة (SPCS)">
      <input type="email" id="dupEmail" placeholder="بريد العميل (اختياري — لإرسال تأكيد)">
      <select id="dupUser"><option value="">👤 اختر الموظف المسؤول *</option></select>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="ab" style="flex:1" onclick="closeModal()">إلغاء</button>
        <button class="ab primary" style="flex:1" id="dupSubmitBtn" onclick="submitDuplicate()">حفظ الطلب</button>
      </div>
      <div id="dupWhatsappContainer" style="display:none;margin-top:10px">
        <button class="ab wa" style="width:100%" id="dupWhatsappBtn" onclick="sendDupWhatsApp()">💬 تأكيد الأوردر عبر واتساب</button>
        <button class="ab sum" style="width:100%;margin-top:8px" id="dupCustomerSummaryBtn" onclick="sendDupCustomerSummary()">📩 إرسال ملخص الطلب للعميل</button>
      </div>
    </div>
  </div>

</div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
/* ══ لوحة الفلاتر — على الموبايل بتبقى مقفولة افتراضيًا عشان
   الكروت تبان من أول لحظة من غير تمرير طويل ══ */
function toggleFilters(){
  const p=document.getElementById("fpanel");
  p.classList.toggle("open");
  document.getElementById("filterToggle").classList.toggle("on", p.classList.contains("open"));
}
function closeFilters(){
  document.getElementById("fpanel").classList.remove("open");
  document.getElementById("filterToggle").classList.remove("on");
  updateFilterCount();
}
function clearFilters(){
  ["searchInput","searchArrival","dateFrom","dateTo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("searchStatus").value="";
  document.getElementById("searchUser").value="";
  applyFilters(); updateFilterCount();
}
/** عدّاد الفلاتر النشطة — عشان تعرف إن فيه فلتر شغال حتى واللوحة مقفولة */
function updateFilterCount(){
  const ids=["searchInput","searchArrival","dateFrom","dateTo","searchStatus","searchUser"];
  const n=ids.filter(id=>{const el=document.getElementById(id); return el && el.value;}).length;
  const b=document.getElementById("fCount");
  if(n){ b.textContent=n; b.style.display=""; } else { b.style.display="none"; }
}
document.addEventListener("change", e=>{
  if(e.target && e.target.closest("#fpanel")){ applyFilters(); updateFilterCount(); }
});
</script>
<script>
function statusTone(st){
  st = String(st||"");
  if(st.indexOf("Delivered")!==-1) return "done";
  if(st.indexOf("Canceled")!==-1)  return "dead";
  if(st.indexOf("Pending")!==-1)   return "wait";
  if(st.indexOf("Delayed")!==-1)   return "late";
  return "move";
}


// ⚠️ هام: الرابط الموحّد بييجي من assets/config.js (نفس رابط الموقع كله) —
// عدّله هناك مرة واحدة بس وهيتطبق على كل حاجة
const scriptURL = TS_CONFIG.ORDERS_SCRIPT_URL;
let ordersData=[];
let currentViewData = []; 
let isGrouped=false;
let renderTimer;

function getStaffToken(){ return localStorage.getItem("staffToken") || ""; }

async function loadData(){
  try {
    const url = scriptURL + "?staffToken=" + encodeURIComponent(getStaffToken());
    const res=await fetch(url, { redirect: 'follow' });
    const data = await res.json();
    if (!Array.isArray(data)) {
      console.error("Unauthorized or bad response loading orders", data);
      alert("⚠️ الجلسة انتهت أو مش صالحة — سجّل دخول تاني.");
      logout();
      return;
    }
    ordersData = data;

    // بناء فلتر اليوزرز من الداتا
    const userSelect = document.getElementById("searchUser");
    if (userSelect) {
      const users = [...new Set(ordersData.map(o => (o.user || "").trim()).filter(Boolean))].sort();
      userSelect.innerHTML = '<option value="">👤 كل الموظفين</option>';
      users.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = "👤 " + u;
        userSelect.appendChild(opt);
      });
    }

    applyFilters();
    checkPendingReview();

function normalizePhone(phone){
  return String(phone || "")
    .replace(/\D/g,'')   // يشيل أي رموز
    .replace(/^0+/, ''); // يشيل الصفر الأول
}

// دا يخلي العرض دايمًا يبدأ بـ 0
function formatPhone(phone){
  let p = String(phone || "").replace(/\D/g,'');
  if(!p.startsWith("0")){
    return "0" + p;
  }
  return p;
}

function recalc(id, ship) {
    const egp = parseFloat(document.getElementById('egp-'+id).value) || 0;
    const dep = parseFloat(document.getElementById('deposit-'+id).value) || 0;
    document.getElementById('net-'+id).innerText = (egp + ship - dep).toLocaleString() + " ج.م";
}

function applyFilters(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const searchArr = document.getElementById("searchArrival").value.toLowerCase();
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value;
  const status = document.getElementById("searchStatus").value;
  const userFilter = (document.getElementById("searchUser")?.value || "").trim().toLowerCase();

  let filtered = ordersData.filter(o=>{
    const d = o.date || "";
    const dateMatch = (!from||d>=from) && (!to||d<=to);
    const statusMatch = !status||o.status===status;
    const arrivalMatch = !searchArr || (o.arrivaldate || "").toString().toLowerCase().includes(searchArr);
    const cleanOrder = String(o.order || "").toLowerCase().replace(/\s/g, "");
    const userMatch = !userFilter || (o.user || "").trim().toLowerCase() === userFilter;

    const searchPhone = normalizePhone(search);
    const searchMatch = (o.customerName||"").toLowerCase().includes(search) ||
                        (searchPhone !== "" && normalizePhone(o.phone).includes(searchPhone)) ||
                        cleanOrder.includes(search.replace(/\s/g, ""));
                      
    return dateMatch && statusMatch && searchMatch && arrivalMatch && userMatch;
  });

   if(isGrouped){
    const groups={};
    filtered.forEach(o=>{
      const key=o.phone||"Unknown";
      if(!groups[key]){
        groups[key]={
          ...o,
          order:o.order,
          items: [{link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1, status: o.status || "", arrivaldate: o.arrivaldate || "", order: o.order || ""}]
        };
      }else{
        groups[key].items.push({link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1, status: o.status || "", arrivaldate: o.arrivaldate || "", order: o.order || ""}); 
        groups[key].quantity = (parseInt(groups[key].quantity)||0) + (parseInt(o.quantity)||1);
        groups[key].weight = (parseFloat(groups[key].weight)||0) + (parseFloat(o.weight)||0);
        groups[key].finalPrice = (parseFloat(groups[key].finalPrice)||0) + (parseFloat(o.finalPrice)||0);
        groups[key].deposit = (parseFloat(groups[key].deposit)||0) + (parseFloat(o.deposit)||0);
        groups[key].shipping = (parseFloat(groups[key].shipping)||0) + (parseFloat(o.shipping)||0);
        groups[key].usd = (parseFloat(groups[key].usd)||0) + (parseFloat(o.usd)||0);
        groups[key].order += " + " + o.order;
      }
    });
    filtered = Object.values(groups);
  }
  
  let finalData = filtered.reverse();
  currentViewData = finalData; 

  if(renderTimer) clearTimeout(renderTimer);

  // 🙈 "opex" اسم عميل داخلي خاص — مش المفروض يظهر في القائمة المرئية
  // خالص في الملف ده تحديدًا، لكن لازم يفضل موجود ومحسوب زي أي طلب
  // عادي في كل حاجة تانية (totalBox تحت، التجميع، currentViewData) —
  // فبنستبعده هنا بس، لحظة العرض النهائي على الكروت، مش قبل كده.
  const displayData = finalData.filter(o => (o.customerName || "").trim().toLowerCase() !== "opex");

  renderCards(displayData.slice(0, 30), false);

  if(displayData.length > 30) {
    renderTimer = setTimeout(() => {
        renderCards(displayData.slice(30), true); 
    }, 500); 
  }

  const totalBox = document.getElementById("totalBox");
  if (status === "") {
    totalBox.style.display = "none";
  } else {
    let totalEGP = 0;
    filtered.forEach(o => { totalEGP += parseFloat(o.finalPrice || 0); });
    totalBox.style.display = "block";
    totalBox.innerText = "الإجمالي: " + totalEGP.toLocaleString() + " ج.م";
  }
}

function updateOrder(orderId){
  const newEGP=document.getElementById("egp-"+orderId).value;
  const newDeposit=document.getElementById("deposit-"+orderId).value;
  const newUSD=document.getElementById("usd-"+orderId).value;
  const newStatus=document.getElementById("status-"+orderId).value;
  const newArrival=document.getElementById("arrival-"+orderId).value; 

  const btn=document.querySelector(`button[onclick*="updateOrder('${orderId}')"]`);
  if(btn) tsSetBtnLoading(btn, "جاري التحديث...");

  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify({
      action:"updateStatus",
      order:orderId,
      finalPrice:newEGP,
      deposit:newDeposit,
      usd:newUSD,
      status:newStatus,
      arrivaldate:newArrival,
      user:getCurrentUser(),   // ✅
      staffToken:getStaffToken()
    })
  }).then(res=>res.text()).then(text=>{
    if(btn) tsClearBtnLoading(btn);
    if(text && text.indexOf("Success")!==-1){
      alert("تم تحديث الطلب #"+orderId);
    }else{
      alert("❌ حصل خطأ أثناء التحديث: "+(text||"سبب غير معروف")+"\n(الطلب مش اتحدّث)");
    }
    loadData();
  }).catch(err=>{
    if(btn) tsClearBtnLoading(btn);
    alert("❌ تعذر الاتصال بالسيرفر — الطلب مش اتحدّث.\n"+err);
  });
}

function sendUndeliveredSummary(orderId) {
  const order = currentViewData.find(o => String(o.order).split(' + ')[0] === orderId);
  if (!order) return alert("حدث خطأ في جلب بيانات العميل.");
  generateUndeliveredSummary(order);
}

function generateUndeliveredSummary(o) {
  const phone = String(o.phone || "").replace(/\D/g, "").replace(/^0/, "");

  // تجميع كل المنتجات (تدعم العرض المجمّع والمفرد)
  let allItems = [];
  if (o.items && o.items.length) {
    allItems = o.items.map(it => ({
      order: it.order || "",
      link: it.link || "",
      price: parseFloat(it.price || 0),
      qty: parseInt(it.qty || 1) || 1,
      status: it.status || o.status || "",
      arrivaldate: (it.arrivaldate || "").toString().trim()
    }));
  } else {
    allItems = [{
      order: o.order || "",
      link: o.link || "",
      price: parseFloat(o.finalPrice || 0),
      qty: parseInt(o.quantity || 1) || 1,
      status: o.status || "",
      arrivaldate: (o.arrivaldate || "").toString().trim()
    }];
  }

  // استبعاد المنتجات المُسلَّمة أو الملغاة
  const pendingItems = allItems.filter(it => it.status !== "Delivered" && it.status !== "Canceled");

  if (pendingItems.length === 0) {
    alert("🎉 لا يوجد طلبات غير مستلمة لهذا العميل حالياً، كل طلباته تم تسليمها بالفعل!");
    return;
  }

  // تجميع المنتجات حسب موعد الوصول
  const NO_DATE_KEY = "📌 موعد لم يتحدد بعد";
  const dateGroups = {};
  pendingItems.forEach(it => {
    const key = it.arrivaldate ? it.arrivaldate : NO_DATE_KEY;
    if (!dateGroups[key]) dateGroups[key] = [];
    dateGroups[key].push(it);
  });

  // ترتيب المواعيد أبجدياً، وترك "غير محدد" في الآخر دايماً
  const dateKeys = Object.keys(dateGroups).sort((a, b) => {
    if (a === NO_DATE_KEY) return 1;
    if (b === NO_DATE_KEY) return -1;
    return a.localeCompare(b, 'ar');
  });

  let message = `السلام عليكم ${o.customerName ? "أ/ " + o.customerName : "حضرتك"} 👋
ده ملخص بكل طلبات حضرتك اللي لسه في الطريق ولم يتم استلامها 📦✨\n`;

  let grandTotal = 0;

  dateKeys.forEach(dateKey => {
    const items = dateGroups[dateKey];
    let groupTotal = 0;

    message += `\n━━━━━━━━━━━━\n📅👇ملخص طلبات موعد وصولها: ${dateKey === NO_DATE_KEY ? dateKey.replace("📌 ", "") : dateKey}\n━━━━━━━━━━━━\n`;

    items.forEach(it => {
      const piecePrice = it.qty > 0 ? (it.price / it.qty) : it.price;
      groupTotal += it.price;

      message += `\n🔖 أوردر: ${it.order || "-"}`;
      if (it.link) message += `\n🔗 المنتج: ${it.link}`;
      message += `\n📦 العدد: ${it.qty}
💵 سعر القطعة: ${piecePrice.toLocaleString()} ج.م
💰 إجمالي القطعة: ${it.price.toLocaleString()} ج.م
🚦 الحالة الحالية: ${it.status || "—"}\n`;
    });

    grandTotal += groupTotal;
    message += `\n📌☝🏻 إجمالي طلبات هذا الموعد: ${groupTotal.toLocaleString()} ج.م\n`;
  });

  message += `\n═══════════════\n💰 الإجمالي الكلي لكل الطلبات غير المستلمة: ${grandTotal.toLocaleString()} ج.م\n═══════════════\n\n📞 لو حضرتك عندك أي استفسار، تواصل معنا في  أي وقت 🙏وممكن نتتبع الطلبات من هنا في اي وقت: https://tryshoppy.github.io/TryShoppy/track`;

  window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(message)}`);
}

    dupUserSelect.innerHTML = '<option value="">👤 اختر الموظف المسؤول *</option>';
    STAFF_DIRECTORY.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u.label;
        opt.textContent = "👤 " + u.label;
        // ✅ تحديد الموظف النشط حالياً بشكل تلقائي كخيار افتراضي لتسهيل الإدخال
        if (u.label.toLowerCase() === (localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "").toLowerCase()) {
            opt.selected = true;
        }
        dupUserSelect.appendChild(opt);
    });
    dupUserSelect.style.borderColor = "var(--border)";

    document.getElementById("dupModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("dupModal").style.display = "none";
    document.getElementById("dupWhatsappContainer").style.display = "none";
}

    const msg = `TRY SHOPPY Order
Order No: ${d.newOrder}

Total Price: ${finalEGP.toLocaleString()} EGP

function sendDupCustomerSummary() {
    const d = lastDupData;
    const phone = String(d.phone || "").replace(/\D/g, "").replace(/^0/, "");
    const qty = parseInt(d.quantity || 1);
    const piecePrice = parseFloat(d.newEgp || 0);

تم تسجيل طلب حضرتك بنجاح في TRY SHOPPY ✅

💰 الإجمالي: ${total.toLocaleString()} ج.م

🔗 https://tryshoppy.github.io/TryShoppy/track

📞 لأي استفسار، تواصل معنا في أي وقت 🙏`;

    window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(msg)}`);
}

function submitDuplicate() {
    const newOrder  = document.getElementById("dupOrderId").value;
    const link      = document.getElementById("dupLink").value;
    const qty       = parseFloat(document.getElementById("dupQty").value) || 1;
    const usd       = parseFloat(document.getElementById("dupUsd").value) || 0;
    const egp       = parseFloat(document.getElementById("dupEgp").value) || 0;
    const dimensions= document.getElementById("dupDimensions").value.trim();
    const dupUser   = document.getElementById("dupUser").value.trim();

    if (!newOrder || !link) return alert("يرجى ملء رقم الأوردر والرابط!");

    if (!dupUser) {
        document.getElementById("dupUser").style.borderColor = "var(--danger)";
        document.getElementById("dupUser").focus();
        return alert("⚠️ يرجى اختيار الموظف المسؤول أولاً!");
    }
    document.getElementById("dupUser").style.borderColor = "var(--border)";

    const originalOrder = ordersData.find(o => String(o.order) === targetOrderId);
    if (!originalOrder) return alert("حدث خطأ في جلب بيانات الأوردر الأصلي.");

    const btn = document.getElementById("dupSubmitBtn");
    tsSetBtnLoading(btn, "جاري النسخ...");

    // ✅ الإجمالي = سعر الوحدة × الكمية
    const totalUsd = (usd * qty).toFixed(2);
    const totalEgp = (egp * qty).toFixed(2);

    fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({
            action: "duplicateOrder",
            originalOrder: originalOrder,
            newOrder: newOrder,
            newLink: link,
            newQty: qty,
            newUsd: totalUsd,
            newEgp: totalEgp,
            newDimensions: dimensions,
            newEmail: document.getElementById("dupEmail").value.trim(),
            user: dupUser,
            staffToken: getStaffToken()
        })
    }).then(res => res.text()).then(text => {
        tsClearBtnLoading(btn);
        if (!(text && text.indexOf("Success") !== -1)) {
            alert("❌ حصل خطأ أثناء تسجيل الطلب: " + (text || "سبب غير معروف"));
            return;
        }
        alert("✅ تم إضافة منتج لنفس العميل بنجاح! - بواسطة الموظف: " + dupUser);

        lastDupData = {
            ...originalOrder,
            newOrder,
            newLink: link,
            quantity: qty,
            newUsd: usd,
            newEgp: egp,
            dimensions: dimensions
        };

        document.getElementById("dupWhatsappContainer").style.display = "block";
        loadData();
    }).catch(e => {
        alert("❌ حدث خطأ في الاتصال بالخادم — الطلب مش اتسجّل. تأكد من الإنترنت وحاول تاني.");
        tsClearBtnLoading(btn);
    });
}

</script>
<script src="staff-auth.js"></script>
<script>

const SESSION_TIME = 2 * 60 * 60 * 1000;

// دليل الموظفين (أسماء بس) لقائمة "الموظف المسؤول" — يتحمّل بعد
// تسجيل الدخول الناجح، ومفيش أي باسورد فيه خالص
let STAFF_DIRECTORY = [];

function getCurrentUser() {
  return localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
}
function showLogin() {
  document.getElementById("mainContent").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("loginError").style.display = "none";
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
}
function showMain() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  const badge = document.getElementById("headerUserBadge");
  if (badge) badge.textContent = "👤 " + getCurrentUser();
  tsListStaff().then(list => { STAFF_DIRECTORY = list; }).catch(() => { STAFF_DIRECTORY = []; });
  loadData();
}
async function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if (!u || !p) return;

  const btn = document.querySelector('button[onclick="doLogin()"]');
  if (btn) tsSetBtnLoading(btn, "جاري التحقق...");

  let res;
  try {
    res = await tsStaffLogin(u, p);
  } catch (err) {
    res = { success: false, message: "تعذر الاتصال بالسيرفر" };
  }
  if (btn) tsClearBtnLoading(btn);

  if (res && res.success) {
    localStorage.setItem("currentUser", u.toLowerCase());
    localStorage.setItem("currentUserLabel", res.label || u);
    localStorage.setItem("loginTime", new Date().getTime());
    localStorage.setItem("staffToken", res.token || "");
    showMain();
  } else {
    document.getElementById("loginError").textContent =
      (res && res.code === "locked") ? "⏳ " + res.message : "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
    document.getElementById("loginError").style.display = "block";
  }
}
function logout() {
  localStorage.removeItem("currentUser");
  localStorage.removeItem("currentUserLabel");
  localStorage.removeItem("loginTime");
  localStorage.removeItem("staffToken");
  showLogin();
}
function initAuth() {
  const key  = localStorage.getItem("currentUser");
  const time = localStorage.getItem("loginTime");
  if (key && time && (new Date().getTime() - time < SESSION_TIME) && localStorage.getItem("staffToken")) {
    showMain();
  } else {
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUserLabel");
    localStorage.removeItem("loginTime");
    localStorage.removeItem("staffToken");
    showLogin();
  }
}
initAuth();
</script>
