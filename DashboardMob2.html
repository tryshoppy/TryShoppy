<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRY SHOPPY - Fixed DropList</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root { 
  --primary: #6366f1; /* أزرق نيلي ناعم */
  --primary-hover: #4f46e5;
  --bg: #f8fafc; /* رمادي فاتح جداً مريح للعين */
  --white: #ffffff; 
  --text: #334155; 
  --text-dark: #0f172a;
  --border: #e2e8f0; 
  --success: #10b981; /* أخضر ناعم */
  --success-hover: #059669;
  --danger: #ef4444; /* أحمر ناعم */
  --danger-hover: #dc2626;
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  --card-shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.08);
}

body { 
  font-family: 'Cairo', sans-serif; 
  background: var(--bg); 
  margin: 0; 
  padding: 15px 10px; 
  color: var(--text); 
  font-size: 15px; 
  -webkit-font-smoothing: antialiased; 
}
.container { max-width: 600px; margin: auto; }

/* Header */
header { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  background: var(--white); 
  padding: 15px 20px; 
  border-radius: 16px; 
  margin-bottom: 20px; 
  box-shadow: var(--card-shadow); 
}
.logo { font-weight: 900; font-size: 1.4rem; color: var(--primary); letter-spacing: 0.5px; }

/* Filters Area */
.filters { 
  background: var(--white); 
  padding: 20px; 
  border-radius: 20px; 
  display: flex; 
  flex-direction: column; 
  gap: 14px; 
  margin-bottom: 20px; 
  box-shadow: var(--card-shadow); 
  border: 1px solid rgba(255,255,255,0.5); 
}
.filters input, .filters select { 
  padding: 12px 16px; 
  border-radius: 12px; 
  border: 1.5px solid var(--border); 
  font-family: 'Cairo'; 
  width: 100%; 
  font-size: 14px; 
  box-sizing: border-box; 
  background: #f8fafc; 
  color: var(--text-dark); 
  transition: all 0.3s ease; 
}
.filters input:focus, .filters select:focus { 
  outline: none; 
  border-color: var(--primary); 
  background: var(--white); 
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); 
}

/* Buttons */
.btn-search { 
  background: var(--primary); 
  color: #fff; 
  font-weight: bold; 
  cursor: pointer; 
  border: none; 
  padding: 14px; 
  border-radius: 12px; 
  font-size: 15px; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25); 
  font-family: 'Cairo';
}
.btn-search:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-search:active { transform: translateY(1px); }

/* زر البحث الخاص بالموظف */
.btn-user-search {
  background: var(--primary); 
  color: #fff; 
  font-weight: bold; 
  cursor: pointer; 
  border: none; 
  padding: 12px; 
  border-radius: 12px; 
  font-size: 14px; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2); 
  font-family: 'Cairo';
  margin-top: -4px;
}
.btn-user-search:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-user-search:active { transform: translateY(1px); }

.btn-group { 
  background: #1e293b; 
  color: #fff; 
  font-weight: bold; 
  cursor: pointer; 
  border: none; 
  padding: 14px; 
  border-radius: 12px; 
  font-size: 15px; 
  transition: all 0.2s ease; 
  font-family: 'Cairo';
}
.btn-group:hover { background: #0f172a; transform: translateY(-1px); }

/* Cards Container & Styling */
.cards-container { display: flex; flex-direction: column; gap: 20px; }
.order-card { 
  background: var(--white); 
  border-radius: 20px; 
  padding: 20px; 
  box-shadow: var(--card-shadow); 
  border-right: 5px solid var(--primary); 
  position: relative; 
  transition: all 0.3s ease; 
  border-left: 1px solid var(--border); 
  border-top: 1px solid var(--border); 
  border-bottom: 1px solid var(--border); 
}
.order-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
.order-card.grouped { border-right-color: #1e293b; }

/* Card Header */
.card-header { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  margin-bottom: 16px; 
  border-bottom: 2px dashed #e2e8f0; 
  padding-bottom: 12px; 
}
.order-id { font-weight: 900; color: var(--text-dark); font-size: 1.1rem; }

/* Fields */
.field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 4px 0; }
.field label { font-weight: 700; color: #64748b; font-size: 14px; }
.field span { font-weight: 700; color: var(--text-dark); font-size: 14px; text-align: left; }
.field input, .field select { 
  width: 140px; 
  padding: 8px 12px; 
  border-radius: 10px; 
  border: 1.5px solid var(--border); 
  text-align: center; 
  font-family: 'Cairo'; 
  font-size: 14px; 
  font-weight: bold; 
  background: #f8fafc; 
  color: var(--text-dark); 
  transition: all 0.2s ease;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--primary); background: var(--white); }

/* Net Box (Total Value) */
.net-box { 
  background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); 
  padding: 15px; 
  border-radius: 16px; 
  margin: 16px 0; 
  text-align: center; 
  border: 1px solid #a7f3d0; 
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.5); 
}
.net-label { display: block; font-size: 13px; color: #065f46; font-weight: 800; margin-bottom: 4px; }
.net-value { font-size: 22px; font-weight: 900; color: var(--success); text-shadow: 0 1px 1px rgba(255,255,255,0.8); }

/* Actions Grid (Buttons inside Card) */
.actions { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 10px; 
  margin-top: 16px; 
  padding-top: 16px; 
  border-top: 1px solid #f1f5f9; 
}
.actions.grouped { grid-template-columns: 1fr 1fr; }

.btn-update { 
  background: var(--success); 
  color: #fff; 
  border: none; 
  padding: 12px; 
  border-radius: 12px; 
  font-weight: bold; 
  font-size: 14px; 
  cursor: pointer; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); 
  font-family: 'Cairo';
}
.btn-update:hover { background: var(--success-hover); transform: translateY(-1px); }
.btn-update:active { transform: translateY(1px); }

.link-btn { 
  background: #eff6ff; 
  color: var(--primary); 
  padding: 12px; 
  border-radius: 12px; 
  text-align: center; 
  text-decoration: none; 
  font-weight: 700; 
  font-size: 14px; 
  transition: all 0.2s ease; 
  border: 1px solid #bfdbfe; 
  font-family: 'Cairo';
  display: flex;
  align-items: center;
  justify-content: center;
}
.link-btn:hover { background: #dbeafe; color: var(--primary-hover); transform: translateY(-1px); }

/* Badges & Spec Row */
.badge { 
  background: #f1f5f9; 
  padding: 6px 12px; 
  border-radius: 8px; 
  font-size: 12px; 
  color: #475569; 
  font-weight: 700; 
  border: 1px solid #e2e8f0; 
}
.spec-row { 
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap; 
  margin-bottom: 12px; 
}
.spec-row .badge {
  background: #e0e7ff; 
  color: #4f46e5; 
  border: 1px solid #c7d2fe; 
  padding: 6px 12px; 
  border-radius: 20px; /* Soft Pill shape */
  font-weight: 700;
}

/* Modal Overlay */
.modal-overlay { 
  display: none; 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(15, 23, 42, 0.6); 
  backdrop-filter: blur(4px); 
  z-index: 1000; 
  justify-content: center; 
  align-items: center; 
}
.modal-content { 
  background: var(--white); 
  padding: 25px; 
  border-radius: 24px; 
  width: 90%; 
  max-width: 400px; 
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
  animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
}
@keyframes modalIn { 
  from { opacity: 0; transform: translateY(20px) scale(0.95); } 
  to { opacity: 1; transform: translateY(0) scale(1); } 
}
.modal-content input { 
  width: 100%; 
  padding: 14px 16px; 
  margin: 8px 0 16px; 
  border: 1.5px solid var(--border); 
  border-radius: 12px; 
  box-sizing: border-box; 
  font-family: 'Cairo'; 
  font-size: 15px; 
  background: #f8fafc; 
  transition: all 0.2s ease;
}
.modal-content input:focus { 
  outline: none; 
  border-color: var(--primary); 
  background: var(--white); 
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); 
}
.modal-content h3 { 
  margin-top: 0; 
  color: var(--text-dark); 
  text-align: center; 
  font-weight: 900; 
  margin-bottom: 20px; 
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #f1f5f9; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* ── Mobile Responsive ── */
@media (max-width: 480px) {
  body { padding: 8px 6px; font-size: 13px; }
  .container { max-width: 100%; }
  header { padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; }
  .logo { font-size: 1.1rem; }
  #totalBox { font-size: 11px !important; padding: 5px 8px !important; }
  #headerUserBadge { font-size: 11px !important; padding: 3px 8px !important; }
  header button { font-size: 11px !important; padding: 5px 10px !important; }
  .filters { padding: 12px; gap: 10px; border-radius: 14px; }
  .filters input, .filters select { padding: 9px 12px; font-size: 13px; border-radius: 10px; }
  .btn-search, .btn-group { padding: 10px; font-size: 13px; border-radius: 10px; }
  .order-card { padding: 13px; border-radius: 14px; }
  .order-id { font-size: 0.95rem; }
  .badge { font-size: 10px; padding: 4px 8px; }
  .field { margin-bottom: 8px; }
  .field label { font-size: 12px; }
  .field span { font-size: 12px; }
  .field input, .field select { width: 120px; padding: 6px 8px; font-size: 12px; }
  .net-value { font-size: 18px; }
  .actions { gap: 7px; margin-top: 12px; }
  .btn-update, .link-btn { padding: 9px; font-size: 12px; border-radius: 10px; }
  .cards-container { gap: 12px; }
  .spec-row .badge { font-size: 11px; padding: 4px 8px; }
  .card-header { margin-bottom: 10px; padding-bottom: 8px; }
  .net-box { padding: 10px; margin: 10px 0; border-radius: 12px; }
  .modal-content { padding: 18px; border-radius: 18px; width: 94%; }
  .modal-content input { padding: 10px 12px; font-size: 13px; }
  .modal-content h3 { font-size: 15px; }
}
</style>
</head>

 <input id="searchArrival" placeholder="🔎 بحث بموعد الوصول">

<script>
// ⚠️ هام: تأكد من وضع رابط السكريبت الجديد بعد عمل Deploy 
const scriptURL="https://script.google.com/macros/s/AKfycbxkoRGFcYNriJuHHF9KmXzXJeyTqKO0OGGFZyWo28JRQZkF5ABPTxMx58go-fHXOtGKlQ/exec";
let ordersData=[];
let currentViewData = []; 
let isGrouped=false;
let renderTimer;

async function loadData(){
  try {
    const res=await fetch(scriptURL, { redirect: 'follow' });
    ordersData=await res.json();

    // بناء فلتر اليوزرز من الداتا
    const userSelect = document.getElementById("searchUser");
    if (userSelect) {
      const users = [...new Set(ordersData.map(o => (o.user || "").trim()).filter(Boolean))].sort();
      userSelect.innerHTML = '<option value="">👤 كل الموظفين</option>';
      users.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = "👤 " + u;
        userSelect.appendChild(opt);
      });
    }

    applyFilters();
    checkPendingReview(); 
  } catch(e) { alert("خطأ في التحميل - تأكد من الاتصال"); }
}

function normalizePhone(phone){
  return String(phone || "")
    .replace(/\D/g,'')   // يشيل أي رموز
    .replace(/^0+/, ''); // يشيل الصفر الأول
}

// دا يخلي العرض دايمًا يبدأ بـ 0
function formatPhone(phone){
  let p = String(phone || "").replace(/\D/g,'');
  if(!p.startsWith("0")){
    return "0" + p;
  }
  return p;
}

function renderCards(data, append = false){
  const container = document.getElementById("cardsContainer");
  
  if(!append) container.innerHTML = ""; 
  
  let htmlString = ""; 

  data.forEach(o => {
    let phone = String(o.phone || "").replace(/\D/g, "").replace(/^0/, "");
    const orderId = o.order;
    const cleanOrderId = orderId.toString().split(' + ')[0];
    const qty = o.quantity || 1;
    const weight = o.weight || 0;
    const dims = o.dimensions || "غير محدد";

    const total = parseFloat(o.finalPrice || 0);
    const dep = parseFloat(o.deposit || 0);
    const ship = parseFloat(o.shipping || 0);
    const net = total + ship - dep;
    const currentArrival = o.arrivaldate || "";

    let linksHTML = "";
    if (isGrouped && o.items) {
      linksHTML = o.items.map((item, i) => `
        <a href="${item.link}" target="_blank" class="link-btn">
          🔗 منتج ${i + 1} - ${parseFloat(item.price).toLocaleString()} ج.م
        </a>
      `).join('');
    } else {
      linksHTML = `
        <a href="${o.link || '#'}" target="_blank" class="link-btn">
          🔗 معاينة المنتج
        </a>
      `;
    }

   let message = `السلام عليكم ${o.customerName ? "أ/ " + o.customerName : "حضرتك"} 👋
الأوردر الخاص بحضرتك من تراي شوبي -Try Shoppy وصل مصر 🇪🇬 وجاهز للتسليم 🚚

سيتم التوصيل خلال:
📍 يومين عمل داخل القاهرة
📍 3 أيام عمل للمحافظات

📍 العنوان: ${o.address || "غير متوفر"}
📞 التليفون: ${o.phone || "غير متوفر"}

📦 التفاصيل:\n`;

let totalQty = 0;

if (isGrouped && o.items) {
  o.items.forEach((item, i) => {
    const itemTotal = parseFloat(item.price || 0);
    const itemQty = parseInt(item.qty || 1);
    const piecePrice = itemQty > 0 ? itemTotal / itemQty : itemTotal;

function recalc(id, ship) {
    const egp = parseFloat(document.getElementById('egp-'+id).value) || 0;
    const dep = parseFloat(document.getElementById('deposit-'+id).value) || 0;
    document.getElementById('net-'+id).innerText = (egp + ship - dep).toLocaleString() + " ج.م";
}

function applyFilters(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const searchArr = document.getElementById("searchArrival").value.toLowerCase();
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value;
  const status = document.getElementById("searchStatus").value;
  const userFilter = (document.getElementById("searchUser")?.value || "").trim().toLowerCase();

  let filtered = ordersData.filter(o=>{
    const d = o.date || "";
    const dateMatch = (!from||d>=from) && (!to||d<=to);
    const statusMatch = !status||o.status===status;
    const arrivalMatch = !searchArr || (o.arrivaldate || "").toString().toLowerCase().includes(searchArr);
    const cleanOrder = String(o.order || "").toLowerCase().replace(/\s/g, "");
    const userMatch = !userFilter || (o.user || "").trim().toLowerCase() === userFilter;

    const searchPhone = normalizePhone(search);
    const searchMatch = (o.customerName||"").toLowerCase().includes(search) ||
                        (searchPhone !== "" && normalizePhone(o.phone).includes(searchPhone)) ||
                        cleanOrder.includes(search.replace(/\s/g, ""));
                      
    return dateMatch && statusMatch && searchMatch && arrivalMatch && userMatch;
  });

   if(isGrouped){
    const groups={};
    filtered.forEach(o=>{
      const key=o.phone||"Unknown";
      if(!groups[key]){
        groups[key]={
          ...o,
          order:o.order,
          items: [{link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1, status: o.status || "", arrivaldate: o.arrivaldate || "", order: o.order || ""}]
        };
      }else{
        groups[key].items.push({link: o.link, price: o.finalPrice, qty: parseInt(o.quantity)||1, status: o.status || "", arrivaldate: o.arrivaldate || "", order: o.order || ""}); 
        groups[key].quantity = (parseInt(groups[key].quantity)||0) + (parseInt(o.quantity)||1);
        groups[key].weight = (parseFloat(groups[key].weight)||0) + (parseFloat(o.weight)||0);
        groups[key].finalPrice = (parseFloat(groups[key].finalPrice)||0) + (parseFloat(o.finalPrice)||0);
        groups[key].deposit = (parseFloat(groups[key].deposit)||0) + (parseFloat(o.deposit)||0);
        groups[key].shipping = (parseFloat(groups[key].shipping)||0) + (parseFloat(o.shipping)||0);
        groups[key].usd = (parseFloat(groups[key].usd)||0) + (parseFloat(o.usd)||0);
        groups[key].order += " + " + o.order;
      }
    });
    filtered = Object.values(groups);
  }
  
  let finalData = filtered.reverse();
  currentViewData = finalData; 

  if(renderTimer) clearTimeout(renderTimer);

  renderCards(finalData.slice(0, 30), false);

  if(finalData.length > 30) {
    renderTimer = setTimeout(() => {
        renderCards(finalData.slice(30), true); 
    }, 500); 
  }

  const totalBox = document.getElementById("totalBox");
  if (status === "") {
    totalBox.style.display = "none";
  } else {
    let totalEGP = 0;
    filtered.forEach(o => { totalEGP += parseFloat(o.finalPrice || 0); });
    totalBox.style.display = "block";
    totalBox.innerText = "الإجمالي: " + totalEGP.toLocaleString() + " ج.م";
  }
}

function generateUndeliveredSummary(o) {
  const phone = String(o.phone || "").replace(/\D/g, "").replace(/^0/, "");

  // تجميع كل المنتجات (تدعم العرض المجمّع والمفرد)
  let allItems = [];
  if (o.items && o.items.length) {
    allItems = o.items.map(it => ({
      order: it.order || "",
      link: it.link || "",
      price: parseFloat(it.price || 0),
      qty: parseInt(it.qty || 1) || 1,
      status: it.status || o.status || "",
      arrivaldate: (it.arrivaldate || "").toString().trim()
    }));
  } else {
    allItems = [{
      order: o.order || "",
      link: o.link || "",
      price: parseFloat(o.finalPrice || 0),
      qty: parseInt(o.quantity || 1) || 1,
      status: o.status || "",
      arrivaldate: (o.arrivaldate || "").toString().trim()
    }];
  }

  // استبعاد المنتجات المُسلَّمة أو الملغاة
  const pendingItems = allItems.filter(it => it.status !== "Delivered" && it.status !== "Canceled");

  if (pendingItems.length === 0) {
    alert("🎉 لا يوجد طلبات غير مستلمة لهذا العميل حالياً، كل طلباته تم تسليمها بالفعل!");
    return;
  }

  // تجميع المنتجات حسب موعد الوصول
  const NO_DATE_KEY = "📌 موعد لم يتحدد بعد";
  const dateGroups = {};
  pendingItems.forEach(it => {
    const key = it.arrivaldate ? it.arrivaldate : NO_DATE_KEY;
    if (!dateGroups[key]) dateGroups[key] = [];
    dateGroups[key].push(it);
  });

  // ترتيب المواعيد أبجدياً، وترك "غير محدد" في الآخر دايماً
  const dateKeys = Object.keys(dateGroups).sort((a, b) => {
    if (a === NO_DATE_KEY) return 1;
    if (b === NO_DATE_KEY) return -1;
    return a.localeCompare(b, 'ar');
  });

  let message = `السلام عليكم ${o.customerName ? "أ/ " + o.customerName : "حضرتك"} 👋
ده ملخص بكل طلبات حضرتك اللي لسه في الطريق ولم يتم استلامها 📦✨\n`;

  let grandTotal = 0;

  dateKeys.forEach(dateKey => {
    const items = dateGroups[dateKey];
    let groupTotal = 0;

    message += `\n━━━━━━━━━━━━\n📅👇ملخص طلبات موعد وصولها: ${dateKey === NO_DATE_KEY ? dateKey.replace("📌 ", "") : dateKey}\n━━━━━━━━━━━━\n`;

    items.forEach(it => {
      const piecePrice = it.qty > 0 ? (it.price / it.qty) : it.price;
      groupTotal += it.price;

      message += `\n🔖 أوردر: ${it.order || "-"}`;
      if (it.link) message += `\n🔗 المنتج: ${it.link}`;
      message += `\n📦 العدد: ${it.qty}
💵 سعر القطعة: ${piecePrice.toLocaleString()} ج.م
💰 إجمالي القطعة: ${it.price.toLocaleString()} ج.م
🚦 الحالة الحالية: ${it.status || "—"}\n`;
    });

    grandTotal += groupTotal;
    message += `\n📌☝🏻 إجمالي طلبات هذا الموعد: ${groupTotal.toLocaleString()} ج.م\n`;
  });

  message += `\n═══════════════\n💰 الإجمالي الكلي لكل الطلبات غير المستلمة: ${grandTotal.toLocaleString()} ج.م\n═══════════════\n\n📞 لو حضرتك عندك أي استفسار، تواصل معنا في أي وقت 🙏`;

  window.open(`https://wa.me/20${phone}?text=${encodeURIComponent(message)}`);
}

    document.getElementById("dupUser").style.borderColor = "var(--border)";

    const originalOrder = ordersData.find(o => String(o.order) === targetOrderId);
    if (!originalOrder) return alert("حدث خطأ في جلب بيانات الأوردر الأصلي.");

    const btn = document.getElementById("dupSubmitBtn");
    btn.innerText = "جاري النسخ...";
    btn.disabled = true;

    // ✅ الإجمالي = سعر الوحدة × الكمية
    const totalUsd = (usd * qty).toFixed(2);
    const totalEgp = (egp * qty).toFixed(2);

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            action: "duplicateOrder",
            originalOrder: originalOrder,
            newOrder: newOrder,
            newLink: link,
            newQty: qty,
            newUsd: totalUsd,
            newEgp: totalEgp,
            newDimensions: dimensions,
            user: dupUser
        })
    }).then(() => {
        alert("✅ تم إضافة منتج لنفس العميل بنجاح! - بواسطة الموظف: " + dupUser);
        btn.innerText = "حفظ الطلب";
        btn.disabled = false;

        lastDupData = {
            ...originalOrder,
            newOrder,
            newLink: link,
            quantity: qty,
            newUsd: usd,
            newEgp: egp,
            dimensions: dimensions
        };

        document.getElementById("dupWhatsappContainer").style.display = "block";
        loadData();
    }).catch(e => {
        alert("❌ حدث خطأ في الاتصال بالخادم");
        btn.innerText = "حفظ الطلب";
        btn.disabled = false;
    });
}

</script>
</div><!-- end mainContent -->

<script src="users.js"></script>
<script>
const SESSION_TIME = 2 * 60 * 60 * 1000;

// ── المستخدمين من users.js ──
const USERS = {};
(function buildUsers() {
  const list = (typeof TRYSHOPPY_DEFAULT_USERS !== "undefined") ? TRYSHOPPY_DEFAULT_USERS : [];
  list.forEach(u => { USERS[u.username.toLowerCase()] = { pass: u.password, label: u.username }; });
})();

function getCurrentUser() {
  return localStorage.getItem("currentUserLabel") || localStorage.getItem("currentUser") || "";
}
function showLogin() {
  document.getElementById("mainContent").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("loginError").style.display = "none";
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
}
function showMain() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  const badge = document.getElementById("headerUserBadge");
  if (badge) badge.textContent = "👤 " + getCurrentUser();
  loadData();
}
function doLogin() {
  const u = document.getElementById("loginUser").value.trim().toLowerCase();
  const p = document.getElementById("loginPass").value;
  if (USERS[u] && USERS[u].pass === p) {
    localStorage.setItem("currentUser", u);
    localStorage.setItem("currentUserLabel", USERS[u].label);
    localStorage.setItem("loginTime", new Date().getTime());
    showMain();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}
function logout() {
  localStorage.removeItem("currentUser");
  localStorage.removeItem("currentUserLabel");
  localStorage.removeItem("loginTime");
  showLogin();
}
(function init() {
  const key  = localStorage.getItem("currentUser");
  const time = localStorage.getItem("loginTime");
  if (key && USERS[key] && time && (new Date().getTime() - time < SESSION_TIME)) {
    if (!localStorage.getItem("currentUserLabel")) {
      localStorage.setItem("currentUserLabel", USERS[key].label);
    }
    showMain();
  } else {
    showLogin();
  }
})();
</script>
</body>
