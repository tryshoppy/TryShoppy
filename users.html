<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRY SHOPPY - إدارة المستخدمين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --bg: #f8fafc;
  --white: #ffffff;
  --text: #334155;
  --text-dark: #0f172a;
  --border: #e2e8f0;
  --success: #10b981;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --warning: #f59e0b;
  --card-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 20px 15px 40px;
  color: var(--text);
}

.container { max-width: 560px; margin: auto; }

/* ── Header ── */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--white);
  padding: 16px 22px;
  border-radius: 18px;
  margin-bottom: 24px;
  box-shadow: var(--card-shadow);
}
.logo { font-weight: 900; font-size: 1.3rem; color: var(--primary); }
.header-badge {
  background: #ede9fe;
  color: var(--primary);
  padding: 5px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 13px;
  border: 1px solid #c4b5fd;
}

/* ── Add User Card ── */
.add-card {
  background: var(--white);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--card-shadow);
  margin-bottom: 24px;
  border: 1px solid var(--border);
}
.add-card h3 {
  font-weight: 900;
  font-size: 1.05rem;
  color: var(--text-dark);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
  font-size: 13px;
  font-weight: 700;
  color: #64748b;
}
.form-group input {
  padding: 11px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  font-family: 'Cairo';
  font-size: 14px;
  background: #f8fafc;
  color: var(--text-dark);
  transition: all 0.2s ease;
  width: 100%;
}
.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
}

.btn-add {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'Cairo';
  font-weight: 900;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(99,102,241,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-add:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-add:active { transform: translateY(1px); }

/* ── Users List ── */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.list-title {
  font-weight: 900;
  font-size: 1rem;
  color: var(--text-dark);
}
.count-badge {
  background: #e0e7ff;
  color: #4338ca;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
}

.users-list { display: flex; flex-direction: column; gap: 12px; }

.user-card {
  background: var(--white);
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--border);
  border-right: 4px solid var(--primary);
  display: flex;
  align-items: center;
  gap: 14px;
  animation: slideIn 0.25s ease;
  transition: box-shadow 0.2s;
}
.user-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.user-avatar {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff;
  font-weight: 900;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  text-transform: uppercase;
}

.user-info { flex: 1; min-width: 0; }
.user-name {
  font-weight: 900;
  font-size: 15px;
  color: var(--text-dark);
  margin-bottom: 3px;
}
.user-pass {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pass-dots { letter-spacing: 2px; font-size: 10px; }
.pass-toggle {
  background: none;
  border: none;
  color: var(--primary);
  cursor: pointer;
  font-size: 12px;
  font-family: 'Cairo';
  font-weight: 700;
  padding: 0;
  width: auto;
}

.user-actions { display: flex; gap: 8px; flex-shrink: 0; }

.btn-edit {
  background: #eff6ff;
  color: var(--primary);
  border: 1px solid #bfdbfe;
  padding: 7px 14px;
  border-radius: 10px;
  font-family: 'Cairo';
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  width: auto;
}
.btn-edit:hover { background: #dbeafe; }

.btn-delete {
  background: #fef2f2;
  color: var(--danger);
  border: 1px solid #fecaca;
  padding: 7px 14px;
  border-radius: 10px;
  font-family: 'Cairo';
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  width: auto;
}
.btn-delete:hover { background: #fee2e2; }

/* ── Edit Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.55);
  backdrop-filter: blur(4px);
  z-index: 999;
  justify-content: center;
  align-items: center;
}
.modal-overlay.active { display: flex; }

.modal-box {
  background: var(--white);
  border-radius: 22px;
  padding: 28px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  animation: modalIn 0.25s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalIn {
  from { opacity:0; transform: translateY(16px) scale(0.97); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
.modal-box h3 {
  font-weight: 900;
  font-size: 1.05rem;
  color: var(--text-dark);
  margin-bottom: 20px;
  text-align: center;
}
.modal-box .form-group { margin-bottom: 14px; }
.modal-box .form-group input { width: 100%; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.btn-cancel {
  flex: 1; padding: 12px; background: #f1f5f9; color: #334155;
  border: none; border-radius: 12px; font-family: 'Cairo';
  font-weight: 700; font-size: 14px; cursor: pointer; width: auto;
}
.btn-save {
  flex: 1; padding: 12px; background: var(--primary); color: #fff;
  border: none; border-radius: 12px; font-family: 'Cairo';
  font-weight: 900; font-size: 14px; cursor: pointer; width: auto;
  transition: all 0.2s;
}
.btn-save:hover { background: var(--primary-hover); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #0f172a;
  color: #fff;
  padding: 12px 24px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 14px;
  z-index: 9999;
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s;
  opacity: 0;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #94a3b8;
}
.empty-state div:first-child { font-size: 2.5rem; margin-bottom: 10px; }
.empty-state div:last-child { font-weight: 700; font-size: 15px; }

/* ── Save Bar ── */
.save-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  justify-content: center;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  z-index: 100;
}
.btn-save-all {
  max-width: 500px;
  width: 100%;
  padding: 14px;
  background: var(--success);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Cairo';
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(16,185,129,0.3);
}
.btn-save-all:hover { background: #059669; transform: translateY(-1px); }

/* bottom padding for save bar */
.bottom-spacer { height: 80px; }

/* ── Admin Login ── */
#adminLogin {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-box {
  background: var(--white);
  border-radius: 24px;
  padding: 36px 30px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.09);
  border: 1px solid var(--border);
}
.login-logo { text-align: center; margin-bottom: 6px; font-size: 2rem; font-weight: 900; color: var(--primary); }
.login-sub  { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 26px; font-weight: 600; }
.login-label { font-size: 14px; font-weight: 700; color: var(--text); display: block; margin-bottom: 7px; }
.login-input {
  width: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  font-family: 'Cairo';
  font-size: 15px;
  background: #f8fafc;
  margin-bottom: 16px;
  transition: all 0.2s;
}
.login-input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
.login-error {
  display: none;
  color: var(--danger);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 14px;
  background: #fef2f2;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #fecaca;
}
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'Cairo';
  font-weight: 900;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  transition: all 0.2s;
}
.btn-login:hover { background: var(--primary-hover); }
</style>
</head>
<body>

<!-- Admin Login Gate -->
<div id="adminLogin">
  <div class="login-box">
    <div class="login-logo">TRY SHOPPY</div>
    <div class="login-sub">🔐 لوحة إدارة المستخدمين</div>
    <label class="login-label">اسم المستخدم</label>
    <input id="adminUserInput" type="text" class="login-input" placeholder="أدخل اسم المستخدم" autocomplete="username" onkeydown="if(event.key==='Enter') checkAdmin()">
    <label class="login-label">كلمة المرور</label>
    <input id="adminPassInput" type="password" class="login-input" placeholder="أدخل كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter') checkAdmin()">
    <div id="adminError" class="login-error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <button class="btn-login" onclick="checkAdmin()">دخول ←</button>
  </div>
</div>

<!-- Main Panel (hidden until admin login) -->
<div id="mainPanel" style="display:none;">
  <div class="container">

    <header>
      <div class="logo">TRY SHOPPY</div>
      <div class="header-badge">⚙️ إدارة المستخدمين</div>
    </header>

    <!-- Add New User -->
    <div class="add-card">
      <h3>➕ إضافة مستخدم جديد</h3>
      <div class="form-row">
        <div class="form-group">
          <label>اسم المستخدم (Username)</label>
          <input id="newUsername" type="text" placeholder="مثال: sara" autocomplete="off">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input id="newPassword" type="text" placeholder="مثال: sara1234" autocomplete="off">
        </div>
      </div>
      <button class="btn-add" onclick="addUser()">
        <span>➕</span> إضافة المستخدم
      </button>
    </div>

    <!-- Users List -->
    <div class="list-header">
      <div class="list-title">👥 المستخدمين الحاليين</div>
      <div class="count-badge" id="countBadge">0 مستخدم</div>
    </div>

    <div class="users-list" id="usersList"></div>
    <div class="bottom-spacer"></div>

  </div>

  <!-- Save Bar -->
  <div class="save-bar">
    <button class="btn-save-all" onclick="saveAll()">
      💾 حفظ وتطبيق على كل الملفات
    </button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>✏️ تعديل المستخدم</h3>
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input id="editUsername" type="text">
    </div>
    <div class="form-group">
      <label>كلمة المرور الجديدة</label>
      <input id="editPassword" type="text">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
      <button class="btn-save"   onclick="saveEdit()">حفظ</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================
// 🔐 كلمة مرور الأدمن للوصول لهذه الصفحة
// ============================================
// ── المستخدمين بيجوا من الشيت فقط ──

// ============================================
// 🔗 رابط الـ Apps Script (نفس رابط الأوردرات)
// ============================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybi0nm5NahnQJiyislAnrGMlXj_d2250h29Ab3kR9q5clIsUSRnPt-ZRl0IHuiuHyh0g/exec";

// ============================================
// القائمة الافتراضية — تُستخدم فقط لو فشل الاتصال بالشيت
// ============================================
// ── مفيش مستخدمين hardcoded — كل البيانات من الشيت فقط ──
const DEFAULT_USERS = [];

const STORAGE_KEY = "tryshoppy_users";

let users = [];
let editIndex = -1;

// ── Admin Login ──
async function checkAdmin() {
  const u = document.getElementById("adminUserInput").value.trim().toLowerCase();
  const p = document.getElementById("adminPassInput").value;
  if (!u || !p) return;

  // جيب المستخدمين من الشيت أو الـ cache
  let list = [];
  try {
    const res = await fetch(SCRIPT_URL + "?action=getUsers", { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    if (Array.isArray(data) && data.length && data[0].username) {
      list = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }
  } catch (e) {}

  // لو الشيت ما ردش جرب الـ cache
  if (!list.length) {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) list = JSON.parse(stored);
    } catch (e) {}
  }

  const match = list.find(x => String(x.username).toLowerCase() === u && String(x.password) === p);
  if (match) {
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("mainPanel").style.display = "block";
    init();
  } else {
    document.getElementById("adminError").style.display = "block";
  }
}
document.getElementById("adminPassInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAdmin();
});

// ── Init: تحميل المستخدمين ──
async function init() {
  // أولاً: جرب تجيب من الشيت
  try {
    const res = await fetch(SCRIPT_URL + "?action=getUsers", { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    // تأكد إن البيانات الراجعة فعلاً قائمة مستخدمين (فيها username وpassword)
    if (Array.isArray(data) && data.length && data[0].username && data[0].password) {
      users = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
      render();
      showToast("✅ تم تحميل " + users.length + " مستخدم من الشيت");
      return;
    }
  } catch (e) { /* timeout أو خطأ في الاتصال */ }

  // ثانياً: استخدم النسخة المحفوظة محلياً أو الافتراضية
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      // تأكد إنها قائمة مستخدمين وليست أوردرات
      if (Array.isArray(parsed) && parsed.length && parsed[0].username) {
        users = parsed;
        render();
        showToast("✅ تم تحميل " + users.length + " مستخدم (نسخة محفوظة)");
        return;
      }
    } catch { }
  }

  // ثالثاً: القائمة الافتراضية
  users = [];
  render();
  showToast("⚠️ مفيش مستخدمين محفوظين — ضيف مستخدمين من الشيت");
}

// ── Render List ──
function render() {
  const list = document.getElementById("usersList");
  const count = document.getElementById("countBadge");
  count.textContent = users.length + " مستخدم";

  if (users.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div>👤</div>
        <div>لا يوجد مستخدمين بعد — أضف مستخدم جديد</div>
      </div>`;
    return;
  }

  list.innerHTML = users.map((u, i) => `
    <div class="user-card" id="ucard-${i}">
      <div class="user-avatar">${u.username.charAt(0).toUpperCase()}</div>
      <div class="user-info">
        <div class="user-name">${escHtml(u.username)}</div>
        <div class="user-pass">
          <span class="pass-dots" id="passDots-${i}">••••••••</span>
          <span id="passText-${i}" style="display:none; font-size:13px; color:#334155; font-weight:700;">${escHtml(u.password)}</span>
          <button class="pass-toggle" onclick="togglePass(${i})">👁 إظهار</button>
        </div>
      </div>
      <div class="user-actions">
        <button class="btn-edit"   onclick="openEdit(${i})">✏️ تعديل</button>
        <button class="btn-delete" onclick="deleteUser(${i})">🗑 حذف</button>
      </div>
    </div>
  `).join('');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toggle Password Visibility ──
function togglePass(i) {
  const dots = document.getElementById("passDots-"+i);
  const text = document.getElementById("passText-"+i);
  const btn  = dots.parentElement.querySelector(".pass-toggle");
  if (dots.style.display === "none") {
    dots.style.display = ""; text.style.display = "none";
    btn.textContent = "👁 إظهار";
  } else {
    dots.style.display = "none"; text.style.display = "";
    btn.textContent = "🙈 إخفاء";
  }
}

// ── Add User ──
function addUser() {
  const uname = document.getElementById("newUsername").value.trim().toLowerCase();
  const upass  = document.getElementById("newPassword").value.trim();

  if (!uname || !upass) return showToast("❌ اكتب الاسم وكلمة المرور");
  if (users.find(u => u.username.toLowerCase() === uname))
    return showToast("⚠️ اسم المستخدم موجود مسبقاً");

  users.push({ username: uname, password: upass });
  document.getElementById("newUsername").value = "";
  document.getElementById("newPassword").value = "";
  render();
  showToast("✅ تم إضافة " + uname);
}

// ── Delete ──
function deleteUser(i) {
  const name = users[i].username;
  if (!confirm("هل تريد حذف المستخدم: " + name + "؟")) return;
  users.splice(i, 1);
  render();
  showToast("🗑 تم حذف " + name);
}

// ── Edit Modal ──
let editOriginalName = "";
function openEdit(i) {
  editIndex = i;
  editOriginalName = users[i].username;
  document.getElementById("editUsername").value = users[i].username;
  document.getElementById("editPassword").value = users[i].password;
  document.getElementById("editModal").classList.add("active");
}
function closeEditModal() {
  document.getElementById("editModal").classList.remove("active");
  editIndex = -1;
}
function saveEdit() {
  if (editIndex < 0) return;
  const uname = document.getElementById("editUsername").value.trim().toLowerCase();
  const upass  = document.getElementById("editPassword").value.trim();
  if (!uname || !upass) return showToast("❌ اكتب الاسم وكلمة المرور");

  const conflict = users.findIndex(u => u.username.toLowerCase() === uname);
  if (conflict !== -1 && conflict !== editIndex)
    return showToast("⚠️ اسم المستخدم مستخدم بالفعل");

  users[editIndex] = { username: uname, password: upass };
  closeEditModal();
  render();
  showToast("✏️ تم تحديث " + uname);
}

// ── Save All: حفظ في جوجل شيت + نسخة محلية ──
async function saveAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(users)); // كاش محلي
  showToast("⏳ جاري الحفظ في جوجل شيت...");
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ action: "saveUsers", users: users })
    });
    showToast("💾 تم الحفظ في الشيت! كل الصفحات هتستخدم القائمة دي على أي جهاز");
  } catch (e) {
    showToast("❌ تعذر الحفظ في الشيت — اتحفظت نسخة محلية فقط");
  }
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// Close modal on overlay click
document.getElementById("editModal").addEventListener("click", function(e) {
  if (e.target === this) closeEditModal();
});
</script>
